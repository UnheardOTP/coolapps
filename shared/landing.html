<!doctype html><meta charset="utf-8"><title>Cool Apps</title>
<style>
:root { --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
main { max-width:960px; margin:64px auto; padding:0 24px; }
h1 { font-size:32px; margin:0 0 4px; letter-spacing:-.02em; }
.sub { color:var(--mut); margin:0 0 24px; }
input { width:100%; max-width:320px; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:24px; }
.tabs { display:flex; gap:8px; margin-bottom:14px; }
.tabs button { font:inherit; padding:6px 16px; border:1px solid var(--line); background:#fff; border-radius:99px; cursor:pointer; }
.tabs button.on { background:var(--fg); color:#fff; border-color:var(--fg); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
a.tile { display:block; background:#fff; border:1px solid var(--line); border-top:6px solid var(--c); border-radius:12px; padding:18px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
a.tile:hover { border-color:var(--c); transform:translateY(-2px); }
.tile b { font-size:17px; } .tile p { margin:4px 0 10px; color:var(--mut); } .tile small { color:var(--mut); }
</style>
<main>
  <h1>Cool Apps</h1><p class="sub" id="count"></p>
  <div class="tabs" id="tabs"></div>
  <input id="q" placeholder="Filter apps…">
  <div class="grid" id="grid"></div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $q = document.getElementById('q'), grid = document.getElementById('grid');
let apps = [], cat = 'All';
// Render tiles; each app lives at /<id>/ on this same server.
function render() {
  const q = $q.value.toLowerCase();
  const cs = ['All', 'Utilities', 'Play'];
  document.getElementById('tabs').innerHTML = cs.map(c => `<button data-c="${c}" class="${c === cat ? 'on' : ''}">${c} ${c === 'All' ? apps.length : apps.filter(a => a.cat === c).length}</button>`).join('');
  grid.innerHTML = apps.filter(a => (cat === 'All' || a.cat === cat) && (a.title + a.description).toLowerCase().includes(q)).map(a =>
    `<a class="tile" style="--c:${esc(a.color || '#4f46e5')}" href="${esc(a.id)}/"><b>${esc(a.title)}</b><p>${esc(a.description)}</p><small>/${esc(a.id)}</small></a>`).join('');
}
$q.oninput = render;
document.getElementById('tabs').onclick = e => { if (e.target.dataset.c) { cat = e.target.dataset.c; render(); } };
fetch('api/apps').then(r => r.json()).then(a => { apps = a; document.getElementById('count').textContent = a.length + ' apps'; render(); });
</script>
