<!doctype html><meta charset="utf-8"><title>World Clock</title><script src="/shared/lib.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f1420;color:#e6ecff;font-family:'Helvetica Neue',Arial;padding:30px 40px}header{display:flex;align-items:center;gap:20px;margin-bottom:20px}h1{margin:0;font-weight:200;letter-spacing:.3em}select{font:inherit;padding:8px 12px;background:#1a2236;color:#fff;border:1px solid #33406a;border-radius:8px}button{font:inherit;padding:8px 16px;background:#4d7cff;border:none;color:#fff;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.c{border-radius:20px;padding:18px;text-align:center;position:relative;transition:background .6s}.c .x{position:absolute;top:8px;right:12px;opacity:0;cursor:pointer;font-size:13px}.c:hover .x{opacity:.7}
.c h2{margin:6px 0 0;font-size:18px;font-weight:600}.c small{opacity:.7}.c .d{font:300 28px 'Helvetica Neue';margin-top:8px;font-variant-numeric:tabular-nums}svg{width:130px;height:130px}.tag{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;opacity:.8}</style>
<header><h1>WORLD CLOCK</h1><select id="s"></select><button id="add">Add city</button></header><div class="grid" id="g"></div>
<script>
const CITIES={'New York':'America/New_York','Los Angeles':'America/Los_Angeles','São Paulo':'America/Sao_Paulo','London':'Europe/London','Paris':'Europe/Paris','Cairo':'Africa/Cairo','Dubai':'Asia/Dubai','Mumbai':'Asia/Kolkata','Bangkok':'Asia/Bangkok','Tokyo':'Asia/Tokyo','Sydney':'Australia/Sydney','Auckland':'Pacific/Auckland','Reykjavik':'Atlantic/Reykjavik','Honolulu':'Pacific/Honolulu'};let cities=[];
$('#s').innerHTML=Object.keys(CITIES).map(c=>`<option>${c}</option>`).join('');
const parts=tz=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'numeric',minute:'numeric',second:'numeric',hour12:false,weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{h:+p.hour%24,m:+p.minute,s:+p.second,wd:p.weekday}};
const hand=(a,l,w,c)=>`<line x1="50" y1="50" x2="${50+Math.sin(a)*l}" y2="${50-Math.cos(a)*l}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
// Cards are tinted by local daylight: deep blue at night, warm in the morning/evening, sky-blue at midday.
function render(){$('#g').innerHTML=cities.map(c=>{const t=parts(CITIES[c.name]),hr=t.h+t.m/60,day=hr>=7&&hr<18,dusk=(hr>=5&&hr<7)||(hr>=18&&hr<20),bg=day?'linear-gradient(160deg,#2f7bd8,#7fc0ff)':dusk?'linear-gradient(160deg,#b0507a,#f2a86b)':'linear-gradient(160deg,#0d1330,#1f2a5c)';
return`<div class="c" data-id="${c.id}" style="background:${bg}"><span class="x" data-del>✕</span><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#ffffff22" stroke="#fff6" stroke-width="2"/>${Array.from({length:12},(_,i)=>`<line x1="50" y1="${i%3?8:6}" x2="50" y2="${i%3?11:14}" stroke="#fff" stroke-width="${i%3?1:2}" transform="rotate(${i*30} 50 50)"/>`).join('')}${hand((t.h%12+t.m/60)/12*6.283,24,3.5,'#fff')}${hand((t.m+t.s/60)/60*6.283,34,2.4,'#fff')}${hand(t.s/60*6.283,38,1,'#ff6b6b')}<circle cx="50" cy="50" r="2.5" fill="#fff"/></svg>
<h2>${esc(c.name)}</h2><div class="d">${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}</div><div class="tag">${t.wd} · ${day?'daytime':dusk?'twilight':'night'}</div></div>`}).join('')||'<p style="opacity:.6">Add a city to begin.</p>'}
$('#add').onclick=async()=>{const n=$('#s').value;if(cities.some(c=>c.name===n))return;cities.push(await api.add({name:n}));render()};
$('#g').onclick=async e=>{if(!e.target.hasAttribute('data-del'))return;const id=e.target.closest('.c').dataset.id;await api.del(id);cities=cities.filter(c=>c.id!==id);render()};
api.list().then(async d=>{cities=d.sort((a,b)=>a.createdAt-b.createdAt);if(!d.length)for(const n of['New York','London','Tokyo'])cities.push(await api.add({name:n}));render()});setInterval(render,1000);
</script>
