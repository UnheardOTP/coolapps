<!doctype html><meta charset="utf-8"><title>Warranty Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#4f46e5;--w:900px}.w{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}.pill{flex:none;width:110px;text-align:center;padding:6px 8px;border-radius:99px;font-size:12px;font-weight:700}.ok2{background:#dcfce7;color:#166534}.soon{background:#fef9c3;color:#854d0e}.near{background:#fed7aa;color:#9a3412}.exp{background:#e5e7eb;color:#4b5563}@media(prefers-color-scheme:dark){.ok2{background:#14532d;color:#bbf7d0}.soon{background:#713f12;color:#fef08a}.near{background:#7c2d12;color:#fed7aa}.exp{background:#374151;color:#d1d5db}}.w .b{flex:1}.w small{color:var(--mut)}</style>
<div class="wrap"><h1>Warranty Tracker</h1><p class="sub">Never miss a return window or warranty claim. Items are sorted by what expires soonest.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Item</label><input id="n" placeholder="Laptop"></div><div class="col"><label>Purchased</label><input id="p" type="date"></div><div class="col" style="max-width:120px"><label>Coverage (months)</label><input id="m" type="number" value="12"></div><div class="col"><label>Where / notes</label><input id="no" placeholder="Receipt in drawer"></div><button id="add">Add</button></div></div>
<div class="card" id="ls"></div></div>
<script>
let it=[];$('#p').value=dkey(new Date());
const expiry=i=>{const d=pdate(i.p);d.setMonth(d.getMonth()+i.m);return d};
function paint(){const now=new Date();now.setHours(0,0,0,0);const l=it.map(i=>({i,e:expiry(i),days:Math.round((expiry(i)-now)/864e5)})).sort((a,b)=>a.days-b.days);
  $('#ls').innerHTML=l.map(({i,e,days})=>{const c=days<0?'exp':days<=30?'near':days<=90?'soon':'ok2',t=days<0?`expired ${-days}d ago`:days===0?'expires today':`${days} day${days===1?'':'s'} left`;return`<div class="w" data-id="${i.id}"><span class="pill ${c}">${t}</span><div class="b"><b>${esc(i.n)}</b><br><small>Expires ${e.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · bought ${pdate(i.p).toLocaleDateString()} · ${i.m} mo${i.no?' · '+esc(i.no):''}</small></div><button class="x" data-rm>✕</button></div>`}).join('')||'<span class="mut">Nothing tracked yet.</span>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n||!$('#p').value)return;it.push(await api.add({kind:'wr',n,p:$('#p').value,m:Math.max(1,num('m')),no:$('#no').value.trim()}));$('#n').value=$('#no').value='';paint()};$('#ls').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('.w').dataset.id;await api.del(id);it=it.filter(x=>x.id!==id);paint()};api.list().then(d=>{it=only(d,'wr');paint()});
</script>
