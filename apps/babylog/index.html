<!doctype html><meta charset="utf-8"><title>Baby Log</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#06b6d4;--w:860px}.bt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.bt button{padding:18px 6px;font-size:16px;border-radius:14px;background:var(--soft);color:var(--fg);border:2px solid var(--line)}.bt button:hover{border-color:var(--a)}.bt button b{display:block;font-size:26px;margin-bottom:2px}.bt button.sl{background:#4f46e5;color:#fff;border-color:#4f46e5}.tl{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.tl .t{width:70px;color:var(--mut);font-variant-numeric:tabular-nums}.tl .e{width:36px;text-align:center;font-size:22px}.tl span.n{flex:1}@media(max-width:560px){.bt{grid-template-columns:1fr 1fr}}</style>
<div class="wrap"><h1>Baby Log</h1><p class="sub">Tap to log feeds, nappies and sleep in one touch. See how long since the last of each and the day's totals.</p>
<div class="bt"><button data-t="feed"><b>🍼</b>Feed</button><button data-t="wet"><b>💧</b>Wet nappy</button><button data-t="dirty"><b>💩</b>Dirty nappy</button><button id="slp"><b>😴</b><span id="sl">Sleep start</span></button></div>
<div class="row gap"><div class="col"><input id="nt" placeholder="Optional note for the next entry (e.g. 120 ml)"></div></div>
<div class="g4 gap" id="kp"></div><div class="card gap"><div class="row" style="margin-bottom:6px"><h2 style="margin:0;flex:1" id="dt"></h2><button class="x" id="pd">‹</button><button class="x" id="nd">›</button></div><div id="tl"></div></div></div>
<script>
let ev=[],day=new Date();day.setHours(0,0,0,0);const IC={feed:'🍼',wet:'💧',dirty:'💩',sleep:'😴'},LB={feed:'Feed',wet:'Wet nappy',dirty:'Dirty nappy',sleep:'Slept'};
const same=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString(),ago=ms=>{const m=Math.round(ms/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+'h '+m%60+'m ago'};
const sleeping=()=>ev.find(e=>e.t==='sleep'&&!e.end);
function paint(){const ds=ev.filter(e=>same(e.at,day)).sort((a,b)=>b.at-a.at),last=t=>ev.filter(e=>e.t===t).sort((a,b)=>b.at-a.at)[0],sl=ds.filter(e=>e.t==='sleep').reduce((n,e)=>n+((e.end||Date.now())-e.at),0),s=sleeping();
  $('#sl').textContent=s?'Wake up':'Sleep start';$('#slp').classList.toggle('sl',!!s);
  $('#kp').innerHTML=[['Last feed',last('feed')?ago(Date.now()-last('feed').at):'–'],['Feeds today',ds.filter(e=>e.t==='feed').length],['Nappies today',ds.filter(e=>e.t==='wet'||e.t==='dirty').length],['Sleep today',`${Math.floor(sl/36e5)}h ${Math.round(sl%36e5/6e4)}m${s?' (ongoing)':''}`]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:18px">${v}</b></div>`).join('');
  $('#dt').textContent=same(day,Date.now())?'Today':day.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});$('#nd').disabled=same(day,Date.now());
  $('#tl').innerHTML=ds.map(e=>`<div class="tl" data-id="${e.id}"><span class="t">${new Date(e.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span><span class="e">${IC[e.t]}</span><span class="n">${LB[e.t]}${e.t==='sleep'?` · ${e.end?Math.round((e.end-e.at)/6e4)+' min':'in progress'}`:''}${e.n?` <span class="mut">· ${esc(e.n)}</span>`:''}</span><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">Nothing logged for this day.</span>'}
document.querySelector('.bt').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='slp'){const s=sleeping();if(s){s.end=Date.now();api.upd(s.id,{end:s.end})}else ev.push(await api.add({kind:'bb',t:'sleep',at:Date.now(),n:$('#nt').value.trim()}))}else if(b.dataset.t)ev.push(await api.add({kind:'bb',t:b.dataset.t,at:Date.now(),n:$('#nt').value.trim()}));$('#nt').value='';day=new Date();day.setHours(0,0,0,0);paint()};
$('#tl').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('.tl').dataset.id;await api.del(id);ev=ev.filter(x=>x.id!==id);paint()};$('#pd').onclick=()=>{day.setDate(day.getDate()-1);paint()};$('#nd').onclick=()=>{day.setDate(day.getDate()+1);paint()};
api.list().then(d=>{ev=only(d,'bb');paint()});setInterval(paint,30000);
</script>
