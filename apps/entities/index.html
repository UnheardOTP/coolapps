<!doctype html><meta charset="utf-8"><title>HTML Entities</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#e11d48}.t{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.t div{background:var(--soft);border:1px solid var(--line);border-radius:9px;text-align:center;padding:8px 4px;cursor:pointer}.t div:hover{border-color:var(--a)}.t b{font-size:22px;display:block}.t small{font:11px ui-monospace,monospace;color:var(--mut)}</style>
<div class="wrap"><h1>HTML Entities</h1><p class="sub">Escape text for safe HTML, decode entities back, and grab common symbols.</p>
<div class="card"><label>Text</label><textarea id="in" data-keep placeholder='<p class="x">Tom & Jerry © 2024</p>'></textarea>
<div class="row gap"><button id="esc">Escape</button><button class="s" id="unesc">Unescape</button><label style="margin:0 0 9px"><input type="checkbox" id="all" data-keep> Encode all non-ASCII as numeric entities</label></div><label class="gap">Result</label><div class="out" id="out"></div><button class="s gap" id="cp">Copy result</button></div>
<div class="card"><h2>Common entities (click to copy)</h2><div class="t" id="tb"></div></div></div>
<script>
const E=[['&','&amp;'],['<','&lt;'],['>','&gt;'],['"','&quot;'],["'",'&#39;'],['©','&copy;'],['®','&reg;'],['™','&trade;'],['€','&euro;'],['£','&pound;'],['¥','&yen;'],['¢','&cent;'],['§','&sect;'],['°','&deg;'],['±','&plusmn;'],['×','&times;'],['÷','&divide;'],['µ','&micro;'],['¶','&para;'],['·','&middot;'],['…','&hellip;'],['–','&ndash;'],['—','&mdash;'],['‘','&lsquo;'],['’','&rsquo;'],['“','&ldquo;'],['”','&rdquo;'],['«','&laquo;'],['»','&raquo;'],['•','&bull;'],['←','&larr;'],['→','&rarr;'],['↑','&uarr;'],['↓','&darr;'],['↔','&harr;'],['♥','&hearts;'],['≈','&asymp;'],['≠','&ne;'],['≤','&le;'],['≥','&ge;'],['∞','&infin;'],['√','&radic;'],['∑','&sum;'],['π','&pi;'],['Ω','&Omega;'],['α','&alpha;'],['β','&beta;'],['(nbsp)','&nbsp;']];
$('#tb').innerHTML=E.map(([c,e])=>`<div data-e="${esc(e)}"><b>${c==='(nbsp)'?'␣':esc(c)}</b><small>${esc(e)}</small></div>`).join('');$('#tb').onclick=e=>{const d=e.target.closest('div[data-e]');if(d)copy(d.dataset.e,d.querySelector('small'))};
const escape=s=>{let r=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');if($('#all').checked)r=[...r].map(c=>c.codePointAt(0)>127?`&#${c.codePointAt(0)};`:c).join('');return r};
const unescape=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
$('#esc').onclick=()=>$('#out').textContent=escape($('#in').value);$('#unesc').onclick=()=>$('#out').textContent=unescape($('#in').value);$('#cp').onclick=e=>copy($('#out').textContent,e.target);remember();
</script>
