<!doctype html><meta charset="utf-8"><title>HTML Playground</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#e34c26;--w:1300px}.ws{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ed{display:flex;flex-direction:column;gap:10px}.ed textarea{min-height:150px;tab-size:2;white-space:pre}iframe{width:100%;height:100%;min-height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}#log{max-height:110px;overflow:auto;font:12px ui-monospace,monospace;background:var(--soft);padding:8px 10px;border-radius:8px;margin-top:8px;white-space:pre-wrap}@media(max-width:900px){.ws{grid-template-columns:1fr}}</style>
<div class="wrap"><h1>HTML Playground</h1><p class="sub">Write HTML, CSS and JavaScript; the preview updates as you type. The preview is sandboxed, and <code>console.log</code> output shows below it.</p>
<div class="ws"><div class="ed"><div class="card"><label>HTML</label><textarea id="h" spellcheck="false" data-keep></textarea></div><div class="card"><label>CSS</label><textarea id="c" spellcheck="false" data-keep></textarea></div><div class="card"><label>JavaScript</label><textarea id="j" spellcheck="false" data-keep></textarea></div></div>
<div class="card" style="display:flex;flex-direction:column"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Preview</h2><button class="x right" id="op">Open in new tab</button><button class="x" id="cp">Copy full HTML</button></div><iframe id="fr" sandbox="allow-scripts allow-modals"></iframe><div id="log"></div></div></div>
<div class="card gap"><h2>Saved projects</h2><div id="sv"></div></div></div>
<script>
const DEF={h:'<h1>Hello 👋</h1>\n<button id="b">Click me</button>\n<p id="o"></p>',c:'body { font-family: system-ui; text-align: center; padding: 2rem; }\nbutton { padding: .6rem 1.2rem; font-size: 1rem; }',j:'let n = 0;\nb.onclick = () => {\n  o.textContent = `Clicked ${++n} times`;\n  console.log("clicks:", n);\n};'};
const doc=()=>`<!doctype html><meta charset="utf-8"><style>${$('#c').value}</style><body>${$('#h').value}<script>addEventListener('error',e=>parent.postMessage({l:'Error: '+e.message},'*'));const _l=console.log;console.log=(...a)=>{parent.postMessage({l:a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')},'*');_l(...a)};<\/script><script>try{(0,eval)(${JSON.stringify($('#j').value).replace(/</g,'\\u003c')})}catch(e){parent.postMessage({l:'Error: '+e.message},'*')}<\/script></body>`;
let t;const run=()=>{clearTimeout(t);t=setTimeout(()=>{$('#log').textContent='';$('#fr').srcdoc=doc()},350)};
addEventListener('message',e=>{if(e.source===$('#fr').contentWindow&&e.data&&typeof e.data.l==='string')$('#log').textContent+=e.data.l+'\n'});
document.addEventListener('input',run);document.addEventListener('keydown',e=>{if(e.key==='Tab'&&e.target.tagName==='TEXTAREA'){e.preventDefault();const s=e.target.selectionStart;e.target.setRangeText('  ',s,e.target.selectionEnd,'end')}});
$('#op').onclick=()=>window.open(URL.createObjectURL(new Blob([doc()],{type:'text/html'})));$('#cp').onclick=e=>copy(doc().replace(/<script>addEventListener[\s\S]*?<\/script>\n?/,''),e.target);
savedBar($('#sv'),{get:()=>({h:$('#h').value,c:$('#c').value,j:$('#j').value}),set:d=>{$('#h').value=d.h;$('#c').value=d.c;$('#j').value=d.j;run()}});remember().then(()=>{if(!$('#h').value&&!$('#c').value&&!$('#j').value)for(const k in DEF)$('#'+k).value=DEF[k];run()});
</script>
