<!doctype html><meta charset="utf-8"><title>Scientific Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#4f46e5;--w:720px}#disp{font:300 30px ui-monospace,Menlo,Consolas,monospace;width:100%;text-align:right}#res{text-align:right;font:600 34px ui-monospace,Menlo,Consolas,monospace;color:var(--a);min-height:48px;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.keys button{padding:12px 4px;font-size:16px;background:var(--soft);color:var(--fg);border:1px solid var(--line)}.keys button.op{background:color-mix(in srgb,var(--a) 14%,var(--soft))}.keys button.eq{background:var(--a);color:#fff}.h{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:14px}.h:hover{background:var(--soft)}</style>
<div class="wrap"><h1>Scientific Calculator</h1><p class="sub">Type or tap an expression. Supports functions, constants, implicit multiplication, <code>ans</code>, and a history that is kept.</p>
<div class="card"><input id="disp" placeholder="0" autofocus autocomplete="off"><div id="res"></div><div class="err" id="er"></div>
<div class="row gap"><label style="margin:0"><input type="radio" name="ang" id="rad" checked> Radians</label><label style="margin:0"><input type="radio" name="ang" id="deg"> Degrees</label><button class="x right" id="clr">Clear history</button></div>
<div class="keys gap" id="keys"></div></div><div class="card"><h2>History</h2><div id="hist"></div></div></div>
<script>
let ans=0,hist=[];const K=[['sin(','op'],['cos(','op'],['tan(','op'],['ln(','op'],['log(','op'],['C','op'],['asin(','op'],['acos(','op'],['atan(','op'],['sqrt(','op'],['^','op'],['⌫','op'],['(','op'],[')','op'],['pi','op'],['e','op'],['!','op'],['ans','op'],['7'],['8'],['9'],['/','op'],['%','op'],['abs(','op'],['4'],['5'],['6'],['*','op'],['exp(','op'],['1/x','op'],['1'],['2'],['3'],['-','op'],['.'],[',','op'],['0'],['00'],['+','op'],['=','eq']];
$('#keys').innerHTML=K.map(([k,c])=>`<button class="${c||''}" data-k="${k}">${k==='*'?'×':k==='/'?'÷':k}</button>`).join('');
const opts=()=>({deg:$('#deg').checked});
function calc(commit){const s=$('#disp').value.trim();$('#er').textContent='';if(!s){$('#res').textContent='';return null}
  try{const f=compile(s,opts()),v=f({ans}),r=Number.isInteger(v)||!isFinite(v)?v:+v.toPrecision(12);$('#res').textContent=String(r);if(commit&&isFinite(v)){ans=v;hist.unshift({expr:s,res:String(r)});api.add({kind:'h',expr:s,res:String(r)});paint()}return v}catch(e){$('#res').textContent='';if(commit)$('#er').textContent=e.message;return null}}
function paint(){$('#hist').innerHTML=hist.slice(0,30).map(h=>`<div class="h" data-e="${esc(h.expr)}" data-r="${esc(h.res)}"><span>${esc(h.expr)}</span><b>= ${esc(h.res)}</b></div>`).join('')||'<span class="mut">No calculations yet.</span>'}
$('#keys').onclick=e=>{const k=e.target.dataset.k;if(!k)return;const d=$('#disp');if(k==='=')return calc(true);if(k==='C'){d.value='';return calc()}if(k==='⌫'){d.value=d.value.slice(0,-1);return calc()}if(k==='1/x'){d.value=`1/(${d.value||'ans'})`;return calc(true)}d.value+=k;calc();d.focus()};
$('#disp').oninput=()=>calc();$('#disp').onkeydown=e=>{if(e.key==='Enter')calc(true)};document.querySelectorAll('input[name=ang]').forEach(i=>i.onchange=()=>calc());
$('#hist').onclick=e=>{const h=e.target.closest('.h');if(h){$('#disp').value=h.dataset.e;calc()}};$('#clr').onclick=async()=>{await Promise.all((await api.list()).filter(x=>x.kind==='h').map(x=>api.del(x.id)));hist=[];paint()};
api.list().then(d=>{hist=only(d,'h').sort((a,b)=>b.createdAt-a.createdAt);if(hist[0])ans=parseFloat(hist[0].res)||0;paint()});
</script>
