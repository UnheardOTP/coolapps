<!doctype html><meta charset="utf-8"><title>Week Numbers</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0f766e;--w:820px}.cal{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:8px 0;border-radius:8px}.cal .h{font-size:11px;color:var(--mut);font-weight:700}.cal .w{color:var(--a);font-size:12px;font-weight:700}.cal .d{background:var(--soft)}.cal .o{opacity:.35}.cal .t{background:var(--a);color:#fff;font-weight:700}.cal .sel{outline:2px solid var(--a)}</style>
<div class="wrap"><h1>Week Numbers</h1><p class="sub">ISO week number, day of year, quarter and more for any date, plus a calendar with week numbers.</p>
<div class="card"><div class="row"><div class="col"><label>Date</label><input id="d" type="date" data-keep></div><button class="s" id="td">Today</button></div></div><div class="g4" id="kp"></div>
<div class="card gap"><div class="row" style="margin-bottom:10px"><button class="s" id="pm">‹</button><b id="mt" style="flex:1;text-align:center"></b><button class="s" id="nm">›</button></div><div class="cal" id="cal"></div></div></div>
<script>
// ISO 8601: weeks start Monday and week 1 is the week containing the year's first Thursday.
function iso(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
const leap=y=>y%4===0&&(y%100!==0||y%400===0),doy=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,0))/864e5);
let view;
function run(){if(!$('#d').value)$('#d').value=dkey(new Date());const d=pdate($('#d').value),i=iso(d),n=doy(d),L=leap(d.getFullYear())?366:365;view??=new Date(d.getFullYear(),d.getMonth(),1);
  $('#kp').innerHTML=[['ISO week',`${i.w} (${i.y})`],['Day of year',`${n} of ${L}`],['Quarter',`Q${Math.floor(d.getMonth()/3)+1}`],['Weekday',d.toLocaleDateString(undefined,{weekday:'long'})],['Days left in year',L-n],['Weeks left',Math.ceil((L-n)/7)],['Leap year',leap(d.getFullYear())?'Yes':'No'],['Julian day number',Math.floor(d/864e5-d.getTimezoneOffset()/1440+2440587.5+.5)]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join('');
  $('#mt').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});const first=new Date(view),off=(first.getDay()+6)%7;first.setDate(1-off);let h='<div class="h">Wk</div>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let r=0;r<6;r++){const row=new Date(first);row.setDate(first.getDate()+r*7);h+=`<div class="w">${iso(new Date(row.getFullYear(),row.getMonth(),row.getDate()+3)).w}</div>`;for(let c=0;c<7;c++){const x=new Date(first);x.setDate(first.getDate()+r*7+c);const k=dkey(x);h+=`<div class="d ${x.getMonth()!==view.getMonth()?'o':''} ${k===dkey(new Date())?'t':''} ${k===$('#d').value?'sel':''}" data-d="${k}" style="cursor:pointer">${x.getDate()}</div>`}}$('#cal').innerHTML=h}
$('#cal').onclick=e=>{const k=e.target.dataset.d;if(k){$('#d').value=k;run();$('#d').dispatchEvent(new Event('input',{bubbles:true}))}};$('#pm').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);run()};$('#nm').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);run()};$('#td').onclick=()=>{$('#d').value=dkey(new Date());view=undefined;run()};$('#d').addEventListener('input',()=>{view=undefined;run()});remember().then(run);
</script>
