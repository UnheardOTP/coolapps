<!doctype html><meta charset="utf-8"><title>Watchlist</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#f59e0b;--w:960px}.m{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.m .b{flex:1}.m small{color:var(--mut)}.st{font-size:20px;letter-spacing:2px;cursor:pointer;color:#f59e0b;user-select:none}.st i{font-style:normal;color:var(--line)}.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--mut);margin-right:6px}.tag.w{background:#fef3c7;color:#92400e}.tag.s{background:#dcfce7;color:#166534}@media(prefers-color-scheme:dark){.tag.w{background:#78350f;color:#fde68a}.tag.s{background:#14532d;color:#bbf7d0}}</style>
<div class="wrap"><h1>Watchlist</h1><p class="sub">Movies and shows to watch, and your ratings for the ones you have.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Title</label><input id="n"></div><div class="col" style="max-width:100px"><label>Year</label><input id="y" type="number"></div><div class="col"><label>Type</label><select id="t"><option>Movie</option><option>Series</option><option>Documentary</option><option>Anime</option></select></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><div class="tabs" id="tabs"></div><input id="q" placeholder="Search…"><div id="ls" class="gap"></div></div></div>
<script>
let it=[],tab='to';
function paint(){const w=it.filter(i=>!i.seen),s=it.filter(i=>i.seen),rt=s.filter(i=>i.r);$('#kp').innerHTML=[['To watch',w.length],['Watched',s.length],['Average rating',rt.length?fmt(rt.reduce((n,i)=>n+i.r,0)/rt.length,1)+' ★':'–'],['5-star films',s.filter(i=>i.r===5).length]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  $('#tabs').innerHTML=[['to','To watch'],['seen','Watched'],['all','All']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');const q=$('#q').value.toLowerCase();
  const l=it.filter(i=>(tab==='all'||(tab==='seen')===!!i.seen)&&(!q||i.n.toLowerCase().includes(q))).sort((a,b)=>tab==='seen'?(b.r||0)-(a.r||0):b.createdAt-a.createdAt);
  $('#ls').innerHTML=l.map(i=>`<div class="m" data-id="${i.id}"><div class="b"><b>${esc(i.n)}</b> ${i.y?`<small>(${i.y})</small>`:''}<div><span class="tag ${i.seen?'s':'w'}">${i.seen?'watched':'to watch'}</span><small>${esc(i.t)}</small></div></div><span class="st" title="Rate">${[1,2,3,4,5].map(n=>n<=(i.r||0)?`<span data-r="${n}">★</span>`:`<i data-r="${n}">★</i>`).join('')}</span><button class="s" data-seen>${i.seen?'Unwatch':'✓ Watched'}</button><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">Nothing here.</span>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n)return;it.push(await api.add({kind:'mv',n,y:num('y')||'',t:$('#t').value,seen:false,r:0}));$('#n').value=$('#y').value='';paint()};
$('#ls').onclick=async e=>{const r=e.target.closest('.m');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);if(e.target.dataset.r){i.r=i.r===+e.target.dataset.r?0:+e.target.dataset.r;if(i.r)i.seen=true;api.upd(i.id,{r:i.r,seen:i.seen})}if(e.target.hasAttribute('data-seen')){i.seen=!i.seen;api.upd(i.id,{seen:i.seen})}if(e.target.hasAttribute('data-rm')){await api.del(i.id);it=it.filter(x=>x!==i)}paint()};
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;paint()}};$('#q').oninput=paint;api.list().then(d=>{it=only(d,'mv');paint()});
</script>
