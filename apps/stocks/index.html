<!doctype html><meta charset="utf-8"><title>Paper Trader</title><script src="/shared/lib.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1117;color:#c9d1d9;font-family:'SF Mono','Courier New',monospace;padding:24px 40px}header{display:flex;align-items:baseline;gap:30px;margin-bottom:18px}h1{margin:0;font-size:22px;letter-spacing:.2em;color:#58a6ff}.nw b{font-size:30px;color:#fff}.up{color:#3fb950}.dn{color:#f85149}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.15em;color:#6e7681;padding:8px;border-bottom:1px solid #21262d}td{padding:12px 8px;border-bottom:1px solid #161b22}td b{color:#fff;font-size:17px}svg{width:150px;height:36px}button{font:inherit;background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:5px 12px;border-radius:6px;cursor:pointer}button.b{border-color:#238636;color:#3fb950}button.s{border-color:#da3633;color:#f85149}button:hover{filter:brightness(1.3)}
.rs{margin-top:20px;color:#6e7681;font-size:13px}.rs a{cursor:pointer;color:#58a6ff}</style>
<header><h1>PAPER TRADER</h1><div class="nw">Net worth <b id="nw"></b> <span id="pl"></span></div><div>Cash <b id="cash"></b></div></header>
<table><thead><tr><th>SYMBOL</th><th>PRICE</th><th>TREND</th><th>HELD</th><th>VALUE</th><th></th></tr></thead><tbody id="tb"></tbody></table><div class="rs">Prices are simulated random walks. Your cash and holdings are saved. <a id="rs">Reset to $10,000</a></div>
<script>
const SYM=[['NOVA',120,.012],['FERN',48,.02],['ORCA',310,.009],['PIXL',22,.035],['GRID',75,.015]],START=10000;let px=SYM.map(([,p])=>[p]),acct={cash:START,held:SYM.map(()=>0)},doc=null,t=0;
const $$=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
// Each tick multiplies every price by a small random factor, giving a geometric random walk with a gentle upward drift.
setInterval(()=>{px.forEach((h,i)=>{const p=h.at(-1),v=SYM[i][2];h.push(Math.max(1,p*(1+(Math.random()-.48)*v*2)));if(h.length>60)h.shift()});render()},1000);
const price=i=>px[i].at(-1),worth=()=>acct.cash+acct.held.reduce((n,k,i)=>n+k*price(i),0);
function render(){const w=worth(),d=w-START;$('#nw').textContent=$$(w);$('#pl').textContent=(d>=0?'+':'')+$$(d);$('#pl').className=d>=0?'up':'dn';$('#cash').textContent=$$(acct.cash);
$('#tb').innerHTML=SYM.map(([n],i)=>{const h=px[i],p=price(i),ch=p-h[0],lo=Math.min(...h),hi=Math.max(...h),pts=h.map((v,k)=>`${k/Math.max(1,h.length-1)*150},${34-(v-lo)/(hi-lo||1)*32}`).join(' ');
return`<tr><td><b>${n}</b></td><td>${$$(p)} <small class="${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'}</small></td><td><svg viewBox="0 0 150 36"><polyline points="${pts}" fill="none" stroke="${ch>=0?'#3fb950':'#f85149'}" stroke-width="2"/></svg></td><td>${acct.held[i]}</td><td>${$$(acct.held[i]*p)}</td><td><button class="b" data-i="${i}" data-q="1">Buy 1</button> <button class="b" data-i="${i}" data-q="10">Buy 10</button> <button class="s" data-i="${i}" data-q="-1">Sell 1</button> <button class="s" data-i="${i}" data-q="-10">Sell 10</button></td></tr>`}).join('')}
$('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,q=+b.dataset.q;if(q>0&&acct.cash>=q*price(i)){acct.cash-=q*price(i);acct.held[i]+=q}else if(q<0&&acct.held[i]>=-q){acct.held[i]+=q;acct.cash-=q*price(i)}else return;render();save()};
async function save(){if(doc)api.upd(doc.id,acct);else doc=await api.add(acct)}
$('#rs').onclick=()=>{acct={cash:START,held:SYM.map(()=>0)};render();save()};
api.list().then(d=>{if(d[0]){doc=d[0];acct={cash:doc.cash,held:doc.held}}render()});render();
</script>
