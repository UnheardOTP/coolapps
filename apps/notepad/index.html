<!doctype html><meta charset="utf-8"><title>Notepad</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#ca8a04;--w:1100px}.app{display:grid;grid-template-columns:240px 1fr;gap:16px;min-height:560px}.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}.note{padding:9px 11px;border-radius:9px;cursor:pointer}.note:hover{background:var(--soft)}.note.on{background:color-mix(in srgb,var(--a) 16%,transparent)}.note b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{color:var(--mut)}
.ed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column}.ed input{border:none;font-size:22px;font-weight:700;padding:4px 0;box-shadow:none}.ed textarea{flex:1;border:none;box-shadow:none;font:15px/1.65 inherit;min-height:440px;padding:6px 0}.ed .ft{display:flex;gap:14px;color:var(--mut);font-size:13px;align-items:center;border-top:1px solid var(--line);padding-top:8px}</style>
<div class="wrap"><h1>Notepad</h1><p class="sub">Notes that save themselves as you type. Search, rename and keep as many as you like.</p>
<div class="app"><div class="side"><button id="new">+ New note</button><input id="q" placeholder="Search…"><div id="list"></div></div><div class="ed" id="ed"></div></div></div>
<script>
let notes=[],cur=null,t;
const sorted=()=>{const q=$('#q').value.toLowerCase();return notes.filter(n=>!q||(n.title+n.body).toLowerCase().includes(q)).sort((a,b)=>b.at-a.at)};
function paint(){$('#list').innerHTML=sorted().map(n=>`<div class="note ${n.id===cur?'on':''}" data-id="${n.id}"><b>${esc(n.title||'Untitled')}</b><small>${esc((n.body||'').slice(0,60)||'empty')} · ${new Date(n.at).toLocaleDateString()}</small></div>`).join('')||'<span class="mut" style="padding:8px">No notes.</span>';
  const n=notes.find(x=>x.id===cur);$('#ed').innerHTML=n?`<input id="ti" value="${esc(n.title)}" placeholder="Title"><textarea id="bd" placeholder="Start writing…">${esc(n.body)}</textarea><div class="ft"><span id="wc"></span><span id="sv" class="ok"></span><button class="x right" id="dl">Delete note</button></div>`:'<div class="mut" style="margin:auto">Select a note or create a new one.</div>';if(n)count()}
const count=()=>{const b=$('#bd');if(b)$('#wc').textContent=((b.value.match(/\S+/g)||[]).length)+' words'};
// Autosave 600 ms after the last keystroke.
function edit(){const n=notes.find(x=>x.id===cur);n.title=$('#ti').value;n.body=$('#bd').value;n.at=Date.now();count();$('#sv').textContent='saving…';clearTimeout(t);t=setTimeout(async()=>{await api.upd(n.id,{title:n.title,body:n.body,at:n.at});$('#sv').textContent='saved';const sel=$('#list');sel.innerHTML=sorted().map(x=>`<div class="note ${x.id===cur?'on':''}" data-id="${x.id}"><b>${esc(x.title||'Untitled')}</b><small>${esc((x.body||'').slice(0,60)||'empty')} · ${new Date(x.at).toLocaleDateString()}</small></div>`).join('')},600)}
$('#ed').oninput=edit;$('#list').onclick=e=>{const n=e.target.closest('.note');if(n){cur=n.dataset.id;paint()}};$('#q').oninput=paint;
$('#new').onclick=async()=>{const n=await api.add({kind:'note',title:'',body:'',at:Date.now()});notes.push(n);cur=n.id;paint();$('#ti').focus()};
$('#ed').onclick=async e=>{if(e.target.id!=='dl')return;await api.del(cur);notes=notes.filter(n=>n.id!==cur);cur=sorted()[0]?.id||null;paint()};api.list().then(d=>{notes=only(d,'note');cur=sorted()[0]?.id||null;paint()});
</script>
