<!doctype html><meta charset="utf-8"><title>Appliance Energy Cost</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#eab308;--w:960px}tr input{padding:6px 8px}</style>
<div class="wrap"><h1>Appliance Energy Cost</h1><p class="sub">Estimate what each device costs to run and the carbon it causes. Add several to see where your electricity goes.</p>
<div class="card"><div class="row"><div class="col"><label>Electricity price ($ per kWh)</label><input id="pr" type="number" step="0.001" value="0.16" data-keep></div><div class="col"><label>CO₂ per kWh (kg)</label><input id="co" type="number" step="0.01" value="0.40" data-keep></div></div></div>
<div class="card"><div class="chips" id="pre"></div><div class="row gap"><div class="col" style="flex:2"><label>Appliance</label><input id="n"></div><div class="col" style="max-width:110px"><label>Watts</label><input id="w" type="number"></div><div class="col" style="max-width:130px"><label>Hours / day</label><input id="h" type="number" step="0.1"></div><div class="col" style="max-width:130px"><label>Qty</label><input id="q" type="number" value="1"></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><div style="overflow:auto"><table id="tb"></table></div></div></div>
<script>
const PRE=[['LED bulb',9,5],['Fridge',150,8],['TV (LED)',100,4],['Laptop',50,6],['Desktop PC',200,5],['Microwave',1100,.3],['Dishwasher',1800,1],['Washing machine',500,.7],['Dryer',3000,.7],['Space heater',1500,4],['Air conditioner',1400,6],['Kettle',2000,.3],['Router',10,24],['Phone charger',5,3]];let it=[];
$('#pre').innerHTML=PRE.map(([n,w,h],i)=>`<span class="chip" data-i="${i}">${n} <span class="mut">${w}W</span></span>`).join('');$('#pre').onclick=e=>{const c=e.target.closest('.chip');if(c){const[n,w,h]=PRE[c.dataset.i];$('#n').value=n;$('#w').value=w;$('#h').value=h}};
const kwh=i=>i.w*i.h*i.q/1000;   // kWh per day
function paint(){const P=num('pr'),C=num('co'),day=it.reduce((n,i)=>n+kwh(i),0);$('#kp').innerHTML=[['Per day',money(day*P)],['Per month',money(day*P*30.44)],['Per year',money(day*P*365)],['CO₂ per year',fmt(day*C*365,0)+' kg']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  const mx=Math.max(...it.map(kwh),1e-9);$('#tb').innerHTML='<tr><th>Appliance</th><th class="r">Watts</th><th class="r">Hrs/day</th><th class="r">Qty</th><th class="r">kWh/month</th><th class="r">Cost/month</th><th style="width:120px">Share</th><th></th></tr>'+[...it].sort((a,b)=>kwh(b)-kwh(a)).map(i=>`<tr data-id="${i.id}"><td><b>${esc(i.n)}</b></td><td class="r">${i.w}</td><td class="r">${i.h}</td><td class="r">${i.q}</td><td class="r">${fmt(kwh(i)*30.44,1)}</td><td class="r"><b>${money(kwh(i)*30.44*P)}</b></td><td><div class="bar"><i style="width:${kwh(i)/mx*100}%"></i></div></td><td class="r"><button class="x" data-rm>✕</button></td></tr>`).join('')||'<tr><td class="mut">Add an appliance above.</td></tr>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim(),w=num('w'),h=num('h');if(!n||!(w>0)||!(h>0))return;it.push(await api.add({kind:'ap',n,w,h,q:Math.max(1,num('q'))}));$('#n').value=$('#w').value=$('#h').value='';paint()};
$('#tb').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('tr').dataset.id;await api.del(id);it=it.filter(x=>x.id!==id);paint()};document.addEventListener('input',e=>{if(e.target.id==='pr'||e.target.id==='co')paint()});api.list().then(d=>{it=only(d,'ap');remember().then(paint)});
</script>
