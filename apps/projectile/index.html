<!doctype html><meta charset="utf-8"><title>Projectile Motion</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#ea580c;--w:960px}svg{width:100%;height:300px;background:linear-gradient(#bfdbfe,#eff6ff);border-radius:12px}@media(prefers-color-scheme:dark){svg{background:linear-gradient(#1e3a8a,#172554)}}</style>
<div class="wrap"><h1>Projectile Motion</h1><p class="sub">Launch speed, angle and height in; flight time, range and peak out — with the trajectory drawn. Air resistance is ignored.</p>
<div class="card"><div class="g4"><div><label>Speed (m/s)</label><input id="v" type="number" step="any" value="25" data-keep></div><div><label>Angle (°)</label><input id="a" type="number" step="any" value="45" data-keep></div><div><label>Launch height (m)</label><input id="h" type="number" step="any" value="1.5" data-keep></div><div><label>Gravity</label><select id="g" data-keep><option value="9.80665">Earth 9.81 m/s²</option><option value="1.62">Moon 1.62</option><option value="3.71">Mars 3.71</option><option value="24.79">Jupiter 24.8</option></select></div></div></div>
<div class="g4" id="kp"></div><div class="card gap"><svg id="sv" viewBox="0 0 800 300" preserveAspectRatio="none"></svg><div class="mut" id="ax"></div></div></div>
<script>
// With vx = v·cosθ, vy = v·sinθ: y(t) = h + vy·t − ½gt², flight time is the positive root of y(t) = 0, apex when vy = gt.
function solve(v,deg,h,g){const th=deg*Math.PI/180,vx=v*Math.cos(th),vy=v*Math.sin(th),T=(vy+Math.sqrt(vy*vy+2*g*h))/g,tp=Math.max(0,vy/g);return{vx,vy,T,range:vx*T,peak:h+vy*tp-.5*g*tp*tp,tp,vimp:Math.hypot(vx,vy-g*T),angImp:Math.atan2(g*T-vy,vx)*180/Math.PI}}
function run(){const v=num('v'),a=num('a'),h=Math.max(0,num('h')),g=+$('#g').value;if(!(v>0)||a<=-90||a>=90){$('#kp').innerHTML='<div class="kpi" style="grid-column:1/-1"><b>Enter a speed above 0 and an angle between −90° and 90°.</b></div>';return}const r=solve(v,a,h,g);
  $('#kp').innerHTML=[['Flight time',fmt(r.T,2)+' s'],['Range',fmt(r.range,1)+' m'],['Max height',fmt(r.peak,1)+' m'],['Impact speed',fmt(r.vimp,1)+' m/s at '+fmt(r.angImp,0)+'° below horizontal']].map(([k,x])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${x}</b></div>`).join('');
  const X=Math.max(r.range,1)*1.08,Yx=Math.max(r.peak,h,1)*1.2,pts=Array.from({length:101},(_,i)=>{const t=r.T*i/100,x=r.vx*t,y=h+r.vy*t-.5*g*t*t;return`${x/X*790+5},${290-Math.max(0,y)/Yx*280}`}).join(' ');
  $('#sv').innerHTML=`<line x1="0" x2="800" y1="290" y2="290" stroke="#16a34a" stroke-width="4"/><polyline fill="none" stroke="var(--a)" stroke-width="3" stroke-dasharray="1 0" points="${pts}"/><circle cx="${5}" cy="${290-h/Yx*280}" r="6" fill="#3b82f6"/><circle cx="${r.range/X*790+5}" cy="290" r="7" fill="#dc2626"/><circle cx="${r.vx*r.tp/X*790+5}" cy="${290-r.peak/Yx*280}" r="5" fill="#f59e0b"/>`;$('#ax').textContent=`x: 0 → ${fmt(X,0)} m · y: 0 → ${fmt(Yx,0)} m · ● launch ● apex ● landing`}
document.addEventListener('input',run);remember().then(run);
</script>
