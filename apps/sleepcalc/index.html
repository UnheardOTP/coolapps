<!doctype html><meta charset="utf-8"><title>Sleep Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#4f46e5;--w:700px}.t{display:flex;gap:10px;flex-wrap:wrap}.t div{flex:1;min-width:110px;text-align:center;padding:14px 8px;border-radius:12px;background:var(--soft);border:2px solid transparent}.t b{font-size:24px;display:block;font-variant-numeric:tabular-nums}.t small{color:var(--mut)}.t .good{border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}</style>
<div class="wrap"><h1>Sleep Calculator</h1><p class="sub">Sleep runs in roughly 90-minute cycles. Waking at the end of one feels easier than mid-cycle.</p>
<div class="card"><div class="tabs" id="tabs"><button data-m="wake" class="on">I need to wake at…</button><button data-m="bed">I'm going to bed at…</button><button data-m="now">Sleep now</button></div>
<div class="row"><div class="col" id="tw"><label id="tl">Wake-up time</label><input id="tm" type="time" value="07:00" data-keep></div><div class="col"><label>Minutes to fall asleep</label><input id="fa" type="number" value="15" data-keep></div></div></div>
<div class="card"><h2 id="rt"></h2><div class="t" id="res"></div><p class="mut gap">Recommended: 5–6 cycles (7.5–9 hours) for most adults.</p></div></div>
<script>
let mode='wake';const f=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function run(){const fa=num('fa'),C=90*60000;$('#tw').classList.toggle('hide',mode==='now');let out=[];
  if(mode==='wake'){const[h,m]=$('#tm').value.split(':').map(Number),w=new Date();w.setHours(h,m,0,0);out=[6,5,4,3].map(c=>[new Date(w-c*C-fa*60000),c]);$('#rt').textContent='Go to sleep at one of these times'}
  else{let s;if(mode==='now')s=new Date(Date.now()+fa*60000);else{const[h,m]=$('#tm').value.split(':').map(Number);s=new Date();s.setHours(h,m,0,0);s=new Date(+s+fa*60000)}out=[3,4,5,6].map(c=>[new Date(+s+c*C),c]);$('#rt').textContent='Wake up at one of these times'}
  $('#res').innerHTML=out.map(([d,c])=>`<div class="${c>=5?'good':''}"><b>${f(d)}</b><small>${c} cycles · ${c*1.5} h</small></div>`).join('')}
$('#tabs').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));$('#tl').textContent=m==='wake'?'Wake-up time':'Bedtime';run()};document.addEventListener('input',run);remember().then(run);
</script>
