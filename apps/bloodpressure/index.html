<!doctype html><meta charset="utf-8"><title>Blood Pressure Log</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#e11d48;--w:900px}svg{width:100%;height:230px;background:var(--soft);border-radius:10px}.tg{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff}</style>
<div class="wrap" style="max-width:900px"><h1>Blood Pressure Log</h1><p class="sub">Record readings, see the category of each (American Heart Association ranges) and your recent averages. For personal tracking — it is not medical advice; talk to a clinician about your numbers.</p>
<div class="card"><div class="row"><div class="col"><label>Systolic (top)</label><input id="s" type="number" placeholder="120"></div><div class="col"><label>Diastolic (bottom)</label><input id="d" type="number" placeholder="80"></div><div class="col"><label>Pulse (optional)</label><input id="p" type="number" placeholder="68"></div><div class="col"><label>Note</label><input id="n" placeholder="morning, after walk…"></div><button id="add">Add reading</button></div><div class="err" id="er"></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Trend</h2><svg id="sv" viewBox="0 0 800 230" preserveAspectRatio="none"></svg><div class="mut"><span style="color:#e11d48">●</span> systolic &nbsp; <span style="color:#2563eb">●</span> diastolic &nbsp; shaded band = normal range</div></div><div class="card"><h2>Readings</h2><div style="max-height:360px;overflow:auto"><table id="tb"></table></div></div></div>
<script>
let rs=[];
// AHA categories: the higher of the two numbers decides the stage.
function cat(s,d){if(s>180||d>120)return['Hypertensive crisis','#7f1d1d'];if(s>=140||d>=90)return['High (stage 2)','#dc2626'];if(s>=130||d>=80)return['High (stage 1)','#f97316'];if(s>=120)return['Elevated','#eab308'];return['Normal','#16a34a']}
function paint(){const sorted=[...rs].sort((a,b)=>a.at-b.at),avg=(n)=>{const c=Date.now()-n*864e5,l=rs.filter(r=>r.at>=c);return l.length?[l.reduce((a,r)=>a+r.s,0)/l.length,l.reduce((a,r)=>a+r.d,0)/l.length,l.length]:null};
  const a7=avg(7),a30=avg(30),last=sorted.at(-1);$('#kp').innerHTML=[['Latest',last?`${last.s}/${last.d}`:'–',last?cat(last.s,last.d):null],['7-day average',a7?`${Math.round(a7[0])}/${Math.round(a7[1])}`:'–',a7?cat(a7[0],a7[1]):null],['30-day average',a30?`${Math.round(a30[0])}/${Math.round(a30[1])}`:'–',a30?cat(a30[0],a30[1]):null],['Readings',rs.length,null]].map(([k,v,c])=>`<div class="kpi"><small>${k}</small><b>${v}</b>${c?`<div><span class="tg" style="background:${c[1]}">${c[0]}</span></div>`:''}</div>`).join('');
  if(sorted.length>1){const lo=50,hi=Math.max(180,...sorted.map(r=>r.s))+10,Y=v=>220-(v-lo)/(hi-lo)*210,X=i=>i/(sorted.length-1)*780+10;$('#sv').innerHTML=`<rect x="0" y="${Y(120)}" width="800" height="${Y(80)-Y(120)}" fill="#16a34a" opacity=".12"/><polyline fill="none" stroke="#e11d48" stroke-width="3" points="${sorted.map((r,i)=>`${X(i)},${Y(r.s)}`).join(' ')}"/><polyline fill="none" stroke="#2563eb" stroke-width="3" points="${sorted.map((r,i)=>`${X(i)},${Y(r.d)}`).join(' ')}"/>`+sorted.map((r,i)=>`<circle cx="${X(i)}" cy="${Y(r.s)}" r="4" fill="#e11d48"/><circle cx="${X(i)}" cy="${Y(r.d)}" r="4" fill="#2563eb"/>`).join('')}else $('#sv').innerHTML='';
  $('#tb').innerHTML='<tr><th>When</th><th>Reading</th><th>Pulse</th><th>Category</th><th>Note</th><th></th></tr>'+[...sorted].reverse().map(r=>{const c=cat(r.s,r.d);return`<tr data-id="${r.id}"><td>${new Date(r.at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td><b>${r.s}/${r.d}</b></td><td>${r.p||'–'}</td><td><span class="tg" style="background:${c[1]}">${c[0]}</span></td><td class="mut">${esc(r.n||'')}</td><td class="r"><button class="x" data-rm>✕</button></td></tr>`}).join('')}
$('#add').onclick=async()=>{$('#er').textContent='';const s=num('s'),d=num('d');if(!(s>50&&s<300&&d>30&&d<200))return $('#er').textContent='Enter realistic systolic (50–300) and diastolic (30–200) values.';if(d>=s)return $('#er').textContent='Systolic should be higher than diastolic.';rs.push(await api.add({kind:'bp',s,d,p:num('p')||0,n:$('#n').value.trim(),at:Date.now()}));$('#s').value=$('#d').value=$('#p').value=$('#n').value='';paint()};
$('#tb').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('tr').dataset.id;await api.del(id);rs=rs.filter(x=>x.id!==id);paint()};api.list().then(d=>{rs=only(d,'bp');paint()});
</script>
