<!doctype html><meta charset="utf-8"><title>Body Fat Estimator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0891b2;--w:780px}.sc{display:flex;height:14px;border-radius:7px;overflow:hidden;position:relative;margin:12px 0 26px}.sc div{flex:1}.pin{position:absolute;top:-5px;width:4px;height:24px;background:var(--fg);border-radius:2px}</style>
<div class="wrap"><h1>Body Fat Estimator</h1><p class="sub">The US Navy tape-measure method: waist, neck (and hips for women) with your height. An estimate within a few percentage points, not a medical measurement.</p>
<div class="card"><div class="tabs" id="sx"><button data-s="m" class="on">Male</button><button data-s="f">Female</button></div><div class="row"><div class="col"><label>Units</label><select id="un" data-keep><option value="cm">Centimetres / kg</option><option value="in">Inches / lb</option></select></div></div>
<div class="g4 gap"><div><label>Height</label><input id="h" type="number" step="any" value="178" data-keep></div><div><label>Neck</label><input id="n" type="number" step="any" value="38" data-keep></div><div><label>Waist (at navel)</label><input id="w" type="number" step="any" value="86" data-keep></div><div id="hipw" class="hide"><label>Hips (widest)</label><input id="hp" type="number" step="any" value="98" data-keep></div></div><div class="row gap"><div class="col"><label>Body weight (optional)</label><input id="bw" type="number" step="any" value="80" data-keep></div></div></div>
<div class="card"><div class="row"><div><div class="mut">Estimated body fat</div><div class="big" id="bf">–</div></div><div class="col" style="text-align:right"><div class="big" id="ct" style="font-size:22px"></div></div></div><div class="sc"><div style="background:#38bdf8"></div><div style="background:#22c55e"></div><div style="background:#a3e635"></div><div style="background:#f59e0b"></div><div style="background:#ef4444"></div><span class="pin" id="pin"></span></div><div class="g3" id="kp"></div></div></div>
<script>
let sex='m';
// US Navy formulas (all measurements in inches): men 86.010·log10(waist−neck) − 70.041·log10(height) + 36.76; women 163.205·log10(waist+hip−neck) − 97.684·log10(height) − 78.387.
function bf(sx,h,n,w,hip){const L=Math.log10;return sx==='m'?86.01*L(w-n)-70.041*L(h)+36.76:163.205*L(w+hip-n)-97.684*L(h)-78.387}
const CAT={m:[[6,'Essential fat'],[14,'Athletic'],[18,'Fit'],[25,'Average'],[100,'Higher']],f:[[14,'Essential fat'],[21,'Athletic'],[25,'Fit'],[32,'Average'],[100,'Higher']]};
function run(){const k=$('#un').value==='cm'?1/2.54:1,h=num('h')*k,n=num('n')*k,w=num('w')*k,hp=num('hp')*k;$('#hipw').classList.toggle('hide',sex==='m');
  if(sex==='m'?!(w>n&&h>0):!(w+hp>n&&h>0)){$('#bf').textContent='–';$('#ct').textContent='Check your measurements';$('#kp').innerHTML='';return}
  const f=bf(sex,h,n,w,hp);if(!isFinite(f)||f<0||f>70){$('#bf').textContent='–';$('#ct').textContent='Measurements look off';$('#kp').innerHTML='';return}
  const cat=CAT[sex].find(c=>f<c[0])[1],lb=$('#un').value==='in',bw=num('bw'),fat=bw*f/100;$('#bf').textContent=fmt(f,1)+'%';$('#ct').textContent=cat;$('#pin').style.left=Math.min(100,f/40*100)+'%';
  $('#kp').innerHTML=bw>0?[['Fat mass',fmt(fat,1)+(lb?' lb':' kg')],['Lean mass',fmt(bw-fat,1)+(lb?' lb':' kg')],['Category',cat]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join(''):''}
$('#sx').onclick=e=>{const s=e.target.dataset.s;if(!s)return;sex=s;document.querySelectorAll('#sx button').forEach(b=>b.classList.toggle('on',b===e.target));run()};document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
