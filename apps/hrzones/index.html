<!doctype html><meta charset="utf-8"><title>Heart Rate Zones</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#e11d48;--w:780px}.z{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;margin-bottom:8px;color:#fff}.z b{width:60px;font-size:18px}.z span{flex:1;opacity:.92}.z em{font-style:normal;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}</style>
<div class="wrap"><h1>Heart Rate Zones</h1><p class="sub">Training zones from your age, with an optional resting heart rate for the more personal Karvonen method.</p>
<div class="card"><div class="g4"><div><label>Age</label><input id="ag" type="number" value="35" data-keep></div><div><label>Max HR formula</label><select id="fm" data-keep><option value="tanaka">Tanaka (208 − 0.7×age)</option><option value="classic">Classic (220 − age)</option><option value="custom">I know mine</option></select></div><div><label>Max HR (bpm)</label><input id="mx" type="number" data-keep></div><div><label>Resting HR (optional)</label><input id="rs" type="number" placeholder="e.g. 60" data-keep></div></div></div>
<div class="card" id="zs"></div></div>
<script>
const Z=[['Zone 1','Very light — recovery & warm-up',.5,.6,'#64748b'],['Zone 2','Light — fat burning, base endurance',.6,.7,'#16a34a'],['Zone 3','Moderate — aerobic fitness',.7,.8,'#ca8a04'],['Zone 4','Hard — threshold, race pace',.8,.9,'#ea580c'],['Zone 5','Maximum — short intervals',.9,1,'#dc2626']];
function run(){const age=num('ag'),f=$('#fm').value;let mx=f==='tanaka'?208-.7*age:f==='classic'?220-age:num('mx');if(f!=='custom')$('#mx').value=Math.round(mx);$('#mx').disabled=f!=='custom';const rest=num('rs');if(!(mx>0))return;
  $('#zs').innerHTML=Z.map(([n,d,lo,hi,c])=>{const a=rest>0?rest+(mx-rest)*lo:mx*lo,b=rest>0?rest+(mx-rest)*hi:mx*hi;return`<div class="z" style="background:${c}"><b>${n}</b><span>${d}<br><small>${Math.round(lo*100)}–${Math.round(hi*100)}% ${rest>0?'of heart-rate reserve':'of max'}</small></span><em>${Math.round(a)}–${Math.round(b)}</em></div>`}).join('')+`<div class="mut">Max HR ${Math.round(mx)} bpm${rest>0?` · reserve ${Math.round(mx-rest)} bpm`:''} · values in beats per minute. Formulas are estimates; individual maximums vary.</div>`}
document.addEventListener('input',run);remember().then(run);
</script>
