<!doctype html><meta charset="utf-8"><title>Minesweeper</title><script src="/shared/lib.js"></script>
<style>body{margin:0;min-height:100vh;background:#c0c0c0;font:14px 'Courier New',monospace;display:flex;flex-direction:column;align-items:center;padding-top:30px;user-select:none}
.win{background:#c0c0c0;border:3px solid;border-color:#fff #808080 #808080 #fff;padding:10px}.bar{display:flex;justify-content:space-between;align-items:center;background:#c0c0c0;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px;margin-bottom:10px}
.led{background:#000;color:#f00;font:700 26px 'Courier New';padding:0 6px;min-width:62px;text-align:center}#face{font-size:24px;width:40px;height:40px;border:3px solid;border-color:#fff #808080 #808080 #fff;background:#c0c0c0;cursor:pointer}
#g{display:grid;grid-template-columns:repeat(9,30px);border:3px solid;border-color:#808080 #fff #fff #808080}.t{width:30px;height:30px;border:3px solid;border-color:#fff #808080 #808080 #fff;background:#c0c0c0;font:700 17px 'Courier New';text-align:center;line-height:24px;cursor:pointer}
.t.o{border:1px solid #808080;background:#bdbdbd;line-height:28px}.t.x{background:#f44}p{margin-top:14px;color:#444}.n1{color:#00f}.n2{color:#080}.n3{color:#f00}.n4{color:#008}.n5{color:#800}</style>
<div class="win"><div class="bar"><div class="led" id="mc">010</div><button id="face">🙂</button><div class="led" id="tm">000</div></div><div id="g"></div></div>
<p id="best"></p><p>Left-click reveals · right-click flags</p>
<script>
const N=9,M=10;let cells,over,started,t0,timer,flags,times=[];
// Mines are placed after the first click so you can never lose on move one.
function init(){cells=Array.from({length:N*N},()=>({m:0,o:0,f:0,n:0}));over=false;started=false;flags=0;clearInterval(timer);$('#tm').textContent='000';$('#face').textContent='🙂';draw()}
function place(safe){let k=0;while(k<M){const i=Math.floor(Math.random()*N*N);if(i!==safe&&!cells[i].m){cells[i].m=1;k++}}cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length)}
const nb=i=>{const x=i%N,y=Math.floor(i/N),r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=x+dx,b=y+dy;if((dx||dy)&&a>=0&&b>=0&&a<N&&b<N)r.push(b*N+a)}return r};
function open(i){const c=cells[i];if(c.o||c.f)return;c.o=1;if(c.m)return;if(!c.n)nb(i).forEach(open)}
function draw(){$('#mc').textContent=String(Math.max(0,M-flags)).padStart(3,'0');$('#g').innerHTML=cells.map((c,i)=>{let s='',cl='t';if(c.o||(over&&c.m)){cl+=c.m?' o x':' o';s=c.m?'💣':c.n||''; if(c.n&&!c.m)cl+=' n'+c.n}else if(c.f)s='🚩';return`<div class="${cl}" data-i="${i}">${s}</div>`}).join('');
const b=times.length?Math.min(...times.map(t=>t.s)):null;$('#best').textContent=b?`Best time: ${b}s`:''}
async function check(){if(cells.some(c=>c.o&&c.m)){over=true;$('#face').textContent='😵';clearInterval(timer)}else if(cells.every(c=>c.m||c.o)){over=true;$('#face').textContent='😎';clearInterval(timer);times.push(await api.add({s:Math.round((Date.now()-t0)/1000)}))}draw()}
$('#g').onclick=e=>{const t=e.target.closest('.t');if(!t||over)return;const i=+t.dataset.i;if(!started){started=true;place(i);t0=Date.now();timer=setInterval(()=>$('#tm').textContent=String(Math.min(999,Math.round((Date.now()-t0)/1000))).padStart(3,'0'),500)}open(i);check()};
$('#g').oncontextmenu=e=>{e.preventDefault();const t=e.target.closest('.t');if(!t||over)return;const c=cells[+t.dataset.i];if(!c.o){c.f^=1;flags+=c.f?1:-1;draw()}};
$('#face').onclick=init;api.list().then(d=>{times=d;init()});
</script>
