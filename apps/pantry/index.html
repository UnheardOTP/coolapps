<!doctype html><meta charset="utf-8"><title>Pantry Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#65a30d;--w:900px}.i{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}.i .b{flex:1}.pill{flex:none;width:112px;text-align:center;padding:5px 8px;border-radius:99px;font-size:12px;font-weight:700}.ex{background:#fecaca;color:#7f1d1d}.so{background:#fed7aa;color:#7c2d12}.wk{background:#fef08a;color:#713f12}.ok2{background:#dcfce7;color:#166534}.no{background:var(--soft);color:var(--mut)}@media(prefers-color-scheme:dark){.ex{background:#7f1d1d;color:#fecaca}.so{background:#7c2d12;color:#fed7aa}.wk{background:#713f12;color:#fef08a}.ok2{background:#14532d;color:#bbf7d0}}</style>
<div class="wrap"><h1>Pantry Tracker</h1><p class="sub">Know what's in the cupboard, fridge and freezer — and what needs using up before it expires.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Item</label><input id="n"></div><div class="col" style="max-width:90px"><label>Qty</label><input id="q" type="number" value="1"></div><div class="col"><label>Where</label><select id="l"><option>Pantry</option><option>Fridge</option><option>Freezer</option><option>Spices</option></select></div><div class="col"><label>Expires (optional)</label><input id="d" type="date"></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><div class="row"><div class="col"><input id="s" placeholder="Search…"></div><div class="col"><select id="f"><option value="">All locations</option><option>Pantry</option><option>Fridge</option><option>Freezer</option><option>Spices</option></select></div></div><div id="ls" class="gap"></div></div></div>
<script>
let it=[];const days=i=>i.d?Math.round((pdate(i.d)-new Date(new Date().setHours(0,0,0,0)))/864e5):null;
function pill(i){const d=days(i);if(d==null)return['no','no date'];return d<0?['ex',`expired ${-d}d ago`]:d===0?['ex','expires today']:d<=3?['so',`${d} days left`]:d<=14?['wk',`${d} days left`]:['ok2',`${d} days left`]}
function paint(){const q=$('#s').value.toLowerCase(),f=$('#f').value,soon=it.filter(i=>days(i)!=null&&days(i)<=7&&days(i)>=0).length,exp=it.filter(i=>days(i)!=null&&days(i)<0).length;
  $('#kp').innerHTML=[['Items',it.length],['Units',it.reduce((n,i)=>n+i.q,0)],['Use within a week',soon],['Expired',exp]].map(([k,v],x)=>`<div class="kpi"><small>${k}</small><b ${x===3&&v?'class="bad"':''}>${v}</b></div>`).join('');
  const l=it.filter(i=>(!f||i.l===f)&&(!q||i.n.toLowerCase().includes(q))).sort((a,b)=>(days(a)??9e9)-(days(b)??9e9));
  $('#ls').innerHTML=l.map(i=>{const[c,t]=pill(i);return`<div class="i" data-id="${i.id}"><span class="pill ${c}">${t}</span><div class="b"><b>${esc(i.n)}</b> <span class="mut">· ${esc(i.l)}${i.d?' · '+pdate(i.d).toLocaleDateString():''}</span></div><button class="x" data-d="-1">−</button><b style="min-width:24px;text-align:center">${i.q}</b><button class="x" data-d="1">+</button><button class="x" data-rm>✕</button></div>`}).join('')||'<span class="mut">Nothing here.</span>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n)return;it.push(await api.add({kind:'pt',n,q:Math.max(1,num('q')),l:$('#l').value,d:$('#d').value}));$('#n').value=$('#d').value='';paint()};
$('#ls').onclick=async e=>{const r=e.target.closest('.i');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);if(e.target.dataset.d){i.q+=+e.target.dataset.d;if(i.q<=0){await api.del(i.id);it=it.filter(x=>x!==i)}else api.upd(i.id,{q:i.q})}if(e.target.hasAttribute('data-rm')){await api.del(i.id);it=it.filter(x=>x!==i)}paint()};$('#s').oninput=$('#f').onchange=paint;api.list().then(d=>{it=only(d,'pt');paint()});
</script>
