<!doctype html><meta charset="utf-8"><title>Fake Data Generator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#d946ef;--w:1000px}.cols label{display:inline-flex;gap:6px;align-items:center;margin:0 16px 6px 0;color:var(--fg);font-weight:400;font-size:14px}</style>
<div class="wrap" style="max-width:1000px"><h1>Fake Data Generator</h1><p class="sub">Realistic-looking sample records for testing: pick columns, a count and an export format. The data is random and fictional.</p>
<div class="card"><label>Columns</label><div class="cols" id="cols"></div><div class="row gap"><div class="col" style="max-width:130px"><label>Rows</label><input id="n" type="number" min="1" max="1000" value="10" data-keep></div><div class="col"><label>Format</label><select id="f" data-keep><option>JSON</option><option>CSV</option><option>SQL INSERT</option><option>Table</option></select></div><div class="col"><label>Table name (SQL)</label><input id="t" value="users" data-keep></div><button id="go">Generate</button></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0" id="st"></h2><button class="x right" id="cp">Copy</button></div><div id="out" class="out" style="max-height:420px;overflow:auto"></div></div></div>
<script>
const R=n=>Math.floor(Math.random()*n),P=a=>a[R(a.length)];
const FN='Ada Alan Grace Linus Margaret Dennis Barbara Ken Radia Tim Katherine Edsger Hedy Donald Frances Bjarne Sophie Guido Mae Brian Anita Rob Jean Niklaus'.split(' '),LN='Lovelace Turing Hopper Torvalds Hamilton Ritchie Liskov Thompson Perlman Berners-Lee Johnson Dijkstra Lamarr Knuth Allen Stroustrup Wilson Rossum Jemison Kernighan Borg Pike Sammet Wirth'.split(' ');
const CO='Acme Globex Initech Umbrella Hooli Stark Wayne Wonka Soylent Cyberdyne Vandelay Pied'.split(' '),SF='Inc LLC Group Labs Systems Partners Works'.split(' '),ST='Maple Oak Pine Cedar Elm Walnut Lake Hill River Sunset Park Highland'.split(' '),SS='St Ave Rd Blvd Ln Way Dr'.split(' '),CT='Springfield Riverton Fairview Georgetown Madison Clinton Salem Franklin Arlington Ashland'.split(' '),STt='CA NY TX WA OR CO FL IL MA GA'.split(' ');
const hex=n=>Array.from({length:n},()=>R(16).toString(16)).join('');
const COLS={id:()=>R(1e6),uuid:()=>`${hex(8)}-${hex(4)}-4${hex(3)}-${P('89ab')}${hex(3)}-${hex(12)}`,first_name:()=>P(FN),last_name:()=>P(LN),email:(r)=>`${r.first_name?.toLowerCase()||P(FN).toLowerCase()}.${(r.last_name||P(LN)).toLowerCase().replace(/[^a-z]/g,'')}@${P(['example.com','mail.test','demo.org'])}`,phone:()=>`(${200+R(800)}) ${200+R(800)}-${1000+R(9000)}`,company:()=>`${P(CO)} ${P(SF)}`,street:()=>`${1+R(9999)} ${P(ST)} ${P(SS)}`,city:()=>P(CT),state:()=>P(STt),zip:()=>String(10000+R(89999)),age:()=>18+R(62),birthday:()=>`${1950+R(55)}-${String(1+R(12)).padStart(2,'0')}-${String(1+R(28)).padStart(2,'0')}`,created_at:()=>new Date(Date.now()-R(3e10)).toISOString(),active:()=>R(10)>1,balance:()=>+(R(1e6)/100).toFixed(2)};
$('#cols').innerHTML=Object.keys(COLS).map(k=>`<label><input type="checkbox" data-c="${k}" ${['id','first_name','last_name','email','city'].includes(k)?'checked':''} data-keep id="c_${k}"> ${k}</label>`).join('');
const rows=()=>{const ks=Object.keys(COLS).filter(k=>$('#c_'+k).checked),n=Math.max(1,Math.min(1000,+$('#n').value||1));return{ks,data:Array.from({length:n},()=>{const r={};for(const k of ['first_name','last_name'])r[k]=COLS[k]();const o={};ks.forEach(k=>o[k]=k==='first_name'||k==='last_name'?r[k]:COLS[k](r));return o})}};
const csvq=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v),sqlq=v=>typeof v==='number'?v:typeof v==='boolean'?(v?'TRUE':'FALSE'):`'${String(v).replace(/'/g,"''")}'`;
function gen(){const{ks,data}=rows();if(!ks.length){$('#out').textContent='Choose at least one column.';return}let o,f=$('#f').value,tbl=false;
  if(f==='JSON')o=JSON.stringify(data,null,2);else if(f==='CSV')o=[ks.join(','),...data.map(r=>ks.map(k=>csvq(r[k])).join(','))].join('\n');else if(f==='SQL INSERT')o=data.map(r=>`INSERT INTO ${$('#t').value||'users'} (${ks.join(', ')}) VALUES (${ks.map(k=>sqlq(r[k])).join(', ')});`).join('\n');
  else{tbl=true;$('#out').innerHTML=`<table style="font-family:system-ui;font-size:12px"><tr>${ks.map(k=>`<th>${k}</th>`).join('')}</tr>${data.slice(0,100).map(r=>`<tr>${ks.map(k=>`<td>${esc(String(r[k]))}</td>`).join('')}</tr>`).join('')}</table>`;window.__txt=[ks.join('\t'),...data.map(r=>ks.map(k=>r[k]).join('\t'))].join('\n')}
  if(!tbl){$('#out').textContent=o;window.__txt=o}$('#st').textContent=`${data.length} rows × ${ks.length} columns`}
$('#go').onclick=gen;$('#cp').onclick=e=>copy(window.__txt||'',e.target);remember().then(gen);
</script>
