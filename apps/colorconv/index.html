<!doctype html><meta charset="utf-8"><title>Color Converter</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#d946ef}.sw{height:110px;border-radius:12px;border:1px solid var(--line)}.pair{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;font-weight:600}</style>
<div class="wrap"><h1>Color Converter</h1><p class="sub">Convert between HEX, RGB and HSL and check text contrast against WCAG.</p>
<div class="g2"><div class="card"><label>Color (hex, rgb(), hsl() or a name)</label><div class="row"><div class="col"><input id="c" class="mono" value="#d946ef" data-keep></div><input type="color" id="pk" style="width:60px"></div><div class="err" id="er"></div><div class="sw gap" id="sw"></div></div>
<div class="card"><h2>Formats</h2><table id="fm"></table></div></div>
<div class="card"><h2>Contrast</h2><div class="row"><div class="col"><label>Background</label><input id="bg" value="#ffffff" data-keep></div><div class="col"><label>Text (uses the color above)</label><div class="pair" id="pv">Sample text 123</div></div></div><div id="ct" class="g4 gap"></div></div>
<div class="card"><h2>Saved colors</h2><div id="sv"></div></div></div>
<script>
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function parse(s){s=s.trim().toLowerCase();if(!s)return null;const cv=document.createElement('canvas').getContext('2d');cv.fillStyle='#000001';cv.fillStyle=s;const v=cv.fillStyle;if(v==='#000001'&&s!=='#000001')return null;
  if(v.startsWith('#'))return[1,3,5].map(i=>parseInt(v.slice(i,i+2),16));const m=v.match(/[\d.]+/g).map(Number);return m.slice(0,3)}
const toHex=([r,g,b])=>'#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
function toHsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s*100,l*100]}
const lum=([r,g,b])=>{const f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function run(){const rgb=parse($('#c').value);$('#er').textContent='';if(!rgb){$('#er').textContent='Unrecognised color';return}const[h,s,l]=toHsl(rgb),hex=toHex(rgb);$('#sw').style.background=hex;$('#pk').value=hex;
  const rows=[['HEX',hex.toUpperCase()],['RGB',`rgb(${rgb.map(Math.round).join(', ')})`],['HSL',`hsl(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l)}%)`],['Luminance',lum(rgb).toFixed(3)]];
  $('#fm').innerHTML=rows.map(([k,v])=>`<tr><td class="mut" style="width:90px">${k}</td><td class="mono">${v}</td><td class="r"><button class="x" data-v="${v}">Copy</button></td></tr>`).join('');
  const bg=parse($('#bg').value)||[255,255,255],r=ratio(rgb,bg);$('#pv').style.cssText=`background:${toHex(bg)};color:${hex}`;
  const t=(lbl,min)=>`<div class="kpi"><small>${lbl}</small><b class="${r>=min?'ok':'bad'}">${r>=min?'Pass':'Fail'}</b></div>`;$('#ct').innerHTML=`<div class="kpi"><small>Ratio</small><b>${r.toFixed(2)}:1</b></div>`+t('AA normal text (4.5)',4.5)+t('AA large text (3)',3)+t('AAA normal (7)',7)}
$('#fm').onclick=e=>{if(e.target.dataset.v)copy(e.target.dataset.v,e.target)};$('#pk').oninput=e=>{$('#c').value=e.target.value;run();$('#c').dispatchEvent(new Event('input',{bubbles:true}))};$('#c').oninput=$('#bg').oninput=run;
savedBar($('#sv'),{get:()=>({c:$('#c').value}),set:d=>{$('#c').value=d.c;run()}});remember().then(run);
</script>
