<!doctype html><meta charset="utf-8"><title>Hex Viewer</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#b91c1c;--w:1000px}#dump{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;max-height:520px}.o{color:var(--mut)}.a{color:var(--a)}</style>
<div class="wrap" style="max-width:1000px"><h1>Hex Viewer</h1><p class="sub">Inspect the raw bytes of text or any file, as a classic offset / hex / ASCII dump. Also converts hex back to text.</p>
<div class="card"><div class="tabs" id="tabs"><button data-m="t" class="on">Text</button><button data-m="f">File</button><button data-m="h">Hex → text</button></div><div id="tm"><textarea id="in" data-keep placeholder="Type text here…">Hello, hex! café ✓</textarea></div><div id="fm" class="hide"><input type="file" id="f"><div class="mut gap" id="fi"></div></div>
<div class="row gap"><div class="col"><label>Bytes per row</label><select id="w" data-keep><option>8</option><option selected>16</option><option>32</option></select></div><div class="col"><label>Show first</label><select id="lim" data-keep><option value="4096">4 KB</option><option value="65536">64 KB</option><option value="1048576">1 MB</option></select></div></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><span class="mut" id="st"></span><button class="x right" id="cp">Copy dump</button></div><div id="dump"></div></div></div>
<script>
let bytes=new Uint8Array(),mode='t';const enc=new TextEncoder();
function dump(){const W=+$('#w').value,lim=+$('#lim').value,b=bytes.slice(0,lim);let h='';for(let i=0;i<b.length;i+=W){const row=b.slice(i,i+W);h+=`<span class="o">${i.toString(16).padStart(8,'0')}</span>  ${[...row].map(x=>x.toString(16).padStart(2,'0')).join(' ').padEnd(W*3-1)}  <span class="a">${[...row].map(x=>x>=32&&x<127?esc(String.fromCharCode(x)):'·').join('')}</span>\n`}
  $('#dump').innerHTML=h||'<span class="mut">No data.</span>';$('#st').textContent=`${bytes.length.toLocaleString()} bytes${bytes.length>lim?` (showing first ${lim.toLocaleString()})`:''}`}
function load(){if(mode==='t')bytes=enc.encode($('#in').value);else if(mode==='h'){const hex=$('#in').value.replace(/0x|[^0-9a-f]/gi,'');bytes=Uint8Array.from(hex.match(/../g)||[],x=>parseInt(x,16));$('#st').title=new TextDecoder().decode(bytes)}dump();if(mode==='h')$('#st').textContent+=' → "'+new TextDecoder().decode(bytes).slice(0,200)+'"'}
$('#tabs').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));$('#tm').classList.toggle('hide',m==='f');$('#fm').classList.toggle('hide',m!=='f');$('#in').placeholder=m==='h'?'48 65 6c 6c 6f':'Type text here…';if(m==='f'){bytes=new Uint8Array();dump()}else load()};
$('#f').onchange=async e=>{const f=e.target.files[0];if(f){bytes=new Uint8Array(await f.arrayBuffer());$('#fi').textContent=`${f.name} · ${f.type||'unknown type'}`;dump()}};$('#in').oninput=load;$('#w').onchange=$('#lim').onchange=dump;
$('#cp').onclick=e=>copy($('#dump').textContent,e.target);remember().then(load);
</script>
