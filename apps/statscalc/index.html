<!doctype html><meta charset="utf-8"><title>Statistics Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:900px}.h{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:8px}.h div{flex:1;background:var(--a);border-radius:3px 3px 0 0;min-height:2px;position:relative}.h div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}</style>
<div class="wrap"><h1>Statistics Calculator</h1><p class="sub">Paste numbers separated by commas, spaces or new lines.</p>
<div class="card"><textarea id="d" style="min-height:100px" data-keep placeholder="12, 15, 11, 18, 22, 9, 15, 30"></textarea><div class="row gap"><label style="margin:0"><input type="radio" name="t" id="smp" checked> Sample (n − 1)</label><label style="margin:0"><input type="radio" name="t" id="pop"> Population (n)</label></div><div class="err" id="er"></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Distribution</h2><div class="h" id="hs"></div><div class="mut" id="ax"></div></div><div class="card"><h2>Sorted</h2><div class="out" id="so" style="min-height:0"></div></div></div>
<script>
const q=(s,p)=>{const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
function run(){const raw=$('#d').value.split(/[\s,;]+/).filter(Boolean),x=raw.map(Number),bad=raw.filter((_,i)=>isNaN(x[i]));$('#er').textContent=bad.length?`Ignoring non-numbers: ${bad.slice(0,5).join(', ')}`:'';const d=x.filter(v=>!isNaN(v));if(!d.length){$('#kp').innerHTML='';$('#hs').innerHTML='';$('#so').textContent='';return}
  const s=[...d].sort((a,b)=>a-b),n=d.length,sum=d.reduce((a,b)=>a+b,0),mean=sum/n,ss=d.reduce((a,v)=>a+(v-mean)**2,0),denom=$('#smp').checked?Math.max(1,n-1):n,vr=ss/denom,sd=Math.sqrt(vr),med=q(s,.5),q1=q(s,.25),q3=q(s,.75),iqr=q3-q1;
  const cnt={};d.forEach(v=>cnt[v]=(cnt[v]||0)+1);const mc=Math.max(...Object.values(cnt)),mode=mc>1?Object.keys(cnt).filter(k=>cnt[k]===mc).join(', '):'none',out=d.filter(v=>v<q1-1.5*iqr||v>q3+1.5*iqr);
  const f=v=>+v.toFixed(6)+'';$('#kp').innerHTML=[['Count',n],['Sum',f(sum)],['Mean',f(mean)],['Median',f(med)],['Mode',mode],['Min',f(s[0])],['Max',f(s.at(-1))],['Range',f(s.at(-1)-s[0])],['Variance',f(vr)],['Std deviation',f(sd)],['Q1 / Q3',`${f(q1)} / ${f(q3)}`],['Outliers',out.length?out.map(f).join(', '):'none']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join('');
  const bins=Math.min(12,Math.max(4,Math.round(Math.sqrt(n)))),lo=s[0],hi=s.at(-1),w=(hi-lo)/bins||1,h=Array(bins).fill(0);d.forEach(v=>h[Math.min(bins-1,Math.floor((v-lo)/w))]++);const mx=Math.max(...h);$('#hs').innerHTML=h.map((c,i)=>`<div style="height:${c/mx*100}%" data-t="${f(lo+i*w)}–${f(lo+(i+1)*w)}: ${c}"></div>`).join('');$('#ax').textContent=`${f(lo)} → ${f(hi)} in ${bins} bins`;$('#so').textContent=s.map(f).join(', ')}
document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
