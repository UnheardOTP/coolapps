<!doctype html><meta charset="utf-8"><title>Roman Numerals</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#9a3412;--w:760px}.rn{font:700 40px Georgia,serif;letter-spacing:.05em}</style>
<div class="wrap"><h1>Roman Numerals</h1><p class="sub">Convert between numbers and Roman numerals (1 to 3999). Type either one.</p>
<div class="g2"><div class="card"><label>Number</label><input id="n" type="number" min="1" max="3999" value="2026" style="font-size:24px" data-keep></div><div class="card"><label>Roman numeral</label><input id="r" style="font-size:24px;font-family:Georgia,serif;text-transform:uppercase" value="MMXXVI" data-keep></div></div>
<div class="card"><div class="rn" id="big"></div><div class="mut" id="ex"></div><div class="err" id="er"></div></div>
<div class="card"><h2>Reference</h2><div class="g4" id="ref"></div></div></div>
<script>
const MAP=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
const toRoman=n=>{let s='';for(const[v,r]of MAP)while(n>=v){s+=r;n-=v}return s};
// Parsing is strict: the result must re-encode to exactly the input, which rejects forms like IIII or VX.
function fromRoman(s){s=s.toUpperCase().trim();if(!/^[MDCLXVI]+$/.test(s))return NaN;const V={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let n=0;for(let i=0;i<s.length;i++){const a=V[s[i]],b=V[s[i+1]]||0;n+=a<b?-a:a}return toRoman(n)===s?n:NaN}
let from='n';
function run(){$('#er').textContent='';let n;if(from==='n'){n=Math.round(num('n'));if(n<1||n>3999){$('#er').textContent='Enter a whole number from 1 to 3999.';return}$('#r').value=toRoman(n)}else{n=fromRoman($('#r').value);if(isNaN(n)){$('#er').textContent='That is not a valid Roman numeral.';$('#big').textContent='';return}$('#n').value=n}
  const r=toRoman(n);$('#big').textContent=r;$('#ex').textContent=r.match(/CM|CD|XC|XL|IX|IV|./g).map(p=>`${p}=${fromRoman(p)}`).join(' + ')+` = ${n}`}
$('#n').oninput=()=>{from='n';run()};$('#r').oninput=()=>{from='r';run()};$('#ref').innerHTML=[['I',1],['V',5],['X',10],['L',50],['C',100],['D',500],['M',1000],['IV',4],['IX',9],['XL',40],['XC',90],['CD',400],['CM',900],['MMXXVI',2026]].map(([r,n])=>`<div class="kpi" style="cursor:pointer" data-n="${n}"><small>${n}</small><b style="font-family:Georgia">${r}</b></div>`).join('');
$('#ref').onclick=e=>{const k=e.target.closest('[data-n]');if(k){$('#n').value=k.dataset.n;from='n';run();$('#n').dispatchEvent(new Event('input',{bubbles:true}))}};remember().then(run);
</script>
