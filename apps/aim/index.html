<!doctype html><meta charset="utf-8"><title>Aim Lab</title><script src="/shared/lib.js"></script>
<style>body{margin:0;background:#0b0f19;color:#cfe6ff;font-family:'Segoe UI',system-ui;display:flex;flex-direction:column;align-items:center;padding-top:20px;user-select:none}
.hud{display:flex;gap:46px;font-size:15px;color:#6f8fb5;margin-bottom:10px}.hud b{display:block;font-size:28px;color:#fff}#a{position:relative;width:900px;height:520px;background:radial-gradient(#13203a,#0b0f19);border:1px solid #1f3a66;cursor:crosshair;overflow:hidden}
.t{position:absolute;border-radius:50%;background:radial-gradient(#fff 0 12%,#ff4d4d 13% 40%,#fff 41% 55%,#ff4d4d 56%);transform:translate(-50%,-50%);animation:sh var(--d) linear forwards}@keyframes sh{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(.15)}}
#o{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f19dd;font-size:22px}#o button{margin-top:14px;font:inherit;background:#4db3ff;color:#06121f;border:none;padding:12px 36px;border-radius:6px;font-weight:700;cursor:pointer}</style>
<div class="hud"><div>Hits<b id="h">0</b></div><div>Accuracy<b id="ac">–</b></div><div>Time<b id="tm">30</b></div><div>Best<b id="bs">0</b></div></div>
<div id="a"><div id="o"><div id="res">Click the targets before they shrink away.</div><button id="go">Start</button></div></div>
<script>
let hits=0,shots=0,time=30,iv,run=false,runs=[];const A=$('#a');
const best=()=>$('#bs').textContent=Math.max(0,...runs.map(r=>r.hits));
function spawn(){if(!run)return;const s=40+Math.random()*34,t=document.createElement('div');t.className='t';t.style.cssText=`left:${s+Math.random()*(900-2*s)}px;top:${s+Math.random()*(520-2*s)}px;width:${s}px;height:${s}px;--d:1.1s`;t.onmousedown=e=>{e.stopPropagation();hits++;shots++;t.remove();hud();spawn()};A.append(t);setTimeout(()=>{if(t.parentNode){t.remove();spawn()}},1100)}
const hud=()=>{$('#h').textContent=hits;$('#ac').textContent=shots?Math.round(hits/shots*100)+'%':'–'};
A.onmousedown=e=>{if(run&&e.target===A){shots++;hud()}};   // a click on empty space is a miss
async function end(){run=false;clearInterval(iv);document.querySelectorAll('.t').forEach(t=>t.remove());$('#o').style.display='flex';$('#res').innerHTML=`<b>${hits} hits</b> · ${shots?Math.round(hits/shots*100):0}% accuracy`;$('#go').textContent='Again';if(hits)runs.push(await api.add({hits,acc:shots?Math.round(hits/shots*100):0}));best()}
$('#go').onclick=()=>{hits=shots=0;time=30;run=true;hud();$('#tm').textContent=30;$('#o').style.display='none';spawn();iv=setInterval(()=>{$('#tm').textContent=--time;if(time<=0)end()},1000)};
api.list().then(d=>{runs=d;best()});
</script>
