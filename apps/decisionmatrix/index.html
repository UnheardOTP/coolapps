<!doctype html><meta charset="utf-8"><title>Decision Matrix</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#7c3aed;--w:1000px}td input{padding:6px 8px;min-width:60px;text-align:center}th input{font-weight:700;text-align:center;min-width:90px}td.nm input{text-align:left;min-width:150px}tr.win td{background:color-mix(in srgb,var(--a) 10%,transparent)}.rk{display:flex;align-items:center;gap:12px;margin-bottom:8px}.rk b{width:140px}.rk .bar{flex:1;height:18px}.rk span{width:60px;text-align:right}</style>
<div class="wrap"><h1>Decision Matrix</h1><p class="sub">Compare options against weighted criteria. Score each option 1–10; the weights decide what matters most.</p>
<div class="card"><div style="overflow:auto"><table id="tb"></table></div><div class="row gap"><button class="s" id="ao">+ Option</button><button class="s" id="ac">+ Criterion</button></div></div>
<div class="card"><h2>Ranking</h2><div id="rk"></div></div><div class="card"><h2>Saved decisions</h2><div id="sv"></div></div></div>
<script>
let D={crit:[{n:'Cost',w:5},{n:'Quality',w:4},{n:'Convenience',w:3}],opts:[{n:'Option A',s:[7,6,8]},{n:'Option B',s:[5,9,6]},{n:'Option C',s:[9,5,5]}]};
const tot=o=>{const W=D.crit.reduce((n,c)=>n+c.w,0)||1;return D.crit.reduce((n,c,i)=>n+c.w*(o.s[i]||0),0)/W};
function table(){$('#tb').innerHTML=`<tr><th></th>${D.crit.map((c,i)=>`<th><input data-c="${i}" data-k="n" value="${esc(c.n)}"><br><span class="mut" style="font-weight:400">weight</span> <input type="number" min="0" max="10" data-c="${i}" data-k="w" value="${c.w}" style="width:64px;min-width:0"><br><button class="x" data-rc="${i}">✕</button></th>`).join('')}<th>Score</th></tr>`+D.opts.map((o,j)=>`<tr data-o="${j}"><td class="nm"><input data-o="${j}" data-k="n" value="${esc(o.n)}"></td>${D.crit.map((c,i)=>`<td><input type="number" min="0" max="10" data-o="${j}" data-s="${i}" value="${o.s[i]??0}"></td>`).join('')}<td><b class="sc"></b> <button class="x" data-ro="${j}">✕</button></td></tr>`).join('');rank()}
function rank(){const r=D.opts.map((o,j)=>({o,j,t:tot(o)})),best=Math.max(...r.map(x=>x.t));document.querySelectorAll('#tb tr[data-o]').forEach(tr=>{const x=r[+tr.dataset.o];tr.querySelector('.sc').textContent=fmt(x.t,2);tr.classList.toggle('win',x.t===best&&D.opts.length>1)});
  $('#rk').innerHTML=[...r].sort((a,b)=>b.t-a.t).map((x,i)=>`<div class="rk"><b>${i+1}. ${esc(x.o.n)}</b><div class="bar"><i style="width:${x.t/10*100}%"></i></div><span>${fmt(x.t,2)}</span></div>`).join('');KV.save(D)}
$('#tb').oninput=e=>{const t=e.target;if(t.dataset.c!==undefined)D.crit[t.dataset.c][t.dataset.k]=t.dataset.k==='w'?parseFloat(t.value)||0:t.value;else if(t.dataset.s!==undefined)D.opts[t.dataset.o].s[t.dataset.s]=Math.max(0,Math.min(10,parseFloat(t.value)||0));else if(t.dataset.o!==undefined)D.opts[t.dataset.o].n=t.value;rank()};
$('#tb').onclick=e=>{const d=e.target.dataset;if(d.rc!==undefined&&D.crit.length>1){const i=+d.rc;D.crit.splice(i,1);D.opts.forEach(o=>o.s.splice(i,1));table()}if(d.ro!==undefined&&D.opts.length>1){D.opts.splice(+d.ro,1);table()}};
$('#ao').onclick=()=>{D.opts.push({n:'Option '+String.fromCharCode(65+D.opts.length),s:D.crit.map(()=>5)});table()};$('#ac').onclick=()=>{D.crit.push({n:'Criterion '+(D.crit.length+1),w:3});D.opts.forEach(o=>o.s.push(5));table()};
savedBar($('#sv'),{get:()=>JSON.parse(JSON.stringify(D)),set:d=>{D=JSON.parse(JSON.stringify(d));table()}});KV.load().then(s=>{if(s.crit){D=s}table()});table();
</script>
