<!doctype html><meta charset="utf-8"><title>Type Scale</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#7c3aed;--w:960px}.ln{display:flex;align-items:baseline;gap:18px;padding:8px 0;border-bottom:1px solid var(--line);overflow:hidden}.ln small{flex:none;width:130px;color:var(--mut);font:12px ui-monospace,monospace}.ln span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}</style>
<div class="wrap"><h1>Type Scale</h1><p class="sub">Generate a modular typographic scale: every step is the base size multiplied by a ratio.</p>
<div class="card"><div class="g4"><div><label>Base size (px)</label><input id="b" type="number" value="16" data-keep></div><div><label>Ratio</label><select id="r" data-keep><option value="1.067">1.067 minor second</option><option value="1.125">1.125 major second</option><option value="1.2" selected>1.2 minor third</option><option value="1.25">1.25 major third</option><option value="1.333">1.333 perfect fourth</option><option value="1.414">1.414 augmented fourth</option><option value="1.5">1.5 perfect fifth</option><option value="1.618">1.618 golden ratio</option></select></div><div><label>Steps down</label><input id="dn" type="number" min="0" max="4" value="2" data-keep></div><div><label>Steps up</label><input id="up" type="number" min="1" max="10" value="6" data-keep></div></div>
<div class="row gap"><div class="col"><label>Preview text</label><input id="tx" value="Whereas recognition of the inherent dignity" data-keep></div><div class="col"><label>Font</label><select id="ff" data-keep><option value="system-ui">System UI</option><option value="Georgia,serif">Georgia</option><option value="ui-monospace,monospace">Monospace</option><option value="'Times New Roman',serif">Times</option></select></div></div></div>
<div class="card" id="pv"></div><div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">CSS variables</h2><button class="x right" id="cp">Copy</button></div><div class="out" id="css"></div></div></div>
<script>
const NAMES=['xs','sm','base','md','lg','xl','2xl','3xl','4xl','5xl','6xl','7xl','8xl','9xl','10xl'];
function run(){const b=num('b'),r=+$('#r').value,dn=Math.max(0,num('dn')),up=Math.max(1,num('up')),L=[];for(let i=-dn;i<=up;i++)L.push({i,px:b*r**i});
  const nm=i=>i===0?'base':i<0?(i===-1?'sm':i===-2?'xs':'2xs'):['md','lg','xl','2xl','3xl','4xl','5xl','6xl','7xl','8xl','9xl'][i-1]||'x'+i;
  $('#pv').innerHTML=[...L].reverse().map(s=>`<div class="ln"><small>${nm(s.i)} · ${fmt(s.px,1)}px · ${fmt(s.px/b,3)}rem</small><span style="font:${s.i>=3?700:400} ${s.px}px/1.15 ${$('#ff').value}">${esc($('#tx').value)}</span></div>`).join('');
  $('#css').textContent=`:root {\n  --text-base: ${b/16}rem;\n${L.map(s=>`  --text-${nm(s.i)}: ${+(s.px/16).toFixed(3)}rem; /* ${fmt(s.px,1)}px */`).join('\n')}\n}`}
document.addEventListener('input',run);$('#cp').onclick=e=>copy($('#css').textContent,e.target);remember().then(run);
</script>
