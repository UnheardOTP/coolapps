<!doctype html><meta charset="utf-8"><title>Matrix Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#4f46e5;--w:960px}.m{display:inline-grid;gap:5px;padding:8px 12px;border-left:3px solid var(--fg);border-right:3px solid var(--fg);border-radius:6px}.m input{width:64px;text-align:center;padding:6px 4px}.rs{display:inline-grid;gap:5px;padding:8px 12px;border-left:3px solid var(--a);border-right:3px solid var(--a);border-radius:6px}.rs div{min-width:64px;text-align:center;padding:6px 4px;font-family:ui-monospace,monospace;background:var(--soft);border-radius:6px}</style>
<div class="wrap"><h1>Matrix Calculator</h1><p class="sub">Enter matrices A and B (up to 4×4) and pick an operation.</p>
<div class="card"><div class="row"><div class="col"><label>Size of A (rows × cols)</label><div class="row" style="flex-wrap:nowrap"><select id="ar" data-keep></select><select id="ac" data-keep></select></div></div><div class="col"><label>Size of B</label><div class="row" style="flex-wrap:nowrap"><select id="br" data-keep></select><select id="bc" data-keep></select></div></div></div>
<div class="row gap" style="align-items:center"><div><h2>A</h2><div id="A"></div></div><div><h2>B</h2><div id="B"></div></div></div></div>
<div class="card"><div class="tabs" id="ops"></div><div id="out"></div><div class="err" id="er"></div></div></div>
<script>
const SZ=[1,2,3,4];for(const id of['ar','ac','br','bc'])$('#'+id).innerHTML=SZ.map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('');
let MA=[[2,1,0],[1,3,1],[0,1,4]],MB=[[1,0,2],[0,1,1],[1,1,0]];
const dims=()=>({ar:+$('#ar').value,ac:+$('#ac').value,br:+$('#br').value,bc:+$('#bc').value});
function fit(M,r,c){return Array.from({length:r},(_,i)=>Array.from({length:c},(_,j)=>M[i]?.[j]??0))}
function grid(id,M){$('#'+id).innerHTML=`<div class="m" style="grid-template-columns:repeat(${M[0].length},auto)">${M.map((r,i)=>r.map((v,j)=>`<input type="number" step="any" data-m="${id}" data-i="${i}" data-j="${j}" value="${v}">`).join('')).join('')}</div>`}
const OPS={'A + B':(a,b)=>{need(a.length===b.length&&a[0].length===b[0].length,'A and B must be the same size');return a.map((r,i)=>r.map((v,j)=>v+b[i][j]))},'A − B':(a,b)=>{need(a.length===b.length&&a[0].length===b[0].length,'A and B must be the same size');return a.map((r,i)=>r.map((v,j)=>v-b[i][j]))},
'A × B':(a,b)=>{need(a[0].length===b.length,`Columns of A (${a[0].length}) must equal rows of B (${b.length})`);return a.map(r=>b[0].map((_,j)=>r.reduce((s,v,k)=>s+v*b[k][j],0)))},'Aᵀ':a=>a[0].map((_,j)=>a.map(r=>r[j])),'det(A)':a=>{need(a.length===a[0].length,'Determinant needs a square matrix');return[[det(a)]]},'A⁻¹':a=>{need(a.length===a[0].length,'Inverse needs a square matrix');return inv(a)},'A²':a=>{need(a.length===a[0].length,'Needs a square matrix');return a.map(r=>a[0].map((_,j)=>r.reduce((s,v,k)=>s+v*a[k][j],0)))},'Trace(A)':a=>{need(a.length===a[0].length,'Trace needs a square matrix');return[[a.reduce((s,r,i)=>s+r[i],0)]]}};
const need=(c,m)=>{if(!c)throw Error(m)};let op='A × B';
// Gaussian elimination with partial pivoting: the determinant is the product of pivots (sign flips per row swap); the inverse is found by reducing [A | I].
function det(M){const n=M.length,a=M.map(r=>[...r]);let d=1;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(a[r][c])>Math.abs(a[p][c]))p=r;if(Math.abs(a[p][c])<1e-12)return 0;if(p!==c){[a[p],a[c]]=[a[c],a[p]];d=-d}d*=a[c][c];for(let r=c+1;r<n;r++){const f=a[r][c]/a[c][c];for(let k=c;k<n;k++)a[r][k]-=f*a[c][k]}}return d}
function inv(M){const n=M.length,a=M.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>+(i===j))]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(a[r][c])>Math.abs(a[p][c]))p=r;need(Math.abs(a[p][c])>1e-12,'Matrix is singular (determinant is 0): no inverse');[a[p],a[c]]=[a[c],a[p]];const d=a[c][c];for(let k=0;k<2*n;k++)a[c][k]/=d;for(let r=0;r<n;r++)if(r!==c){const f=a[r][c];for(let k=0;k<2*n;k++)a[r][k]-=f*a[c][k]}}return a.map(r=>r.slice(n))}
function run(){const d=dims();MA=fit(MA,d.ar,d.ac);MB=fit(MB,d.br,d.bc);$('#ops').innerHTML=Object.keys(OPS).map(k=>`<button data-o="${k}" class="${k===op?'on':''}">${k}</button>`).join('');$('#er').textContent='';
  try{const R=OPS[op](MA.map(r=>[...r]),MB.map(r=>[...r])),f=v=>Math.abs(v)<1e-10?'0':+v.toFixed(6)+'';$('#out').innerHTML=`<div class="rs" style="grid-template-columns:repeat(${R[0].length},auto)">${R.map(r=>r.map(v=>`<div>${f(v)}</div>`).join('')).join('')}</div>`}catch(e){$('#out').innerHTML='';$('#er').textContent=e.message}}
function redraw(){const d=dims();MA=fit(MA,d.ar,d.ac);MB=fit(MB,d.br,d.bc);grid('A',MA);grid('B',MB);run()}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m){(t.dataset.m==='A'?MA:MB)[+t.dataset.i][+t.dataset.j]=parseFloat(t.value)||0;run();KV.save({MA,MB,sz:dims()})}});['ar','ac','br','bc'].forEach(id=>$('#'+id).onchange=()=>{redraw();KV.save({MA,MB,sz:dims()})});$('#ops').onclick=e=>{if(e.target.dataset.o){op=e.target.dataset.o;run()}};
KV.load().then(s=>{if(s.MA){MA=s.MA;MB=s.MB;for(const k in s.sz)$('#'+k).value=s.sz[k]}redraw()});
</script>
