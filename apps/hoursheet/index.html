<!doctype html><meta charset="utf-8"><title>Timesheet</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0ea5e9;--w:900px}#clk{font:200 56px ui-monospace,Menlo,Consolas,monospace;text-align:center;font-variant-numeric:tabular-nums}.pb{display:block;margin:10px auto;font-size:18px;padding:12px 40px;border-radius:30px}.pb.on{background:#dc2626}</style>
<div class="wrap"><h1>Timesheet</h1><p class="sub">Punch in and out, or add shifts by hand. See weekly hours and earnings.</p>
<div class="card"><div id="clk">0:00:00</div><button class="pb" id="pb">Clock in</button><div class="mut" style="text-align:center" id="ps"></div></div>
<div class="g2"><div class="card"><h2>Add a shift manually</h2><div class="row"><div class="col"><label>Date</label><input id="d" type="date"></div><div class="col"><label>Start</label><input id="s" type="time" value="09:00"></div><div class="col"><label>End</label><input id="e" type="time" value="17:00"></div></div><label class="gap">Note (optional)</label><input id="no" placeholder="Project / client"><div class="row gap"><div class="col"><label>Unpaid break (min)</label><input id="br" type="number" value="30"></div><button id="add">Add shift</button></div></div>
<div class="card"><h2>This week</h2><div class="row"><div class="col"><label>Hourly rate ($)</label><input id="rt" type="number" step="0.01" value="25" data-keep></div></div><div class="g2 gap" id="wk"></div></div></div>
<div class="card"><h2>Shifts</h2><table id="tb"></table></div></div>
<script>
let sh=[],punch=null;$('#d').value=dkey(new Date());
const hrs=s=>s.m/60,f=h=>`${Math.floor(h)}h ${pad2(Math.round(h%1*60))}m`;const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function paint(){const wk=monday(new Date()),wk7=new Date(wk);wk7.setDate(wk7.getDate()+7),inW=s=>{const d=pdate(s.d);return d>=wk&&d<wk7},H=sh.filter(inW).reduce((n,s)=>n+hrs(s),0);
  $('#wk').innerHTML=[['Hours',f(H)],['Earnings',money(H*num('rt'))],['Shifts',sh.filter(inW).length],['Avg / shift',sh.filter(inW).length?f(H/sh.filter(inW).length):'–']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join('');
  $('#tb').innerHTML='<tr><th>Date</th><th>Time</th><th>Note</th><th class="r">Hours</th><th></th></tr>'+[...sh].sort((a,b)=>b.d.localeCompare(a.d)||b.s.localeCompare(a.s)).slice(0,60).map(s=>`<tr data-id="${s.id}"><td>${pdate(s.d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</td><td>${s.s}–${s.e}${s.br?` <span class="mut">(−${s.br}m)</span>`:''}</td><td class="mut">${esc(s.no||'')}</td><td class="r"><b>${f(hrs(s))}</b></td><td class="r"><button class="x" data-rm>✕</button></td></tr>`).join('')}
function clock(){if(punch){const s=Math.floor((Date.now()-punch.at)/1000);$('#clk').textContent=`${Math.floor(s/3600)}:${pad2(Math.floor(s%3600/60))}:${pad2(s%60)}`;$('#ps').textContent='Clocked in at '+new Date(punch.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}else{$('#clk').textContent='0:00:00';$('#ps').textContent=''}$('#pb').textContent=punch?'Clock out':'Clock in';$('#pb').classList.toggle('on',!!punch)}
const tm=d=>pad2(d.getHours())+':'+pad2(d.getMinutes());
$('#pb').onclick=async()=>{if(!punch){punch=await api.add({kind:'punch',at:Date.now()})}else{const a=new Date(punch.at),b=new Date(),m=Math.round((b-a)/60000);await api.del(punch.id);punch=null;sh.push(await api.add({kind:'shift',d:dkey(a),s:tm(a),e:tm(b),br:0,m,no:''}));paint()}clock()};
$('#add').onclick=async()=>{const[a,b]=[$('#s').value,$('#e').value];if(!a||!b||!$('#d').value)return;const m=Math.max(0,(+b.slice(0,2)*60+ +b.slice(3)-(+a.slice(0,2)*60+ +a.slice(3)))-num('br'));sh.push(await api.add({kind:'shift',d:$('#d').value,s:a,e:b,br:num('br'),m,no:$('#no').value.trim()}));$('#no').value='';paint()};
$('#tb').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('tr').dataset.id;await api.del(id);sh=sh.filter(x=>x.id!==id);paint()};document.addEventListener('input',e=>{if(e.target.id==='rt')paint()});
api.list().then(d=>{sh=only(d,'shift');punch=only(d,'punch')[0]||null;remember().then(paint);clock()});setInterval(clock,1000);
</script>
