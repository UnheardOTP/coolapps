<!doctype html><meta charset="utf-8"><title>Magic 8</title><script src="/shared/lib.js"></script>
<style>body{margin:0;min-height:100vh;background:radial-gradient(#3a3a5a,#0d0d1c);color:#ddd;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;padding-top:30px}
input#q{width:420px;font:20px Georgia;text-align:center;padding:12px;background:#ffffff14;border:1px solid #6a6a9a;border-radius:30px;color:#fff;outline:none;margin-bottom:24px}
.ball{width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#666,#111 40%,#000);position:relative;box-shadow:0 30px 60px #000a;cursor:pointer;display:flex;align-items:center;justify-content:center}.ball.shake{animation:sh .7s}@keyframes sh{0%,100%{transform:translate(0)}15%{transform:translate(-18px,8px) rotate(-6deg)}30%{transform:translate(16px,-10px) rotate(5deg)}45%{transform:translate(-14px,6px) rotate(-4deg)}60%{transform:translate(12px,-6px) rotate(3deg)}80%{transform:translate(-6px,3px)}}
.win{width:150px;height:150px;border-radius:50%;background:#0a0a40;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 24px #000;text-align:center}.tri{width:0;height:0;border-left:56px solid transparent;border-right:56px solid transparent;border-bottom:96px solid #1c2a9a;position:relative;filter:drop-shadow(0 0 8px #4a6aff);transition:opacity .5s}.tri span{position:absolute;top:30px;left:-48px;width:96px;text-align:center;color:#cfe0ff;font:600 12px/1.15 Georgia;letter-spacing:.04em}.eight{font:900 90px Georgia;color:#fff}
.log{margin-top:30px;width:420px;font-size:14px;color:#9a9aba}.log div{padding:3px 0;border-bottom:1px solid #ffffff14}.log b{color:#cfe0ff}p{color:#8a8aaa}</style>
<input id="q" placeholder="Ask a yes/no question…"><div class="ball" id="ball"><div class="win" id="win"><div class="eight">8</div></div></div><p>Click the ball to shake it.</p><div class="log" id="log"></div>
<script>
const A=['It is certain','Without a doubt','Yes, definitely','You may rely on it','As I see it, yes','Most likely','Outlook good','Signs point to yes','Reply hazy, try again','Ask again later','Better not tell you now','Cannot predict now','Concentrate and ask again',"Don't count on it",'My reply is no','My sources say no','Outlook not so good','Very doubtful'];let hist=[],busy=false;
$('#ball').onclick=async()=>{if(busy)return;busy=true;$('#win').innerHTML='<div class="eight">8</div>';$('#ball').classList.add('shake');await new Promise(r=>setTimeout(r,700));$('#ball').classList.remove('shake');
  const a=A[Math.floor(Math.random()*A.length)];$('#win').innerHTML=`<div class="tri"><span>${a.toUpperCase()}</span></div>`;const q=$('#q').value.trim();hist.unshift(await api.add({q,a}));log();busy=false};
const log=()=>$('#log').innerHTML=hist.slice(0,7).map(h=>`<div><b>${esc(h.a)}</b> — ${esc(h.q||'(no question)')}</div>`).join('');
api.list().then(d=>{hist=d;log()});
</script>
