<!doctype html><meta charset="utf-8"><title>Triangle Solver</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0891b2;--w:960px}svg{width:100%;height:260px;background:var(--soft);border-radius:12px}.sol{border-left:4px solid var(--a);padding-left:14px;margin-bottom:14px}</style>
<div class="wrap"><h1>Triangle Solver</h1><p class="sub">Enter any three values — at least one a side — and the whole triangle is solved: SSS, SAS, ASA, AAS and the ambiguous SSA case (which can have two answers). Side <b>a</b> is opposite angle <b>A</b>, and so on.</p>
<div class="card"><div class="g3"><div><label>Side a</label><input id="a" type="number" step="any" data-keep></div><div><label>Side b</label><input id="b" type="number" step="any" data-keep></div><div><label>Side c</label><input id="c" type="number" step="any" data-keep></div><div><label>Angle A (°)</label><input id="A" type="number" step="any" data-keep></div><div><label>Angle B (°)</label><input id="B" type="number" step="any" data-keep></div><div><label>Angle C (°)</label><input id="C" type="number" step="any" data-keep></div></div><div class="row gap"><button class="s" id="ex1">3-4-5</button><button class="s" id="ex2">SAS example</button><button class="s" id="ex3">Ambiguous SSA</button><button class="x" id="cl">Clear</button></div><div class="err" id="er"></div></div>
<div id="res"></div></div>
<script>
const R=Math.PI/180,D=180/Math.PI;
// Reduce every case to "find the missing parts": sides via the law of cosines (SSS, SAS) or sines (ASA, AAS, SSA).
function solve(s){const[a,b,c,A,B,C]=s,S=[a,b,c].filter(x=>x!=null),An=[A,B,C].filter(x=>x!=null);if(S.length+An.length<3||S.length<1)return{err:'Provide three values, including at least one side.'};if(S.some(x=>!(x>0)))return{err:'Sides must be positive.'};if(An.some(x=>!(x>0&&x<180)))return{err:'Angles must be between 0° and 180°.'};
  let out=[];
  if(S.length===3){const[x,y,z]=[a,b,c];if(x+y<=z||x+z<=y||y+z<=x)return{err:'Those sides cannot form a triangle (the two shorter must add up to more than the longest).'};const AA=Math.acos((y*y+z*z-x*x)/(2*y*z))*D,BB=Math.acos((x*x+z*z-y*y)/(2*x*z))*D;out=[[x,y,z,AA,BB,180-AA-BB]]}
  else if(An.length>=2){const sum=An.reduce((n,v)=>n+v,0);if(sum>=180)return{err:'Angles must add up to less than 180°.'};const ang=[A,B,C];const i=ang.findIndex(v=>v==null);if(i>=0)ang[i]=180-sum;const j=[a,b,c].findIndex(v=>v!=null),k=[a,b,c][j]/Math.sin(ang[j]*R);out=[[0,1,2].map(n=>k*Math.sin(ang[n]*R)).concat(ang)]}
  else{const sides=[a,b,c],ang=[A,B,C],ai=ang.findIndex(v=>v!=null),oi=[0,1,2].filter(n=>n!==ai),known=oi.filter(n=>sides[n]!=null);
    if(sides[ai]==null&&known.length===2){const[p,q]=known.map(n=>sides[n]),t=Math.sqrt(p*p+q*q-2*p*q*Math.cos(ang[ai]*R)),r=[0,0,0];r[ai]=t;known.forEach((n,m)=>r[n]=[p,q][m]);const A2=Math.acos((r[1]*r[1]+r[2]*r[2]-r[0]*r[0])/(2*r[1]*r[2]))*D,B2=Math.acos((r[0]*r[0]+r[2]*r[2]-r[1]*r[1])/(2*r[0]*r[2]))*D;out=[[...r,A2,B2,180-A2-B2]]}
    else{const sa=sides[ai],other=known[0],so=sides[other],sinO=so*Math.sin(ang[ai]*R)/sa;if(sinO>1+1e-9)return{err:'No triangle exists with those values.'};const o1=Math.asin(Math.min(1,sinO))*D,cands=[o1];if(Math.abs(sinO-1)>1e-9&&Math.abs(o1-(180-o1))>1e-9)cands.push(180-o1);
      for(const o of cands){const third=180-ang[ai]-o;if(third<=1e-9)continue;const angs=[0,0,0];angs[ai]=ang[ai];angs[other]=o;const t=3-ai-other;angs[t]=third;const k=sa/Math.sin(ang[ai]*R);out.push([0,1,2].map(n=>k*Math.sin(angs[n]*R)).concat(angs))}if(!out.length)return{err:'No triangle exists with those values.'}}}
  return{out}}
const f=n=>+n.toFixed(4)+'';
function draw([a,b,c,A,B,C]){const bx=c,cx=b*Math.cos(A*R),cy=b*Math.sin(A*R),pts=[[0,0],[bx,0],[cx,cy]],xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys),sc=Math.min(520/w,200/h),ox=40-Math.min(...xs)*sc+(560-w*sc)/2,P=pts.map(([x,y])=>[ox+x*sc,230-y*sc]);
  return`<svg viewBox="0 0 600 260"><polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="color-mix(in srgb,var(--a) 20%,transparent)" stroke="var(--a)" stroke-width="3"/><text x="${P[0][0]-16}" y="${P[0][1]+18}" fill="currentColor" font-weight="700">A</text><text x="${P[1][0]+6}" y="${P[1][1]+18}" fill="currentColor" font-weight="700">B</text><text x="${P[2][0]-4}" y="${P[2][1]-8}" fill="currentColor" font-weight="700">C</text><text x="${(P[1][0]+P[2][0])/2+10}" y="${(P[1][1]+P[2][1])/2}" fill="currentColor">a=${f(a)}</text><text x="${(P[0][0]+P[2][0])/2-60}" y="${(P[0][1]+P[2][1])/2}" fill="currentColor">b=${f(b)}</text><text x="${(P[0][0]+P[1][0])/2-20}" y="${P[0][1]+34}" fill="currentColor">c=${f(c)}</text></svg>`}
function run(){$('#er').textContent='';const v=['a','b','c','A','B','C'].map(id=>{const x=document.getElementById(id).value;return x===''?null:parseFloat(x)}),r=solve(v);if(r.err){$('#res').innerHTML='';return $('#er').textContent=document.getElementById('a').value+document.getElementById('b').value+document.getElementById('c').value+document.getElementById('A').value+document.getElementById('B').value+document.getElementById('C').value?r.err:''}
  $('#res').innerHTML=r.out.map((t,i)=>{const[a,b,c,A,B,C]=t,s=(a+b+c)/2,area=Math.sqrt(Math.max(0,s*(s-a)*(s-b)*(s-c))),mx=Math.max(A,B,C),kind=Math.abs(mx-90)<1e-6?'right':mx>90?'obtuse':'acute',sym=(Math.abs(a-b)<1e-6&&Math.abs(b-c)<1e-6)?'equilateral':(Math.abs(a-b)<1e-6||Math.abs(b-c)<1e-6||Math.abs(a-c)<1e-6)?'isosceles':'scalene';
    return`<div class="card sol">${r.out.length>1?`<h2>Solution ${i+1} of 2 (ambiguous case)</h2>`:''}${draw(t)}<div class="g4 gap">${[['a',a],['b',b],['c',c],['A',A],['B',B],['C',C]].map(([k,x])=>`<div class="kpi"><small>${k==='a'||k==='b'||k==='c'?'Side '+k:'Angle '+k}</small><b>${f(x)}${/[ABC]/.test(k)?'°':''}</b></div>`).join('')}<div class="kpi"><small>Area</small><b>${f(area)}</b></div><div class="kpi"><small>Perimeter</small><b>${f(a+b+c)}</b></div><div class="kpi"><small>Type</small><b style="font-size:16px">${kind}, ${sym}</b></div><div class="kpi"><small>Height on c</small><b>${f(2*area/c)}</b></div></div></div>`}).join('')}
const set=o=>{for(const id of['a','b','c','A','B','C'])document.getElementById(id).value=o[id]??'';run();document.getElementById('a').dispatchEvent(new Event('input',{bubbles:true}))};
$('#ex1').onclick=()=>set({a:3,b:4,c:5});$('#ex2').onclick=()=>set({b:7,c:9,A:40});$('#ex3').onclick=()=>set({a:8,b:10,A:30});$('#cl').onclick=()=>set({});document.addEventListener('input',run);remember().then(run);
</script>
