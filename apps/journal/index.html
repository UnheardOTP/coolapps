<!doctype html><meta charset="utf-8"><title>Daily Journal</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#7c3aed;--w:1050px}.app{display:grid;grid-template-columns:300px 1fr;gap:16px}.side{max-height:76vh;overflow:auto}.e{padding:10px;border-radius:10px;cursor:pointer}.e:hover{background:var(--soft)}.e.on{background:color-mix(in srgb,var(--a) 14%,transparent)}.e small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mood{display:flex;gap:8px}.mood button{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--fg);border:2px solid transparent;font-size:20px;padding:0}.mood button.on{border-color:var(--a)}@media(max-width:760px){.app{grid-template-columns:1fr}}</style>
<div class="wrap"><h1>Daily Journal</h1><p class="sub">One entry per day, with a mood and tags. Search everything you've written.</p>
<div class="g4" id="kp"></div><div class="app gap"><div class="card side"><input id="q" placeholder="Search entries…"><div id="ls" class="gap"></div></div><div class="card" id="ed"></div></div></div>
<script>
let en=[],cur=dkey(new Date());const MO=['😞','🙁','😐','🙂','😄'];
const get=d=>en.find(e=>e.d===d);
function stats(){const days=new Set(en.map(e=>e.d));let streak=0;const d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);while(days.has(dkey(d))){streak++;d.setDate(d.getDate()-1)}const m=en.filter(e=>e.m);
  $('#kp').innerHTML=[['Entries',en.length],['Current streak',streak+' day'+(streak===1?'':'s')],['Words written',en.reduce((n,e)=>n+(e.t.match(/\S+/g)||[]).length,0).toLocaleString()],['Average mood',m.length?MO[Math.round(m.reduce((n,e)=>n+e.m,0)/m.length)-1]+' '+fmt(m.reduce((n,e)=>n+e.m,0)/m.length,1):'–']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('')}
function paint(){const q=$('#q').value.toLowerCase(),l=[...en,...(get(cur)?[]:[{d:cur,t:'',m:0,g:[],tmp:1}])].filter(e=>!q||(e.t+e.g.join(' ')).toLowerCase().includes(q)).sort((a,b)=>b.d.localeCompare(a.d));
  $('#ls').innerHTML=l.map(e=>`<div class="e ${e.d===cur?'on':''}" data-d="${e.d}"><b>${pdate(e.d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b> ${e.m?MO[e.m-1]:''}<small>${esc(e.t.slice(0,70)||'(empty)')}</small></div>`).join('');
  const e=get(cur)||{t:'',m:0,g:[]};$('#ed').innerHTML=`<div class="row" style="margin-bottom:10px"><h2 style="margin:0;flex:1;font-size:15px;color:var(--fg);letter-spacing:0;text-transform:none">${pdate(cur).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><div class="mood">${MO.map((m,i)=>`<button data-m="${i+1}" class="${e.m===i+1?'on':''}">${m}</button>`).join('')}</div></div><textarea id="tx" style="min-height:340px;font-family:inherit;font-size:16px;line-height:1.6" placeholder="How was your day?">${esc(e.t)}</textarea><input id="tg" class="gap" placeholder="Tags (comma separated)" value="${esc(e.g.join(', '))}"><div class="mut gap" id="sv"></div>`;stats()}
let tm;async function save(patch){let e=get(cur);if(!e){e=await api.add({kind:'je',d:cur,t:'',m:0,g:[]});en.push(e)}Object.assign(e,patch);await api.upd(e.id,patch);$('#sv').textContent='saved '+new Date().toLocaleTimeString();stats()}
$('#ed').oninput=e=>{if(e.target.id==='tx'||e.target.id==='tg'){clearTimeout(tm);$('#sv').textContent='saving…';tm=setTimeout(()=>save({t:$('#tx').value,g:$('#tg').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean)}).then(()=>{if(!$('#q').value)paint0()}),600)}};
const paint0=()=>{const e=get(cur);const el=document.querySelector(`.e[data-d="${cur}"]`);if(e&&el)el.querySelector('small').textContent=e.t.slice(0,70)||'(empty)';else paintList()};const paintList=()=>{};
$('#ed').onclick=async e=>{const m=e.target.dataset.m;if(!m)return;await save({m:+m});paint()};$('#ls').onclick=e=>{const d=e.target.closest('.e');if(d){cur=d.dataset.d;paint()}};$('#q').oninput=paint;api.list().then(d=>{en=only(d,'je');paint()});
</script>
