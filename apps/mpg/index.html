<!doctype html><meta charset="utf-8"><title>Mileage Log</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:900px}svg{width:100%;height:200px;background:var(--soft);border-radius:10px}</style>
<div class="wrap"><h1>Mileage Log</h1><p class="sub">Record each fill-up to see your real-world fuel economy and running cost.</p>
<div class="card"><div class="row"><div class="col"><label>Date</label><input id="d" type="date"></div><div class="col"><label>Odometer (mi)</label><input id="o" type="number" step="any"></div><div class="col"><label>Gallons added</label><input id="g" type="number" step="0.001"></div><div class="col"><label>Total cost ($)</label><input id="c" type="number" step="0.01"></div><button id="add">Add fill-up</button></div><div class="err" id="er"></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>MPG per fill-up</h2><svg id="sv" viewBox="0 0 800 200" preserveAspectRatio="none"></svg></div><div class="card"><h2>Fill-ups</h2><div style="max-height:320px;overflow:auto"><table id="tb"></table></div></div></div>
<script>
let fs=[];$('#d').value=dkey(new Date());
// MPG for a fill-up = miles since the previous fill-up ÷ gallons added now (full-tank-to-full-tank method).
function rows(){const s=[...fs].sort((a,b)=>a.o-b.o);return s.map((f,i)=>{const prev=s[i-1],mi=prev?f.o-prev.o:null;return{...f,mi,mpg:mi>0?mi/f.g:null,ppg:f.c/f.g}})}
function run(){const r=rows(),m=r.filter(x=>x.mpg),tot=m.reduce((n,x)=>n+x.mi,0),gal=m.reduce((n,x)=>n+x.g,0),cost=m.reduce((n,x)=>n+x.c,0);
  $('#kp').innerHTML=[['Average MPG',gal?fmt(tot/gal,1):'–'],['Last fill-up',m.length?fmt(m.at(-1).mpg,1)+' mpg':'–'],['Cost per mile',tot?money(cost/tot):'–'],['Total spent',money(r.reduce((n,x)=>n+x.c,0))]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  if(m.length>1){const mx=Math.max(...m.map(x=>x.mpg))*1.1,mn=Math.min(...m.map(x=>x.mpg))*.9;$('#sv').innerHTML=`<polyline fill="none" stroke="var(--a)" stroke-width="3" points="${m.map((x,i)=>`${10+i/(m.length-1)*780},${190-(x.mpg-mn)/(mx-mn)*180}`).join(' ')}"/>`+m.map((x,i)=>`<circle cx="${10+i/(m.length-1)*780}" cy="${190-(x.mpg-mn)/(mx-mn)*180}" r="4" fill="var(--a)"/>`).join('')}else $('#sv').innerHTML='';
  $('#tb').innerHTML='<tr><th>Date</th><th class="r">Odometer</th><th class="r">Miles</th><th class="r">Gal</th><th class="r">MPG</th><th class="r">$/gal</th><th class="r">Cost</th><th></th></tr>'+[...r].reverse().map(x=>`<tr data-id="${x.id}"><td>${x.d}</td><td class="r">${x.o.toLocaleString()}</td><td class="r">${x.mi??'–'}</td><td class="r">${fmt(x.g,2)}</td><td class="r"><b>${x.mpg?fmt(x.mpg,1):'–'}</b></td><td class="r">${fmt(x.ppg,3)}</td><td class="r">${money(x.c)}</td><td class="r"><button class="x" data-rm>✕</button></td></tr>`).join('')}
$('#add').onclick=async()=>{$('#er').textContent='';const o=num('o'),g=num('g'),c=num('c');if(!(o>0&&g>0&&c>=0)||!$('#d').value)return $('#er').textContent='Fill in odometer, gallons and cost.';
  const last=Math.max(0,...fs.map(f=>f.o));if(fs.length&&o<=last&&!fs.some(f=>f.o>o))return $('#er').textContent=`Odometer must be above your last reading (${last}).`;fs.push(await api.add({kind:'fill',d:$('#d').value,o,g,c}));$('#o').value=$('#g').value=$('#c').value='';run()};
$('#tb').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('tr').dataset.id;await api.del(id);fs=fs.filter(x=>x.id!==id);run()};api.list().then(d=>{fs=only(d,'fill');run()});
</script>
