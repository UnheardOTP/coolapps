<!doctype html><meta charset="utf-8"><title>Barcode Maker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#111827;--w:820px}#bc{background:#fff;border-radius:12px;padding:20px;text-align:center;border:1px solid var(--line)}#bc svg{max-width:100%;height:auto}</style>
<div class="wrap"><h1>Barcode Maker</h1><p class="sub">Generate Code 39 barcodes (letters A–Z, digits, and - . space $ / + %) as crisp SVG or PNG. Great for labels, inventory and asset tags.</p>
<div class="card"><div class="row"><div class="col" style="flex:3"><label>Text</label><input id="t" class="mono" style="font-size:20px" value="ITEM-0042" data-keep></div><div class="col"><label>Bar width (px)</label><input id="bw" type="number" min="1" max="6" value="2" data-keep></div><div class="col"><label>Height (px)</label><input id="h" type="number" min="30" max="300" value="90" data-keep></div></div><div class="row gap"><label style="margin:0"><input type="checkbox" id="cd" data-keep> Add mod-43 check digit</label><label style="margin:0"><input type="checkbox" id="tx" checked data-keep> Show text below</label></div><div class="err" id="er"></div></div>
<div class="card"><div id="bc"></div><div class="row gap"><button id="ds">Download SVG</button><button class="s" id="dp">Download PNG</button><button class="s" id="cs">Copy SVG code</button></div></div></div>
<script>
// Code 39: each character is 9 elements (5 bars + 4 spaces), 3 of them wide; "n" = narrow, "w" = wide. Characters are separated by a narrow space and wrapped in * start/stop.
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn'};
const ORDER='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%';
function svg(text,nw,H,showText,check){let s=text.toUpperCase();const bad=[...s].find(c=>!(c in C39)||c==='*');if(bad)throw Error(`"${bad}" can't be encoded in Code 39`);if(!s)throw Error('Enter some text');if(check){s+=ORDER[[...s].reduce((n,c)=>n+ORDER.indexOf(c),0)%43]}
  const full='*'+s+'*',W=nw*3;let x=0,bars='';[...full].forEach((ch,ci)=>{[...C39[ch]].forEach((e,i)=>{const w=e==='w'?W:nw;if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="${H}"/>`;x+=w});x+=nw});x-=nw;
  const q=nw*10,tot=x+q*2,ty=H+16;return`<svg xmlns="http://www.w3.org/2000/svg" width="${tot}" height="${H+(showText?24:0)}" viewBox="0 0 ${tot} ${H+(showText?24:0)}"><rect width="100%" height="100%" fill="#fff"/><g transform="translate(${q} 0)" fill="#000">${bars}</g>${showText?`<text x="${tot/2}" y="${ty}" text-anchor="middle" font-family="monospace" font-size="14" fill="#000">${esc(s)}</text>`:''}</svg>`}
let cur='';
function run(){$('#er').textContent='';try{cur=svg($('#t').value,Math.max(1,num('bw')),Math.max(30,num('h')),$('#tx').checked,$('#cd').checked);$('#bc').innerHTML=cur}catch(e){$('#bc').innerHTML='';cur='';$('#er').textContent=e.message}}
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};
$('#ds').onclick=()=>cur&&dl(new Blob([cur],{type:'image/svg+xml'}),'barcode.svg');$('#cs').onclick=e=>cur&&copy(cur,e.target);
$('#dp').onclick=()=>{if(!cur)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width*2;c.height=im.height*2;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>dl(b,'barcode.png'))};im.src='data:image/svg+xml;base64,'+btoa(cur)};
document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
