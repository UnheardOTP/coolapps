<!doctype html><meta charset="utf-8"><title>Color Scheme Generator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#ec4899;--w:980px}.sch{margin-bottom:18px}.sch h2{margin-bottom:6px}.row2{display:flex;border-radius:12px;overflow:hidden;height:86px;box-shadow:0 0 0 1px #0002}.row2 div{flex:1;display:flex;align-items:flex-end;padding:8px;font:600 12px ui-monospace,monospace;cursor:pointer}</style>
<div class="wrap"><h1>Color Scheme Generator</h1><p class="sub">Pick a base color and get harmonious schemes from the color wheel. Click any swatch to copy its hex.</p>
<div class="card"><div class="row"><div class="col"><label>Base color</label><input id="c" class="mono" value="#3b82f6" data-keep></div><input type="color" id="pk" style="width:70px;height:42px"><button class="s" id="rn">🎲 Random</button></div></div>
<div id="out"></div><div class="card"><h2>Saved schemes</h2><div id="sv"></div></div></div>
<script>
function toHsl(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,S=0;if(d){S=d/(1-Math.abs(2*l-1));H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}return[H,S*100,l*100]}
function hex(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const norm=s=>{s=s.trim();if(/^#?[0-9a-f]{3}$/i.test(s))s=s.replace('#','').split('').map(x=>x+x).join('');if(/^#?[0-9a-f]{6}$/i.test(s))return'#'+s.replace('#','').toLowerCase();return null};
const SCH={'Complementary':h=>[0,180],'Split-complementary':h=>[0,150,210],'Analogous':h=>[-30,0,30],'Triadic':h=>[0,120,240],'Tetradic (square)':h=>[0,90,180,270],'Tetradic (rectangle)':h=>[0,60,180,240]};
let cur=[];
function run(){const b=norm($('#c').value);if(!b){$('#out').innerHTML='<div class="card err">Enter a hex color like #3b82f6</div>';return}$('#pk').value=b;const[H,S,L]=toHsl(b);cur=[];
  const sets=Object.entries(SCH).map(([n,f])=>[n,f(H).map(d=>hex(H+d,S,L))]);sets.push(['Monochromatic',[-30,-15,0,15,30].map(d=>hex(H,S,Math.max(8,Math.min(92,L+d))))]);sets.push(['Shades & tints',[15,30,50,70,90].map(l=>hex(H,S,l))]);
  $('#out').innerHTML=sets.map(([n,c])=>`<div class="card sch"><h2>${n}</h2><div class="row2">${c.map(x=>`<div data-h="${x}" style="background:${x};color:${toHsl(x)[2]>58?'#111':'#fff'}">${x.toUpperCase()}</div>`).join('')}</div><button class="x gap" data-cs="${c.join(',')}">Copy CSS variables</button></div>`).join('');window.__sets=sets}
$('#out').onclick=e=>{const d=e.target.closest('[data-h]');if(d)return copy(d.dataset.h,d);const c=e.target.dataset.cs;if(c)copy(':root {\n'+c.split(',').map((x,i)=>`  --color-${i+1}: ${x};`).join('\n')+'\n}',e.target)};
$('#pk').oninput=e=>{$('#c').value=e.target.value;run();$('#c').dispatchEvent(new Event('input',{bubbles:true}))};$('#rn').onclick=()=>{$('#c').value=hex(Math.random()*360,50+Math.random()*40,40+Math.random()*25);run();$('#c').dispatchEvent(new Event('input',{bubbles:true}))};$('#c').oninput=run;
savedBar($('#sv'),{get:()=>({c:$('#c').value}),set:d=>{$('#c').value=d.c;run()}});remember().then(run);
</script>
