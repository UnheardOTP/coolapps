<!doctype html><meta charset="utf-8"><title>Medication Schedule</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0d9488;--w:780px}.dose{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.dose.done{opacity:.5}.dose.done b{text-decoration:line-through}.dose .tm{width:76px;font-variant-numeric:tabular-nums;font-weight:700}.dose.late .tm{color:var(--bad)}.dose.next{background:color-mix(in srgb,var(--a) 10%,transparent);border-radius:10px}</style>
<div class="wrap"><h1>Medication Schedule</h1><p class="sub">Set up what you take and when, then tick doses off each day. For personal tracking only — follow your clinician's instructions.</p>
<div class="card"><h2>Today</h2><div id="today"></div></div>
<div class="card"><h2>Add a medication</h2><div class="row"><div class="col" style="flex:2"><label>Name</label><input id="n" placeholder="Vitamin D"></div><div class="col"><label>Dose</label><input id="d" placeholder="1000 IU"></div><div class="col" style="flex:2"><label>Times (comma separated)</label><input id="t" placeholder="08:00, 20:00" value="08:00"></div><button id="add">Add</button></div></div>
<div class="card"><h2>Medications</h2><div id="list"></div></div></div>
<script>
let meds=[],taken=new Set();const day=()=>dkey(new Date()),k=(m,t)=>`${day()}|${m}|${t}`;
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function paint(){const now=new Date(),nm=now.getHours()*60+now.getMinutes(),doses=meds.flatMap(m=>m.times.map(t=>({m,t}))).sort((a,b)=>mins(a.t)-mins(b.t)),nextI=doses.findIndex(x=>!taken.has(k(x.m.id,x.t)));
  $('#today').innerHTML=doses.map((x,i)=>{const done=taken.has(k(x.m.id,x.t)),late=!done&&mins(x.t)<nm-30;return`<div class="dose ${done?'done':''} ${late?'late':''} ${i===nextI?'next':''}" data-m="${x.m.id}" data-t="${x.t}"><input type="checkbox" ${done?'checked':''} style="width:22px;height:22px"><span class="tm">${x.t}</span><div class="col"><b>${esc(x.m.n)}</b> <span class="mut">${esc(x.m.d)}</span></div>${late?'<span class="bad">overdue</span>':''}</div>`}).join('')||'<span class="mut">No doses scheduled. Add a medication below.</span>';
  $('#list').innerHTML=meds.map(m=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)" data-id="${m.id}"><div class="col"><b>${esc(m.n)}</b> <span class="mut">${esc(m.d)}</span><div class="mut">${m.times.join(' · ')}</div></div><button class="x" data-rm>Remove</button></div>`).join('')||'<span class="mut">None yet.</span>'}
$('#today').onchange=async e=>{const r=e.target.closest('.dose');if(!r)return;const key=k(r.dataset.m,r.dataset.t);if(e.target.checked){const d=await api.add({kind:'taken',key});taken.add(key);taken[key]=d.id}else{await api.del(taken[key]);taken.delete(key)}paint()};
$('#add').onclick=async()=>{const times=$('#t').value.split(',').map(s=>s.trim()).filter(s=>/^\d{1,2}:\d{2}$/.test(s)).map(s=>pad2(+s.split(':')[0])+':'+s.split(':')[1]);if(!$('#n').value.trim()||!times.length)return;meds.push(await api.add({kind:'med',n:$('#n').value.trim(),d:$('#d').value,times}));$('#n').value=$('#d').value='';paint()};
$('#list').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('[data-id]').dataset.id;await api.del(id);meds=meds.filter(m=>m.id!==id);paint()};
api.list().then(d=>{meds=only(d,'med').sort((a,b)=>a.createdAt-b.createdAt);for(const t of only(d,'taken'))if(t.key.startsWith(day())){taken.add(t.key);taken[t.key]=t.id}paint()});setInterval(paint,60000);
</script>
