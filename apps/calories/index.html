<!doctype html><meta charset="utf-8"><title>Calorie Needs</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#f97316;--w:860px}.mac{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:10px 0}.mac div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}</style>
<div class="wrap"><h1>Calorie Needs</h1><p class="sub">Estimate your daily energy use (Mifflin–St Jeor) and a macro split for your goal.</p>
<div class="card"><div class="g4"><div><label>Sex</label><select id="sx" data-keep><option value="m">Male</option><option value="f">Female</option></select></div><div><label>Age</label><input id="ag" type="number" value="32" data-keep></div><div><label>Height (cm)</label><input id="h" type="number" value="175" data-keep></div><div><label>Weight (kg)</label><input id="w" type="number" value="75" step="0.1" data-keep></div></div>
<div class="g2 gap"><div><label>Activity level</label><select id="ac" data-keep><option value="1.2">Sedentary (desk job, little exercise)</option><option value="1.375" selected>Light (1–3 workouts / week)</option><option value="1.55">Moderate (3–5 workouts / week)</option><option value="1.725">Very active (6–7 / week)</option><option value="1.9">Athlete / physical job</option></select></div><div><label>Goal</label><select id="gl" data-keep><option value="-500">Lose ~0.5 kg / week</option><option value="-250">Lose slowly</option><option value="0" selected>Maintain</option><option value="250">Gain slowly</option><option value="500">Gain ~0.5 kg / week</option></select></div></div></div>
<div class="g3" id="kp"></div><div class="card gap"><h2>Macros</h2><div class="row"><div class="col"><label>Protein <b id="vp"></b>%</label><input type="range" id="pp" min="10" max="50" value="30" data-keep></div><div class="col"><label>Carbs <b id="vc"></b>%</label><input type="range" id="pc" min="10" max="70" value="40" data-keep></div></div><div class="mac" id="mc"></div><table id="mt"></table></div></div>
<script>
function run(){const w=num('w'),h=num('h'),a=num('ag'),bmr=10*w+6.25*h-5*a+($('#sx').value==='m'?5:-161),tdee=bmr*+$('#ac').value,tgt=Math.max(1000,tdee+ +$('#gl').value);
  $('#kp').innerHTML=[['Basal metabolic rate',Math.round(bmr)+' kcal'],['Maintenance (TDEE)',Math.round(tdee)+' kcal'],['Daily target',Math.round(tgt)+' kcal']].map(([k,v],i)=>`<div class="kpi"><small>${k}</small><b ${i===2?'style="color:var(--a)"':''}>${v}</b></div>`).join('');
  const p=num('pp'),c=Math.min(num('pc'),100-p-10),f=100-p-c;$('#vp').textContent=p;$('#vc').textContent=c;
  $('#mc').innerHTML=[[p,'#ef4444','P'],[c,'#3b82f6','C'],[f,'#eab308','F']].map(([v,col,l])=>`<div style="width:${v}%;background:${col}">${l} ${v}%</div>`).join('');
  $('#mt').innerHTML='<tr><th></th><th class="r">Calories</th><th class="r">Grams / day</th></tr>'+[['Protein',p,4],['Carbs',c,4],['Fat',f,9]].map(([k,v,kc])=>`<tr><td>${k}</td><td class="r">${Math.round(tgt*v/100)}</td><td class="r"><b>${Math.round(tgt*v/100/kc)} g</b></td></tr>`).join('')}
document.addEventListener('input',run);remember().then(run);
</script>
