<!doctype html><meta charset="utf-8"><title>Goal Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#8b5cf6;--w:900px}.g{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--card)}.g.done{border-color:var(--ok)}.g .bar{height:14px;margin:10px 0 6px}.g.done .bar i{background:var(--ok)}.g .up{display:flex;gap:6px;margin-top:8px}.g .up input{width:90px}.pace{font-size:13px}</style>
<div class="wrap" style="max-width:900px"><h1>Goal Tracker</h1><p class="sub">Numeric goals with a deadline: pages read, kilometres run, dollars saved. See the pace you need to finish on time.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Goal</label><input id="n" placeholder="Read 24 books"></div><div class="col" style="max-width:110px"><label>Target</label><input id="t" type="number" step="any"></div><div class="col" style="max-width:110px"><label>Unit</label><input id="u" placeholder="books"></div><div class="col"><label>Deadline</label><input id="d" type="date"></div><button id="add">Add</button></div></div>
<div id="ls"></div></div>
<script>
let it=[];$('#d').value=dkey(new Date(new Date().getFullYear(),11,31));
function paint(){const now=new Date();now.setHours(0,0,0,0);$('#ls').innerHTML=[...it].sort((a,b)=>(a.v>=a.t)-(b.v>=b.t)||a.d.localeCompare(b.d)).map(g=>{const done=g.v>=g.t,pc=Math.min(100,g.v/g.t*100),left=Math.round((pdate(g.d)-now)/864e5),rem=Math.max(0,g.t-g.v);
  let pace='';if(!done){if(left<0)pace=`<span class="bad">Deadline passed — ${fmt(rem,rem%1?1:0)} ${esc(g.u)} short</span>`;else{const days=Math.max(1,left);pace=`Need <b>${fmt(rem/days,2)} ${esc(g.u)}/day</b> (${fmt(rem/days*7,1)}/week) · ${left} days left`}}else pace='<span class="ok">🎉 Goal reached!</span>'.replace('🎉 ','');
  return`<div class="g ${done?'done':''}" data-id="${g.id}"><div class="row" style="flex-wrap:nowrap"><b style="flex:1;font-size:17px">${esc(g.n)}</b><b>${fmt(g.v,g.v%1?1:0)} / ${fmt(g.t,g.t%1?1:0)} ${esc(g.u)}</b><button class="x" data-rm>✕</button></div><div class="bar"><i style="width:${pc}%"></i></div><div class="pace mut">${fmt(pc,0)}% · ${pace}</div><div class="up"><input type="number" step="any" placeholder="+ amount"><button class="s" data-add>Add progress</button><button class="x" data-set>Set total</button></div></div>`}).join('')||'<div class="card mut">No goals yet — add one above.</div>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim(),t=num('t');if(!n||!(t>0)||!$('#d').value)return;it.push(await api.add({kind:'goal',n,t,u:$('#u').value.trim(),d:$('#d').value,v:0}));$('#n').value=$('#t').value=$('#u').value='';paint()};
$('#ls').onclick=async e=>{const r=e.target.closest('.g');if(!r)return;const g=it.find(x=>x.id===r.dataset.id),inp=r.querySelector('.up input'),v=parseFloat(inp.value);if(e.target.hasAttribute('data-add')&&!isNaN(v)){g.v=Math.max(0,g.v+v);api.upd(g.id,{v:g.v});paint()}if(e.target.hasAttribute('data-set')&&!isNaN(v)){g.v=Math.max(0,v);api.upd(g.id,{v:g.v});paint()}if(e.target.hasAttribute('data-rm')){await api.del(g.id);it=it.filter(x=>x!==g);paint()}};api.list().then(d=>{it=only(d,'goal');paint()});
</script>
