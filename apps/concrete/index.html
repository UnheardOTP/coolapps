<!doctype html><meta charset="utf-8"><title>Concrete Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#78716c;--w:900px}</style>
<div class="wrap"><h1>Concrete Calculator</h1><p class="sub">How much concrete for slabs, footings and round posts — in cubic yards or metres, and as bags of pre-mix.</p>
<div class="card"><div class="row"><div class="col"><label>Units</label><select id="un" data-keep><option value="ft">Feet &amp; inches (yd³)</option><option value="m">Metres &amp; cm (m³)</option></select></div><div class="col"><label>Extra for waste / over-dig (%)</label><input id="ws" type="number" value="10" data-keep></div></div></div>
<div class="card"><div style="overflow:auto"><table id="tb"></table></div><div class="row gap"><button class="s" data-add="slab">+ Slab / footing</button><button class="s" data-add="col">+ Round post / column</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Bags of pre-mix needed</h2><div class="g4" id="bg"></div><div class="mut gap">Based on 60 lb (0.45 ft³) / 80 lb (0.6 ft³) bags, or 25 kg (≈0.0115 m³) / 40 kg (≈0.018 m³) bags — check the yield printed on your bag.</div></div></div>
<script>
let it=[{t:'slab',n:'Patio slab',l:12,w:10,d:4,q:1},{t:'col',n:'Posts',dm:12,h:36,q:4}];
const m=()=>$('#un').value==='m';
// Dimensions are lengths in feet (+inches for thickness/diameter/height) or metres (+cm); everything is normalised to cubic feet / cubic metres.
function vol(i){const M=m();if(i.t==='slab')return i.l*i.w*i.d/(M?100:12)*i.q;const r=i.dm/(M?200:24),h=i.h/(M?100:12);return Math.PI*r*r*h*i.q}
function paint(){const M=m();$('#tb').innerHTML='<tr><th>Item</th><th>Dimensions</th><th>Qty</th><th class="r">Volume</th><th></th></tr>'+it.map((i,k)=>`<tr><td><input data-i="${k}" data-k="n" value="${esc(i.n)}"></td><td>${i.t==='slab'?`<div class="row" style="flex-wrap:nowrap">${[['l','length '+(M?'m':'ft')],['w','width '+(M?'m':'ft')],['d','thick '+(M?'cm':'in')]].map(([f,p])=>`<input type="number" step="any" style="width:90px" data-i="${k}" data-k="${f}" value="${i[f]}" placeholder="${p}" title="${p}">`).join('')}</div>`:`<div class="row" style="flex-wrap:nowrap">${[['dm','diameter '+(M?'cm':'in')],['h','height '+(M?'cm':'in')]].map(([f,p])=>`<input type="number" step="any" style="width:100px" data-i="${k}" data-k="${f}" value="${i[f]}" placeholder="${p}" title="${p}">`).join('')}</div>`}</td><td><input type="number" style="width:70px" data-i="${k}" data-k="q" value="${i.q}"></td><td class="r v"></td><td><button class="x" data-rm="${k}">✕</button></td></tr>`).join('');calc()}
function calc(){const M=m(),raw=it.reduce((n,i)=>n+vol(i),0),tot=raw*(1+num('ws')/100);document.querySelectorAll('#tb tr').forEach((tr,i)=>{if(i)tr.querySelector('.v').textContent=fmt(vol(it[i-1]),3)+(M?' m³':' ft³')});
  const yd=M?null:tot/27,cf=M?tot*35.3147:tot;$('#kp').innerHTML=[['Exact volume',M?fmt(raw,3)+' m³':fmt(raw,2)+' ft³'],['With waste',M?fmt(tot,3)+' m³':fmt(tot,2)+' ft³'],[M?'Cubic metres to order':'Cubic yards to order',M?fmt(Math.ceil(tot*10)/10,1):fmt(Math.ceil(yd*4)/4,2)],['Weight (approx.)',fmt(cf*150/2000,2)+' tons']].map(([k,v],i)=>`<div class="kpi"><small>${k}</small><b ${i===2?'style="color:var(--a)"':''}>${v}</b></div>`).join('');
  $('#bg').innerHTML=[['60 lb bags',Math.ceil(cf/.45)],['80 lb bags',Math.ceil(cf/.6)],['25 kg bags',Math.ceil(cf/35.3147/.0115)],['40 kg bags',Math.ceil(cf/35.3147/.018)]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');KV.save({it,un:$('#un').value,ws:$('#ws').value})}
$('#tb').oninput=e=>{const i=e.target.dataset.i;if(i===undefined)return;const k=e.target.dataset.k;it[i][k]=k==='n'?e.target.value:parseFloat(e.target.value)||0;calc()};$('#tb').onclick=e=>{const r=e.target.dataset.rm;if(r!==undefined){it.splice(+r,1);paint()}};
document.addEventListener('click',e=>{const a=e.target.dataset.add;if(a){it.push(a==='slab'?{t:'slab',n:'Slab',l:10,w:10,d:4,q:1}:{t:'col',n:'Column',dm:12,h:36,q:1});paint()}});$('#un').onchange=paint;$('#ws').oninput=calc;
KV.load().then(s=>{if(s.it){it=s.it;$('#un').value=s.un;$('#ws').value=s.ws}paint()});
</script>
