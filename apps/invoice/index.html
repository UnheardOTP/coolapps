<!doctype html><meta charset="utf-8"><title>Invoice Maker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#1d4ed8;--w:960px}#inv{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:34px}#inv input,#inv textarea{background:transparent;border-color:transparent;color:#111}#inv input:hover,#inv textarea:hover{border-color:#cbd5e1}#inv table input{padding:5px 6px}#inv h2{color:#64748b}.tot td{border:none;padding:3px 10px}@media print{body{background:#fff}.noprint{display:none!important}.wrap{padding:0;max-width:none}#inv{border:none;padding:0}}</style>
<div class="wrap"><div class="noprint"><h1>Invoice Maker</h1><p class="sub">Fill in the invoice below, save it, or print / save as PDF.</p><div class="row" style="margin-bottom:14px"><button id="pr">Print / PDF</button><button class="s" id="sv">Save</button><button class="s" id="nw">New</button></div></div>
<div id="inv"><div class="row"><div class="col"><input id="from" placeholder="Your business name" style="font-size:22px;font-weight:700" data-keep><textarea id="fa" placeholder="Address, email, phone" style="min-height:70px" data-keep></textarea></div><div style="text-align:right"><div style="font-size:30px;font-weight:800;color:var(--a)">INVOICE</div><input id="no" placeholder="Invoice #" style="text-align:right" data-keep><input id="dt" type="date" style="text-align:right" data-keep><input id="due" type="date" style="text-align:right" data-keep placeholder="Due"></div></div>
<h2 class="gap">Bill to</h2><input id="to" placeholder="Client name" style="font-weight:600" data-keep><textarea id="ta" placeholder="Client address" style="min-height:60px" data-keep></textarea>
<table class="gap" id="tb"></table><button class="x noprint" id="add">+ Add line</button>
<div class="row gap"><div class="col"><h2>Notes</h2><textarea id="nt" placeholder="Payment terms, thank-you note…" style="min-height:90px" data-keep></textarea></div><table class="tot" style="width:280px"><tr><td>Subtotal</td><td class="r" id="sub"></td></tr><tr><td>Discount <input id="dc" type="number" value="0" style="width:60px;display:inline" data-keep>%</td><td class="r" id="dv"></td></tr><tr><td>Tax <input id="tx" type="number" value="0" style="width:60px;display:inline" data-keep>%</td><td class="r" id="tv"></td></tr><tr><td><b>Total</b></td><td class="r" style="font-size:22px;font-weight:800" id="tot"></td></tr></table></div></div>
<div class="card noprint gap"><h2>Saved invoices</h2><div class="chips" id="list"></div></div></div>
<script>
let lines=[{d:'Design work',q:10,p:75}],saved=[];
function table(){$('#tb').innerHTML='<tr><th>Description</th><th class="r" style="width:80px">Qty</th><th class="r" style="width:110px">Price</th><th class="r" style="width:110px">Amount</th><th class="noprint" style="width:30px"></th></tr>'+lines.map((l,i)=>`<tr><td><input data-i="${i}" data-k="d" value="${esc(l.d)}"></td><td><input data-i="${i}" data-k="q" type="number" class="r" value="${l.q}" style="text-align:right"></td><td><input data-i="${i}" data-k="p" type="number" step="0.01" value="${l.p}" style="text-align:right"></td><td class="r">${money(l.q*l.p)}</td><td class="noprint"><button class="x" data-rm="${i}">✕</button></td></tr>`).join('')}
function totals(){const sub=lines.reduce((n,l)=>n+l.q*l.p,0),dv=sub*num('dc')/100,tv=(sub-dv)*num('tx')/100;$('#sub').textContent=money(sub);$('#dv').textContent='−'+money(dv);$('#tv').textContent=money(tv);$('#tot').textContent=money(sub-dv+tv)}
$('#tb').oninput=e=>{const i=e.target.dataset.i;if(i===undefined)return;const k=e.target.dataset.k;lines[i][k]=k==='d'?e.target.value:parseFloat(e.target.value)||0;e.target.closest('tr').children[3].textContent=money(lines[i].q*lines[i].p);totals();KV.save(stateAll())};
$('#tb').onclick=e=>{const r=e.target.dataset.rm;if(r!==undefined){lines.splice(+r,1);table();totals()}};$('#add').onclick=()=>{lines.push({d:'',q:1,p:0});table()};
const F=['from','fa','no','dt','due','to','ta','nt','dc','tx'];
const stateAll=()=>({...Object.fromEntries(F.map(i=>[i,$('#'+i).value])),lines});
const load=s=>{F.forEach(i=>$('#'+i).value=s[i]??'');lines=JSON.parse(JSON.stringify(s.lines||[{d:'',q:1,p:0}]));table();totals()};
function chips(){$('#list').innerHTML=saved.map(s=>`<span class="chip" data-id="${s.id}">${esc(s.data.no||'—')} · ${esc(s.data.to||'client')}<i data-del>✕</i></span>`).join('')||'<span class="mut">None yet.</span>'}
document.addEventListener('input',e=>{totals();if(!e.target.dataset.i)KV.save(stateAll())});$('#pr').onclick=()=>print();$('#nw').onclick=()=>{load({from:$('#from').value,fa:$('#fa').value,dt:dkey(new Date()),no:String(+($('#no').value.match(/\d+/)||[0])[0]+1).padStart(3,'0'),lines:[{d:'',q:1,p:0}],dc:0,tx:$('#tx').value})};
$('#sv').onclick=async()=>{saved.unshift(await api.add({kind:'saved',name:$('#no').value||'invoice',data:stateAll()}));chips()};
$('#list').onclick=async e=>{const c=e.target.closest('.chip');if(!c)return;const s=saved.find(x=>x.id===c.dataset.id);if(e.target.hasAttribute('data-del')){await api.del(s.id);saved=saved.filter(x=>x!==s);chips()}else load(s.data)};
api.list().then(async d=>{saved=only(d,'saved');const st=d.find(x=>x.kind==='_state');KV.doc=st||null;chips();const s=st?.state||{};load({dt:dkey(new Date()),no:'001',dc:0,tx:0,...s,lines:s.lines||lines})});
</script>
