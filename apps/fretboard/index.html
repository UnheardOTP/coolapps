<!doctype html><meta charset="utf-8"><title>Fretboard</title><script src="/shared/lib.js"></script>
<style>body{margin:0;min-height:100vh;background:#231710;color:#f2dcb5;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;padding-top:30px}h1{margin:0;font-weight:400;letter-spacing:.3em}.sub{color:#a58a63;margin:6px 0 16px;font-style:italic}
svg{background:linear-gradient(#5a3a22,#4a2e1a);border-radius:8px;box-shadow:0 14px 40px #000a}.bar{display:flex;gap:10px;margin-top:20px;align-items:center}input{font:inherit;padding:8px 12px;background:#150d08;border:1px solid #6b4a2c;color:#f2dcb5;outline:none}button{font:inherit;background:#d9a441;color:#231710;border:none;padding:8px 18px;cursor:pointer;font-weight:700}button.g{background:none;border:1px solid #6b4a2c;color:#f2dcb5}
#nm{font-size:30px;height:40px;margin-top:10px;color:#ffd78a}.chip{display:inline-block;margin:8px 8px 0 0;padding:5px 12px;border:1px solid #6b4a2c;border-radius:16px;cursor:pointer}</style>
<h1>FRETBOARD</h1><div class="sub">Click to place fingers. Click a string name to hear it open.</div><svg id="s" width="920" height="270" viewBox="0 0 920 270"></svg><div id="nm"></div>
<div class="bar"><button class="g" id="strum">Strum</button><button class="g" id="cl">Clear</button><input id="n" placeholder="Name this chord"><button id="sv">Save</button></div><div id="chips"></div>
<script>
const OPEN=[64,59,55,50,45,40],NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FR=12,X0=70,FW=68,Y0=30,SG=42;let held={},saved=[],ac;   // held[string]=fret (0 = open ringing, absent = muted)
const hz=m=>440*2**((m-69)/12),note=m=>NAMES[m%12];
function pluck(m,at=0){ac||=new AudioContext();const t=ac.currentTime+at,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=hz(m);f.type='lowpass';f.frequency.setValueAtTime(3500,t);f.frequency.exponentialRampToValueAtTime(400,t+1);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.connect(f).connect(g).connect(ac.destination);o.start(t);o.stop(t+1.7)}
function draw(){let h='';for(let f=0;f<=FR;f++)h+=`<line x1="${X0+f*FW}" y1="${Y0}" x2="${X0+f*FW}" y2="${Y0+SG*5}" stroke="${f?'#b9a58a':'#f2dcb5'}" stroke-width="${f?3:8}"/>`+(f&&[3,5,7,9].includes(f)?`<circle cx="${X0+f*FW-FW/2}" cy="${Y0+SG*2.5}" r="7" fill="#f2dcb533"/>`:'')+(f?`<text x="${X0+f*FW-FW/2}" y="${Y0+SG*5+30}" fill="#a58a63" font-size="13" text-anchor="middle">${f}</text>`:'');
  OPEN.forEach((m,s)=>{const y=Y0+s*SG;h+=`<line x1="${X0}" y1="${y}" x2="${X0+FR*FW}" y2="${y}" stroke="#e8e0d0" stroke-width="${1+s*.5}"/><text data-open="${s}" x="40" y="${y+5}" fill="#ffd78a" font-size="17" text-anchor="middle" style="cursor:pointer">${note(m)}</text>`;
    for(let f=0;f<=FR;f++)h+=`<rect data-s="${s}" data-f="${f}" x="${f?X0+(f-1)*FW:X0-30}" y="${y-SG/2}" width="${f?FW:30}" height="${SG}" fill="transparent" style="cursor:pointer"/>`;
    if(held[s]!==undefined){const f=held[s];h+=f?`<circle cx="${X0+f*FW-FW/2}" cy="${y}" r="14" fill="#ffd78a" stroke="#231710" stroke-width="2"/><text x="${X0+f*FW-FW/2}" y="${y+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#231710">${note(m+f)}</text>`:`<circle cx="${X0-14}" cy="${y}" r="9" fill="none" stroke="#ffd78a" stroke-width="3"/>`}else h+=`<text x="${X0-16}" y="${y+5}" fill="#6b4a2c" text-anchor="middle">×</text>`});
  $('#s').innerHTML=h;const ms=Object.entries(held).map(([s,f])=>OPEN[s]+f);$('#nm').textContent=ms.length?[...new Set(ms.map(note))].join(' · '):'';
  $('#chips').innerHTML=saved.map(c=>`<span class="chip" data-id="${c.id}">${esc(c.name)}<i data-del style="font-style:normal;margin-left:8px;opacity:.5">×</i></span>`).join('')}
$('#s').onclick=e=>{const o=e.target.dataset.open;if(o!==undefined){pluck(OPEN[o]);return}const s=e.target.dataset.s;if(s===undefined)return;const f=+e.target.dataset.f;if(held[s]===f)delete held[s];else{held[s]=f;pluck(OPEN[s]+f)}draw()};
$('#strum').onclick=()=>Object.entries(held).sort((a,b)=>b[0]-a[0]).forEach(([s,f],i)=>pluck(OPEN[s]+f,i*.06));$('#cl').onclick=()=>{held={};draw()};
$('#sv').onclick=async()=>{if(!Object.keys(held).length)return;saved.unshift(await api.add({name:$('#n').value||'Chord',held}));$('#n').value='';draw()};
$('#chips').onclick=async e=>{const c=e.target.closest('.chip');if(!c)return;const s=saved.find(x=>x.id===c.dataset.id);if(e.target.hasAttribute('data-del')){await api.del(s.id);saved=saved.filter(x=>x!==s)}else held={...s.held};draw()};
api.list().then(d=>{saved=d;draw()});draw();
</script>
