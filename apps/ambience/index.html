<!doctype html><meta charset="utf-8"><title>Ambience</title>
<script src="/shared/lib.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #17161a; color: #e8dfd0; font-family: 'Helvetica Neue', Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
  h1 { margin: 0; font-weight: 200; font-size: 40px; letter-spacing: .3em; text-transform: uppercase; } h1 b { color: #f5a623; font-weight: 700; }
  .sub { color: #8b8478; margin: 6px 0 30px; }
  .desk { display: flex; gap: 14px; background: linear-gradient(#26242a, #1f1d22); border: 1px solid #38353d; border-radius: 16px; padding: 26px 22px 20px; box-shadow: 0 20px 50px #0008; }
  .ch { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ch.master { border-left: 1px solid #38353d; padding-left: 14px; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #3a3633; transition: .2s; } .led.on { background: #f5a623; box-shadow: 0 0 12px #f5a623; }
  input[type=range] { writing-mode: vertical-lr; direction: rtl; height: 220px; width: 28px; accent-color: #f5a623; }
  .ch label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #a79d8c; } .ch b { font-size: 13px; font-variant-numeric: tabular-nums; color: #f5a623; }
  #power { display: block; margin: 0 0 22px; font: inherit; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; background: none; border: 2px solid #f5a623; color: #f5a623; padding: 12px 26px; border-radius: 8px; cursor: pointer; }
  #power.on { background: #f5a623; color: #17161a; }
  .scenes { margin-top: 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input.t { font: inherit; background: #26242a; border: 1px solid #38353d; color: inherit; padding: 9px 12px; border-radius: 8px; outline: none; }
  button.s { font: inherit; background: #26242a; color: inherit; border: 1px solid #38353d; padding: 9px 14px; border-radius: 8px; cursor: pointer; }
  .chip { border: 1px solid #5a5347; border-radius: 20px; padding: 6px 8px 6px 14px; cursor: pointer; } .chip:hover { border-color: #f5a623; } .chip i { font-style: normal; color: #7a7366; margin-left: 8px; }
</style>
<main>
  <h1>Ambi<b>ence</b></h1><p class="sub">Mix your own soundscape. Everything is synthesized live — no audio files.</p>
  <button id="power">Power on</button>
  <div class="desk" id="desk"></div>
  <div class="scenes"><input class="t" id="name" placeholder="Scene name"><button class="s" id="save">Save scene</button><span id="scenes" style="display:contents"></span></div>
</main>
<script>
const CH = [['rain', 'Rain'], ['wind', 'Wind'], ['ocean', 'Ocean'], ['fire', 'Fire'], ['hum', 'Hum'], ['master', 'Master']];
const level = { rain: 0, wind: 0, ocean: 0, fire: 0, hum: 0, master: .7 };
let ac, gains = {}, scenes = [], master;

// Build a looping noise buffer: white, or brown (integrated white — deep and rumbly).
function noiseBuf(brown) {
  const b = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate), d = b.getChannelData(0); let last = 0;
  for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = brown ? (last + .02 * w) / 1.02 : w; d[i] = brown ? last * 3.5 : w; }
  return b;
}
const src = (buf) => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
const lfo = (hz, depth, target) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = hz; g.gain.value = depth; o.connect(g).connect(target); o.start(); };
const filt = (type, f, q = 1) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };

// Each channel is a small audio graph ending in its own gain node, controlled by a fader.
function start() {
  ac = new AudioContext(); const white = noiseBuf(false), brown = noiseBuf(true);
  master = ac.createGain(); master.connect(ac.destination);
  const mk = n => (gains[n] = Object.assign(ac.createGain(), {})).connect(master) && gains[n];
  gains.rain = ac.createGain(); src(white).connect(filt('highpass', 900)).connect(filt('lowpass', 9000)).connect(gains.rain);
  gains.wind = ac.createGain(); { const bp = filt('bandpass', 450, 1.5); src(brown).connect(bp).connect(gains.wind); lfo(.11, 280, bp.frequency); }
  gains.ocean = ac.createGain(); { const sw = ac.createGain(); sw.gain.value = .5; src(brown).connect(filt('lowpass', 700)).connect(sw).connect(gains.ocean); lfo(.09, .5, sw.gain); }
  gains.fire = ac.createGain(); src(brown).connect(filt('lowpass', 260)).connect(gains.fire);
  setInterval(() => {                                        // random crackles
    if (level.fire < .05 || Math.random() > .55) return;
    const s = ac.createBufferSource(), g = ac.createGain(), t = ac.currentTime; s.buffer = white;
    g.gain.setValueAtTime(Math.random() * level.fire * .8, t); g.gain.exponentialRampToValueAtTime(.001, t + .03 + Math.random() * .05);
    s.connect(filt('highpass', 2500 + Math.random() * 3000)).connect(g).connect(gains.fire); s.start(t, Math.random() * 3); s.stop(t + .1);
  }, 90);
  gains.hum = ac.createGain(); [55, 110.4, 164.7].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = [1, .5, .25][i]; o.connect(g).connect(gains.hum); o.start(); });
  ['rain', 'wind', 'ocean', 'fire', 'hum'].forEach(n => gains[n].connect(master));
  apply();
}
const apply = () => { if (!ac) return; master.gain.value = level.master * .8; for (const n of Object.keys(gains)) gains[n].gain.setTargetAtTime(level[n] ** 1.6, ac.currentTime, .1); };

function render() {
  $('#desk').innerHTML = CH.map(([k, n]) => `<div class="ch ${k === 'master' ? 'master' : ''}"><div class="led ${level[k] > .02 ? 'on' : ''}"></div><b>${Math.round(level[k] * 100)}</b>
    <input type="range" min="0" max="1" step="0.01" value="${level[k]}" data-k="${k}"><label>${n}</label></div>`).join('');
  $('#scenes').innerHTML = scenes.map(s => `<div class="chip" data-id="${s.id}">${esc(s.name)}<i data-del>×</i></div>`).join('');
}
$('#desk').addEventListener('input', e => {
  const k = e.target.dataset.k; level[k] = +e.target.value; apply();
  e.target.parentNode.querySelector('b').textContent = Math.round(level[k] * 100); e.target.parentNode.querySelector('.led').classList.toggle('on', level[k] > .02);
});
$('#power').onclick = () => { if (!ac) start(); $('#power').classList.add('on'); $('#power').textContent = 'Live'; };
$('#save').onclick = async () => { scenes.unshift(await api.add({ name: $('#name').value || 'Scene', level: { ...level } })); $('#name').value = ''; render(); };
$('#scenes').onclick = async e => {
  const c = e.target.closest('.chip'); if (!c) return; const s = scenes.find(x => x.id === c.dataset.id);
  if (e.target.hasAttribute('data-del')) { await api.del(s.id); scenes = scenes.filter(x => x !== s); } else { Object.assign(level, s.level); apply(); }
  render();
};
api.list().then(d => { scenes = d; render(); });
</script>
