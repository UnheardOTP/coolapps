<!doctype html><meta charset="utf-8"><title>Docker Cheatsheet</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2496ed;--w:980px}.cm{display:flex;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.cm code{flex:none;width:48%;background:var(--soft);padding:5px 10px;border-radius:7px;font:13px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;word-break:break-all}.cm code:hover{outline:2px solid var(--a)}.cm span{flex:1;color:var(--mut)}.cm i{font-style:normal;cursor:pointer;color:var(--mut)}.cm i.on{color:#f59e0b}</style>
<div class="wrap" style="max-width:980px"><h1>Docker Cheatsheet</h1><p class="sub">Containers, images, volumes, Compose and cleanup. Click to copy, star favorites.</p>
<div class="card"><input id="q" placeholder="Search…" data-keep><div class="tabs gap" id="tabs"></div><div id="list"></div></div></div>
<script>
const G={'Containers':[['docker ps -a','List all containers, including stopped'],['docker run -d --name web -p 8080:80 nginx','Run detached with a name and port map'],['docker run --rm -it ubuntu bash','Throwaway interactive shell'],['docker exec -it web sh','Open a shell in a running container'],['docker logs -f --tail 100 web','Follow the last 100 log lines'],['docker stop web && docker rm web','Stop and remove'],['docker restart web','Restart'],['docker inspect web','Full JSON details'],['docker stats','Live CPU / memory per container'],['docker cp web:/app/file ./','Copy a file out of a container']],
'Images':[['docker images','List local images'],['docker build -t name:tag .','Build from the Dockerfile here'],['docker pull image:tag','Download an image'],['docker tag name:tag repo/name:tag','Add a tag'],['docker push repo/name:tag','Upload to a registry'],['docker history name','Layers and their sizes'],['docker rmi name','Remove an image'],['docker save name | gzip > img.tgz','Export an image to a file']],
'Compose':[['docker compose up -d','Start all services in the background'],['docker compose up -d --build','Rebuild images, then start'],['docker compose down','Stop and remove containers'],['docker compose down -v','…and delete the volumes too (data loss!)'],['docker compose logs -f svc','Follow one service\'s logs'],['docker compose ps','Service status'],['docker compose exec svc sh','Shell into a service'],['docker compose pull','Update images'],['docker compose config','Show the resolved config']],
'Volumes & networks':[['docker volume ls','List volumes'],['docker volume inspect vol','Where a volume lives'],['docker run -v vol:/data img','Mount a named volume'],['docker run -v "$PWD":/app img','Bind-mount the current folder'],['docker network ls','List networks'],['docker network create net','Create a network'],['docker run --network net img','Attach to a network']],
'Cleanup':[['docker system df','How much space Docker uses'],['docker system prune','Remove stopped containers, dangling images, unused networks'],['docker system prune -a --volumes','Remove EVERYTHING unused (careful)'],['docker image prune','Remove dangling images'],['docker container prune','Remove stopped containers'],['docker volume prune','Remove unused volumes (data loss!)']],
'Dockerfile':[['FROM node:20-alpine','Base image'],['WORKDIR /app','Set the working directory'],['COPY package*.json ./','Copy only the manifest first (cache layer)'],['RUN npm ci --omit=dev','Run a build step'],['COPY . .','Copy the rest of the source'],['ENV NODE_ENV=production','Set an environment variable'],['EXPOSE 3000','Document the port'],['CMD ["node","server.js"]','Default command']]};
let cat='All',favs=new Set(),doc=null;
function render(){const q=$('#q').value.toLowerCase();$('#tabs').innerHTML=['All','★ Starred',...Object.keys(G)].map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join('');
  const rows=Object.entries(G).flatMap(([g,l])=>l.map(([c,d])=>({g,c,d}))).filter(r=>(cat==='All'||cat==='★ Starred'&&favs.has(r.c)||cat===r.g)&&(!q||(r.c+r.d).toLowerCase().includes(q)));
  $('#list').innerHTML=rows.map(r=>`<div class="cm"><code data-c="${esc(r.c)}">${esc(r.c)}</code><span>${esc(r.d)}</span><i data-f="${esc(r.c)}" class="${favs.has(r.c)?'on':''}">${favs.has(r.c)?'★':'☆'}</i></div>`).join('')||'<span class="mut">Nothing matches.</span>'}
$('#tabs').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};$('#q').oninput=render;
$('#list').onclick=async e=>{if(e.target.dataset.c)return copy(e.target.dataset.c,e.target);const f=e.target.dataset.f;if(!f)return;favs.has(f)?favs.delete(f):favs.add(f);render();const l=[...favs];if(doc)api.upd(doc.id,{l});else doc=await api.add({kind:'favs',l})};
api.list().then(d=>{doc=d.find(x=>x.kind==='favs')||null;if(doc)favs=new Set(doc.l);remember().then(render)});
</script>
