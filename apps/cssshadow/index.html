<!doctype html><meta charset="utf-8"><title>Box Shadow</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#6366f1}#stage{height:300px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:12px}#box{width:150px;height:150px;border-radius:14px;background:#fff}</style>
<div class="wrap"><h1>Box Shadow</h1><p class="sub">Layer up to three shadows and copy the CSS.</p>
<div class="g2"><div class="card"><div id="stage"><div id="box"></div></div></div>
<div class="card"><div class="tabs" id="tabs"></div><div class="g2"><div><label>X offset <b id="vx"></b></label><input type="range" id="x" min="-60" max="60" value="0"></div><div><label>Y offset <b id="vy"></b></label><input type="range" id="y" min="-60" max="60" value="12"></div><div><label>Blur <b id="vb"></b></label><input type="range" id="b" min="0" max="100" value="30"></div><div><label>Spread <b id="vs"></b></label><input type="range" id="s" min="-40" max="60" value="0"></div><div><label>Opacity <b id="vo"></b></label><input type="range" id="o" min="0" max="100" value="25"></div><div><label>Color</label><input type="color" id="c" value="#000000"></div></div>
<label class="gap"><input type="checkbox" id="i"> Inset</label><div class="row gap"><button class="s" id="add">+ Layer</button><button class="x" id="rm">Remove layer</button></div></div></div>
<div class="card"><h2>CSS</h2><div class="out" id="css"></div><button class="s gap" id="cp">Copy</button></div></div>
<script>
let L=[{x:0,y:12,b:30,s:0,o:25,c:'#000000',i:false}],cur=0;
const rgba=l=>{const h=l.c,a=l.o/100;return`rgba(${parseInt(h.slice(1,3),16)}, ${parseInt(h.slice(3,5),16)}, ${parseInt(h.slice(5,7),16)}, ${a})`};
const one=l=>`${l.i?'inset ':''}${l.x}px ${l.y}px ${l.b}px ${l.s}px ${rgba(l)}`;
function render(){const l=L[cur];$('#tabs').innerHTML=L.map((_,i)=>`<button data-i="${i}" class="${i===cur?'on':''}">Layer ${i+1}</button>`).join('');
  for(const[k,v]of[['x','vx'],['y','vy'],['b','vb'],['s','vs'],['o','vo']]){$('#'+k).value=l[k];$('#'+v).textContent=l[k]+(k==='o'?'%':'px')}$('#c').value=l.c;$('#i').checked=l.i;
  const css=L.map(one).join(',\n    ');$('#box').style.boxShadow=L.map(one).join(', ');$('#css').textContent=`box-shadow: ${css};`}
for(const k of['x','y','b','s','o'])$('#'+k).oninput=e=>{L[cur][k]=+e.target.value;render()};$('#c').oninput=e=>{L[cur].c=e.target.value;render()};$('#i').onchange=e=>{L[cur].i=e.target.checked;render()};
$('#tabs').onclick=e=>{if(e.target.dataset.i){cur=+e.target.dataset.i;render()}};$('#add').onclick=()=>{if(L.length<3){L.push({x:0,y:4,b:8,s:0,o:20,c:'#000000',i:false});cur=L.length-1;render()}};$('#rm').onclick=()=>{if(L.length>1){L.splice(cur,1);cur=0;render()}};$('#cp').onclick=e=>copy($('#css').textContent,e.target);render();
</script>
