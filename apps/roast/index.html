<!doctype html><meta charset="utf-8"><title>Roast Timer</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#b91c1c;--w:860px}.st{display:flex;gap:14px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}.st b{width:130px}</style>
<div class="wrap"><h1>Roast Timer</h1><p class="sub">Work out the oven time for a joint or bird, and when to start so dinner is ready on time. Always confirm doneness with a meat thermometer.</p>
<div class="card"><div class="g4"><div><label>Meat</label><select id="m" data-keep></select></div><div><label>Doneness</label><select id="dn" data-keep></select></div><div><label>Weight</label><input id="w" type="number" step="any" value="2.5" data-keep></div><div><label>Unit</label><select id="u" data-keep><option>kg</option><option>lb</option></select></div></div>
<div class="row gap"><div class="col"><label>Serve at</label><input id="sv" type="time" value="18:30" data-keep></div><div class="col"><label>Oven preheat (min)</label><input id="ph" type="number" value="15" data-keep></div></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Your timeline</h2><div id="tl"></div></div><div class="card"><h2>Safe internal temperatures</h2><table id="tb"></table></div></div>
<script>
// min per lb at the listed oven temp (°F), target pull temperature (°F) and rest minutes. These are typical guideline values, not guarantees.
const M={'Beef roast':{o:325,l:{'Rare':[13,120],'Medium-rare':[15,130],'Medium':[18,140],'Well done':[24,160]},rest:20},'Whole turkey (unstuffed)':{o:325,l:{'Cooked through':[13,165]},rest:35},'Whole chicken':{o:375,l:{'Cooked through':[20,165]},rest:15},'Pork loin / shoulder':{o:350,l:{'Medium':[22,145],'Well done':[28,160]},rest:15},'Leg of lamb':{o:325,l:{'Medium-rare':[17,130],'Medium':[20,140],'Well done':[25,160]},rest:20},'Ham (fully cooked)':{o:325,l:{'Reheat':[14,140]},rest:15}};
$('#m').innerHTML=Object.keys(M).map(k=>`<option>${k}</option>`).join('');
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),x=m%60;return`${(h%12)||12}:${pad2(x)} ${h<12?'am':'pm'}`};
function run(){const m=M[$('#m').value],cur=$('#dn').value;$('#dn').innerHTML=Object.keys(m.l).map(k=>`<option ${k===cur?'selected':''}>${k}</option>`).join('');const[ppl,tf]=m.l[$('#dn').value],lb=num('w')*($('#u').value==='kg'?2.20462:1),cook=lb*ppl,[h,mi]=($('#sv').value||'18:30').split(':').map(Number),serve=h*60+mi,oven=serve-m.rest-cook,pre=oven-num('ph');
  if(!(lb>0)){$('#kp').innerHTML='';$('#tl').innerHTML='';return}
  $('#kp').innerHTML=[['Oven temp',`${m.o}°F / ${Math.round((m.o-32)*5/9)}°C`],['Cook time',`${Math.floor(cook/60)}h ${Math.round(cook%60)}m`],['Pull at',`${tf}°F / ${Math.round((tf-32)*5/9)}°C`],['Rest',m.rest+' min']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join('');
  $('#tl').innerHTML=[[pre,'Turn the oven on'],[oven,'Meat goes in'],[serve-m.rest,`Check temperature — pull at ${tf}°F (${Math.round((tf-32)*5/9)}°C); rest tented with foil`],[serve,'Carve and serve']].map(([t,l])=>`<div class="st"><b>${hm(t)}</b><span>${l}</span></div>`).join('')+(oven<0?'<p class="bad gap">That means starting before midnight — consider a smaller joint or a later serving time.</p>':'');
  $('#tb').innerHTML=[['Poultry (whole or ground)','165°F / 74°C'],['Ground beef, pork, lamb','160°F / 71°C'],['Beef, pork, lamb steaks &amp; roasts (medium-rare to medium)','145°F / 63°C minimum + 3 min rest'],['Fish','145°F / 63°C'],['Leftovers / casseroles','165°F / 74°C']].map(([k,v])=>`<tr><td>${k}</td><td class="r"><b>${v}</b></td></tr>`).join('')}
document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
