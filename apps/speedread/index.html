<!doctype html><meta charset="utf-8"><title>Speed Reader</title>
<script src="/shared/lib.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #fbfbf9; color: #111; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; }
  aside { width: 280px; background: #f0efe9; border-right: 1px solid #ddd; padding: 28px 20px; min-height: 100vh; } h1 { margin: 0 0 18px; font-size: 22px; letter-spacing: .15em; text-transform: uppercase; font-weight: 800; } h1 b { color: #d62828; }
  .tx { padding: 10px 12px; margin-bottom: 8px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; } .tx.on { border-color: #d62828; } .tx small { display: block; color: #888; } .tx .bar { height: 3px; background: #eee; margin-top: 6px; } .tx .bar i { display: block; height: 100%; background: #d62828; }
  button { font: inherit; padding: 9px 16px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; } button.g { background: #fff; color: #111; border: 1px solid #ccc; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
  .stage { position: relative; width: 760px; height: 190px; border-top: 2px solid #111; border-bottom: 2px solid #111; display: flex; align-items: center; justify-content: center; } .stage::before { content: ''; position: absolute; left: 50%; top: 0; height: 36px; width: 2px; background: #d62828; margin-left: -1px; } .stage::after { content: ''; position: absolute; left: 50%; bottom: 0; height: 36px; width: 2px; background: #d62828; margin-left: -1px; }
  #word { display: flex; width: 100%; font: 700 64px Georgia, serif; } #word span { flex: 1; } #l { text-align: right; } #m { flex: 0 0 auto !important; color: #d62828; } #r { text-align: left; }
  .ctl { display: flex; align-items: center; gap: 18px; width: 760px; } .ctl input[type=range] { flex: 1; accent-color: #d62828; } #pos { font-variant-numeric: tabular-nums; color: #666; min-width: 120px; text-align: right; } .wpm { color: #666; width: 100px; }
  dialog { width: 520px; border: 1px solid #ccc; border-radius: 10px; padding: 22px; } dialog input, dialog textarea { width: 100%; margin: 6px 0 12px; padding: 9px; font: inherit; border: 1px solid #ccc; border-radius: 6px; } dialog::backdrop { background: #0008; }
</style>
<aside><h1>Speed<b>Read</b></h1><button id="add" style="width:100%;margin-bottom:16px">+ Paste text</button><div id="list"></div></aside>
<main><div class="stage"><div id="word"><span id="l"></span><span id="m">Ready</span><span id="r"></span></div></div>
  <div class="ctl"><button id="play">▶ Play</button><button class="g" id="back">« 10</button><input type="range" id="seek" min="0" max="0" value="0"><span id="pos"></span><span class="wpm"><b id="wv">350</b> wpm</span><input type="range" id="wpm" min="150" max="900" step="25" value="350" style="flex:none;width:140px"></div>
  <p style="color:#888;margin:0">Space play/pause · ← back 10 words · → forward 10</p></main>
<dialog id="dlg"><h3 style="margin:0">Add text</h3><input id="tt" placeholder="Title"><textarea id="tb" rows="10" placeholder="Paste something to read…"></textarea><div style="text-align:right"><button class="g" id="cx">Cancel</button> <button id="sv">Add</button></div></dialog>
<script>
let texts = [], cur = null, words = [], i = 0, timer = null;
// Optimal recognition point: the letter your eye should land on, a bit left of centre.
const orp = w => w.length <= 1 ? 0 : w.length <= 5 ? 1 : w.length <= 9 ? 2 : w.length <= 13 ? 3 : 4;
function show() {
  const w = words[i] || ''; if (!w) { $('#l').textContent = ''; $('#m').textContent = words.length ? 'Done' : 'Ready'; $('#r').textContent = ''; }
  else { const k = orp(w); $('#l').textContent = w.slice(0, k); $('#m').textContent = w[k]; $('#r').textContent = w.slice(k + 1); }
  $('#seek').max = Math.max(0, words.length - 1); $('#seek').value = i; $('#pos').textContent = words.length ? `${i + 1} / ${words.length}` : '';
}
// Each word is shown for 60000/wpm ms, longer after punctuation and for long words.
const delay = w => 60000 / $('#wpm').value * (/[.!?]$/.test(w) ? 2 : /[,;:]$/.test(w) ? 1.5 : 1) * (w.length > 8 ? 1.3 : 1);
function tick() { if (i >= words.length - 1) return pause(); i++; show(); timer = setTimeout(tick, delay(words[i])); }
function play() { if (!words.length) return; if (i >= words.length - 1) i = 0; $('#play').textContent = '❚❚ Pause'; show(); timer = setTimeout(tick, delay(words[i])); }
function pause() { clearTimeout(timer); timer = null; $('#play').textContent = '▶ Play'; if (cur) { cur.pos = i; api.upd(cur.id, { pos: i }); list(); } }
const toggle = () => timer ? pause() : play();
function open(id) { pause(); cur = texts.find(t => t.id === id); words = cur ? cur.text.split(/\s+/).filter(Boolean) : []; i = Math.min(cur?.pos || 0, Math.max(0, words.length - 1)); show(); list(); }
function list() { $('#list').innerHTML = texts.map(t => `<div class="tx ${t === cur ? 'on' : ''}" data-id="${t.id}"><b>${esc(t.title)}</b><small>${t.text.split(/\s+/).length} words <span data-del style="float:right;cursor:pointer">✕</span></small><div class="bar"><i style="width:${Math.round((t.pos || 0) / Math.max(1, t.text.split(/\s+/).length - 1) * 100)}%"></i></div></div>`).join('') || '<p style="color:#888">Paste an article or chapter to begin.</p>'; }
$('#list').onclick = async e => { const t = e.target.closest('.tx'); if (!t) return; if (e.target.hasAttribute('data-del')) { await api.del(t.dataset.id); texts = texts.filter(x => x.id !== t.dataset.id); if (cur?.id === t.dataset.id) { cur = null; words = []; pause(); show(); } list(); } else open(t.dataset.id); };
$('#play').onclick = toggle; $('#back').onclick = () => { i = Math.max(0, i - 10); show(); };
$('#seek').oninput = e => { i = +e.target.value; show(); }; $('#wpm').oninput = e => $('#wv').textContent = e.target.value;
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.key === 'ArrowLeft') { i = Math.max(0, i - 10); show(); } if (e.key === 'ArrowRight') { i = Math.min(words.length - 1, i + 10); show(); } });
$('#add').onclick = () => $('#dlg').showModal(); $('#cx').onclick = () => $('#dlg').close();
$('#sv').onclick = async () => { const text = $('#tb').value.trim(); if (!text) return; const t = await api.add({ title: $('#tt').value || 'Untitled', text, pos: 0 }); texts.unshift(t); $('#dlg').close(); $('#tt').value = $('#tb').value = ''; open(t.id); };
api.list().then(d => { texts = d; list(); if (d[0]) open(d[0].id); });
</script>
