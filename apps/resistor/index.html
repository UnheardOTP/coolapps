<!doctype html><meta charset="utf-8"><title>Resistor Color Code</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#b45309;--w:860px}svg{width:100%;max-width:520px;height:110px}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px #0004}</style>
<div class="wrap"><h1>Resistor Color Code</h1><p class="sub">Pick the colored bands to read a resistor's value, or type a value to see which bands to look for.</p>
<div class="card"><div class="tabs" id="tabs"><button data-b="4" class="on">4-band</button><button data-b="5">5-band</button></div><div style="text-align:center" id="vis"></div><div class="row gap" id="sel"></div><div class="big" id="val" style="text-align:center;margin-top:10px"></div><div class="mut" style="text-align:center" id="tol"></div></div>
<div class="card"><h2>Value → bands</h2><div class="row"><div class="col"><label>Resistance (e.g. 4.7k, 330, 1M, 2.2k)</label><input id="rv" value="4.7k" data-keep></div><div class="col"><label>Tolerance</label><select id="rt" data-keep><option value="gold">±5% gold</option><option value="silver">±10% silver</option><option value="brown">±1% brown</option><option value="red">±2% red</option></select></div></div><div id="bands" class="gap"></div></div></div>
<script>
const C=[['black','#111',0,1,null],['brown','#7b3f00',1,10,1],['red','#dc2626',2,100,2],['orange','#f97316',3,1e3,null],['yellow','#facc15',4,1e4,null],['green','#16a34a',5,1e5,.5],['blue','#2563eb',6,1e6,.25],['violet','#8b5cf6',7,1e7,.1],['grey','#9ca3af',8,1e8,.05],['white','#f8fafc',9,1e9,null],['gold','#d4a017',null,.1,5],['silver','#c0c0c0',null,.01,10]];
let nb=4,sel=[1,0,2,10];const col=n=>C.find(c=>c[0]===n);
const eng=x=>{const a=x;return a>=1e9?+(x/1e9).toPrecision(4)+' GΩ':a>=1e6?+(x/1e6).toPrecision(4)+' MΩ':a>=1e3?+(x/1e3).toPrecision(4)+' kΩ':+x.toPrecision(4)+' Ω'};
function calc(s){const d=s.slice(0,nb-2).map(i=>C[i][2]);const mult=C[s[nb-2]][3],base=+d.join('');return{v:base*mult,tol:C[s[nb-1]][4]}}
function paint(){const w=520,xs=nb===4?[130,190,250,360]:[110,160,210,260,370];$('#vis').innerHTML=`<svg viewBox="0 0 ${w} 110"><rect x="0" y="52" width="60" height="6" fill="#999"/><rect x="${w-60}" y="52" width="60" height="6" fill="#999"/><rect x="50" y="22" width="${w-100}" height="66" rx="28" fill="#e7cfa3" stroke="#a88" stroke-width="2"/>${sel.map((i,k)=>`<rect x="${xs[k]}" y="22" width="22" height="66" fill="${C[i][1]}" stroke="#0003"/>`).join('')}</svg>`;
  $('#sel').innerHTML=sel.map((s,k)=>{const L=k<nb-2?'Digit '+(k+1):k===nb-2?'Multiplier':'Tolerance',ok=c=>k<nb-2?c[2]!==null:k===nb-2?true:c[4]!==null;return`<div class="col"><label>${L}</label><select data-k="${k}">${C.map((c,i)=>ok(c)?`<option value="${i}" ${i===s?'selected':''}>${c[0]}${k<nb-2?' ('+c[2]+')':k===nb-2?' (×'+c[3]+')':' (±'+c[4]+'%)'}</option>`:'').join('')}</select></div>`}).join('');const r=calc(sel);$('#val').textContent=eng(r.v);$('#tol').textContent=`±${r.tol}% tolerance · ${eng(r.v*(1-r.tol/100))} to ${eng(r.v*(1+r.tol/100))}`}
function parse(s){s=s.trim().toLowerCase().replace(/ω|ohms?/g,'').replace(/\s/g,'');const m=/^([\d.]+)([kmgr]?)$/.exec(s.replace(/(\d)([kmgr])(\d)/,'$1.$3$2'));if(!m)return NaN;return parseFloat(m[1])*({'':1,r:1,k:1e3,m:1e6,g:1e9}[m[2]])}
function reverse(){const v=parse($('#rv').value);if(!(v>=.1)){$('#bands').innerHTML='<span class="err">Enter a value of at least 0.1 Ω, like 330 or 4.7k.</span>';return}
  // Express as 2 (or 3) significant digits × 10^n, then map digits and exponent to colors.
  const out=[];for(const n of[2,3]){let e=Math.floor(Math.log10(v))-(n-1),d=Math.round(v/10**e);if(d>=10**n){d/=10;e++}const mult=C.find(c=>Math.abs(c[3]-10**e)<1e-9*Math.max(1,c[3]));if(!mult)continue;const digs=String(d).padStart(n,'0').split('').map(x=>C.find(c=>c[2]===+x));out.push([...digs,mult,col($('#rt').value)])}
  $('#bands').innerHTML=out.map((b,i)=>`<div class="gap"><b>${i?'5':'4'}-band:</b> ${b.map(c=>`<span><span class="sw" style="background:${c[1]}"></span>${c[0]}</span>`).join(' · ')}</div>`).join('')||'<span class="err">That value is outside the color code range.</span>'}
$('#tabs').onclick=e=>{const b=e.target.dataset.b;if(!b)return;nb=+b;sel=nb===4?[1,0,2,10]:[1,0,0,1,10];document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===e.target));paint()};$('#sel').onchange=e=>{sel[+e.target.dataset.k]=+e.target.value;paint()};document.addEventListener('input',e=>{if(e.target.id==='rv'||e.target.id==='rt')reverse()});$('#rt').onchange=reverse;paint();remember().then(reverse);
</script>
