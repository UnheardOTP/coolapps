<!doctype html><meta charset="utf-8"><title>Teleprompter</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:1000px}#pr{position:fixed;inset:0;background:#000;color:#fff;z-index:50;display:none;overflow:hidden}#pr.on{display:block}#sc{position:absolute;left:8%;right:8%;top:100%;text-align:center;line-height:1.5;font-weight:600;white-space:pre-wrap}#pr.mir #sc{transform:scaleX(-1)}#ln{position:absolute;left:0;right:0;top:40%;height:2px;background:#ef4444;opacity:.6}#ctl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:#111c;padding:10px 14px;border-radius:30px;z-index:60;align-items:center;color:#fff}#ctl button{padding:6px 14px}</style>
<div class="wrap"><h1>Teleprompter</h1><p class="sub">Paste a script and read it from a smoothly scrolling screen. Esc exits, Space pauses.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Title</label><input id="ti" placeholder="Intro video"></div><div class="col"><label>Font size (<b id="fv"></b>px)</label><input type="range" id="fs" min="28" max="140" value="64" data-keep></div><div class="col"><label>Speed <b id="sv2"></b></label><input type="range" id="sp" min="1" max="20" value="6" data-keep></div></div><label class="gap">Script</label><textarea id="tx" style="min-height:260px;font-family:inherit;font-size:16px" data-keep></textarea>
<div class="row gap"><label style="margin:0 0 9px"><input type="checkbox" id="mi" data-keep> Mirror text (for a glass prompter)</label><button id="go">▶ Start prompter</button><button class="s" id="sv">Save script</button></div><div class="chips" id="list"></div></div></div>
<div id="pr"><div id="ln"></div><div id="sc"></div></div><div id="ctl" class="hide"><button class="s" id="pp">Pause</button><button class="s" id="sl">Slower</button><button class="s" id="fa">Faster</button><button class="s" id="rw">Restart</button><button id="ex">Exit</button></div>
<script>
let y=0,run=false,raf=0,last=0,scripts=[];
const upd=()=>{$('#fv').textContent=$('#fs').value;$('#sv2').textContent=$('#sp').value};
function frame(t){if(!run)return;const dt=(t-last)/1000;last=t;y-=dt*$('#sp').value*14;const sc=$('#sc');sc.style.transform=`translateY(${y}px)${$('#pr').classList.contains('mir')?' scaleX(-1)':''}`;if(y<-sc.offsetHeight-innerHeight*.4){run=false;$('#pp').textContent='Replay'}else raf=requestAnimationFrame(frame)}
function start(){if(!$('#tx').value.trim())return;const p=$('#pr'),sc=$('#sc');p.classList.add('on');p.classList.toggle('mir',$('#mi').checked);$('#ctl').classList.remove('hide');sc.textContent=$('#tx').value;sc.style.fontSize=$('#fs').value+'px';y=innerHeight*.4;run=true;last=performance.now();$('#pp').textContent='Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
const stop=()=>{run=false;$('#pr').classList.remove('on');$('#ctl').classList.add('hide')};
function toggle(){if(run){run=false;$('#pp').textContent='Resume'}else{if(y<-$('#sc').offsetHeight)y=innerHeight*.4;run=true;last=performance.now();$('#pp').textContent='Pause';raf=requestAnimationFrame(frame)}}
$('#go').onclick=start;$('#ex').onclick=stop;$('#pp').onclick=toggle;$('#rw').onclick=()=>{y=innerHeight*.4;if(!run)toggle()};$('#sl').onclick=()=>{$('#sp').value=Math.max(1,+$('#sp').value-1);upd()};$('#fa').onclick=()=>{$('#sp').value=Math.min(20,+$('#sp').value+1);upd()};
addEventListener('keydown',e=>{if(!$('#pr').classList.contains('on'))return;if(e.key==='Escape')stop();if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowUp')$('#fa').click();if(e.key==='ArrowDown')$('#sl').click()});$('#fs').oninput=$('#sp').oninput=upd;
function chips(){$('#list').innerHTML=scripts.map(s=>`<span class="chip" data-id="${s.id}">${esc(s.title)}<i data-del>✕</i></span>`).join('')}
$('#sv').onclick=async()=>{if(!$('#tx').value.trim())return;scripts.unshift(await api.add({kind:'script',title:$('#ti').value||'Script',text:$('#tx').value}));chips()};
$('#list').onclick=async e=>{const c=e.target.closest('.chip');if(!c)return;const s=scripts.find(x=>x.id===c.dataset.id);if(e.target.hasAttribute('data-del')){await api.del(s.id);scripts=scripts.filter(x=>x!==s);chips()}else{$('#ti').value=s.title;$('#tx').value=s.text}};
api.list().then(d=>{scripts=only(d,'script');chips();remember().then(upd)});upd();
</script>
