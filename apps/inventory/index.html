<!doctype html><meta charset="utf-8"><title>Home Inventory</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#b45309;--w:1000px}tr.low td:first-child{box-shadow:inset 4px 0 var(--bad)}input.q{width:70px}</style>
<div class="wrap"><h1>Home Inventory</h1><p class="sub">Know what you own and where it is — and get a nudge when stock runs low.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Item</label><input id="n" placeholder="Batteries AA"></div><div class="col"><label>Location</label><input id="l" list="locs" placeholder="Garage"><datalist id="locs"></datalist></div><div class="col" style="max-width:90px"><label>Qty</label><input id="q" type="number" value="1"></div><div class="col" style="max-width:110px"><label>Low at</label><input id="lw" type="number" value="0"></div><div class="col" style="max-width:120px"><label>Value ($)</label><input id="v" type="number" step="0.01" value="0"></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><div class="row"><div class="col"><input id="s" placeholder="Search items or locations…"></div><div class="col"><select id="lf"></select></div></div><div style="overflow:auto;margin-top:10px"><table id="tb"></table></div></div></div>
<script>
let it=[];
function paint(){const q=$('#s').value.toLowerCase(),lf=$('#lf').value,locs=[...new Set(it.map(i=>i.l).filter(Boolean))].sort();$('#locs').innerHTML=locs.map(l=>`<option>${esc(l)}</option>`).join('');$('#lf').innerHTML='<option value="">All locations</option>'+locs.map(l=>`<option ${l===lf?'selected':''}>${esc(l)}</option>`).join('');
  const l=it.filter(i=>(!lf||i.l===lf)&&(!q||(i.n+i.l).toLowerCase().includes(q))).sort((a,b)=>a.n.localeCompare(b.n));const lowN=it.filter(i=>i.lw>0&&i.q<=i.lw).length;
  $('#kp').innerHTML=[['Items',it.length],['Total units',it.reduce((n,i)=>n+i.q,0)],['Total value',money(it.reduce((n,i)=>n+i.q*i.v,0))],['Running low',lowN]].map(([k,v],i)=>`<div class="kpi"><small>${k}</small><b ${i===3&&v?'class="bad"':''}>${v}</b></div>`).join('');
  $('#tb').innerHTML='<tr><th>Item</th><th>Location</th><th>Qty</th><th class="r">Each</th><th class="r">Value</th><th></th></tr>'+l.map(i=>`<tr data-id="${i.id}" class="${i.lw>0&&i.q<=i.lw?'low':''}"><td><b>${esc(i.n)}</b>${i.lw>0&&i.q<=i.lw?' <span class="bad">low</span>':''}</td><td>${esc(i.l||'—')}</td><td><button class="x" data-d="-1">−</button> <b>${i.q}</b> <button class="x" data-d="1">+</button></td><td class="r">${money(i.v)}</td><td class="r">${money(i.q*i.v)}</td><td class="r"><button class="x" data-rm>✕</button></td></tr>`).join('')}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n)return;it.push(await api.add({kind:'inv',n,l:$('#l').value.trim(),q:num('q'),lw:num('lw'),v:num('v')}));$('#n').value='';paint()};
$('#tb').onclick=async e=>{const r=e.target.closest('tr[data-id]');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);if(e.target.dataset.d){i.q=Math.max(0,i.q+ +e.target.dataset.d);api.upd(i.id,{q:i.q});paint()}if(e.target.hasAttribute('data-rm')){await api.del(i.id);it=it.filter(x=>x!==i);paint()}};$('#s').oninput=$('#lf').onchange=paint;api.list().then(d=>{it=only(d,'inv');paint()});
</script>
