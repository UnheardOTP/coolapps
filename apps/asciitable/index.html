<!doctype html><meta charset="utf-8"><title>ASCII Table</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#475569;--w:900px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}.k{background:var(--soft);border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 2px;cursor:pointer}.k:hover{border-color:var(--a)}.k b{display:block;font-size:20px;min-height:30px;line-height:30px}.k small{color:var(--mut);font-size:11px}.k.ctl b{font-size:12px}</style>
<div class="wrap"><h1>ASCII Table</h1><p class="sub">All 128 characters. Click one to see every representation.</p>
<div class="card"><div class="row"><div class="col"><label>Look up a character or number</label><input id="q" placeholder="A, 65, 0x41 or 0b1000001" data-keep></div></div><div id="det" class="g4 gap"></div></div>
<div class="card"><div class="g" id="g"></div></div></div>
<script>
const CTL='NUL SOH STX ETX EOT ENQ ACK BEL BS TAB LF VT FF CR SO SI DLE DC1 DC2 DC3 DC4 NAK SYN ETB CAN EM SUB ESC FS GS RS US'.split(' ');
const NAME=n=>n<32?CTL[n]:n===32?'SP':n===127?'DEL':String.fromCharCode(n);
$('#g').innerHTML=Array.from({length:128},(_,i)=>`<div class="k ${i<32||i===127||i===32?'ctl':''}" data-n="${i}"><b>${i<32||i===127?NAME(i):i===32?'␣':esc(String.fromCharCode(i))}</b><small>${i} · ${i.toString(16).toUpperCase().padStart(2,'0')}</small></div>`).join('');
function show(n){$('#det').innerHTML=[['Character',n<32||n===127?NAME(n):n===32?'space':String.fromCharCode(n)],['Decimal',n],['Hex','0x'+n.toString(16).toUpperCase().padStart(2,'0')],['Octal','0'+n.toString(8)],['Binary',n.toString(2).padStart(8,'0')],['HTML','&#'+n+';'],['Escape',n<32||n===127?'\\x'+n.toString(16).padStart(2,'0'):String.fromCharCode(n)],['Group',n<32||n===127?'control':n<48?'punctuation / space':n<58?'digit':n<65?'punctuation':n<91?'uppercase':n<97?'punctuation':n<123?'lowercase':'punctuation']].map(([k,v])=>`<div class="kpi" style="cursor:pointer" data-v="${esc(String(v))}"><small>${k}</small><b class="mono" style="font-size:16px">${esc(String(v))}</b></div>`).join('')}
function lookup(v){v=v.trim();if(!v)return;let n=NaN;if(/^0x[0-9a-f]+$/i.test(v))n=parseInt(v,16);else if(/^0b[01]+$/i.test(v))n=parseInt(v.slice(2),2);else if(/^\d+$/.test(v)&&+v<128)n=+v;else if([...v].length===1)n=v.codePointAt(0);else{const i=CTL.indexOf(v.toUpperCase());if(i>=0)n=i}if(n>=0&&n<128)show(n)}
$('#g').onclick=e=>{const k=e.target.closest('.k');if(k)show(+k.dataset.n)};$('#det').onclick=e=>{const k=e.target.closest('.kpi');if(k)copy(k.dataset.v,k.querySelector('b'))};$('#q').oninput=()=>lookup($('#q').value);show(65);remember().then(()=>lookup($('#q').value));
</script>
