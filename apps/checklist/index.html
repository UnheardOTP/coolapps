<!doctype html><meta charset="utf-8"><title>Checklists</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:1000px}.app{display:grid;grid-template-columns:260px 1fr;gap:16px}.side{display:flex;flex-direction:column;gap:6px}.li{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--card)}.li.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--card))}.li small{display:block;color:var(--mut)}.it{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}.it input[type=checkbox]{width:20px;height:20px}.it.d span{text-decoration:line-through;color:var(--mut)}.it span{flex:1}@media(max-width:720px){.app{grid-template-columns:1fr}}</style>
<div class="wrap"><h1>Checklists</h1><p class="sub">Reusable lists with progress. Start from a template or build your own.</p>
<div class="app"><div class="side"><div class="row" style="flex-wrap:nowrap"><input id="nn" placeholder="New list name"><button id="mk">+</button></div><div class="chips" id="tp"></div><div id="ls" class="side"></div></div><div class="card" id="ed"></div></div></div>
<script>
const TPL={'Travel packing':['Passport / ID','Tickets & bookings','Phone charger','Medications','Toiletries','Weather-appropriate clothes','Travel insurance','Cash & cards'],'Moving house':['Book movers','Change address','Pack room by room','Cancel / transfer utilities','Take meter readings','Clean old place','Return keys'],'Project launch':['Final QA pass','Backups verified','Docs updated','Announce to team','Monitor dashboards','Retrospective scheduled'],'Weekly review':['Clear inbox','Review calendar','Plan top 3 priorities','Tidy desk','Back up files','Pay bills']};
let lists=[],cur=null;
const cl=()=>lists.find(l=>l.id===cur),sv=l=>api.upd(l.id,{items:l.items,name:l.name});
function paint(){$('#tp').innerHTML=Object.keys(TPL).map(t=>`<span class="chip" data-t="${t}">+ ${t}</span>`).join('');
  $('#ls').innerHTML=lists.map(l=>{const d=l.items.filter(i=>i.d).length;return`<div class="li ${l.id===cur?'on':''}" data-id="${l.id}"><b>${esc(l.name)}</b><small>${d}/${l.items.length} done</small></div>`}).join('')||'<span class="mut">No lists yet.</span>';
  const l=cl();$('#ed').innerHTML=l?`<div class="row" style="margin-bottom:8px"><h2 style="margin:0;flex:1">${esc(l.name)}</h2><button class="x" data-reset>Uncheck all</button><button class="x" data-del>Delete list</button></div><div class="bar"><i style="width:${l.items.length?l.items.filter(i=>i.d).length/l.items.length*100:0}%"></i></div>${l.items.map((i,k)=>`<div class="it ${i.d?'d':''}"><input type="checkbox" data-k="${k}" ${i.d?'checked':''}><span>${esc(i.t)}</span><button class="x" data-rm="${k}">✕</button></div>`).join('')}<div class="row gap"><div class="col"><input id="ni" placeholder="Add an item…"></div><button id="ai">Add</button></div>`:'<span class="mut">Create or pick a list.</span>'}
$('#mk').onclick=async()=>{const n=$('#nn').value.trim();if(!n)return;const l=await api.add({kind:'list',name:n,items:[]});lists.push(l);cur=l.id;$('#nn').value='';paint()};
$('#tp').onclick=async e=>{const t=e.target.dataset.t;if(!t)return;const l=await api.add({kind:'list',name:t,items:TPL[t].map(x=>({t:x,d:false}))});lists.push(l);cur=l.id;paint()};
$('#ls').onclick=e=>{const l=e.target.closest('.li');if(l){cur=l.dataset.id;paint()}};
$('#ed').onclick=async e=>{const l=cl();if(!l)return;if(e.target.dataset.rm!==undefined){l.items.splice(+e.target.dataset.rm,1);sv(l);paint()}if(e.target.hasAttribute('data-reset')){l.items.forEach(i=>i.d=false);sv(l);paint()}if(e.target.hasAttribute('data-del')){await api.del(l.id);lists=lists.filter(x=>x!==l);cur=lists[0]?.id;paint()}if(e.target.id==='ai')add()};
$('#ed').onchange=e=>{const k=e.target.dataset.k;if(k===undefined)return;const l=cl();l.items[k].d=e.target.checked;sv(l);paint()};$('#ed').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ni')add()};
function add(){const l=cl(),v=$('#ni').value.trim();if(!v)return;l.items.push({t:v,d:false});sv(l);paint();$('#ni').focus()}
api.list().then(d=>{lists=only(d,'list').sort((a,b)=>a.createdAt-b.createdAt);cur=lists[0]?.id;paint()});
</script>
