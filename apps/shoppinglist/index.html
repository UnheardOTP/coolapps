<!doctype html><meta charset="utf-8"><title>Shopping List</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:720px}.cat{margin-top:16px}.cat h2{display:flex;justify-content:space-between}.it{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}.it input{width:20px;height:20px}.it span{flex:1}.it.d span{text-decoration:line-through;color:var(--mut)}</style>
<div class="wrap"><h1>Shopping List</h1><p class="sub">Add items; they sort themselves into store sections. Tick things off as you shop.</p>
<div class="card"><div class="row" style="flex-wrap:nowrap"><div class="col"><input id="n" placeholder="Add an item, e.g. milk" autocomplete="off"></div><select id="c" style="width:150px"></select><button id="add">Add</button></div><div class="row gap"><div class="mut" id="st" style="flex:1"></div><button class="x" id="cl">Clear checked</button></div></div><div id="ls"></div></div>
<script>
const CATS=['Produce','Dairy & eggs','Meat & fish','Bakery','Frozen','Pantry','Drinks','Household','Other'];
const KW={Produce:'apple banana orange lemon lime lettuce spinach tomato onion garlic potato carrot pepper cucumber broccoli avocado berries grapes herbs mushroom celery',"Dairy & eggs":'milk cheese butter yogurt cream egg eggs',"Meat & fish":'chicken beef pork bacon sausage fish salmon tuna shrimp turkey ham mince',Bakery:'bread bagel roll buns tortilla croissant muffin',Frozen:'frozen ice pizza fries',Pantry:'rice pasta flour sugar salt oil cereal beans sauce soup spice oats honey peanut jam coffee tea',Drinks:'water juice soda beer wine cola',Household:'paper towel soap detergent sponge bags foil batteries shampoo toothpaste tissue'};
$('#c').innerHTML='<option value="">Auto</option>'+CATS.map(c=>`<option>${c}</option>`).join('');
const guess=n=>{const w=n.toLowerCase().split(/\W+/);for(const[c,k]of Object.entries(KW))if(k.split(' ').some(x=>w.includes(x)||w.includes(x+'s')))return c;return 'Other'};
let it=[];
function paint(){const open=it.filter(i=>!i.d).length;$('#st').textContent=`${open} to buy · ${it.length-open} in the cart`;$('#ls').innerHTML=CATS.map(c=>{const l=it.filter(i=>i.c===c);return l.length?`<div class="card cat"><h2>${c}<span>${l.filter(i=>!i.d).length}</span></h2>${l.sort((a,b)=>a.d-b.d||a.n.localeCompare(b.n)).map(i=>`<div class="it ${i.d?'d':''}" data-id="${i.id}"><input type="checkbox" ${i.d?'checked':''}><span>${esc(i.n)}</span><button class="x" data-rm>✕</button></div>`).join('')}</div>`:''}).join('')||'<div class="card mut">Your list is empty.</div>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n)return;it.push(await api.add({kind:'sh',n,c:$('#c').value||guess(n),d:false}));$('#n').value='';paint();$('#n').focus()};$('#n').onkeydown=e=>e.key==='Enter'&&$('#add').click();
$('#ls').onchange=e=>{const r=e.target.closest('.it');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);i.d=e.target.checked;api.upd(i.id,{d:i.d});paint()};$('#ls').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('.it').dataset.id;await api.del(id);it=it.filter(x=>x.id!==id);paint()};
$('#cl').onclick=async()=>{const gone=it.filter(i=>i.d);await Promise.all(gone.map(i=>api.del(i.id)));it=it.filter(i=>!i.d);paint()};api.list().then(d=>{it=only(d,'sh');paint()});
</script>
