<!doctype html><meta charset="utf-8"><title>Calories Burned</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#ea580c;--w:860px}</style>
<div class="wrap"><h1>Calories Burned</h1><p class="sub">Estimate the energy cost of exercise from your weight, the activity and its duration (MET method). Log a day's workouts to see the total.</p>
<div class="card"><div class="row"><div class="col"><label>Your weight</label><input id="w" type="number" step="any" value="75" data-keep></div><div class="col"><label>Unit</label><select id="u" data-keep><option>kg</option><option>lb</option></select></div></div></div>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Activity</label><select id="a"></select></div><div class="col"><label>Minutes</label><input id="m" type="number" value="30"></div><div class="kpi col"><small>Estimated burn</small><b id="est"></b></div><button id="add">Log it</button></div></div>
<div class="g3" id="kp"></div><div class="card gap"><h2>Today's log</h2><div id="ls"></div></div></div>
<script>
// Calories = MET × 3.5 ml/kg/min × weight(kg) × minutes ÷ 200  (the standard compendium formula).
const ACT=[['Walking, 3 mph (easy)',3.5],['Walking, 4 mph (brisk)',5],['Running, 5 mph (12 min/mi)',8.3],['Running, 6 mph (10 min/mi)',9.8],['Running, 7.5 mph (8 min/mi)',12.3],['Cycling, leisure (<10 mph)',4],['Cycling, moderate (12–14 mph)',8],['Cycling, vigorous (16+ mph)',12],['Swimming, laps (moderate)',5.8],['Swimming, laps (vigorous)',9.8],['Hiking',6],['Rowing machine (moderate)',7],['Elliptical',5],['Stair climbing',8.8],['Yoga',2.5],['Pilates',3],['Weight training (general)',3.5],['Weight training (vigorous)',6],['HIIT / circuit training',8],['Aerobics (general)',6.5],['Dancing',5],['Basketball (game)',8],['Soccer',7],['Tennis (singles)',8],['Golf (walking, no cart)',4.3],['Gardening',3.8],['Housework / cleaning',3.3],['Mowing the lawn',5.5],['Shoveling snow',6]];
let log=[];$('#a').innerHTML=ACT.map(([n,m],i)=>`<option value="${i}">${n} · ${m} MET</option>`).join('');
const kg=()=>num('w')*($('#u').value==='lb'?.45359237:1),burn=(i,min)=>ACT[i][1]*3.5*kg()*min/200;
function run(){$('#est').textContent=Math.round(burn($('#a').value,num('m')))+' kcal';const t=new Date().toDateString(),td=log.filter(l=>new Date(l.at).toDateString()===t),sum=td.reduce((n,l)=>n+burn(l.i,l.m),0),wk=log.filter(l=>Date.now()-l.at<7*864e5).reduce((n,l)=>n+burn(l.i,l.m),0);
  $('#kp').innerHTML=[['Today',Math.round(sum)+' kcal'],['Last 7 days',Math.round(wk)+' kcal'],['Time today',td.reduce((n,l)=>n+l.m,0)+' min']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  $('#ls').innerHTML=td.map(l=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)" data-id="${l.id}"><span class="col">${esc(ACT[l.i][0])} <span class="mut">· ${l.m} min</span></span><b>${Math.round(burn(l.i,l.m))} kcal</b><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">Nothing logged today.</span>'}
$('#add').onclick=async()=>{const m=num('m');if(m>0){log.push(await api.add({kind:'ex',i:+$('#a').value,m,at:Date.now()}));run()}};$('#ls').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('[data-id]').dataset.id;await api.del(id);log=log.filter(x=>x.id!==id);run()};
document.addEventListener('input',run);api.list().then(d=>{log=only(d,'ex');remember().then(run)});
</script>
