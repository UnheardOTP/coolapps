<!doctype html><meta charset="utf-8"><title>Image Resizer</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:1000px}#drop{border:2px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--mut);cursor:pointer}#drop.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,transparent)}.pv{max-width:100%;max-height:360px;border-radius:10px;background:repeating-conic-gradient(#8881 0 25%,transparent 0 50%) 0 0/16px 16px}</style>
<div class="wrap"><h1>Image Resizer</h1><p class="sub">Resize, convert and compress images entirely in your browser. Nothing is uploaded.</p>
<div class="card"><div id="drop">Drop an image here, or click to choose one<input type="file" id="f" accept="image/*" hidden></div></div>
<div class="card hide" id="ctl"><div class="g4"><div><label>Width (px)</label><input id="w" type="number" min="1"></div><div><label>Height (px)</label><input id="h" type="number" min="1"></div><div><label>Format</label><select id="fm"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div><label>Quality <b id="qv">85</b>%</label><input type="range" id="q" min="10" max="100" value="85"></div></div>
<div class="row gap"><label style="margin:0"><input type="checkbox" id="lk" checked> Keep aspect ratio</label><div class="chips" id="pc" style="margin:0"></div></div></div>
<div class="g2 hide" id="res"><div class="card"><h2>Original <span class="mut" id="oi"></span></h2><img class="pv" id="po"></div><div class="card"><h2>Result <span class="mut" id="ri"></span></h2><img class="pv" id="pr"><div class="row gap"><a id="dl"><button>Download</button></a></div></div></div></div>
<script>
let img=null,name='image',url=null;
const load=f=>{if(!f||!f.type.startsWith('image/'))return;name=f.name.replace(/\.[^.]+$/,'');const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{img=i;$('#w').value=i.naturalWidth;$('#h').value=i.naturalHeight;$('#po').src=r.result;$('#oi').textContent=`${i.naturalWidth}×${i.naturalHeight} · ${(f.size/1024).toFixed(0)} KB`;$('#ctl').classList.remove('hide');$('#res').classList.remove('hide');go()};i.src=r.result};r.readAsDataURL(f)};
function go(){if(!img)return;const W=Math.max(1,Math.round(num('w'))),H=Math.max(1,Math.round(num('h'))),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');if($('#fm').value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,W,H)}x.imageSmoothingQuality='high';x.drawImage(img,0,0,W,H);
  c.toBlob(b=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('#pr').src=url;const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[$('#fm').value];$('#dl').href=url;$('#dl').download=`${name}-${W}x${H}.${ext}`;$('#ri').textContent=`${W}×${H} · ${(b.size/1024).toFixed(0)} KB`},$('#fm').value,$('#q').value/100)}
$('#w').oninput=()=>{if($('#lk').checked&&img)$('#h').value=Math.round(num('w')*img.naturalHeight/img.naturalWidth);go()};$('#h').oninput=()=>{if($('#lk').checked&&img)$('#w').value=Math.round(num('h')*img.naturalWidth/img.naturalHeight);go()};$('#fm').onchange=go;$('#q').oninput=()=>{$('#qv').textContent=$('#q').value;go()};
$('#pc').innerHTML=[['25%',.25],['50%',.5],['75%',.75],['1920 wide',1920],['1280 wide',1280],['800 wide',800],['400 wide',400]].map(([n,v])=>`<span class="chip" data-v="${v}">${n}</span>`).join('');$('#pc').onclick=e=>{const v=+e.target.dataset.v;if(!v||!img)return;const w=v<=1?Math.round(img.naturalWidth*v):v;$('#w').value=w;$('#h').value=Math.round(w*img.naturalHeight/img.naturalWidth);go()};
$('#drop').onclick=()=>$('#f').click();$('#f').onchange=e=>load(e.target.files[0]);$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('on')};$('#drop').ondragleave=()=>$('#drop').classList.remove('on');$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('on');load(e.dataTransfer.files[0])};
</script>
