<!doctype html><meta charset="utf-8"><title>CSV Profiler</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:1100px}.h{display:flex;align-items:flex-end;gap:2px;height:110px;margin:8px 0}.h div{flex:1;background:var(--a);border-radius:3px 3px 0 0;min-height:2px;position:relative}.h div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:5}.col{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}.col h3{margin:0 0 4px;font-size:15px}.tp{font-size:11px;font-weight:700;color:var(--a);letter-spacing:.08em;text-transform:uppercase}</style>
<div class="wrap"><h1>CSV Profiler</h1><p class="sub">Drop in a CSV (or paste one) and get a quick profile of every column: types, missing values, statistics and distributions. Everything stays in your browser.</p>
<div class="card"><div class="row"><input type="file" id="f" accept=".csv,.tsv,.txt" style="max-width:300px"><div class="col"><label>Delimiter</label><select id="d" data-keep><option value="auto">Auto-detect</option><option value=",">Comma</option><option value=";">Semicolon</option><option value="&#9;">Tab</option><option value="|">Pipe</option></select></div></div><textarea id="in" class="gap" style="min-height:130px" data-keep placeholder="…or paste CSV here"></textarea><div class="err" id="er"></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Columns</h2><div class="g2" id="cols"></div></div><div class="card"><h2>Preview (first 20 rows)</h2><div style="overflow:auto"><table id="pv"></table></div></div></div>
<script>
function parseCSV(t,d){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===d){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x!==''))}
const detect=t=>{const l=t.split('\n').slice(0,5).join('\n');return[',',';','\t','|'].map(d=>[d,(l.match(new RegExp(d==='|'?'\\|':d,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0]};
const q=(s,p)=>{const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
const isNum=v=>v.trim()!==''&&!isNaN(Number(v.replace(/[$,%]/g,'').trim()))&&/\d/.test(v);
function profile(rows){const hdr=rows[0].map((h,i)=>h.trim()||`col${i+1}`),body=rows.slice(1);return hdr.map((h,c)=>{const vals=body.map(r=>(r[c]??'').trim()),filled=vals.filter(v=>v!==''),nums=filled.filter(isNum),numeric=filled.length&&nums.length/filled.length>=.9;
  const o={h,missing:vals.length-filled.length,uniq:new Set(filled).size,n:filled.length};if(numeric){const x=nums.map(v=>Number(v.replace(/[$,%]/g,''))).sort((a,b)=>a-b),sum=x.reduce((a,b)=>a+b,0),mean=sum/x.length,sd=Math.sqrt(x.reduce((a,v)=>a+(v-mean)**2,0)/Math.max(1,x.length-1));Object.assign(o,{t:'number',sum,mean,sd,min:x[0],max:x.at(-1),med:q(x,.5),q1:q(x,.25),q3:q(x,.75),x});
    const B=Math.min(12,Math.max(4,Math.round(Math.sqrt(x.length)))),w=(o.max-o.min)/B||1,hist=Array(B).fill(0);x.forEach(v=>hist[Math.min(B-1,Math.floor((v-o.min)/w))]++);o.hist=hist.map((c,i)=>[o.min+i*w,o.min+(i+1)*w,c])}
  else{const cnt={};filled.forEach(v=>cnt[v]=(cnt[v]||0)+1);o.t=o.uniq===filled.length&&filled.length>5?'unique id':'text';o.top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5)}return o})}
const f=v=>+v.toFixed(4)+'';
function run(){$('#er').textContent='';const t=$('#in').value;if(!t.trim()){$('#kp').innerHTML=$('#cols').innerHTML=$('#pv').innerHTML='';return}const d=$('#d').value==='auto'?detect(t):$('#d').value,rows=parseCSV(t,d);if(rows.length<2){$('#er').textContent='Need a header row and at least one data row.';return}
  const P=profile(rows),cells=(rows.length-1)*P.length,miss=P.reduce((n,p)=>n+p.missing,0);$('#kp').innerHTML=[['Rows',(rows.length-1).toLocaleString()],['Columns',P.length],['Numeric columns',P.filter(p=>p.t==='number').length],['Missing cells',`${miss.toLocaleString()} (${fmt(miss/cells*100,1)}%)`]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  $('#cols').innerHTML=P.map(p=>`<div class="col"><h3>${esc(p.h)}</h3><div class="tp">${p.t} · ${p.n.toLocaleString()} values${p.missing?` · <span class="bad">${p.missing} missing</span>`:''}</div>`+(p.t==='number'?`<div class="h">${p.hist.map(([a,b,c])=>`<div style="height:${c/Math.max(...p.hist.map(h=>h[2]))*100}%" data-t="${f(a)}–${f(b)}: ${c}"></div>`).join('')}</div><table style="font-size:13px">${[['Mean',f(p.mean)],['Median',f(p.med)],['Std dev',f(p.sd)],['Min / Max',`${f(p.min)} / ${f(p.max)}`],['Q1 / Q3',`${f(p.q1)} / ${f(p.q3)}`],['Sum',f(p.sum)]].map(([k,v])=>`<tr><td class="mut">${k}</td><td class="r">${v}</td></tr>`).join('')}</table>`:`<div class="mut" style="margin:6px 0">${p.uniq.toLocaleString()} distinct</div><table style="font-size:13px">${p.top.map(([v,n])=>`<tr><td>${esc(v.slice(0,40))}</td><td class="r">${n} <span class="mut">(${fmt(n/p.n*100,0)}%)</span></td></tr>`).join('')}</table>`)+'</div>').join('');
  $('#pv').innerHTML=`<tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`+rows.slice(1,21).map(r=>`<tr>${rows[0].map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}
$('#f').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{$('#in').value=r.result.slice(0,3e6);run();$('#in').dispatchEvent(new Event('input',{bubbles:true}))};r.readAsText(fl)};
$('#in').oninput=run;$('#d').onchange=run;remember().then(()=>{if(!$('#in').value)$('#in').value='name,dept,salary,start\nAda,Eng,120000,2019-03-01\nGrace,Eng,135000,2018-07-15\nLinus,Ops,98000,2020-01-10\nMargaret,Ops,,2021-05-20\nDennis,Eng,128000,2017-11-02\nBarbara,Design,105000,2022-02-14';run()});
</script>
