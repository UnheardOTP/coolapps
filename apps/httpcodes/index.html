<!doctype html><meta charset="utf-8"><title>HTTP Status Codes</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0891b2}.c1{--k:#64748b}.c2{--k:#16a34a}.c3{--k:#2563eb}.c4{--k:#d97706}.c5{--k:#dc2626}.code{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.code b{flex:none;width:58px;font-size:22px;color:var(--k);font-variant-numeric:tabular-nums}.code strong{display:block}.code span{color:var(--mut)}</style>
<div class="wrap"><h1>HTTP Status Codes</h1><p class="sub">A searchable reference. Click a code to pin it as a favorite.</p>
<div class="card"><div class="row"><div class="col" style="flex:3"><input id="q" placeholder="Search by code, name or meaning…" data-keep></div><div class="tabs" id="cat" style="margin:0"></div></div></div><div class="card" id="list"></div></div>
<script>
const C=[[100,'Continue','The server received the request headers; the client should send the body.'],[101,'Switching Protocols','The server is switching to the protocol requested (e.g. WebSocket).'],[103,'Early Hints','Preload hints sent before the final response.'],
[200,'OK','The request succeeded.'],[201,'Created','A new resource was created.'],[202,'Accepted','Accepted for processing, but not finished.'],[204,'No Content','Success with no body to return.'],[206,'Partial Content','Only part of the resource is returned (range request).'],
[301,'Moved Permanently','The resource has a new permanent URL.'],[302,'Found','Temporary redirect to another URL.'],[303,'See Other','Redirect to a different resource, fetched with GET.'],[304,'Not Modified','The cached copy is still valid.'],[307,'Temporary Redirect','Temporary redirect that keeps the HTTP method.'],[308,'Permanent Redirect','Permanent redirect that keeps the HTTP method.'],
[400,'Bad Request','The server could not understand the request.'],[401,'Unauthorized','Authentication is required or has failed.'],[403,'Forbidden','You are authenticated but not allowed to do this.'],[404,'Not Found','The resource does not exist.'],[405,'Method Not Allowed','The HTTP method is not supported for this resource.'],[406,'Not Acceptable','No representation matches the Accept headers.'],[408,'Request Timeout','The server timed out waiting for the request.'],[409,'Conflict','The request conflicts with the current state of the resource.'],[410,'Gone','The resource was permanently removed.'],[411,'Length Required','A Content-Length header is required.'],[412,'Precondition Failed','A precondition in the request headers was not met.'],[413,'Payload Too Large','The request body is larger than the server allows.'],[414,'URI Too Long','The URL is longer than the server will accept.'],[415,'Unsupported Media Type','The request body format is not supported.'],[418,"I'm a teapot",'Refuses to brew coffee because it is a teapot (RFC 2324).'],[422,'Unprocessable Content','The request is well-formed but semantically invalid.'],[425,'Too Early','The server is unwilling to risk processing a replayable request.'],[426,'Upgrade Required','Switch to a different protocol to continue.'],[428,'Precondition Required','The request must be conditional.'],[429,'Too Many Requests','Rate limit exceeded.'],[431,'Request Header Fields Too Large','Headers are too large.'],[451,'Unavailable For Legal Reasons','Blocked for legal reasons.'],
[500,'Internal Server Error','An unexpected error occurred on the server.'],[501,'Not Implemented','The server does not support the requested functionality.'],[502,'Bad Gateway','An upstream server returned an invalid response.'],[503,'Service Unavailable','The server is overloaded or down for maintenance.'],[504,'Gateway Timeout','An upstream server did not respond in time.'],[505,'HTTP Version Not Supported','The HTTP version is not supported.'],[507,'Insufficient Storage','The server cannot store the representation.'],[511,'Network Authentication Required','You need to authenticate to gain network access.']];
let cat='all',favs=new Set(),doc=null;
function render(){const q=$('#q').value.toLowerCase();$('#cat').innerHTML=['all','★',1,2,3,4,5].map(c=>`<button data-c="${c}" class="${String(c)===cat?'on':''}">${c==='all'?'All':c==='★'?'★ Pinned':c+'xx'}</button>`).join('');
  const l=C.filter(([c,n,d])=>(cat==='all'||(cat==='★'?favs.has(c):String(c)[0]===cat))&&(!q||`${c} ${n} ${d}`.toLowerCase().includes(q)));
  $('#list').innerHTML=l.map(([c,n,d])=>`<div class="code c${String(c)[0]}" data-c="${c}" style="cursor:pointer"><b>${c}</b><div><strong>${esc(n)} ${favs.has(c)?'★':''}</strong><span>${esc(d)}</span></div></div>`).join('')||'<span class="mut">No matching codes.</span>'}
$('#cat').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};$('#q').oninput=render;
$('#list').onclick=async e=>{const r=e.target.closest('.code');if(!r)return;const c=+r.dataset.c;favs.has(c)?favs.delete(c):favs.add(c);render();const f=[...favs];if(doc)api.upd(doc.id,{f});else doc=await api.add({kind:'favs',f})};
api.list().then(d=>{doc=d.find(x=>x.kind==='favs')||null;if(doc)favs=new Set(doc.f);remember().then(render)});
</script>
