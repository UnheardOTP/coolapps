<!doctype html><meta charset="utf-8"><title>Score Keeper</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#f59e0b;--w:1000px}td input{width:78px;text-align:center;padding:7px 4px}th input{font-weight:700;text-align:center;min-width:90px}tr.tot td{font-weight:800;font-size:18px;border-top:2px solid var(--fg)}td.lead{background:color-mix(in srgb,var(--a) 22%,transparent)}.crown{font-size:14px}</style>
<div class="wrap"><h1>Score Keeper</h1><p class="sub">Running totals for card games, board games and quiz nights. Add players, add rounds, and the leader is highlighted.</p>
<div class="card"><div style="overflow:auto"><table id="tb"></table></div><div class="row gap"><button id="ar">+ Round</button><button class="s" id="ap">+ Player</button><button class="s" id="rp">− Player</button><label style="margin:0 0 0 10px"><input type="checkbox" id="lw" data-keep> lowest score wins</label><input id="gn" placeholder="Game name (for saving)" style="max-width:200px;margin-left:auto"><button class="s" id="fin">Finish &amp; save game</button><button class="x" id="rs">New game</button></div></div>
<div class="card"><h2>Finished games</h2><div id="hs"></div></div></div>
<script>
let G={players:['Player 1','Player 2','Player 3'],rounds:[[0,0,0]]},hist=[];
const tot=()=>G.players.map((_,i)=>G.rounds.reduce((n,r)=>n+(+r[i]||0),0));
function leader(t){const v=$('#lw').checked?Math.min(...t):Math.max(...t);return t.map(x=>x===v&&G.rounds.some(r=>r.some(c=>+c)))}
function table(){const t=tot(),L=leader(t);$('#tb').innerHTML=`<tr><th></th>${G.players.map((p,i)=>`<th><input data-p="${i}" value="${esc(p)}"></th>`).join('')}</tr>`+G.rounds.map((r,ri)=>`<tr><td class="mut">R${ri+1}</td>${G.players.map((_,i)=>`<td><input type="number" data-r="${ri}" data-c="${i}" value="${r[i]??0}"></td>`).join('')}<td><button class="x" data-rr="${ri}">✕</button></td></tr>`).join('')+`<tr class="tot"><td>Total</td>${t.map((x,i)=>`<td class="r ${L[i]?'lead':''}" style="text-align:center">${x}${L[i]?' <span class="crown">👑</span>':''}</td>`).join('')}</tr>`;KV.save({G,lw:$('#lw').checked})}
function totals(){const t=tot(),L=leader(t),cells=document.querySelectorAll('tr.tot td:not(:first-child)');cells.forEach((c,i)=>{c.className='r '+(L[i]?'lead':'');c.style.textAlign='center';c.innerHTML=t[i]+(L[i]?' <span class="crown">👑</span>':'')});KV.save({G,lw:$('#lw').checked})}
$('#tb').oninput=e=>{const d=e.target.dataset;if(d.p!==undefined)G.players[d.p]=e.target.value;else if(d.r!==undefined)G.rounds[d.r][d.c]=parseFloat(e.target.value)||0;totals()};$('#tb').onclick=e=>{const r=e.target.dataset.rr;if(r!==undefined&&G.rounds.length>1){G.rounds.splice(+r,1);table()}};
$('#ar').onclick=()=>{G.rounds.push(G.players.map(()=>0));table()};$('#ap').onclick=()=>{if(G.players.length<10){G.players.push('Player '+(G.players.length+1));G.rounds.forEach(r=>r.push(0));table()}};$('#rp').onclick=()=>{if(G.players.length>1){G.players.pop();G.rounds.forEach(r=>r.pop());table()}};$('#lw').onchange=totals;
$('#rs').onclick=()=>{if(confirm('Clear all scores?')){G.rounds=[G.players.map(()=>0)];table()}};
$('#fin').onclick=async()=>{const t=tot(),L=leader(t),win=G.players.filter((_,i)=>L[i]);hist.unshift(await api.add({kind:'game',name:$('#gn').value.trim()||'Game',players:[...G.players],totals:t,win,rounds:G.rounds.length}));$('#gn').value='';G.rounds=[G.players.map(()=>0)];table();paint()};
function paint(){$('#hs').innerHTML=hist.slice(0,15).map(h=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)" data-id="${h.id}"><div class="col"><b>${esc(h.name)}</b> <span class="mut">${new Date(h.createdAt).toLocaleDateString()} · ${h.rounds} rounds</span><div class="mut">${h.players.map((p,i)=>`${esc(p)} ${h.totals[i]}`).join(' · ')}</div></div><b>🏆 ${esc(h.win.join(', '))}</b><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">No finished games yet.</span>'}
$('#hs').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('[data-id]').dataset.id;await api.del(id);hist=hist.filter(x=>x.id!==id);paint()};
api.list().then(async d=>{hist=only(d,'game');const s=await KV.load();if(s.G){G=s.G;$('#lw').checked=!!s.lw}table();paint()});
</script>
