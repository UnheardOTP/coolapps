<!doctype html><meta charset="utf-8"><title>Fraction Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#c026d3;--w:760px}.fr{display:inline-flex;flex-direction:column;align-items:center;gap:2px}.fr input{width:72px;text-align:center;font-size:20px}.fr hr{width:100%;border:none;border-top:2px solid var(--fg);margin:0}.eq{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}.eq select{width:70px;font-size:22px;text-align:center}.res{font-size:30px;font-weight:700;color:var(--a)}.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 4px}</style>
<div class="wrap"><h1>Fraction Calculator</h1><p class="sub">Add, subtract, multiply and divide fractions, with the answer simplified and as a mixed number and decimal.</p>
<div class="card"><div class="eq"><div class="fr"><input id="n1" type="number" value="3" data-keep><hr><input id="d1" type="number" value="4" data-keep></div><select id="op" data-keep><option>+</option><option>−</option><option>×</option><option>÷</option></select><div class="fr"><input id="n2" type="number" value="5" data-keep><hr><input id="d2" type="number" value="6" data-keep></div><span style="font-size:28px">=</span><div class="res" id="r"></div></div><div class="err" id="er" style="text-align:center"></div><div class="g3 gap" id="kp"></div></div>
<div class="card"><h2>Decimal → fraction</h2><div class="row"><div class="col"><input id="dec" type="number" step="any" value="0.375" data-keep></div><div class="kpi col"><small>Closest simple fraction</small><b id="df"></b></div></div></div></div>
<script>
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const simp=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]};
const show=(n,d)=>d===1?`${n}`:`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const mixed=(n,d)=>{if(d===1||Math.abs(n)<d)return null;const w=Math.trunc(n/d),r=Math.abs(n)%d;return r?`${w} ${r}/${d}`:null};
function run(){$('#er').textContent='';const[n1,d1,n2,d2]=['n1','d1','n2','d2'].map(num);if(!d1||!d2||!Number.isInteger(n1+d1+n2+d2)){$('#r').textContent='';$('#kp').innerHTML='';$('#er').textContent=!d1||!d2?'Denominators cannot be zero':'Use whole numbers';return}
  let n,d;switch($('#op').value){case'+':n=n1*d2+n2*d1;d=d1*d2;break;case'−':n=n1*d2-n2*d1;d=d1*d2;break;case'×':n=n1*n2;d=d1*d2;break;default:if(!n2){$('#er').textContent='Cannot divide by zero';return}n=n1*d2;d=d1*n2}
  [n,d]=simp(n,d);$('#r').innerHTML=show(n,d);$('#kp').innerHTML=[['Decimal',+(n/d).toFixed(8)+''],['Mixed number',mixed(n,d)||'—'],['Percent',+(n/d*100).toFixed(4)+'%']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join('');
  const x=num('dec');let best=[Math.round(x),1];for(let q=1;q<=1000;q++){const p=Math.round(x*q);if(Math.abs(p/q-x)<Math.abs(best[0]/best[1]-x)-1e-12)best=[p,q];if(Math.abs(p/q-x)<1e-9)break}const[a,b]=simp(best[0],best[1]);$('#df').textContent=`${a}/${b}`+(Math.abs(a/b-x)>1e-9?` (≈ ${+(a/b).toFixed(6)})`:'')}
document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
