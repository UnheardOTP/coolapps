<!doctype html><meta charset="utf-8"><title>Mortgage Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#7c3aed;--w:960px}.stack{display:flex;height:34px;border-radius:9px;overflow:hidden;margin:8px 0}.stack div{height:100%}.lg span{margin-right:16px;white-space:nowrap}</style>
<div class="wrap"><h1>Mortgage Calculator</h1><p class="sub">Full monthly cost: principal and interest plus taxes, insurance and fees — and what income it takes.</p>
<div class="card"><div class="g4"><div><label>Home price ($)</label><input id="hp" type="number" value="450000" data-keep></div><div><label>Down payment (%)</label><input id="dp" type="number" value="20" step="0.5" data-keep></div><div><label>Rate (% APR)</label><input id="r" type="number" value="6.75" step="0.01" data-keep></div><div><label>Term (years)</label><select id="y" data-keep><option>30</option><option>20</option><option>15</option><option>10</option></select></div>
<div><label>Property tax (%/yr)</label><input id="pt" type="number" value="1.2" step="0.05" data-keep></div><div><label>Insurance ($/yr)</label><input id="ins" type="number" value="1500" data-keep></div><div><label>HOA ($/mo)</label><input id="hoa" type="number" value="0" data-keep></div><div><label>PMI (%/yr if &lt;20% down)</label><input id="pmi" type="number" value="0.6" step="0.05" data-keep></div></div></div>
<div class="card"><div class="mut">Estimated monthly payment</div><div class="big" id="tot"></div><div class="stack" id="st"></div><div class="lg" id="lg"></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Affordability (28% rule)</h2><div class="row"><div class="col"><label>Gross annual income ($)</label><input id="inc" type="number" value="120000" data-keep></div><div class="kpi col"><small>Housing as % of income</small><b id="pct"></b></div><div class="kpi col"><small>Income needed at 28%</small><b id="need"></b></div></div></div><div class="card"><h2>Saved scenarios</h2><div id="sv"></div></div></div>
<script>
function run(){const hp=num('hp'),dpp=num('dp'),r=num('r')/1200,n=+$('#y').value*12,down=hp*dpp/100,L=hp-down,pi=r?L*r/(1-(1+r)**-n):L/n,tax=hp*num('pt')/1200,ins=num('ins')/12,hoa=num('hoa'),pmi=dpp<20?L*num('pmi')/1200:0,tot=pi+tax+ins+hoa+pmi;
  $('#tot').textContent=money(tot);const parts=[['Principal & interest',pi,'#7c3aed'],['Property tax',tax,'#0ea5e9'],['Insurance',ins,'#22c55e'],['HOA',hoa,'#f59e0b'],['PMI',pmi,'#ef4444']].filter(x=>x[1]>0);
  $('#st').innerHTML=parts.map(([,v,c])=>`<div style="width:${v/tot*100}%;background:${c}"></div>`).join('');$('#lg').innerHTML=parts.map(([k,v,c])=>`<span><b style="color:${c}">■</b> ${k} ${money(v)}</span>`).join('');
  const total=pi*n;$('#kp').innerHTML=[['Down payment',money(down)],['Loan amount',money(L)],['Total interest',money(total-L)],['Total of payments',money(total)]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  const inc=num('inc');$('#pct').textContent=inc?fmt(tot*12/inc*100,1)+'%':'–';$('#need').textContent=money(tot*12/.28)}
document.addEventListener('input',run);const ids=['hp','dp','r','y','pt','ins','hoa','pmi','inc'];savedBar($('#sv'),{get:()=>Object.fromEntries(ids.map(i=>[i,$('#'+i).value])),set:d=>{ids.forEach(i=>$('#'+i).value=d[i]);run()}});remember().then(run);
</script>
