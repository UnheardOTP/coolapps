<!doctype html><meta charset="utf-8"><title>Pack It</title><script src="/shared/lib.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e8f1f5;color:#17323f;font-family:'Avenir Next','Helvetica Neue',system-ui;padding:30px 40px}header{display:flex;align-items:center;gap:30px;margin-bottom:22px}h1{margin:0;font-size:34px}.all{margin-left:auto;text-align:right}.all b{font-size:34px;font-weight:300}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.c{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px #17323f14}.top{display:flex;align-items:center;gap:14px;margin-bottom:10px}svg{width:56px;height:56px;transform:rotate(-90deg)}.top h2{margin:0;font-size:17px}.top small{color:#6c8a99}
.it{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;border-bottom:1px solid #eef2f4}.it input{accent-color:#2a9d8f;width:18px;height:18px}.it.d span{text-decoration:line-through;color:#9ab}.it i{margin-left:auto;font-style:normal;color:#ccc;cursor:pointer}form input{width:100%;margin-top:10px;border:none;background:#f1f6f8;padding:8px 10px;border-radius:8px;font:inherit;outline:none}</style>
<header><h1>Pack It</h1><div class="all"><b id="pc">0%</b><div id="pn" style="color:#6c8a99"></div></div></header><div class="grid" id="g"></div>
<script>
const CATS={Clothes:'#e76f51',Toiletries:'#2a9d8f',Tech:'#457b9d',Documents:'#e9a23b',Other:'#8e6bb8'},SEED={Clothes:['T-shirts','Jeans','Socks','Jacket'],Toiletries:['Toothbrush','Shampoo','Sunscreen'],Tech:['Phone charger','Headphones','Power bank'],Documents:['Passport','Tickets','Insurance'],Other:['Water bottle','Book']};let items=[];
function render(){const t=items.length,d=items.filter(i=>i.done).length;$('#pc').textContent=(t?Math.round(d/t*100):0)+'%';$('#pn').textContent=`${d} of ${t} packed`;
$('#g').innerHTML=Object.entries(CATS).map(([k,c])=>{const li=items.filter(i=>i.cat===k),dn=li.filter(i=>i.done).length,f=li.length?dn/li.length:0,C=2*Math.PI*22;
return`<div class="c"><div class="top"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="#e6edf0" stroke-width="7"/><circle cx="28" cy="28" r="22" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/></svg><div><h2>${k}</h2><small>${dn}/${li.length}</small></div></div>
${li.map(i=>`<label class="it ${i.done?'d':''}" data-id="${i.id}"><input type="checkbox" ${i.done?'checked':''}><span>${esc(i.text)}</span><i data-del>✕</i></label>`).join('')}<form data-k="${k}"><input placeholder="+ add item"></form></div>`}).join('')}
document.addEventListener('change',e=>{const l=e.target.closest('.it');if(!l)return;const i=items.find(x=>x.id===l.dataset.id);i.done=e.target.checked;api.upd(i.id,{done:i.done});render()});
document.addEventListener('click',async e=>{if(!e.target.hasAttribute('data-del'))return;e.preventDefault();const id=e.target.closest('.it').dataset.id;await api.del(id);items=items.filter(i=>i.id!==id);render()});
document.addEventListener('submit',async e=>{e.preventDefault();const v=e.target.querySelector('input').value.trim();if(v){items.push(await api.add({cat:e.target.dataset.k,text:v,done:false}));render()}});
api.list().then(async d=>{items=d;if(!d.length)for(const[k,l]of Object.entries(SEED))for(const t of l)items.push(await api.add({cat:k,text:t,done:false}));items.sort((a,b)=>a.createdAt-b.createdAt);render()});
</script>
