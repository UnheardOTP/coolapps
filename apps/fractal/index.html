<!doctype html><meta charset="utf-8"><title>Fractal Explorer</title>
<script src="/shared/lib.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #05080f; color: #b9d4e8; font-family: 'Inter', system-ui, sans-serif; display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 28px; }
  canvas { display: block; cursor: grab; border: 1px solid #1c3550; box-shadow: 0 0 60px #1fb6ff22; } canvas.d { cursor: grabbing; } .side { width: 260px; } h1 { margin: 0 0 4px; font-weight: 200; font-size: 30px; letter-spacing: .3em; text-transform: uppercase; color: #fff; } .sub { color: #5f7f99; font-size: 13px; margin: 0 0 20px; }
  label { display: block; margin: 16px 0 6px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #5f7f99; } input[type=range] { width: 100%; accent-color: #1fb6ff; } .pal { display: flex; gap: 6px; } .pal button { flex: 1; height: 26px; border: 2px solid transparent; cursor: pointer; border-radius: 4px; } .pal button.on { border-color: #fff; }
  button.a { font: inherit; background: #1fb6ff; color: #04121c; border: none; padding: 9px 14px; font-weight: 700; border-radius: 6px; cursor: pointer; margin-right: 6px; } button.g { background: #0f2538; color: #b9d4e8; } #info { font: 11px monospace; color: #5f7f99; margin-top: 10px; word-break: break-all; }
  #gal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; } .t { position: relative; cursor: pointer; } .t img { width: 100%; display: block; border: 1px solid #1c3550; } .t img:hover { border-color: #1fb6ff; } .t b { position: absolute; top: 2px; right: 4px; opacity: 0; font-size: 12px; } .t:hover b { opacity: 1; }
  #prog { height: 3px; background: #1fb6ff; width: 0; position: fixed; top: 0; left: 0; transition: width .1s; }
</style>
<div id="prog"></div>
<canvas id="c" width="720" height="480"></canvas>
<div class="side"><h1>Fractal</h1><p class="sub">Scroll to zoom · drag to pan · double-click to dive in</p>
  <label>Detail <span id="iv"></span></label><input type="range" id="it" min="0" max="3" step="1" value="1">
  <label>Palette</label><div class="pal" id="pal"></div>
  <div style="margin-top:20px"><button class="a" id="save">Save view</button><button class="a g" id="home">Reset</button></div><div id="info"></div>
  <label>Bookmarks</label><div id="gal"></div></div>
<script>
const cv = $('#c'), g = cv.getContext('2d'), W = 720, H = 480;
const PALS = [['Fire', 'linear-gradient(90deg,#000,#c0392b,#f39c12,#fff)', t => [255 * Math.min(1, t * 2.2), 255 * Math.max(0, t * 2 - .5), 255 * Math.max(0, t * 3 - 2)]],
  ['Ice', 'linear-gradient(90deg,#001,#1f6fb2,#9fe6ff,#fff)', t => [255 * Math.max(0, t * 2 - 1), 255 * Math.min(1, t * 1.6), 255 * Math.min(1, .3 + t * 1.4)]],
  ['Neon', 'linear-gradient(90deg,#f0f,#0ff,#ff0,#f0f)', t => hsl(t * 3 % 1 * 360, .9, .55)], ['Mono', 'linear-gradient(90deg,#000,#fff)', t => [255 * t, 255 * t, 255 * t]]];
function hsl(h, s, l) { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0) * 255, f(8) * 255, f(4) * 255]; }
const HOME = { cx: -.55, cy: 0, sc: 3.4 / W }; let v = { ...HOME }, pal = 0, detail = 1, token = 0, saved = [];
// Render in row-chunks so the UI stays responsive; a newer render cancels an older one via `token`.
function render() {
  const my = ++token, iters = Math.round((140 + 55 * Math.log2(HOME.sc / v.sc)) * [.6, 1, 1.8, 3][detail]), img = g.createImageData(W, H), f = PALS[pal][2]; let y = 0;
  $('#iv').textContent = iters + ' iter'; $('#info').textContent = `center ${v.cx.toPrecision(12)}, ${v.cy.toPrecision(12)}\nzoom ×${(HOME.sc / v.sc).toExponential(2)}`.replace('\n', ' · ');
  (function chunk() {
    if (my !== token) return;
    for (const end = Math.min(H, y + 16); y < end; y++) for (let x = 0; x < W; x++) {
      const cr = v.cx + (x - W / 2) * v.sc, ci = v.cy + (y - H / 2) * v.sc; let zr = 0, zi = 0, i = 0, r2 = 0;
      if ((cr + 1) ** 2 + ci * ci < .0625 || ((cr - .25) ** 2 + ci * ci) * (((cr - .25) ** 2 + ci * ci) + (cr - .25)) < .25 * ci * ci) i = iters;          // inside main cardioid / period-2 bulb
      else for (; i < iters && (r2 = zr * zr + zi * zi) < 256; i++) { const t = zr * zr - zi * zi + cr; zi = 2 * zr * zi + ci; zr = t; }
      const o = (y * W + x) * 4; if (i >= iters) { img.data[o + 3] = 255; continue; }
      const sm = (i + 1 - Math.log2(Math.log2(r2 || 4))) / iters, c = f(Math.pow(Math.max(0, Math.min(1, sm * 6)), .6));
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
    g.putImageData(img, 0, 0); $('#prog').style.width = (y / H * 100) + '%'; if (y < H) setTimeout(chunk); else setTimeout(() => $('#prog').style.width = 0, 200);
  })();
}
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = pos(e), k = e.deltaY < 0 ? .7 : 1 / .7, wx = v.cx + (x - W / 2) * v.sc, wy = v.cy + (y - H / 2) * v.sc; v.sc *= k; v.cx = wx - (x - W / 2) * v.sc; v.cy = wy - (y - H / 2) * v.sc; clearTimeout(cv.t); cv.t = setTimeout(render, 120); }, { passive: false });
let drag = null; cv.onmousedown = e => { drag = { p: pos(e), c: { ...v }, snap: g.getImageData(0, 0, W, H) }; cv.classList.add('d'); };
addEventListener('mousemove', e => { if (!drag) return; const [x, y] = pos(e), dx = x - drag.p[0], dy = y - drag.p[1]; g.fillStyle = '#05080f'; g.fillRect(0, 0, W, H); g.putImageData(drag.snap, dx, dy); v.cx = drag.c.cx - dx * v.sc; v.cy = drag.c.cy - dy * v.sc; });
addEventListener('mouseup', () => { if (drag) { drag = null; cv.classList.remove('d'); render(); } });
cv.ondblclick = e => { const [x, y] = pos(e); v.cx += (x - W / 2) * v.sc; v.cy += (y - H / 2) * v.sc; v.sc *= .4; render(); };
$('#pal').innerHTML = PALS.map((p, i) => `<button data-i="${i}" title="${p[0]}" class="${i === pal ? 'on' : ''}" style="background:${p[1]}"></button>`).join('');
$('#pal').onclick = e => { if (e.target.dataset.i) { pal = +e.target.dataset.i; document.querySelectorAll('#pal button').forEach((b, i) => b.classList.toggle('on', i === pal)); render(); } };
$('#it').oninput = e => { detail = +e.target.value; render(); }; $('#home').onclick = () => { v = { ...HOME }; render(); };
$('#save').onclick = async () => { const t = document.createElement('canvas'); t.width = 240; t.height = 160; t.getContext('2d').drawImage(cv, 0, 0, 240, 160); saved.unshift(await api.add({ v: { ...v }, pal, detail, img: t.toDataURL('image/jpeg', .8) })); gal(); };
const gal = () => $('#gal').innerHTML = saved.map(s => `<div class="t" data-id="${s.id}"><img src="${s.img}"><b data-del>✕</b></div>`).join('');
$('#gal').onclick = async e => { const t = e.target.closest('.t'); if (!t) return; const s = saved.find(x => x.id === t.dataset.id); if (e.target.hasAttribute('data-del')) { await api.del(s.id); saved = saved.filter(x => x !== s); gal(); } else { v = { ...s.v }; pal = s.pal; detail = s.detail; $('#it').value = detail; document.querySelectorAll('#pal button').forEach((b, i) => b.classList.toggle('on', i === pal)); render(); } };
api.list().then(d => { saved = d; gal(); }); render();
</script>
