<!doctype html><meta charset="utf-8"><title>Contacts</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0d9488;--w:1000px}.app{display:grid;grid-template-columns:330px 1fr;gap:16px}.side{max-height:72vh;overflow:auto}.c{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}.c:hover{background:var(--soft)}.c.on{background:color-mix(in srgb,var(--a) 14%,transparent)}.av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}.c small{color:var(--mut);display:block}.ltr{font-size:11px;color:var(--mut);padding:8px 10px 2px;letter-spacing:.1em}@media(max-width:760px){.app{grid-template-columns:1fr}}</style>
<div class="wrap"><h1>Contacts</h1><p class="sub">A simple address book with search and vCard export.</p>
<div class="app"><div class="card side"><div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><input id="q" placeholder="Search…"><button id="new">+</button></div><div id="ls"></div></div><div class="card" id="ed"></div></div></div>
<script>
let cs=[],cur=null;const F=[['name','Name'],['phone','Phone'],['email','Email'],['company','Company'],['address','Address'],['notes','Notes']];
const col=s=>`hsl(${[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360},50%,45%)`;
function paint(){const q=$('#q').value.toLowerCase(),l=cs.filter(c=>!q||F.some(([k])=>(c[k]||'').toLowerCase().includes(q))).sort((a,b)=>(a.name||'').localeCompare(b.name||''));let last='';
  $('#ls').innerHTML=l.map(c=>{const L=(c.name||'#')[0].toUpperCase(),h=L!==last?`<div class="ltr">${L}</div>`:'';last=L;return h+`<div class="c ${c.id===cur?'on':''}" data-id="${c.id}"><div class="av" style="background:${col(c.name||'?')}">${esc(L)}</div><div><b>${esc(c.name||'Unnamed')}</b><small>${esc(c.phone||c.email||c.company||'')}</small></div></div>`}).join('')||'<span class="mut">No contacts.</span>';
  const c=cs.find(x=>x.id===cur);$('#ed').innerHTML=c?`<div class="g2">${F.slice(0,4).map(([k,l])=>`<div><label>${l}</label><input data-k="${k}" value="${esc(c[k]||'')}" ${k==='email'?'type="email"':''}></div>`).join('')}</div><label class="gap">Address</label><input data-k="address" value="${esc(c.address||'')}"><label class="gap">Notes</label><textarea data-k="notes">${esc(c.notes||'')}</textarea><div class="row gap"><button class="s" id="vc">Export vCard</button><span class="mut" id="sv"></span><button class="x right" id="dl">Delete</button></div>`:'<div class="mut">Select a contact or add a new one.</div>'}
let t;$('#ed').oninput=e=>{const k=e.target.dataset.k;if(!k)return;const c=cs.find(x=>x.id===cur);c[k]=e.target.value;if($('#sv'))$('#sv').textContent='saving…';clearTimeout(t);t=setTimeout(async()=>{await api.upd(c.id,{[k]:c[k]});if($('#sv'))$('#sv').textContent='saved';const sel=$('#ls');paintList()},500)};
function paintList(){const keep=document.activeElement,id=keep?.dataset?.k;paint0()}
const paint0=()=>{const q=$('#q').value.toLowerCase();document.querySelectorAll('.c').forEach(el=>{const c=cs.find(x=>x.id===el.dataset.id);el.querySelector('b').textContent=c.name||'Unnamed';el.querySelector('small').textContent=c.phone||c.email||c.company||''})};
$('#ls').onclick=e=>{const c=e.target.closest('.c');if(c){cur=c.dataset.id;paint()}};$('#q').oninput=paint;$('#new').onclick=async()=>{const c=await api.add({kind:'ct',name:'New contact'});cs.push(c);cur=c.id;$('#q').value='';paint()};
$('#ed').onclick=async e=>{const c=cs.find(x=>x.id===cur);if(e.target.id==='dl'){await api.del(c.id);cs=cs.filter(x=>x!==c);cur=null;paint()}if(e.target.id==='vc'){const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${c.name||''}\nORG:${c.company||''}\nTEL:${c.phone||''}\nEMAIL:${c.email||''}\nADR:;;${c.address||''};;;;\nNOTE:${(c.notes||'').replace(/\n/g,'\\n')}\nEND:VCARD\n`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=(c.name||'contact')+'.vcf';a.click()}};
api.list().then(d=>{cs=only(d,'ct');cur=cs[0]?.id;paint()});
</script>
