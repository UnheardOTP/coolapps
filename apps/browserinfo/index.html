<!doctype html><meta charset="utf-8"><title>Browser Info</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0d9488;--w:860px}</style>
<div class="wrap"><h1>Browser Info</h1><p class="sub">What your browser tells every website: screen, locale, capabilities. Nothing leaves this page.</p>
<div class="row" style="margin-bottom:12px"><button id="cp">Copy all as JSON</button><button class="s" id="rf">Refresh</button></div><div id="out"></div></div>
<script>
function info(){const n=navigator,s=screen,m=q=>matchMedia(q).matches,i=Intl.DateTimeFormat().resolvedOptions(),c=document.createElement('canvas'),gl=c.getContext('webgl'),dbg=gl&&gl.getExtension('WEBGL_debug_renderer_info');
  return{'Browser':{'User agent':n.userAgent,'Platform':n.userAgentData?.platform||n.platform,'Languages':(n.languages||[n.language]).join(', '),'Cookies enabled':n.cookieEnabled,'Do Not Track':n.doNotTrack??'unset','Online':n.onLine,'Secure context':isSecureContext},
  'Screen & window':{'Screen':`${s.width} × ${s.height}`,'Available':`${s.availWidth} × ${s.availHeight}`,'Viewport':`${innerWidth} × ${innerHeight}`,'Pixel ratio':devicePixelRatio,'Color depth':s.colorDepth+'-bit','Orientation':s.orientation?.type||'—'},
  'Locale & time':{'Time zone':i.timeZone,'UTC offset':'UTC'+(-new Date().getTimezoneOffset()>=0?'+':'−')+Math.abs(new Date().getTimezoneOffset()/60),'Locale':i.locale,'Calendar':i.calendar,'Number sample':(1234567.891).toLocaleString(),'Date sample':new Date().toLocaleDateString()},
  'Hardware':{'CPU threads':n.hardwareConcurrency??'—','Device memory':n.deviceMemory?n.deviceMemory+' GB':'—','Touch points':n.maxTouchPoints,'GPU':dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'hidden','Connection':n.connection?`${n.connection.effectiveType||'?'} · ${n.connection.downlink||'?'} Mbps`:'—'},
  'Preferences':{'Dark mode':m('(prefers-color-scheme: dark)'),'Reduced motion':m('(prefers-reduced-motion: reduce)'),'High contrast':m('(prefers-contrast: more)'),'Hover capable':m('(hover: hover)'),'Fine pointer':m('(pointer: fine)'),'Standalone app':m('(display-mode: standalone)')},
  'APIs':Object.fromEntries([['WebGL',!!gl],['WebGL2',!!document.createElement('canvas').getContext('webgl2')],['Web Audio',!!(window.AudioContext||window.webkitAudioContext)],['Service workers','serviceWorker' in n],['Clipboard','clipboard' in n],['Geolocation','geolocation' in n],['Notifications','Notification' in window],['WebAssembly',typeof WebAssembly==='object'],['IndexedDB','indexedDB' in window],['WebRTC','RTCPeerConnection' in window],['Bluetooth','bluetooth' in n],['Vibration','vibrate' in n]])}}
async function run(){const d=info();try{const e=await navigator.storage?.estimate();if(e)d['Hardware']['Storage quota']=`${(e.quota/1e9).toFixed(1)} GB (${(e.usage/1e6).toFixed(1)} MB used)`}catch{}
  window.__d=d;$('#out').innerHTML=Object.entries(d).map(([g,o])=>`<div class="card"><h2>${g}</h2><table>${Object.entries(o).map(([k,v])=>`<tr><td class="mut" style="width:180px">${k}</td><td class="mono" style="word-break:break-all">${typeof v==='boolean'?(v?'<span class="ok">✓ yes</span>':'<span class="mut">✗ no</span>'):esc(String(v))}</td></tr>`).join('')}</table></div>`).join('')}
$('#cp').onclick=e=>copy(JSON.stringify(window.__d,null,2),e.target);$('#rf').onclick=run;addEventListener('resize',()=>run());run();
</script>
