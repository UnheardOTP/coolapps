<!doctype html><meta charset="utf-8"><title>Markdown Table Maker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#475569;--w:980px}td input,th input{padding:6px 8px;min-width:110px}th input{font-weight:700}</style>
<div class="wrap" style="max-width:980px"><h1>Markdown Table Maker</h1><p class="sub">Edit a grid (or paste from a spreadsheet), choose alignment, and copy a neatly padded Markdown table.</p>
<div class="card"><div style="overflow:auto"><table id="g"></table></div><div class="row gap"><button class="s" id="ar">+ Row</button><button class="s" id="ac">+ Column</button><button class="s" id="rr">− Row</button><button class="s" id="rc">− Column</button><span class="mut">Tip: paste tab- or comma-separated data into any cell.</span></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Markdown</h2><button class="x right" id="cp">Copy</button></div><div class="out" id="md"></div></div><div class="card"><h2>Saved tables</h2><div id="sv"></div></div></div>
<script>
let T=[['Name','Role','Score'],['Ada','Engineer','98'],['Linus','Maintainer','95']],AL=['l','l','r'];
const pad=(s,w,a)=>a==='r'?s.padStart(w):a==='c'?s.padStart(Math.floor((w+s.length)/2)).padEnd(w):s.padEnd(w);
function md(){const W=T[0].map((_,c)=>Math.max(3,...T.map(r=>(r[c]||'').length))),row=r=>'| '+W.map((w,c)=>pad((r[c]||'').replace(/\|/g,'\\|'),w,AL[c])).join(' | ')+' |',sep='| '+W.map((w,c)=>AL[c]==='c'?':'+'-'.repeat(w-2)+':':AL[c]==='r'?'-'.repeat(w-1)+':':':'+'-'.repeat(w-1)).join(' | ')+' |';return[row(T[0]),sep,...T.slice(1).map(row)].join('\n')}
function paint(){$('#g').innerHTML='<tr>'+T[0].map((_,c)=>`<th style="font-weight:400"><select data-a="${c}" style="width:auto;padding:3px">${['l','c','r'].map(x=>`<option value="${x}" ${AL[c]===x?'selected':''}>${{l:'⟵ left',c:'↔ center',r:'right ⟶'}[x]}</option>`).join('')}</select></th>`).join('')+'</tr>'+T.map((r,i)=>`<tr>${r.map((v,c)=>`<${i?'td':'th'}><input data-r="${i}" data-c="${c}" value="${esc(v)}"></${i?'td':'th'}>`).join('')}</tr>`).join('');out()}
const out=()=>{$('#md').textContent=md();KV.save({T,AL})};
$('#g').oninput=e=>{const t=e.target;if(t.dataset.r!==undefined){T[t.dataset.r][t.dataset.c]=t.value;out()}};$('#g').onchange=e=>{if(e.target.dataset.a!==undefined){AL[e.target.dataset.a]=e.target.value;out()}};
$('#g').onpaste=e=>{const txt=e.clipboardData.getData('text');if(!/[\t\n]/.test(txt)&&!txt.includes(','))return;e.preventDefault();const rows=txt.trim().split(/\r?\n/).map(l=>l.split(l.includes('\t')?'\t':','));const w=Math.max(...rows.map(r=>r.length));T=rows.map(r=>Array.from({length:w},(_,i)=>(r[i]||'').trim()));AL=Array.from({length:w},(_,i)=>AL[i]||'l');paint()};
$('#ar').onclick=()=>{T.push(T[0].map(()=>''));paint()};$('#ac').onclick=()=>{T.forEach(r=>r.push(''));AL.push('l');paint()};$('#rr').onclick=()=>{if(T.length>2){T.pop();paint()}};$('#rc').onclick=()=>{if(T[0].length>1){T.forEach(r=>r.pop());AL.pop();paint()}};$('#cp').onclick=e=>copy($('#md').textContent,e.target);
savedBar($('#sv'),{get:()=>({T:JSON.parse(JSON.stringify(T)),AL:[...AL]}),set:d=>{T=JSON.parse(JSON.stringify(d.T));AL=[...d.AL];paint()}});KV.load().then(s=>{if(s.T){T=s.T;AL=s.AL}paint()});paint();
</script>
