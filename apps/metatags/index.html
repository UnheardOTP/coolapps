<!doctype html><meta charset="utf-8"><title>Meta Tag Generator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:1100px}.serp{background:#fff;color:#202124;border-radius:10px;padding:16px;font-family:Arial,sans-serif}.serp .u{color:#4d5156;font-size:13px}.serp .t{color:#1a0dab;font-size:20px;margin:2px 0}.serp .d{color:#4d5156;font-size:14px;line-height:1.5}.soc{background:#fff;color:#111;border:1px solid #ddd;border-radius:12px;overflow:hidden;font-family:system-ui;max-width:440px}.soc .im{height:200px;background:#e5e7eb center/cover;display:flex;align-items:center;justify-content:center;color:#9ca3af}.soc .tx{padding:10px 14px;background:#f3f4f6}.soc .tx small{color:#6b7280;text-transform:uppercase;font-size:11px}.soc .tx b{display:block}.cn{font-size:12px;float:right}.cn.bad{color:var(--bad)}</style>
<div class="wrap"><h1>Meta Tag Generator</h1><p class="sub">Write the title, description and social-sharing tags for a page, with live search-result and social-card previews and length warnings.</p>
<div class="g2"><div class="card"><label>Page title <span class="cn" id="ct"></span></label><input id="t" value="Cool Apps — 250 small tools" data-keep><label class="gap">Description <span class="cn" id="cd"></span></label><textarea id="d" style="min-height:80px;font-family:inherit" data-keep>A hub of small, fast web apps: calculators, converters, trackers and toys.</textarea>
<div class="g2 gap"><div><label>Canonical URL</label><input id="u" value="https://example.com/" data-keep></div><div><label>Site name</label><input id="sn" value="Cool Apps" data-keep></div><div><label>Image URL (1200×630)</label><input id="im" placeholder="https://example.com/og.png" data-keep></div><div><label>Twitter / X handle</label><input id="tw" placeholder="@yourname" data-keep></div></div>
<div class="row gap"><div class="col"><label>Type</label><select id="ty" data-keep><option>website</option><option>article</option><option>product</option></select></div><div class="col"><label>Language</label><input id="lg" value="en" data-keep></div><label style="margin:0 0 9px"><input type="checkbox" id="ni" data-keep> noindex</label></div></div>
<div class="card"><h2>Search result preview</h2><div class="serp" id="serp"></div><h2 class="gap">Social card preview</h2><div class="soc" id="soc"></div></div></div>
<div class="card gap"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">HTML</h2><button class="x right" id="cp">Copy</button></div><div class="out" id="out"></div></div></div>
<script>
const A=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function run(){const g=id=>$('#'+id).value.trim(),t=g('t'),d=g('d'),u=g('u'),im=g('im'),tw=g('tw').replace(/^@?/,'@'),L=[];
  $('#ct').textContent=`${t.length}/60`;$('#ct').className='cn'+(t.length>60?' bad':'');$('#cd').textContent=`${d.length}/160`;$('#cd').className='cn'+(d.length>160?' bad':'');
  L.push('<meta charset="utf-8">','<meta name="viewport" content="width=device-width, initial-scale=1">',`<title>${esc(t)}</title>`,`<meta name="description" content="${A(d)}">`);if(u)L.push(`<link rel="canonical" href="${A(u)}">`);if($('#ni').checked)L.push('<meta name="robots" content="noindex, nofollow">');
  L.push(`<meta property="og:title" content="${A(t)}">`,`<meta property="og:description" content="${A(d)}">`,`<meta property="og:type" content="${$('#ty').value}">`);if(u)L.push(`<meta property="og:url" content="${A(u)}">`);if(g('sn'))L.push(`<meta property="og:site_name" content="${A(g('sn'))}">`);if(im)L.push(`<meta property="og:image" content="${A(im)}">`);
  L.push(`<meta name="twitter:card" content="${im?'summary_large_image':'summary'}">`,`<meta name="twitter:title" content="${A(t)}">`,`<meta name="twitter:description" content="${A(d)}">`);if(im)L.push(`<meta name="twitter:image" content="${A(im)}">`);if(g('tw')&&tw.length>1)L.push(`<meta name="twitter:site" content="${A(tw)}">`);
  $('#out').textContent=(g('lg')?`<html lang="${g('lg')}">\n<head>\n`:'<head>\n')+L.map(x=>'  '+x).join('\n')+'\n</head>';
  let host='';try{host=new URL(u).hostname+new URL(u).pathname.replace(/\/$/,'').replace(/\//g,' › ')}catch{host=u}$('#serp').innerHTML=`<div class="u">${esc(host)}</div><div class="t">${esc(t.length>60?t.slice(0,57)+'…':t)||'Page title'}</div><div class="d">${esc(d.length>160?d.slice(0,157)+'…':d)||'Description…'}</div>`;
  const okIm=/^https?:\/\/\S+$/i.test(im);$('#soc').innerHTML=`<div class="im" style="${okIm?`background-image:url('${A(im).replace(/'/g,'%27')}')`:''}">${okIm?'':im?'(enter a full https:// image URL)':'(no image set)'}</div><div class="tx"><small>${esc((()=>{try{return new URL(u).hostname}catch{return g('sn')}})())}</small><b>${esc(t)}</b><span style="color:#555;font-size:13px">${esc(d.slice(0,110))}</span></div>`}
$('#cp').onclick=e=>copy($('#out').textContent,e.target);document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
