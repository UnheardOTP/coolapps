<!doctype html><meta charset="utf-8"><title>Grade Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:900px}.cat{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.sc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sc input{width:70px;text-align:center}</style>
<div class="wrap"><h1>Grade Calculator</h1><p class="sub">Weighted course grades, and what you need on the final to hit a target.</p>
<div class="card"><div id="cats"></div><button class="s" id="add">+ Category</button></div>
<div class="g3" id="kp"></div><div class="card gap"><h2>What do I need on the final?</h2><div class="row"><div class="col"><label>Final exam weight (%)</label><input id="fw" type="number" value="30" data-keep></div><div class="col"><label>Target course grade (%)</label><input id="tg" type="number" value="90" data-keep></div><div class="kpi col"><small>Score needed on the final</small><b id="need"></b></div></div><div class="mut gap">Uses the grade so far in the categories above as the remaining (100 − final weight)% of the course.</div></div><div class="card"><h2>Saved courses</h2><div id="sv"></div></div></div>
<script>
let cats=[{n:'Homework',w:20,s:[95,88,100]},{n:'Quizzes',w:20,s:[78,85]},{n:'Midterm',w:30,s:[82]}];
const avg=c=>c.s.length?c.s.reduce((a,b)=>a+b,0)/c.s.length:null;
const letter=p=>p>=93?'A':p>=90?'A−':p>=87?'B+':p>=83?'B':p>=80?'B−':p>=77?'C+':p>=73?'C':p>=70?'C−':p>=60?'D':'F';
function paint(){$('#cats').innerHTML=cats.map((c,i)=>`<div class="cat"><div class="row"><div class="col" style="flex:2"><label>Category</label><input data-i="${i}" data-k="n" value="${esc(c.n)}"></div><div class="col" style="max-width:120px"><label>Weight (%)</label><input type="number" data-i="${i}" data-k="w" value="${c.w}"></div><div class="kpi" style="min-width:110px"><small>Average</small><b>${avg(c)==null?'–':fmt(avg(c),1)+'%'}</b></div><button class="x" data-rm="${i}">✕</button></div><div class="sc">${c.s.map((s,j)=>`<input type="number" data-i="${i}" data-j="${j}" value="${s}"><button class="x" data-rs="${i}-${j}" style="padding:2px 6px">×</button>`).join('')}<button class="s" data-as="${i}">+ score</button></div></div>`).join('');calc()}
function calc(){const used=cats.filter(c=>avg(c)!=null),W=used.reduce((n,c)=>n+c.w,0),g=W?used.reduce((n,c)=>n+avg(c)*c.w,0)/W:null,tw=cats.reduce((n,c)=>n+c.w,0);
  $('#kp').innerHTML=[['Current grade',g==null?'–':fmt(g,2)+'%'],['Letter',g==null?'–':letter(g)],['Weight counted',`${fmt(W,0)}% of ${fmt(tw,0)}%`]].map(([k,v],i)=>`<div class="kpi"><small>${k}</small><b ${i===0?'style="color:var(--a)"':''}>${v}</b></div>`).join('');
  const fw=num('fw')/100,tgt=num('tg');if(g==null||fw<=0||fw>=1){$('#need').textContent='–'}else{const need=(tgt-g*(1-fw))/fw;$('#need').innerHTML=`<span class="${need>100?'bad':need<=0?'ok':''}">${need<=0?'Already secured':fmt(need,1)+'%'}</span>${need>100?'<br><small>not reachable</small>':''}`}KV.save({cats,fw:$('#fw').value,tg:$('#tg').value})}
$('#cats').oninput=e=>{const t=e.target,i=t.dataset.i;if(i===undefined)return;if(t.dataset.k)cats[i][t.dataset.k]=t.dataset.k==='w'?parseFloat(t.value)||0:t.value;else cats[i].s[t.dataset.j]=parseFloat(t.value)||0;calc();const a=t.closest('.cat').querySelector('.kpi b');a.textContent=avg(cats[i])==null?'–':fmt(avg(cats[i]),1)+'%'};
$('#cats').onclick=e=>{const d=e.target.dataset;if(d.rm!==undefined){cats.splice(+d.rm,1);paint()}if(d.as!==undefined){cats[d.as].s.push(100);paint()}if(d.rs){const[i,j]=d.rs.split('-');cats[i].s.splice(+j,1);paint()}};$('#add').onclick=()=>{cats.push({n:'Category',w:10,s:[]});paint()};document.addEventListener('input',e=>{if(e.target.id==='fw'||e.target.id==='tg')calc()});
savedBar($('#sv'),{get:()=>({cats:JSON.parse(JSON.stringify(cats)),fw:$('#fw').value,tg:$('#tg').value}),set:d=>{cats=JSON.parse(JSON.stringify(d.cats));$('#fw').value=d.fw;$('#tg').value=d.tg;paint()}});KV.load().then(s=>{if(s.cats){cats=s.cats;if(s.fw)$('#fw').value=s.fw;if(s.tg)$('#tg').value=s.tg}paint()});paint();
</script>
