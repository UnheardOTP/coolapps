<!doctype html><meta charset="utf-8"><title>Link Vault</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:960px}.lk{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.fv{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px}.lk .b{flex:1;min-width:0}.lk a{font-weight:600;color:var(--fg);text-decoration:none}.lk a:hover{color:var(--a)}.lk .u{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tg{font-size:12px;color:var(--a);margin-right:6px;cursor:pointer}</style>
<div class="wrap"><h1>Link Vault</h1><p class="sub">Save links with tags and find them again fast.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>URL</label><input id="u" placeholder="https://example.com/article"></div><div class="col"><label>Title (optional)</label><input id="t"></div><div class="col"><label>Tags</label><input id="g" placeholder="read, work"></div><button id="add">Save</button></div><div class="err" id="er"></div></div>
<div class="card"><input id="q" placeholder="Search title, URL or tag…"><div class="chips" id="tags"></div><div id="ls" class="gap"></div></div></div>
<script>
let ls=[],tag='';const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};const col=s=>`hsl(${[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360},55%,45%)`;
function paint(){const q=$('#q').value.toLowerCase(),all=[...new Set(ls.flatMap(l=>l.tags))].sort();$('#tags').innerHTML=all.map(t=>`<span class="chip" data-t="${esc(t)}" style="${t===tag?'border-color:var(--a)':''}">#${esc(t)}</span>`).join('');
  const l=ls.filter(x=>(!tag||x.tags.includes(tag))&&(!q||(x.title+x.url+x.tags.join(' ')).toLowerCase().includes(q)));
  $('#ls').innerHTML=l.map(x=>`<div class="lk" data-id="${x.id}"><div class="fv" style="background:${col(host(x.url))}">${esc(host(x.url)[0]?.toUpperCase()||'?')}</div><div class="b"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" data-open>${esc(x.title||host(x.url))}</a><div class="u">${esc(x.url)}</div><div>${x.tags.map(t=>`<span class="tg" data-t="${esc(t)}">#${esc(t)}</span>`).join('')}<span class="mut" style="font-size:12px">${x.n?x.n+' visits':''}</span></div></div><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">No links.</span>'}
$('#add').onclick=async()=>{$('#er').textContent='';let u=$('#u').value.trim();if(!u)return;if(!/^[a-z]+:\/\//i.test(u))u='https://'+u;try{new URL(u)}catch{return $('#er').textContent='That does not look like a valid URL.'}
  ls.unshift(await api.add({kind:'lk',url:u,title:$('#t').value.trim(),tags:$('#g').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),n:0}));$('#u').value=$('#t').value=$('#g').value='';paint()};
$('#ls').onclick=async e=>{const r=e.target.closest('.lk');if(!r)return;const x=ls.find(v=>v.id===r.dataset.id);if(e.target.hasAttribute('data-rm')){await api.del(x.id);ls=ls.filter(v=>v!==x);paint()}else if(e.target.hasAttribute('data-open')){x.n=(x.n||0)+1;api.upd(x.id,{n:x.n});setTimeout(paint,50)}else if(e.target.dataset.t){tag=e.target.dataset.t;paint()}};
$('#tags').onclick=e=>{const t=e.target.closest('.chip')?.dataset.t;if(t!==undefined){tag=tag===t?'':t;paint()}};$('#q').oninput=paint;api.list().then(d=>{ls=only(d,'lk');paint()});
</script>
