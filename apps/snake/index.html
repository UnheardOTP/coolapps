<!doctype html><meta charset="utf-8"><title>Neon Snake</title>
<script src="/shared/lib.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0c0a24; color: #c9c4ff; font: 14px 'Courier New', monospace; display: flex; gap: 48px; align-items: center; justify-content: center; }
  h1 { margin: 0 0 6px; font-size: 38px; letter-spacing: .12em; color: #fff; text-shadow: 0 0 18px #ff2bd6, 0 0 36px #ff2bd6; }
  canvas { display: block; border: 2px solid #3a2f8f; box-shadow: 0 0 40px #5b3fff55, inset 0 0 40px #0006; border-radius: 6px; }
  .side { width: 230px; } .score { font-size: 56px; color: #19e3ff; text-shadow: 0 0 14px #19e3ff; margin: 18px 0 0; } .lbl { color: #6e68b8; letter-spacing: .25em; font-size: 11px; text-transform: uppercase; }
  ol { padding-left: 24px; margin: 8px 0 0; line-height: 1.8; } li span { float: right; color: #ff2bd6; }
  .hint { color: #6e68b8; margin-top: 28px; line-height: 1.6; }
</style>
<div class="side"><h1>NEON<br>SNAKE</h1><div class="lbl">score</div><div class="score" id="score">0</div>
  <div class="lbl" style="margin-top:30px">high scores</div><ol id="board"></ol><div class="hint">Arrow keys / WASD<br>Space to start</div></div>
<canvas id="c" width="528" height="528"></canvas>
<script>
const N = 22, S = 24, cv = $('#c'), g = cv.getContext('2d');
let snake, dir, queue, food, score, state = 'idle', last = 0, delay, scores = [];

function reset() {
  snake = [{ x: 11, y: 11 }, { x: 10, y: 11 }, { x: 9, y: 11 }]; dir = { x: 1, y: 0 }; queue = []; score = 0; delay = 125; spawn();
  $('#score').textContent = 0;
}
// Place food on a random empty cell.
function spawn() {
  do food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; while (snake.some(s => s.x === food.x && s.y === food.y));
}
function tick() {
  if (queue.length) dir = queue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) return die();
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score += 10; delay = Math.max(55, delay - 3); $('#score').textContent = score; spawn(); } else snake.pop();
}
async function die() {
  state = 'over';
  if (score > 0) { scores.push(await api.add({ score })); board(); }
}
function board() {
  $('#board').innerHTML = [...scores].sort((a, b) => b.score - a.score).slice(0, 8).map(s => `<li>${new Date(s.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}<span>${s.score}</span></li>`).join('') || '<li style="list-style:none;color:#6e68b8">no scores yet</li>';
}
function draw(t) {
  g.fillStyle = '#0a0820'; g.fillRect(0, 0, 528, 528);
  g.strokeStyle = '#17124a'; g.lineWidth = 1;
  for (let i = 1; i < N; i++) { g.beginPath(); g.moveTo(i * S, 0); g.lineTo(i * S, 528); g.moveTo(0, i * S); g.lineTo(528, i * S); g.stroke(); }
  const pulse = 7 + Math.sin(t / 150) * 2;                         // food pulses
  g.shadowBlur = 18; g.shadowColor = '#ffe14d'; g.fillStyle = '#ffe14d';
  g.beginPath(); g.arc(food.x * S + S / 2, food.y * S + S / 2, pulse, 0, 7); g.fill();
  snake.forEach((s, i) => {                                         // cyan head fading to magenta tail
    const k = i / Math.max(snake.length - 1, 1), c = `hsl(${185 + k * 125}, 100%, ${62 - k * 10}%)`;
    g.shadowColor = c; g.fillStyle = c; g.beginPath(); g.roundRect(s.x * S + 2, s.y * S + 2, S - 4, S - 4, 6); g.fill();
  });
  g.shadowBlur = 0;
  if (state !== 'running') {
    g.fillStyle = '#0a0820cc'; g.fillRect(0, 200, 528, 120); g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '28px Courier New';
    g.fillText(state === 'over' ? 'GAME OVER · ' + score : 'PRESS SPACE', 264, 252); g.font = '14px Courier New'; g.fillStyle = '#6e68b8'; g.fillText(state === 'over' ? 'space to play again' : 'arrow keys or WASD', 264, 286);
  }
}
reset();
(function frame(t) {
  if (state === 'running' && t - last > delay) { last = t; tick(); }
  draw(t); requestAnimationFrame(frame);
})(0);
const DIRS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (state !== 'running') { reset(); state = 'running'; } return; }
  const d = DIRS[e.key]; if (!d) return; e.preventDefault();
  const ref = queue.length ? queue[queue.length - 1] : dir;
  if (d[0] === -ref.x && d[1] === -ref.y || (d[0] === ref.x && d[1] === ref.y)) return;     // no reversing, no duplicates
  if (state === 'idle' || state === 'over') { reset(); state = 'running'; }
  queue.push({ x: d[0], y: d[1] }); if (queue.length > 2) queue.shift();
});
api.list().then(d => { scores = d; board(); });
</script>
