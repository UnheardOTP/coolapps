<!doctype html><meta charset="utf-8"><title>Password Generator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:760px}#pw{font:600 24px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;padding:16px;background:var(--soft);border-radius:12px;min-height:64px;user-select:all}.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:12px 0 4px}.meter i{display:block;height:100%;transition:width .3s,background .3s}.pl{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,monospace}</style>
<div class="wrap"><h1>Password Generator</h1><p class="sub">Strong random passwords and passphrases, generated in your browser with the secure random source. Nothing is stored or sent.</p>
<div class="card"><div id="pw"></div><div class="meter"><i id="mi"></i></div><div class="mut" id="ms"></div><div class="row gap"><button id="go">Generate</button><button class="s" id="cp">Copy</button></div></div>
<div class="card"><div class="tabs" id="tabs"><button data-m="pw" class="on">Password</button><button data-m="pp">Passphrase</button></div>
<div id="pwo"><label>Length: <b id="lv"></b></label><input type="range" id="len" min="8" max="64" value="20" data-keep><div class="row gap"><label style="margin:0"><input type="checkbox" id="lo" checked data-keep> a–z</label><label style="margin:0"><input type="checkbox" id="up" checked data-keep> A–Z</label><label style="margin:0"><input type="checkbox" id="di" checked data-keep> 0–9</label><label style="margin:0"><input type="checkbox" id="sy" checked data-keep> !@#$…</label><label style="margin:0"><input type="checkbox" id="am" checked data-keep> avoid look-alikes (0 O l 1 I)</label></div></div>
<div id="ppo" class="hide"><label>Words: <b id="wv"></b></label><input type="range" id="wc" min="3" max="10" value="5" data-keep><div class="row gap"><div class="col"><label>Separator</label><select id="sp" data-keep><option>-</option><option>.</option><option value=" ">space</option><option>_</option></select></div><label style="margin:0 0 9px"><input type="checkbox" id="cap" checked data-keep> Capitalise</label><label style="margin:0 0 9px"><input type="checkbox" id="nm" checked data-keep> Add a number</label></div></div></div>
<div class="card"><h2>More options</h2><div id="more"></div><button class="s gap" id="five">Generate 5 more</button></div></div>
<script>
const WORDS='able acid aged also area army away baby back ball band bank base bath bear beat been bell belt best bird blue boat body bomb bone book born boss both bowl bulk burn bush busy cafe cake call calm came camp card care case cash cast cell chat chip city clay club coal coat code cold come cook cool cope copy core cost crew crop dark data date dawn days dead deal dear debt deep deny desk dial diet dirt dish disk door dose down draw drew drop drug dual duke dust duty each earn ease east easy edge else even ever evil exit face fact fade fail fair fall fame farm fast fate fear feed feel feet fell felt file fill film find fine fire firm fish five flat flow food foot ford form fort four free from fuel full fund gain game gate gave gear gene gift girl give glad goal goes gold golf gone good gray grew grey grow gulf hair half hall hand hang hard harm hate have head hear heat held hell help here hero high hill hire hold hole holy home hope horn host hour huge hung hunt hurt idea inch into iron item jack jane jazz join jump jury just keen keep kept kick kill kind king knee knew know lack lady laid lake land lane last late lead left less life lift like line link list live load loan lock logo long look lord lose loss lost love luck made mail main make male many mark mass math meal mean meat meet menu mere mike mild mile milk mill mind mine miss mode mood moon more most move much must name navy near neck need news next nice nine none nose note okay once only onto open oral over pace pack page paid pain pair palm park part pass past path peak pick pink pipe plan play plot plug plus poll pool poor port post pull pure push race rail rain rank rare rate read real rear rely rent rest rice rich ride ring rise risk road rock role roll roof room root rose rule rush ruth safe sage said sake sale salt same sand save seat seed seek seem seen self sell send sent sept ship shop shot show shut sick side sign silk site size skin slip slow snow soft soil sold sole some song soon sort soul spot star stay step stop such suit sure take tale talk tall tank tape task team tech tell tend term test text than that them then they thin this thus till time tiny told toll tone tony took tool tour town tree trip true tune turn twin type unit upon used user vary vast very vice view vote wage wait wake walk wall want ward warm wash wave ways weak wear week well went were west what when whom wide wife wild will wind wine wing wire wise wish with wolf wood word wore work worn yard yeah year your zero zone'.split(' ');
let mode='pw';
const rnd=n=>{const a=new Uint32Array(1),lim=Math.floor(2**32/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n};   // rejection sampling: no modulo bias
function gen(){if(mode==='pp'){const n=+$('#wc').value,w=Array.from({length:n},()=>{let x=WORDS[rnd(WORDS.length)];return $('#cap').checked?x[0].toUpperCase()+x.slice(1):x});if($('#nm').checked)w.push(rnd(100));return{pw:w.join($('#sp').value),bits:n*Math.log2(WORDS.length)+($('#nm').checked?Math.log2(100):0)}}
  const am=$('#am').checked,sets=[['lo','abcdefghijklmnopqrstuvwxyz'],['up','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['di','0123456789'],['sy','!@#$%^&*()-_=+[]{};:,.?']].filter(([k])=>$('#'+k).checked).map(([,s])=>am?s.replace(/[0Ol1I|]/g,''):s);if(!sets.length)return{pw:'',bits:0};
  const all=sets.join(''),L=+$('#len').value,out=sets.map(s=>s[rnd(s.length)]);while(out.length<L)out.push(all[rnd(all.length)]);for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}return{pw:out.slice(0,L).join(''),bits:L*Math.log2(all.length)}}
function show(){const{pw,bits}=gen();$('#pw').textContent=pw||'Select at least one character set';const lv=bits<40?['Weak','#ef4444']:bits<60?['Fair','#f59e0b']:bits<80?['Good','#84cc16']:['Excellent','#16a34a'];$('#mi').style.cssText=`width:${Math.min(100,bits/128*100)}%;background:${lv[1]}`;$('#ms').textContent=`${lv[0]} · ~${Math.round(bits)} bits of entropy`;$('#lv').textContent=$('#len').value;$('#wv').textContent=$('#wc').value}
$('#go').onclick=show;$('#cp').onclick=e=>copy($('#pw').textContent,e.target);$('#five').onclick=()=>{$('#more').innerHTML=Array.from({length:5},()=>`<div class="pl"><span style="flex:1;word-break:break-all">${esc(gen().pw)}</span><button class="x" data-c>Copy</button></div>`).join('')};$('#more').onclick=e=>{if(e.target.hasAttribute('data-c'))copy(e.target.previousElementSibling.textContent,e.target)};
$('#tabs').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));$('#pwo').classList.toggle('hide',m!=='pw');$('#ppo').classList.toggle('hide',m!=='pp');show()};
document.addEventListener('input',e=>{if(e.target.closest('.card')&&e.target.id!=='pw')show()});remember().then(show);
</script>
