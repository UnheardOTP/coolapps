<!doctype html><meta charset="utf-8"><title>Port Numbers</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#9333ea}tr.fav td:first-child::before{content:'★ ';color:#f59e0b}tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}</style>
<div class="wrap"><h1>Port Numbers</h1><p class="sub">Well-known TCP/UDP ports. Click a row to star it.</p>
<div class="card"><div class="row"><div class="col" style="flex:3"><input id="q" placeholder="Search by port or service…" data-keep></div><div class="col"><select id="pr" data-keep><option value="">TCP + UDP</option><option>TCP</option><option>UDP</option></select></div></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Port</th><th>Proto</th><th>Service</th><th>Notes</th></tr></thead><tbody id="b"></tbody></table></div></div></div>
<script>
const P=[[20,'TCP','FTP data',''],[21,'TCP','FTP','File transfer control'],[22,'TCP','SSH','Secure shell, also SFTP/SCP'],[23,'TCP','Telnet','Unencrypted; avoid'],[25,'TCP','SMTP','Mail transfer between servers'],[53,'TCP/UDP','DNS','Name resolution'],[67,'UDP','DHCP server',''],[68,'UDP','DHCP client',''],[69,'UDP','TFTP','Trivial file transfer'],[80,'TCP','HTTP','Web'],[88,'TCP/UDP','Kerberos',''],[110,'TCP','POP3','Mail retrieval'],[119,'TCP','NNTP','Usenet'],[123,'UDP','NTP','Time sync'],[135,'TCP','MS RPC',''],[137,'UDP','NetBIOS name',''],[139,'TCP','NetBIOS session',''],[143,'TCP','IMAP','Mail retrieval'],[161,'UDP','SNMP',''],[162,'UDP','SNMP trap',''],[179,'TCP','BGP','Border gateway'],[389,'TCP/UDP','LDAP',''],[443,'TCP','HTTPS','Web over TLS'],[445,'TCP','SMB','Windows file sharing'],[465,'TCP','SMTPS','Mail submission (implicit TLS)'],[514,'UDP','Syslog',''],[515,'TCP','LPD','Printing'],[587,'TCP','SMTP submission','Mail submission (STARTTLS)'],[636,'TCP','LDAPS',''],[873,'TCP','rsync',''],[993,'TCP','IMAPS',''],[995,'TCP','POP3S',''],[1080,'TCP','SOCKS proxy',''],[1194,'UDP','OpenVPN',''],[1433,'TCP','MS SQL Server',''],[1521,'TCP','Oracle DB',''],[1723,'TCP','PPTP VPN',''],[1883,'TCP','MQTT','IoT messaging'],[2049,'TCP/UDP','NFS',''],[2181,'TCP','ZooKeeper',''],[2375,'TCP','Docker (plain)','Unencrypted API'],[2376,'TCP','Docker (TLS)',''],[3000,'TCP','Dev servers','Node, Rails, Grafana'],[3306,'TCP','MySQL / MariaDB',''],[3389,'TCP','RDP','Remote Desktop'],[4222,'TCP','NATS',''],[5000,'TCP','Flask / Docker registry',''],[5060,'TCP/UDP','SIP',''],[5432,'TCP','PostgreSQL',''],[5672,'TCP','AMQP / RabbitMQ',''],[5900,'TCP','VNC',''],[6379,'TCP','Redis',''],[6443,'TCP','Kubernetes API',''],[8000,'TCP','Dev HTTP',''],[8080,'TCP','HTTP alt / proxies',''],[8443,'TCP','HTTPS alt',''],[8883,'TCP','MQTT over TLS',''],[9000,'TCP','PHP-FPM / MinIO',''],[9090,'TCP','Prometheus',''],[9092,'TCP','Kafka',''],[9200,'TCP','Elasticsearch',''],[11211,'TCP/UDP','Memcached',''],[27017,'TCP','MongoDB',''],[51820,'UDP','WireGuard','']];
let favs=new Set(),doc=null;
function render(){const q=$('#q').value.toLowerCase(),pr=$('#pr').value;$('#b').innerHTML=P.filter(([p,t,s,n])=>(!pr||t.includes(pr))&&(!q||`${p} ${t} ${s} ${n}`.toLowerCase().includes(q))).sort((a,b)=>favs.has(b[0])-favs.has(a[0])||a[0]-b[0]).map(([p,t,s,n])=>`<tr data-p="${p}" class="${favs.has(p)?'fav':''}"><td class="mono"><b>${p}</b></td><td>${t}</td><td>${esc(s)}</td><td class="mut">${esc(n)}</td></tr>`).join('')}
$('#b').onclick=async e=>{const r=e.target.closest('tr');if(!r)return;const p=+r.dataset.p;favs.has(p)?favs.delete(p):favs.add(p);render();const l=[...favs];if(doc)api.upd(doc.id,{l});else doc=await api.add({kind:'favs',l})};
$('#q').oninput=$('#pr').onchange=render;api.list().then(d=>{doc=d.find(x=>x.kind==='favs')||null;if(doc)favs=new Set(doc.l);remember().then(render)});
</script>
