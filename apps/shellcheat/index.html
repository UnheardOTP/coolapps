<!doctype html><meta charset="utf-8"><title>Linux Command Cheatsheet</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:980px}.cm{display:flex;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.cm code{flex:none;width:46%;background:var(--soft);padding:5px 10px;border-radius:7px;font:13px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;word-break:break-all}.cm code:hover{outline:2px solid var(--a)}.cm span{flex:1;color:var(--mut)}.cm i{font-style:normal;cursor:pointer;color:var(--mut)}.cm i.on{color:#f59e0b}</style>
<div class="wrap"><h1>Linux Command Cheatsheet</h1><p class="sub">Everyday shell commands. Click one to copy it; star the ones you keep forgetting.</p>
<div class="card"><input id="q" placeholder="Search commands or what you want to do…" data-keep><div class="tabs gap" id="tabs"></div><div id="list"></div></div></div>
<script>
const G={'Files':[['ls -lah','List all files with sizes and permissions'],['cd -','Jump back to the previous directory'],['cp -r src/ dest/','Copy a directory recursively'],['mv old new','Move or rename'],['rm -rf dir/','Delete a directory (no undo!)'],['mkdir -p a/b/c','Create nested directories'],['ln -s target link','Create a symbolic link'],['find . -name "*.log" -mtime +7','Find files older than 7 days'],['du -sh * | sort -h','Size of each item, smallest to largest'],['tree -L 2','Directory tree two levels deep'],['stat file','Detailed file info']],
'Text':[['cat file','Print a file'],['less +F file','Follow a file like tail -f (Ctrl-C to stop)'],['tail -f file','Watch a log as it grows'],['head -n 20 file','First 20 lines'],['grep -rn "text" .','Search recursively with line numbers'],['grep -v "text" file','Lines that do NOT match'],['sed -i "s/old/new/g" file','Replace in place'],['awk \'{print $1}\' file','Print the first column'],['sort | uniq -c | sort -rn','Count and rank duplicate lines'],['wc -l file','Count lines'],['cut -d, -f2 file.csv','Second column of a CSV'],['diff -u a b','Unified diff of two files']],
'Processes':[['ps aux | grep name','Find a running process'],['top','Live process viewer'],['htop','Nicer live process viewer'],['kill -9 PID','Force-kill a process'],['pkill -f name','Kill by name'],['jobs; bg; fg','Manage background jobs'],['nohup cmd &','Run immune to hangups'],['systemctl status svc','Service status'],['journalctl -u svc -f','Follow a service\'s logs'],['crontab -e','Edit scheduled jobs']],
'Network':[['curl -I https://x.com','Fetch only the headers'],['curl -fsSL url | bash','Download and run (read it first!)'],['wget -c url','Download, resuming if interrupted'],['ss -tulpn','Listening ports and their processes'],['ping -c 4 host','Four pings'],['dig +short host','Resolve a hostname'],['nc -zv host 22','Test whether a port is open'],['ip a','Show network addresses'],['traceroute host','Trace the route to a host']],
'Disk & archives':[['df -h','Free space per filesystem'],['lsblk','Block devices'],['tar czf out.tgz dir/','Create a gzip tarball'],['tar xzf in.tgz','Extract a tarball'],['zip -r out.zip dir/','Zip a directory'],['unzip file.zip -d out/','Unzip to a folder'],['rsync -avz --progress src/ host:dest/','Sync over SSH'],['dd if=in of=out bs=4M status=progress','Copy raw data']],
'Permissions':[['chmod 755 file','rwxr-xr-x'],['chmod +x script.sh','Make executable'],['chown user:group file','Change owner'],['sudo !!','Re-run the last command with sudo'],['id','Who am I and which groups'],['umask','Default permission mask']],
'SSH':[['ssh user@host','Log in'],['ssh -L 8080:localhost:80 host','Forward a local port'],['ssh-keygen -t ed25519','Create a key pair'],['ssh-copy-id user@host','Install your key'],['scp file host:~/','Copy a file over SSH'],['ssh -J jump host','Hop through a bastion']],
'Shell':[['history | grep word','Search command history'],['Ctrl-R','Reverse-search history'],['!!','Repeat the last command'],['alias ll="ls -lah"','Create a shortcut'],['export VAR=value','Set an environment variable'],['cmd1 && cmd2','Run cmd2 only if cmd1 succeeds'],['cmd > out.txt 2>&1','Redirect stdout and stderr'],['xargs -n1 cmd','Run cmd for each input line'],['watch -n 2 cmd','Repeat a command every 2 s']]};
let cat='All',favs=new Set(),doc=null;
function render(){const q=$('#q').value.toLowerCase();$('#tabs').innerHTML=['All','★ Starred',...Object.keys(G)].map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join('');
  const rows=Object.entries(G).flatMap(([g,l])=>l.map(([c,d])=>({g,c,d}))).filter(r=>(cat==='All'||cat==='★ Starred'&&favs.has(r.c)||cat===r.g)&&(!q||(r.c+r.d).toLowerCase().includes(q)));
  $('#list').innerHTML=rows.map(r=>`<div class="cm"><code data-c="${esc(r.c)}">${esc(r.c)}</code><span>${esc(r.d)}</span><i data-f="${esc(r.c)}" class="${favs.has(r.c)?'on':''}">${favs.has(r.c)?'★':'☆'}</i></div>`).join('')||'<span class="mut">Nothing matches.</span>'}
$('#tabs').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};$('#q').oninput=render;
$('#list').onclick=async e=>{if(e.target.dataset.c)return copy(e.target.dataset.c,e.target);const f=e.target.dataset.f;if(!f)return;favs.has(f)?favs.delete(f):favs.add(f);render();const l=[...favs];if(doc)api.upd(doc.id,{l});else doc=await api.add({kind:'favs',l})};
api.list().then(d=>{doc=d.find(x=>x.kind==='favs')||null;if(doc)favs=new Set(doc.l);remember().then(render)});
</script>
