<!doctype html><meta charset="utf-8"><title>Unit Converter</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0284c7;--w:860px}</style>
<div class="wrap"><h1>Unit Converter</h1><p class="sub">Length, mass, temperature, volume, speed, area, time, pressure, energy and data.</p>
<div class="card"><div class="tabs" id="tabs"></div><div class="row"><div class="col"><label>Value</label><input id="v" type="number" step="any" value="1" style="font-size:22px" data-keep></div><div class="col"><label>From</label><select id="f" data-keep></select></div><button class="s" id="sw" style="margin-bottom:1px">⇄</button><div class="col"><label>To</label><select id="t" data-keep></select></div></div><div class="big gap" id="res"></div></div>
<div class="card"><h2>All units</h2><table id="all"></table></div></div>
<script>
// Each category lists units as factor-to-base (base = first unit). Temperature is handled separately because it is not a pure ratio.
const C={Length:{m:1,km:1000,cm:.01,mm:.001,mile:1609.344,yard:.9144,foot:.3048,inch:.0254,'nautical mile':1852},Mass:{kg:1,g:.001,mg:1e-6,tonne:1000,lb:.45359237,oz:.028349523,stone:6.35029318},Volume:{L:1,mL:.001,'m³':1000,'US gal':3.785411784,'US qt':.946352946,'US pint':.473176473,'US cup':.2365882365,'fl oz':.0295735296,tbsp:.0147867648,tsp:.00492892159,'imp gal':4.54609},Speed:{'m/s':1,'km/h':.277777778,mph:.44704,knot:.514444444,'ft/s':.3048,mach:340.29},Area:{'m²':1,'km²':1e6,'cm²':1e-4,hectare:1e4,acre:4046.8564224,'sq ft':.09290304,'sq in':6.4516e-4,'sq mile':2589988.11},Time:{s:1,ms:.001,min:60,hour:3600,day:86400,week:604800,month:2629746,year:31556952},Pressure:{Pa:1,kPa:1000,bar:1e5,atm:101325,psi:6894.757,mmHg:133.322,torr:133.322},Energy:{J:1,kJ:1000,cal:4.184,kcal:4184,Wh:3600,kWh:3.6e6,BTU:1055.056,eV:1.602176634e-19},Data:{B:1,KB:1e3,MB:1e6,GB:1e9,TB:1e12,KiB:1024,MiB:1048576,GiB:1073741824,bit:.125},Temperature:{'°C':0,'°F':0,K:0}};
let cat='Length';
const toBase={'°C':x=>x,'°F':x=>(x-32)*5/9,K:x=>x-273.15},fromBase={'°C':x=>x,'°F':x=>x*9/5+32,K:x=>x+273.15};
function conv(v,f,t,c=cat){return c==='Temperature'?fromBase[t](toBase[f](v)):v*C[c][f]/C[c][t]}
const nice=n=>!isFinite(n)?'–':n===0?'0':Math.abs(n)>=1e9||Math.abs(n)<1e-4?n.toExponential(4):+n.toPrecision(8)+'';
function setCat(c,keep){cat=c;const u=Object.keys(C[c]);if(!keep){$('#f').innerHTML=$('#t').innerHTML=u.map(x=>`<option>${x}</option>`).join('');$('#t').selectedIndex=Math.min(1,u.length-1)}$('#tabs').innerHTML=Object.keys(C).map(x=>`<button data-c="${x}" class="${x===c?'on':''}">${x}</button>`).join('');run()}
function run(){const v=num('v'),f=$('#f').value,t=$('#t').value;if(!(f in C[cat])||!(t in C[cat]))return;$('#res').textContent=`${nice(conv(v,f,t))} ${t}`;$('#all').innerHTML=Object.keys(C[cat]).map(u=>`<tr><td class="mut">${u}</td><td class="r mono">${nice(conv(v,f,u))}</td><td class="r"><button class="x" data-v="${nice(conv(v,f,u))}">Copy</button></td></tr>`).join('')}
$('#tabs').onclick=e=>{if(e.target.dataset.c)setCat(e.target.dataset.c)};$('#sw').onclick=()=>{const f=$('#f').value;$('#f').value=$('#t').value;$('#t').value=f;run();$('#f').dispatchEvent(new Event('input',{bubbles:true}))};$('#all').onclick=e=>{if(e.target.dataset.v)copy(e.target.dataset.v,e.target)};document.addEventListener('input',run);
setCat('Length');remember().then(()=>{const f=$('#f').value;const owner=Object.keys(C).find(c=>f in C[c]);if(owner&&owner!==cat){const t=$('#t').value,v=$('#v').value;setCat(owner,false);$('#f').value=f;if(t in C[owner])$('#t').value=t;$('#v').value=v}else setCat(cat,true)});
</script>
