<!doctype html><meta charset="utf-8"><title>Chore Rotation</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#7c3aed;--w:960px}.c{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.c.d{opacity:.5}.c.d b.n{text-decoration:line-through}.av{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.c input{width:20px;height:20px}.c .b{flex:1}.sc{display:flex;gap:10px;flex-wrap:wrap}.sc div{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:8px 12px}</style>
<div class="wrap"><h1>Chore Rotation</h1><p class="sub">Share the household jobs fairly. Chores rotate through the people each week; tick them off as they're done.</p>
<div class="g2"><div class="card"><h2>People</h2><div class="row"><div class="col"><input id="pn" placeholder="Add a person"></div><button class="s" id="pa">Add</button></div><div class="chips" id="pp"></div></div><div class="card"><h2>Chores</h2><div class="row"><div class="col"><input id="cn" placeholder="Add a chore (Dishes, Bins…)"></div><button class="s" id="ca">Add</button></div><div class="chips" id="cc"></div></div></div>
<div class="card gap"><div class="row" style="margin-bottom:8px"><button class="s" id="pv">‹</button><b id="wk" style="flex:1;text-align:center"></b><button class="s" id="nx">›</button><button class="s" id="td">This week</button></div><div id="ls"></div><div class="sc gap" id="sm"></div></div></div>
<script>
let people=[],chores=[],done=new Set(),dmap={},start;const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};start=mon(new Date());
const wkIdx=()=>Math.floor((start-new Date(2024,0,1))/(7*864e5)),key=c=>`${dkey(start)}|${c.id}`,col=i=>`hsl(${i*67%360},55%,45%)`;
// Rotation rule: chore number c in week w goes to person (c + w) mod N, so everyone cycles through every chore.
const who=(c,ci)=>people.length?people[((ci+wkIdx())%people.length+people.length)%people.length]:null;
function paint(){$('#pp').innerHTML=people.map((p,i)=>`<span class="chip" data-p="${p.id}"><span style="color:${col(i)}">●</span> ${esc(p.n)}<i data-del>✕</i></span>`).join('')||'<span class="mut">No one yet.</span>';$('#cc').innerHTML=chores.map(c=>`<span class="chip" data-c="${c.id}">${esc(c.n)}<i data-del>✕</i></span>`).join('')||'<span class="mut">No chores yet.</span>';
  const end=new Date(start);end.setDate(end.getDate()+6);$('#wk').textContent=`${start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
  $('#ls').innerHTML=people.length?chores.map((c,ci)=>{const p=who(c,ci),pi=people.indexOf(p),d=done.has(key(c));return`<div class="c ${d?'d':''}" data-c="${c.id}"><input type="checkbox" ${d?'checked':''}><div class="b"><b class="n">${esc(c.n)}</b></div><span class="av" style="background:${col(pi)}">${esc(p.n[0].toUpperCase())}</span><b style="width:110px">${esc(p.n)}</b></div>`}).join('')||'<span class="mut">Add some chores.</span>':'<span class="mut">Add the people in your household first.</span>';
  $('#sm').innerHTML=people.map((p,i)=>{const mine=chores.filter((c,ci)=>who(c,ci)===p),dn=mine.filter(c=>done.has(key(c))).length;return`<div><span class="av" style="background:${col(i)};width:26px;height:26px;font-size:13px">${esc(p.n[0].toUpperCase())}</span>${esc(p.n)}: <b>${dn}/${mine.length}</b></div>`}).join('')}
const go=n=>{start.setDate(start.getDate()+7*n);paint()};$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#td').onclick=()=>{start=mon(new Date());paint()};
$('#pa').onclick=async()=>{const n=$('#pn').value.trim();if(n){people.push(await api.add({kind:'mem',n}));$('#pn').value='';paint()}};$('#ca').onclick=async()=>{const n=$('#cn').value.trim();if(n){chores.push(await api.add({kind:'chr',n}));$('#cn').value='';paint()}};
$('#pp').onclick=async e=>{const c=e.target.closest('.chip');if(c&&e.target.hasAttribute('data-del')){await api.del(c.dataset.p);people=people.filter(x=>x.id!==c.dataset.p);paint()}};$('#cc').onclick=async e=>{const c=e.target.closest('.chip');if(c&&e.target.hasAttribute('data-del')){await api.del(c.dataset.c);chores=chores.filter(x=>x.id!==c.dataset.c);paint()}};
$('#ls').onchange=async e=>{const r=e.target.closest('.c');if(!r)return;const c=chores.find(x=>x.id===r.dataset.c),k=key(c);if(e.target.checked){dmap[k]=(await api.add({kind:'dn',k})).id;done.add(k)}else{await api.del(dmap[k]);done.delete(k)}paint()};
api.list().then(d=>{people=only(d,'mem').sort((a,b)=>a.createdAt-b.createdAt);chores=only(d,'chr').sort((a,b)=>a.createdAt-b.createdAt);only(d,'dn').forEach(x=>{done.add(x.k);dmap[x.k]=x.id});paint()});
</script>
