<!doctype html><meta charset="utf-8"><title>Tally Counters</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#e11d48;--w:960px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;position:relative}.c .n{font-weight:600;margin-bottom:4px;cursor:text}.c .v{font:700 64px ui-monospace,Menlo,Consolas,monospace;line-height:1.1;font-variant-numeric:tabular-nums;user-select:none}.c .b{display:flex;gap:8px;justify-content:center;margin-top:10px}.c .b button{font-size:22px;width:64px;height:54px}.c .b .p{width:110px;background:var(--a)}.c .x2{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);cursor:pointer}.c .bar{margin:8px 0 0}.c small{color:var(--mut)}</style>
<div class="wrap"><h1>Tally Counters</h1><p class="sub">Tap to count anything: laps, visitors, reps, cups of coffee. Set an optional goal for a progress bar.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Name</label><input id="n" placeholder="Cups of water"></div><div class="col" style="max-width:130px"><label>Goal (optional)</label><input id="g" type="number" min="0"></div><div class="col" style="max-width:110px"><label>Step</label><input id="s" type="number" value="1" min="1"></div><button id="add">Add counter</button></div></div><div class="g" id="g2"></div></div>
<script>
let cs=[];
function paint(){$('#g2').innerHTML=cs.map(c=>`<div class="c" data-id="${c.id}"><button class="x2" data-rm>✕</button><div class="n">${esc(c.n)}</div><div class="v">${c.v}</div>${c.g?`<div class="bar"><i style="width:${Math.min(100,c.v/c.g*100)}%;${c.v>=c.g?'background:var(--ok)':''}"></i></div><small>goal ${c.g}${c.v>=c.g?' — reached!':''}</small>`:''}<div class="b"><button class="s" data-d="-1">−</button><button class="p" data-d="1">+${c.s>1?c.s:''}</button><button class="s" data-z>0</button></div></div>`).join('')||'<span class="mut">Add your first counter above.</span>'}
async function set(c,v){c.v=Math.max(0,v);api.upd(c.id,{v:c.v});paint()}
$('#g2').onclick=async e=>{const r=e.target.closest('.c');if(!r)return;const c=cs.find(x=>x.id===r.dataset.id);if(e.target.dataset.d)set(c,c.v+ +e.target.dataset.d*c.s);if(e.target.hasAttribute('data-z'))set(c,0);if(e.target.hasAttribute('data-rm')){await api.del(c.id);cs=cs.filter(x=>x!==c);paint()}};
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n)return;cs.push(await api.add({kind:'tc',n,v:0,g:num('g'),s:Math.max(1,num('s'))}));$('#n').value=$('#g').value='';paint()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!cs.length)return;if(e.key==='+'||e.key==='='||e.code==='Space'){e.preventDefault();set(cs[0],cs[0].v+cs[0].s)}if(e.key==='-')set(cs[0],cs[0].v-cs[0].s)});api.list().then(d=>{cs=only(d,'tc').sort((a,b)=>a.createdAt-b.createdAt);paint()});
</script>
