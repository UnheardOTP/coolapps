<!doctype html><meta charset="utf-8"><title>Ohm's Law Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#f59e0b;--w:860px}.tri{display:flex;justify-content:center;margin:6px 0}.f input{font-size:20px}.hint{font-size:13px;color:var(--mut)}</style>
<div class="wrap"><h1>Ohm's Law Calculator</h1><p class="sub">Fill in any two of voltage, current, resistance and power — the other two are calculated.</p>
<div class="card"><div class="g4 f"><div><label>Voltage (V)</label><input id="V" type="number" step="any" data-k="V" value="12"></div><div><label>Current (A)</label><input id="I" type="number" step="any" data-k="I" value=""></div><div><label>Resistance (Ω)</label><input id="R" type="number" step="any" data-k="R" value="470"></div><div><label>Power (W)</label><input id="P" type="number" step="any" data-k="P" value=""></div></div><div class="hint gap" id="h"></div><div class="row gap"><button class="s" id="cl">Clear</button></div></div>
<div class="g2 gap"><div class="card"><h2>Resistors in series / parallel</h2><label>Values in Ω, comma or line separated</label><textarea id="rs" style="min-height:80px" data-keep>100, 220, 470</textarea><div class="g2 gap"><div class="kpi"><small>Series</small><b id="se"></b></div><div class="kpi"><small>Parallel</small><b id="pa"></b></div></div></div>
<div class="card"><h2>Voltage divider</h2><div class="row"><div class="col"><label>Vin (V)</label><input id="vin" type="number" step="any" value="5" data-keep></div><div class="col"><label>R1 (Ω)</label><input id="r1" type="number" step="any" value="10000" data-keep></div><div class="col"><label>R2 (Ω)</label><input id="r2" type="number" step="any" value="10000" data-keep></div></div><div class="kpi gap"><small>Vout = Vin · R2 / (R1 + R2)</small><b id="vo"></b></div></div></div></div>
<script>
let known=['V','R'];const g=k=>{const v=document.getElementById(k).value;return v===''?null:parseFloat(v)};
const eng=(x,u)=>{if(!isFinite(x))return '–';const a=Math.abs(x);const[p,s]=a>=1e6?[1e6,'M']:a>=1e3?[1e3,'k']:a>=1||a===0?[1,'']:a>=1e-3?[1e-3,'m']:[1e-6,'µ'];return +(x/p).toPrecision(4)+' '+s+u};
// Any two of V, I, R, P determine the other two: P=VI, V=IR, so each pair has a closed-form solution.
function solve([a,b]){const o={V:g('V'),I:g('I'),R:g('R'),P:g('P')};const has=(x,y)=>(a===x&&b===y)||(a===y&&b===x),v=k=>o[k];let V,I,R,P;
  if(has('V','I')){V=v('V');I=v('I');R=V/I;P=V*I}else if(has('V','R')){V=v('V');R=v('R');I=V/R;P=V*V/R}else if(has('V','P')){V=v('V');P=v('P');I=P/V;R=V*V/P}else if(has('I','R')){I=v('I');R=v('R');V=I*R;P=I*I*R}else if(has('I','P')){I=v('I');P=v('P');V=P/I;R=P/(I*I)}else{R=v('R');P=v('P');V=Math.sqrt(P*R);I=Math.sqrt(P/R)}return{V,I,R,P}}
function run(e){if(e&&e.target.dataset.k){const k=e.target.dataset.k;known=[k,...known.filter(x=>x!==k)].slice(0,2)}const r=solve(known);$('#h').textContent=`Using ${known.join(' and ')}; the other two are calculated.`;
  for(const k of['V','I','R','P'])if(!known.includes(k))document.getElementById(k).value=isFinite(r[k])?+r[k].toPrecision(6):'';
  const L=$('#rs').value.split(/[\s,;]+/).map(Number).filter(x=>x>0);$('#se').textContent=L.length?eng(L.reduce((a,b)=>a+b,0),'Ω'):'–';$('#pa').textContent=L.length?eng(1/L.reduce((a,b)=>a+1/b,0),'Ω'):'–';$('#vo').textContent=eng(num('vin')*num('r2')/(num('r1')+num('r2')),'V')}
document.addEventListener('input',run);$('#cl').onclick=()=>{for(const k of['V','I','R','P'])document.getElementById(k).value='';known=['V','R'];$('#V').focus()};remember().then(()=>run());
</script>
