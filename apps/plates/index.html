<!doctype html><meta charset="utf-8"><title>Barbell Plate Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0f172a;--w:860px}svg{width:100%;height:150px}.pl{display:inline-flex;align-items:center;gap:6px;margin:0 14px 6px 0}.pl i{display:inline-block;width:16px;height:16px;border-radius:4px}</style>
<div class="wrap"><h1>Barbell Plate Calculator</h1><p class="sub">Tell it the weight you want on the bar and it shows which plates to load on each side.</p>
<div class="card"><div class="row"><div class="col"><label>Target weight</label><input id="t" type="number" step="any" value="142.5" style="font-size:22px" data-keep></div><div class="col"><label>Unit</label><select id="u" data-keep><option>kg</option><option>lb</option></select></div><div class="col"><label>Bar weight</label><input id="b" type="number" step="any" value="20" data-keep></div></div><div class="chips" id="pre"></div>
<label class="gap">Plates you own (per side, comma separated)</label><input id="p" class="mono" value="25, 20, 15, 10, 5, 2.5, 1.25" data-keep></div>
<div class="card"><div class="row"><div class="big" id="load"></div><div class="mut" id="msg"></div></div><svg id="sv" viewBox="0 0 800 150"></svg><div id="lg"></div></div></div>
<script>
const COL={25:'#dc2626',20:'#2563eb',15:'#eab308',10:'#16a34a',5:'#f8fafc',2.5:'#111827',1.25:'#9ca3af',45:'#2563eb',35:'#eab308',55:'#dc2626',100:'#dc2626',.5:'#9ca3af'};
const col=p=>COL[p]||`hsl(${p*37%360},55%,50%)`;
// Greedy: the largest plates that still fit under the per-side weight; whatever remains is reported as the shortfall.
function load(target,bar,plates){let rem=(target-bar)/2;if(rem<0)return{err:'Target is lighter than the bar.'};const out=[];for(const p of [...plates].sort((a,b)=>b-a)){while(rem>=p-1e-9){out.push(p);rem-=p}}return{out,left:Math.max(0,+(rem*2).toFixed(4))}}
function run(){const u=$('#u').value,pl=$('#p').value.split(/[\s,;]+/).map(Number).filter(x=>x>0),r=load(num('t'),num('b'),pl);if(r.err){$('#load').textContent='–';$('#msg').textContent=r.err;$('#sv').innerHTML='';$('#lg').innerHTML='';return}
  const per=r.out.reduce((a,b)=>a+b,0),tot=num('b')+per*2;$('#load').textContent=`${fmt(tot,2).replace(/\.?0+$/,'')} ${u}`;$('#msg').textContent=r.left>0?`⚠ ${r.left} ${u} short of the target with these plates (closest loadable weight shown)`:`${per} ${u} per side`;
  let x=330;const bars=[`<rect x="40" y="70" width="720" height="10" rx="3" fill="#9ca3af"/><rect x="300" y="60" width="34" height="30" fill="#6b7280"/>`];r.out.forEach(p=>{const h=Math.min(140,40+Math.log2(p+1)*24),w=Math.max(10,Math.min(30,6+p*.9));bars.push(`<rect x="${x}" y="${75-h/2}" width="${w}" height="${h}" rx="3" fill="${col(p)}" stroke="#0005"/><text x="${x+w/2}" y="${75+3}" font-size="10" fill="${[5,1.25].includes(p)?'#111':'#fff'}" text-anchor="middle" transform="rotate(-90 ${x+w/2} 75)">${p}</text>`);x+=w+3});$('#sv').innerHTML=bars.join('');
  const c={};r.out.forEach(p=>c[p]=(c[p]||0)+1);$('#lg').innerHTML=Object.entries(c).sort((a,b)=>b[0]-a[0]).map(([p,n])=>`<span class="pl"><i style="background:${col(+p)}"></i><b>${n} × ${p} ${u}</b></span>`).join('')||'<span class="mut">Just the bar.</span>'}
$('#pre').innerHTML=[['Olympic bar (men) 20 kg',20,'kg','25, 20, 15, 10, 5, 2.5, 1.25'],['Women\'s bar 15 kg',15,'kg','25, 20, 15, 10, 5, 2.5, 1.25'],['45 lb bar',45,'lb','45, 35, 25, 10, 5, 2.5'],['35 lb bar',35,'lb','45, 35, 25, 10, 5, 2.5']].map(([n,b,u,p])=>`<span class="chip" data-b="${b}" data-u="${u}" data-p="${p}">${n}</span>`).join('');$('#pre').onclick=e=>{const c=e.target.closest('.chip');if(c){$('#b').value=c.dataset.b;$('#u').value=c.dataset.u;$('#p').value=c.dataset.p;run();$('#b').dispatchEvent(new Event('input',{bubbles:true}))}};
document.addEventListener('input',run);document.addEventListener('change',run);remember().then(run);
</script>
