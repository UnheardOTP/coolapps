<!doctype html><meta charset="utf-8"><title>Maintenance Schedule</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#ea580c;--w:900px}.t{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}.t .b{flex:1}.t small{color:var(--mut)}.t .bar{margin-top:6px;width:100%}.od .bar i{background:var(--bad)}.sn .bar i{background:#f59e0b}.dn{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.od .dn{background:#fee2e2;color:#991b1b}.sn .dn{background:#fef3c7;color:#92400e}.ok3 .dn{background:#dcfce7;color:#166534}@media(prefers-color-scheme:dark){.od .dn{background:#7f1d1d;color:#fecaca}.sn .dn{background:#78350f;color:#fde68a}.ok3 .dn{background:#14532d;color:#bbf7d0}}</style>
<div class="wrap"><h1>Maintenance Schedule</h1><p class="sub">Recurring chores for your home, car and gear — with how overdue each one is.</p>
<div class="card"><div class="chips" id="pre"></div><div class="row gap"><div class="col" style="flex:2"><label>Task</label><input id="n" placeholder="Replace furnace filter"></div><div class="col" style="max-width:150px"><label>Every (days)</label><input id="d" type="number" value="90"></div><div class="col"><label>Last done</label><input id="l" type="date"></div><button id="add">Add</button></div></div>
<div class="card" id="ls"></div></div>
<script>
const PRE=[['Furnace filter',90],['Smoke detector batteries',180],['Oil change',180],['Rotate tires',180],['Clean gutters',180],['Descale kettle',60],['Water heater flush',365],['Deep-clean fridge',90]];let it=[];$('#l').value=dkey(new Date());
$('#pre').innerHTML=PRE.map(([n,d])=>`<span class="chip" data-n="${n}" data-d="${d}">${n} <span class="mut">${d}d</span></span>`).join('');$('#pre').onclick=e=>{const c=e.target.closest('.chip');if(c){$('#n').value=c.dataset.n;$('#d').value=c.dataset.d}};
const due=i=>{const d=pdate(i.last);d.setDate(d.getDate()+i.d);return d};
function paint(){const now=new Date();now.setHours(0,0,0,0);const l=it.map(i=>({i,days:Math.round((due(i)-now)/864e5)})).sort((a,b)=>a.days-b.days);
  $('#ls').innerHTML=l.map(({i,days})=>{const c=days<0?'od':days<=Math.max(7,i.d*.1)?'sn':'ok3',pct=Math.min(100,Math.max(0,(i.d-days)/i.d*100));return`<div class="t ${c}" data-id="${i.id}"><div class="b"><b>${esc(i.n)}</b> <span class="dn">${days<0?`${-days}d overdue`:days===0?'due today':`due in ${days}d`}</span><br><small>every ${i.d} days · last done ${pdate(i.last).toLocaleDateString()} · next ${due(i).toLocaleDateString()}</small><div class="bar"><i style="width:${pct}%"></i></div></div><button class="s" data-done>Done today</button><button class="x" data-rm>✕</button></div>`}).join('')||'<span class="mut">No tasks yet — pick a starter above.</span>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n||!(num('d')>0))return;it.push(await api.add({kind:'mt',n,d:num('d'),last:$('#l').value||dkey(new Date())}));$('#n').value='';paint()};
$('#ls').onclick=async e=>{const r=e.target.closest('.t');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);if(e.target.hasAttribute('data-done')){i.last=dkey(new Date());api.upd(i.id,{last:i.last});paint()}if(e.target.hasAttribute('data-rm')){await api.del(i.id);it=it.filter(x=>x!==i);paint()}};api.list().then(d=>{it=only(d,'mt');paint()});
</script>
