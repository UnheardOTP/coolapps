<!doctype html><meta charset="utf-8"><title>Kanban Board</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#6366f1;--w:1300px}.bd{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}.col{flex:0 0 290px;background:var(--soft);border-radius:14px;padding:12px;min-height:200px}.col.over{outline:2px dashed var(--a)}.col h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.col h2 input{background:none;border:none;font:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:2px 4px;width:150px;box-shadow:none}.cd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;display:flex;gap:8px;align-items:flex-start;box-shadow:0 1px 2px #0001}.cd.dr{opacity:.4}.cd span{flex:1;word-break:break-word}.cd i{font-style:normal;color:var(--mut);cursor:pointer;opacity:0}.cd:hover i{opacity:1}.add input{font-size:14px}.nc{flex:0 0 200px}</style>
<div class="wrap"><h1>Kanban Board</h1><p class="sub">Drag cards between columns. Rename columns by clicking their titles.</p><div class="bd" id="bd"></div></div>
<script>
let cols=[],cards=[],drag=null;
const byCol=id=>cards.filter(c=>c.col===id).sort((a,b)=>a.ord-b.ord);
function paint(){$('#bd').innerHTML=cols.map(c=>`<div class="col" data-col="${c.id}"><h2><input value="${esc(c.n)}" data-cn="${c.id}"><span class="mut" style="font-size:12px">${byCol(c.id).length}${cols.length>1?` <i data-rc="${c.id}" style="cursor:pointer;font-style:normal">✕</i>`:''}</span></h2>${byCol(c.id).map(k=>`<div class="cd" draggable="true" data-id="${k.id}"><span>${esc(k.t)}</span><i data-rk>✕</i></div>`).join('')}<div class="add"><input data-ac="${c.id}" placeholder="+ Add a card"></div></div>`).join('')+`<div class="col nc" style="background:none;border:2px dashed var(--line)"><input id="ncn" placeholder="+ New column"></div>`}
document.addEventListener('dragstart',e=>{const k=e.target.closest('.cd');if(k){drag=k.dataset.id;k.classList.add('dr')}});document.addEventListener('dragend',()=>{drag=null;paint()});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col[data-col]');if(c&&drag){e.preventDefault();document.querySelectorAll('.col').forEach(x=>x.classList.toggle('over',x===c))}});
// Dropping places the card in that column at the position of the card it landed on (or the end).
document.addEventListener('drop',e=>{const col=e.target.closest('.col[data-col]');if(!col||!drag)return;e.preventDefault();const k=cards.find(x=>x.id===drag),before=e.target.closest('.cd'),list=byCol(col.dataset.col).filter(x=>x!==k);const idx=before?list.findIndex(x=>x.id===before.dataset.id):list.length;list.splice(idx<0?list.length:idx,0,k);k.col=col.dataset.col;list.forEach((x,i)=>{if(x.ord!==i||x===k){x.ord=i;api.upd(x.id,{col:x.col,ord:i})}});drag=null;paint()});
document.addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const t=e.target;if(t.dataset.ac&&t.value.trim()){const k=await api.add({kind:'card',col:t.dataset.ac,t:t.value.trim(),ord:byCol(t.dataset.ac).length});cards.push(k);paint();document.querySelector(`[data-ac="${k.col}"]`).focus()}if(t.id==='ncn'&&t.value.trim()){cols.push(await api.add({kind:'col',n:t.value.trim(),ord:cols.length}));paint()}});
document.addEventListener('change',e=>{const id=e.target.dataset.cn;if(id){const c=cols.find(x=>x.id===id);c.n=e.target.value;api.upd(id,{n:c.n})}});
document.addEventListener('click',async e=>{if(e.target.hasAttribute('data-rk')){const id=e.target.closest('.cd').dataset.id;await api.del(id);cards=cards.filter(x=>x.id!==id);paint()}const rc=e.target.dataset.rc;if(rc&&confirm('Delete this column and its cards?')){await Promise.all(byCol(rc).map(k=>api.del(k.id)));cards=cards.filter(k=>k.col!==rc);await api.del(rc);cols=cols.filter(c=>c.id!==rc);paint()}});
api.list().then(async d=>{cols=only(d,'col').sort((a,b)=>a.ord-b.ord);cards=only(d,'card');if(!cols.length)for(const n of['To do','Doing','Done'])cols.push(await api.add({kind:'col',n,ord:cols.length}));paint()});
</script>
