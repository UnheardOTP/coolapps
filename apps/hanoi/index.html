<!doctype html><meta charset="utf-8"><title>Hanoi</title><script src="/shared/lib.js"></script>
<style>body{margin:0;min-height:100vh;background:linear-gradient(#f6e7c8,#e3c99a);color:#4a2f14;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;padding-top:30px}
h1{margin:0;font-size:42px;letter-spacing:.1em}.bar{display:flex;gap:26px;align-items:center;margin:12px 0}select,button{font:inherit;padding:7px 14px;border:2px solid #4a2f14;background:#fff8e8;cursor:pointer}
#w{display:flex;gap:30px}.peg{position:relative;width:260px;height:300px;display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;padding-bottom:18px}.peg::before{content:'';position:absolute;bottom:18px;width:12px;height:240px;background:#7a4a22;border-radius:6px 6px 0 0}.peg::after{content:'';position:absolute;bottom:0;width:250px;height:18px;background:#5a3414;border-radius:4px}
.peg.sel{background:#ffffff40;border-radius:10px}.d{position:relative;z-index:1;height:26px;border-radius:13px;margin-top:2px;box-shadow:0 3px 0 #0003;transition:transform .15s}.d.lift{transform:translateY(-30px)}#m{height:30px;font-style:italic;font-size:20px}</style>
<h1>Tower of Hanoi</h1><div class="bar"><label>Discs <select id="n"></select></label><span>Moves <b id="mv">0</b> · Minimum <b id="min"></b> · Best <b id="best">–</b></span><button id="r">Restart</button></div><div id="m">Move the whole stack to the right peg. Never put a big disc on a small one.</div><div id="w"></div>
<script>
let pegs,n=4,sel=null,moves=0,done=false,runs=[];
const COL=['#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d','#6a4c93','#b5838d'];
$('#n').innerHTML=[3,4,5,6,7].map(k=>`<option ${k===n?'selected':''}>${k}</option>`).join('');
function reset(){n=+$('#n').value;pegs=[Array.from({length:n},(_,i)=>n-i),[],[]];sel=null;moves=0;done=false;$('#m').textContent='Move the whole stack to the right peg. Never put a big disc on a small one.';draw()}
function draw(){$('#mv').textContent=moves;$('#min').textContent=2**n-1;const b=runs.filter(r=>r.n===n).map(r=>r.moves);$('#best').textContent=b.length?Math.min(...b):'–';
$('#w').innerHTML=pegs.map((p,i)=>`<div class="peg ${sel===i?'sel':''}" data-i="${i}">${p.map((d,k)=>`<div class="d ${sel===i&&k===p.length-1?'lift':''}" style="width:${50+d*26}px;background:${COL[d-1]}"></div>`).join('')}</div>`).join('')}
// Click a peg to lift its top disc, click another to drop it (only onto a larger disc or an empty peg).
$('#w').onclick=async e=>{const p=e.target.closest('.peg');if(!p||done)return;const i=+p.dataset.i;
  if(sel===null){if(pegs[i].length)sel=i}else if(sel===i)sel=null;else{const d=pegs[sel].at(-1),t=pegs[i].at(-1);if(!t||d<t){pegs[sel].pop();pegs[i].push(d);moves++;sel=null}else{$('#m').textContent='A larger disc can\'t sit on a smaller one.';sel=null}}
  draw();if(pegs[2].length===n){done=true;$('#m').textContent=moves===2**n-1?'Perfect solution!':'Solved!';runs.push(await api.add({n,moves}));draw()}};
$('#n').onchange=reset;$('#r').onclick=reset;api.list().then(d=>{runs=d;reset()});
</script>
