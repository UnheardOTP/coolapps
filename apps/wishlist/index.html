<!doctype html><meta charset="utf-8"><title>Wishlist</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#d946ef;--w:900px}.w{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.w.got{opacity:.5}.w.got b.n{text-decoration:line-through}.w .b{flex:1;min-width:0}.pr{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.w a{color:var(--a);font-size:13px}</style>
<div class="wrap"><h1>Wishlist</h1><p class="sub">Things you want, ranked by how much — with the running total so you can plan purchases.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Item</label><input id="n"></div><div class="col" style="max-width:120px"><label>Price ($)</label><input id="p" type="number" step="0.01"></div><div class="col"><label>Priority</label><select id="pr"><option value="1">Must have</option><option value="2" selected>Want</option><option value="3">Someday</option></select></div><div class="col"><label>Link (optional)</label><input id="l" type="url" placeholder="https://"></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><div class="row"><div class="col"><select id="sort"><option value="p">Sort by priority</option><option value="pr">Sort by price (low → high)</option><option value="prh">Sort by price (high → low)</option><option value="n">Sort by name</option></select></div><label style="margin:0 0 9px"><input type="checkbox" id="hg"> hide purchased</label></div><div id="ls"></div></div></div>
<script>
let it=[];const PC={1:'#ef4444',2:'#f59e0b',3:'#94a3b8'},safe=u=>/^https?:\/\//i.test(u)?u:'';
function paint(){const open=it.filter(i=>!i.got),T=open.reduce((n,i)=>n+i.p,0),must=open.filter(i=>i.pr===1).reduce((n,i)=>n+i.p,0);$('#kp').innerHTML=[['Still wanted',open.length],['Total cost',money(T)],['Must-haves',money(must)],['Bought so far',money(it.filter(i=>i.got).reduce((n,i)=>n+i.p,0))]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  const s=$('#sort').value,l=it.filter(i=>!($('#hg').checked&&i.got)).sort((a,b)=>a.got-b.got||(s==='p'?a.pr-b.pr||a.p-b.p:s==='pr'?a.p-b.p:s==='prh'?b.p-a.p:a.n.localeCompare(b.n)));
  $('#ls').innerHTML=l.map(i=>`<div class="w ${i.got?'got':''}" data-id="${i.id}"><input type="checkbox" ${i.got?'checked':''} style="width:20px;height:20px" title="Mark as bought"><div class="b"><b class="n"><span class="pr" style="background:${PC[i.pr]}"></span>${esc(i.n)}</b>${safe(i.l)?`<br><a href="${esc(safe(i.l))}" target="_blank" rel="noopener noreferrer">${esc(new URL(i.l).hostname.replace(/^www\./,''))} ↗</a>`:''}</div><b>${money(i.p)}</b><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">Nothing on the list yet.</span>'}
$('#add').onclick=async()=>{const n=$('#n').value.trim();if(!n)return;it.push(await api.add({kind:'wish',n,p:num('p'),pr:+$('#pr').value,l:$('#l').value.trim(),got:false}));$('#n').value=$('#p').value=$('#l').value='';paint()};
$('#ls').onchange=e=>{const r=e.target.closest('.w');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);i.got=e.target.checked;api.upd(i.id,{got:i.got});paint()};$('#ls').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('.w').dataset.id;await api.del(id);it=it.filter(x=>x.id!==id);paint()};$('#sort').onchange=$('#hg').onchange=paint;api.list().then(d=>{it=only(d,'wish');paint()});
</script>
