<!doctype html><meta charset="utf-8"><title>Git Cheatsheet</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#f05133;--w:980px}.cm{display:flex;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.cm code{flex:none;width:46%;background:var(--soft);padding:5px 10px;border-radius:7px;font:13px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;word-break:break-all}.cm code:hover{outline:2px solid var(--a)}.cm span{flex:1;color:var(--mut)}.cm i{font-style:normal;cursor:pointer;color:var(--mut)}.cm i.on{color:#f59e0b}</style>
<div class="wrap"><h1>Git Cheatsheet</h1><p class="sub">Click a command to copy it. Star the ones you reach for most.</p>
<div class="card"><input id="q" placeholder="Search commands or descriptions…" data-keep><div class="tabs gap" id="tabs"></div><div id="list"></div></div></div>
<script>
const G={'Setup':[['git init','Create a new repository here'],['git clone <url>','Copy a remote repository locally'],['git config --global user.name "Name"','Set your commit name'],['git config --global user.email "me@x.com"','Set your commit email']],
'Basics':[['git status','Show changed and staged files'],['git add <file>','Stage a file'],['git add -p','Stage changes interactively, hunk by hunk'],['git commit -m "msg"','Commit staged changes'],['git commit --amend','Edit the last commit'],['git diff','Unstaged changes'],['git diff --staged','Staged changes'],['git log --oneline --graph','Compact history graph'],['git show <commit>','Show one commit']],
'Branches':[['git branch','List local branches'],['git switch -c <name>','Create and switch to a branch'],['git switch <name>','Switch branches'],['git merge <name>','Merge a branch into the current one'],['git rebase <base>','Replay commits on top of another base'],['git branch -d <name>','Delete a merged branch'],['git cherry-pick <commit>','Apply one commit here']],
'Remotes':[['git remote -v','List remotes'],['git fetch','Download remote changes without merging'],['git pull --rebase','Fetch and rebase local commits'],['git push -u origin <branch>','Push and set upstream'],['git push --force-with-lease','Safer force push']],
'Undo':[['git restore <file>','Discard working-tree changes to a file'],['git restore --staged <file>','Unstage a file'],['git reset --soft HEAD~1','Undo last commit, keep changes staged'],['git reset --hard HEAD~1','Undo last commit and discard changes'],['git revert <commit>','Make a new commit that undoes one'],['git reflog','Find "lost" commits'],['git clean -fd','Delete untracked files and folders']],
'Stash':[['git stash','Shelve changes'],['git stash -u','Shelve including untracked files'],['git stash list','List stashes'],['git stash pop','Reapply the latest stash and drop it']],
'Inspect':[['git blame <file>','Who changed each line'],['git log -S"text"','Find commits that added/removed text'],['git bisect start','Binary-search for a bad commit'],['git shortlog -sn','Commits per author'],['git diff main...HEAD','Changes on this branch since it diverged']],
'Tags':[['git tag <name>','Create a lightweight tag'],['git tag -a v1.0 -m "msg"','Create an annotated tag'],['git push --tags','Push all tags']]};
let cat='All',favs=new Set(),doc=null;
function render(){const q=$('#q').value.toLowerCase();$('#tabs').innerHTML=['All','★ Starred',...Object.keys(G)].map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join('');
  const rows=Object.entries(G).flatMap(([g,l])=>l.map(([c,d])=>({g,c,d}))).filter(r=>(cat==='All'||cat==='★ Starred'&&favs.has(r.c)||cat===r.g)&&(!q||(r.c+r.d).toLowerCase().includes(q)));
  $('#list').innerHTML=rows.map(r=>`<div class="cm"><code data-c="${esc(r.c)}">${esc(r.c)}</code><span>${esc(r.d)}</span><i data-f="${esc(r.c)}" class="${favs.has(r.c)?'on':''}">${favs.has(r.c)?'★':'☆'}</i></div>`).join('')||'<span class="mut">Nothing matches.</span>'}
$('#tabs').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};$('#q').oninput=render;
$('#list').onclick=async e=>{if(e.target.dataset.c)return copy(e.target.dataset.c,e.target);const f=e.target.dataset.f;if(!f)return;favs.has(f)?favs.delete(f):favs.add(f);render();const l=[...favs];if(doc)api.upd(doc.id,{l});else doc=await api.add({kind:'favs',l})};
api.list().then(d=>{doc=d.find(x=>x.kind==='favs')||null;if(doc)favs=new Set(doc.l);remember().then(render)});
</script>
