<!doctype html><meta charset="utf-8"><title>Break-Even Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#b45309;--w:900px}svg{width:100%;height:260px;background:var(--soft);border-radius:10px}</style>
<div class="wrap"><h1>Break-Even Calculator</h1><p class="sub">How many units must you sell before you stop losing money?</p>
<div class="card"><div class="g4"><div><label>Fixed costs ($/period)</label><input id="f" type="number" value="4500" data-keep></div><div><label>Variable cost per unit ($)</label><input id="v" type="number" value="12" step="0.01" data-keep></div><div><label>Selling price per unit ($)</label><input id="p" type="number" value="30" step="0.01" data-keep></div><div><label>Target profit ($)</label><input id="t" type="number" value="0" data-keep></div></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Revenue vs cost</h2><svg id="sv" viewBox="0 0 800 260" preserveAspectRatio="none"></svg><div class="mut"><span style="color:#16a34a">■</span> revenue &nbsp; <span style="color:#dc2626">■</span> total cost</div></div><div class="card"><h2>Saved scenarios</h2><div id="sv2"></div></div></div>
<script>
function run(){const F=num('f'),V=num('v'),P=num('p'),T=num('t'),cm=P-V;if(cm<=0){$('#kp').innerHTML='<div class="kpi" style="grid-column:1/-1"><b class="bad">Price must be higher than variable cost per unit.</b></div>';$('#sv').innerHTML='';return}
  const be=F/cm,tu=(F+T)/cm;$('#kp').innerHTML=[['Break-even units',Math.ceil(be).toLocaleString()],['Break-even revenue',money(be*P)],['Contribution margin',`${money(cm)} (${fmt(cm/P*100,1)}%)`],[T?'Units for target profit':'Margin of safety @ 2× BE',T?Math.ceil(tu).toLocaleString():'sell '+Math.ceil(be*2).toLocaleString()]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  const X=Math.max(be*2,1),Y=Math.max(X*P,F+X*V),sx=u=>u/X*800,sy=y=>260-y/Y*250;$('#sv').innerHTML=`<polyline fill="none" stroke="#16a34a" stroke-width="3" points="0,${sy(0)} 800,${sy(X*P)}"/><polyline fill="none" stroke="#dc2626" stroke-width="3" points="0,${sy(F)} 800,${sy(F+X*V)}"/><line x1="${sx(be)}" x2="${sx(be)}" y1="0" y2="260" stroke="#64748b" stroke-dasharray="6 5"/><circle cx="${sx(be)}" cy="${sy(be*P)}" r="7" fill="var(--a)"/><text x="${sx(be)+10}" y="${sy(be*P)-10}" fill="currentColor" font-size="14">break-even: ${Math.ceil(be)} units</text>`}
document.addEventListener('input',run);const ids=['f','v','p','t'];savedBar($('#sv2'),{get:()=>Object.fromEntries(ids.map(i=>[i,$('#'+i).value])),set:d=>{ids.forEach(i=>$('#'+i).value=d[i]);run()}});remember().then(run);
</script>
