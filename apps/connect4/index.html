<!doctype html><meta charset="utf-8"><title>Connect 4</title><script src="/shared/lib.js"></script>
<style>body{margin:0;min-height:100vh;background:#0d1b3d;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding-top:30px}
h1{margin:0;font-size:42px;letter-spacing:.15em}#m{height:34px;font-size:22px;margin:8px 0}#b{background:#1b4fd8;padding:12px;border-radius:16px;display:grid;grid-template-columns:repeat(7,70px);gap:8px;box-shadow:0 14px 0 #0a2a8a}
.c{width:70px;height:70px;border-radius:50%;background:#0d1b3d;cursor:pointer;box-shadow:inset 0 6px 10px #0008;transition:background .2s}.c.r{background:radial-gradient(#ff7a7a,#e02424)}.c.y{background:radial-gradient(#ffe97a,#e0b800)}.c.w{box-shadow:0 0 0 5px #fff,0 0 20px #fff}
button{margin-top:26px;font:inherit;background:#ffd23f;color:#0d1b3d;border:none;padding:10px 26px;border-radius:22px;font-weight:700;cursor:pointer}.rec{margin-top:16px;color:#9db4ff}</style>
<h1>CONNECT 4</h1><div id="m"></div><div id="b"></div><div class="rec" id="rec"></div><button id="n">New game</button>
<script>
const R=6,C=7;let b,turn,over,hist=[];
const at=(r,c)=>r>=0&&r<R&&c>=0&&c<C?b[r*C+c]:null;
function line(p){for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[0,1,2,3].map(k=>[r+dr*k,c+dc*k]);if(cells.every(([a,d])=>at(a,d)===p))return cells}return null}
const drop=(c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r*C+c]){b[r*C+c]=p;return r}return -1};
const undo=(c)=>{for(let r=0;r<R;r++)if(b[r*C+c]){b[r*C+c]='';return}};
// Computer: win now > block now > avoid giving the opponent a win > prefer the centre.
function ai(){const cols=[...Array(C).keys()].filter(c=>!b[c]);
  for(const p of['y','r'])for(const c of cols){drop(c,p);const w=line(p);undo(c);if(w)return c}
  const safe=cols.filter(c=>{drop(c,'y');const has=cols.some(d=>{if(b[d])return false;drop(d,'r');const w=line('r');undo(d);return w});undo(c);return!has});
  const pool=safe.length?safe:cols;return pool.sort((a,d)=>Math.abs(a-3)-Math.abs(d-3)||Math.random()-.5)[0]}
function reset(){b=Array(R*C).fill('');turn='r';over=false;$('#m').textContent='Your turn (red)';draw()}
function draw(w){$('#b').innerHTML=b.map((v,i)=>`<div class="c ${v} ${w&&w.some(([r,c])=>r*C+c===i)?'w':''}" data-c="${i%C}"></div>`).join('');const n=k=>hist.filter(h=>h.r===k).length;$('#rec').textContent=`You ${n('win')} · Draws ${n('draw')} · Computer ${n('loss')}`}
async function end(p){over=true;const w=p&&line(p),r=p==='r'?'win':p==='y'?'loss':'draw';$('#m').textContent={win:'You win!',loss:'Computer wins',draw:'Draw'}[r];hist.push(await api.add({r}));draw(w)}
$('#b').onclick=async e=>{const c=e.target.closest('.c');if(!c||over||turn!=='r')return;if(drop(+c.dataset.c,'r')<0)return;draw();if(line('r'))return end('r');if(b.every(Boolean))return end();
  turn='y';setTimeout(async()=>{drop(ai(),'y');draw();if(line('y'))return end('y');if(b.every(Boolean))return end();turn='r'},350)};
$('#n').onclick=reset;api.list().then(d=>{hist=d;reset()});
</script>
