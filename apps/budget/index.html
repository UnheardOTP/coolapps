<!doctype html><meta charset="utf-8"><title>Monthly Budget</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:1000px}.cat{padding:10px 0;border-bottom:1px solid var(--line)}.cat .bar{margin:6px 0 2px}.cat.over .bar i{background:var(--bad)}.cat.warn .bar i{background:#f59e0b}.cat input.pl{width:100px;text-align:right}</style>
<div class="wrap"><h1>Monthly Budget</h1><p class="sub">Plan each category, log spending as it happens, and see what's left. Each month is tracked separately.</p>
<div class="row" style="margin-bottom:14px"><button class="s" id="pv">‹</button><b id="mt" style="min-width:160px;text-align:center"></b><button class="s" id="nx">›</button></div><div class="g4" id="kp"></div>
<div class="g2 gap"><div class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0;flex:1">Categories</h2></div><div class="row"><div class="col"><label>Monthly income ($)</label><input id="inc" type="number" step="any"></div></div><div id="cs" class="gap"></div><div class="row gap"><div class="col"><input id="cn" placeholder="New category (Groceries…)"></div><button class="s" id="ca">Add</button></div></div>
<div class="card"><h2>Log spending</h2><div class="row"><div class="col"><label>Category</label><select id="tc"></select></div><div class="col"><label>Amount ($)</label><input id="ta" type="number" step="0.01"></div></div><div class="row gap"><div class="col"><input id="tn" placeholder="Note (optional)"></div><button id="tx">Add</button></div><div id="tl" class="gap" style="max-height:300px;overflow:auto"></div></div></div></div>
<script>
let view=new Date(),cats=[],tx=[],inc={};const mk=()=>dkey(view).slice(0,7);
const spent=c=>tx.filter(t=>t.c===c.id&&t.m===mk()).reduce((n,t)=>n+t.a,0);
function paint(){$('#mt').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});const I=inc[mk()]?.v||0;$('#inc').value=I||'';const P=cats.reduce((n,c)=>n+c.p,0),S=tx.filter(t=>t.m===mk()).reduce((n,t)=>n+t.a,0);
  $('#kp').innerHTML=[['Income',money(I)],['Planned',money(P)],['Spent',money(S)],['Left of income',money(I-S)]].map(([k,v],i)=>`<div class="kpi"><small>${k}</small><b ${i===3?`class="${I-S>=0?'ok':'bad'}"`:''}>${v}</b></div>`).join('');
  $('#cs').innerHTML=cats.map(c=>{const s=spent(c),pc=c.p?s/c.p*100:0;return`<div class="cat ${pc>100?'over':pc>85?'warn':''}" data-id="${c.id}"><div class="row" style="flex-wrap:nowrap;align-items:center"><b style="flex:1">${esc(c.n)}</b><span class="mut">${money(s)} of</span><input class="pl" type="number" step="any" value="${c.p}"><button class="x" data-rm>✕</button></div><div class="bar"><i style="width:${Math.min(100,pc)}%"></i></div><small class="${pc>100?'bad':'mut'}">${c.p?(pc>100?money(s-c.p)+' over':money(c.p-s)+' left'):'set a plan'}</small></div>`}).join('')||'<span class="mut">Add your first category.</span>';
  $('#tc').innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('');$('#tl').innerHTML=tx.filter(t=>t.m===mk()).sort((a,b)=>b.at-a.at).map(t=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap" data-t="${t.id}"><span class="mut" style="width:64px">${new Date(t.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span style="flex:1">${esc(cats.find(c=>c.id===t.c)?.n||'?')} ${t.n?`<span class="mut">· ${esc(t.n)}</span>`:''}</span><b>${money(t.a)}</b><button class="x" data-rt>✕</button></div>`).join('')||'<span class="mut">No spending logged this month.</span>'}
const go=d=>{view=new Date(view.getFullYear(),view.getMonth()+d,1);paint()};$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#ca').onclick=async()=>{const n=$('#cn').value.trim();if(!n)return;cats.push(await api.add({kind:'cat',n,p:0}));$('#cn').value='';paint()};
$('#tx').onclick=async()=>{const a=num('ta');if(!(a>0)||!$('#tc').value)return;tx.push(await api.add({kind:'tx',c:$('#tc').value,a,n:$('#tn').value.trim(),m:mk(),at:Date.now()}));$('#ta').value=$('#tn').value='';paint()};
let t;$('#cs').oninput=e=>{const r=e.target.closest('.cat');if(!r||!e.target.classList.contains('pl'))return;const c=cats.find(x=>x.id===r.dataset.id);c.p=parseFloat(e.target.value)||0;clearTimeout(t);t=setTimeout(()=>{api.upd(c.id,{p:c.p});paint()},700)};
$('#cs').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('.cat').dataset.id;await api.del(id);cats=cats.filter(c=>c.id!==id);paint()};$('#tl').onclick=async e=>{if(!e.target.hasAttribute('data-rt'))return;const id=e.target.closest('[data-t]').dataset.t;await api.del(id);tx=tx.filter(x=>x.id!==id);paint()};
$('#inc').oninput=async()=>{const v=num('inc'),k=mk();clearTimeout(window.__t);window.__t=setTimeout(async()=>{if(inc[k]){inc[k].v=v;api.upd(inc[k].id,{v})}else inc[k]=await api.add({kind:'inc',m:k,v});paint()},700)};
api.list().then(d=>{cats=only(d,'cat').sort((a,b)=>a.createdAt-b.createdAt);tx=only(d,'tx');only(d,'inc').forEach(i=>inc[i.m]=i);paint()});
</script>
