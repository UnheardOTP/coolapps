<!doctype html><meta charset="utf-8"><title>Image Palette Extractor</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#db2777;--w:960px}#drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mut);cursor:pointer}#cv{max-width:100%;border-radius:10px;cursor:crosshair;display:block}.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.sw div{border-radius:12px;height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;cursor:pointer;font:600 13px ui-monospace,monospace;box-shadow:inset 0 0 0 1px #0002}</style>
<div class="wrap"><h1>Image Palette Extractor</h1><p class="sub">Drop in a photo to pull out its dominant colors, or click anywhere on the image to pick one pixel.</p>
<div class="card"><div id="drop">Drop an image here, or click to choose one<input type="file" id="f" accept="image/*" hidden></div></div>
<div class="card hide" id="rs"><canvas id="cv"></canvas><div class="row gap"><div class="col"><label>Colors to extract: <b id="nv">6</b></label><input type="range" id="n" min="3" max="12" value="6"></div><div class="kpi" id="pk" style="min-width:200px"><small>Picked pixel</small><b>click the image</b></div></div></div>
<div class="card hide" id="pl"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Palette</h2><button class="x right" id="cc">Copy as CSS variables</button><button class="x" id="ch">Copy hex list</button></div><div class="sw" id="sw"></div></div></div>
<script>
let cols=[],cv=$('#cv'),cx=cv.getContext('2d',{willReadFrequently:true});const hex=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
// Quantise pixels into 4-bit-per-channel buckets, rank buckets by population, then keep the most common buckets that are visibly different from those already chosen.
function palette(n){const d=cx.getImageData(0,0,cv.width,cv.height).data,b=new Map();for(let i=0;i<d.length;i+=4*3){if(d[i+3]<200)continue;const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|d[i+2]>>4,e=b.get(k)||{n:0,r:0,g:0,b:0};e.n++;e.r+=d[i];e.g+=d[i+1];e.b+=d[i+2];b.set(k,e)}
  const all=[...b.values()].sort((a,b)=>b.n-a.n).map(e=>[e.r/e.n,e.g/e.n,e.b/e.n,e.n]),out=[];for(const c of all){if(out.every(o=>Math.hypot(o[0]-c[0],o[1]-c[1],o[2]-c[2])>(n>8?38:55)))out.push(c);if(out.length>=n)break}return out}
const ink=c=>(c[0]*.299+c[1]*.587+c[2]*.114)>150?'#111':'#fff';
function show(){cols=palette(+$('#n').value);$('#nv').textContent=$('#n').value;$('#sw').innerHTML=cols.map(c=>`<div data-h="${hex(c)}" style="background:${hex(c)};color:${ink(c)}">${hex(c).toUpperCase()}<span style="font-weight:400;font-size:11px">${fmt(c[3]/cols.reduce((n,x)=>n+x[3],0)*100,0)}%</span></div>`).join('');$('#pl').classList.remove('hide')}
function load(f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,700/i.naturalWidth);cv.width=Math.round(i.naturalWidth*s);cv.height=Math.round(i.naturalHeight*s);cx.drawImage(i,0,0,cv.width,cv.height);$('#rs').classList.remove('hide');show()};i.src=r.result};r.readAsDataURL(f)}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*cv.width/r.width),y=Math.floor((e.clientY-r.top)*cv.height/r.height),p=cx.getImageData(x,y,1,1).data,h=hex([...p]);$('#pk').innerHTML=`<small>Picked pixel (click to copy)</small><b style="color:${h}">■ ${h.toUpperCase()}</b>`;$('#pk').onclick=()=>copy(h,$('#pk b'))};
$('#sw').onclick=e=>{const d=e.target.closest('[data-h]');if(d)copy(d.dataset.h,d)};$('#n').oninput=show;$('#ch').onclick=e=>copy(cols.map(hex).join('\n'),e.target);$('#cc').onclick=e=>copy(':root {\n'+cols.map((c,i)=>`  --color-${i+1}: ${hex(c)};`).join('\n')+'\n}',e.target);
$('#drop').onclick=()=>$('#f').click();$('#f').onchange=e=>load(e.target.files[0]);$('#drop').ondragover=e=>e.preventDefault();$('#drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
</script>
