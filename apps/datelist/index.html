<!doctype html><meta charset="utf-8"><title>Date List Generator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0891b2;--w:860px}.dow label{display:inline-flex;gap:5px;align-items:center;margin:0 12px 0 0;color:var(--fg);font-weight:400}</style>
<div class="wrap"><h1>Date List Generator</h1><p class="sub">Generate a run of dates — every week, every 10 days, the first of each month — for schedules, invoices and calendars.</p>
<div class="card"><div class="g4"><div><label>Start date</label><input id="s" type="date" data-keep></div><div><label>Repeat every</label><input id="n" type="number" min="1" value="1" data-keep></div><div><label>Unit</label><select id="u" data-keep><option>days</option><option selected>weeks</option><option>months</option><option>years</option></select></div><div><label>How many</label><input id="c" type="number" min="1" max="500" value="12" data-keep></div></div>
<label class="gap">Only on these weekdays</label><div class="dow" id="dow"></div>
<div class="row gap"><div class="col"><label>Format</label><select id="f" data-keep><option value="iso">2026-10-25</option><option value="us">10/25/2026</option><option value="eu">25/10/2026</option><option value="long">Sunday, October 25, 2026</option><option value="short">Oct 25</option></select></div><div class="col"><label>Separator</label><select id="sep" data-keep><option value="nl">new line</option><option value="comma">comma</option><option value="tab">tab</option></select></div><button id="go">Generate</button></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0" id="st"></h2><button class="x right" id="cp">Copy</button></div><div class="out" id="out" style="max-height:380px;overflow:auto"></div></div></div>
<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];$('#dow').innerHTML=DAYS.map((d,i)=>`<label><input type="checkbox" data-d="${i}" checked data-keep id="d${i}"> ${d}</label>`).join('');
const FMT={iso:d=>dkey(d),us:d=>`${pad2(d.getMonth()+1)}/${pad2(d.getDate())}/${d.getFullYear()}`,eu:d=>`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`,long:d=>d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}),short:d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
function gen(){if(!$('#s').value)$('#s').value=dkey(new Date());const s=pdate($('#s').value),n=Math.max(1,num('n')),u=$('#u').value,c=Math.min(500,Math.max(1,num('c'))),ok=DAYS.map((_,i)=>$('#d'+i).checked),out=[];
  // Step from the start by the interval; weekdays that are unticked are skipped (and don't count toward the total).
  for(let i=0;out.length<c&&i<5000;i++){const d=new Date(s);if(u==='days')d.setDate(s.getDate()+i*n);else if(u==='weeks')d.setDate(s.getDate()+i*n*7);else if(u==='months'){d.setMonth(s.getMonth()+i*n);if(d.getDate()!==s.getDate())d.setDate(0)}else{d.setFullYear(s.getFullYear()+i*n);if(d.getDate()!==s.getDate())d.setDate(0)}if(ok[d.getDay()])out.push(FMT[$('#f').value](d))}
  $('#out').textContent=out.join(({nl:'\n',comma:', ',tab:'\t'})[$('#sep').value]);$('#st').textContent=`${out.length} date${out.length===1?'':'s'}`}
$('#go').onclick=gen;document.addEventListener('input',gen);document.addEventListener('change',gen);$('#cp').onclick=e=>copy($('#out').textContent,e.target);remember().then(gen);
</script>
