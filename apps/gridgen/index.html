<!doctype html><meta charset="utf-8"><title>CSS Grid Generator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#10b981;--w:1000px}#pv{min-height:300px;background:var(--soft);border:2px dashed var(--line);border-radius:10px;padding:8px}#pv div{background:var(--a);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:6px;min-height:50px}</style>
<div class="wrap"><h1>CSS Grid Generator</h1><p class="sub">Define columns, rows and gaps, then copy the CSS. Tracks accept any value: <code>1fr</code>, <code>200px</code>, <code>minmax(100px,1fr)</code>, <code>repeat(3,1fr)</code>.</p>
<div class="card"><div id="pv"></div></div>
<div class="card"><div class="g2"><div><label>grid-template-columns</label><input id="gc" class="mono" value="repeat(3, 1fr)" data-keep></div><div><label>grid-template-rows</label><input id="gr" class="mono" value="auto" data-keep></div></div>
<div class="g4 gap"><div><label>Column gap (px)</label><input id="cg" type="number" value="12" data-keep></div><div><label>Row gap (px)</label><input id="rg" type="number" value="12" data-keep></div><div><label>justify-items</label><select id="ji" data-keep><option>stretch</option><option>start</option><option>center</option><option>end</option></select></div><div><label>align-items</label><select id="ai" data-keep><option>stretch</option><option>start</option><option>center</option><option>end</option></select></div></div>
<div class="row gap"><div class="col"><label>Items <b id="nv"></b></label><input type="range" id="n" min="1" max="24" value="9" data-keep></div><label style="margin:0 0 9px"><input type="checkbox" id="sp" data-keep> Make some items span 2 columns</label></div><div class="chips" id="pre"></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">CSS</h2><button class="x right" id="cp">Copy</button></div><div class="out" id="css"></div></div></div>
<script>
function run(){const n=+$('#n').value;$('#nv').textContent=n;const css=`display: grid;\ngrid-template-columns: ${$('#gc').value||'none'};\ngrid-template-rows: ${$('#gr').value||'auto'};\ncolumn-gap: ${num('cg')}px;\nrow-gap: ${num('rg')}px;\njustify-items: ${$('#ji').value};\nalign-items: ${$('#ai').value};`;
  const pv=$('#pv');pv.style.cssText='';css.split('\n').forEach(l=>{const[k,v]=l.replace(';','').split(': ');pv.style.setProperty(k,v)});pv.style.padding='8px';
  pv.innerHTML=Array.from({length:n},(_,i)=>`<div style="${$('#sp').checked&&i%4===1?'grid-column:span 2;':''}${$('#ai').value==='stretch'?'':'min-height:50px;padding:0 18px'}">${i+1}</div>`).join('');$('#css').textContent=css+($('#sp').checked?'\n\n/* every 4th item */\n.item:nth-child(4n+2) { grid-column: span 2; }':'')}
$('#pre').innerHTML=[['3 equal','repeat(3, 1fr)','auto'],['Sidebar + main','240px 1fr','auto'],['Holy grail','200px 1fr 200px','auto 1fr auto'],['Auto-fit cards','repeat(auto-fit, minmax(160px, 1fr))','auto'],['12-column','repeat(12, 1fr)','auto']].map(([n,c,r])=>`<span class="chip" data-c="${c}" data-r="${r}">${n}</span>`).join('');$('#pre').onclick=e=>{const c=e.target.closest('.chip');if(c){$('#gc').value=c.dataset.c;$('#gr').value=c.dataset.r;run();$('#gc').dispatchEvent(new Event('input',{bubbles:true}))}};
document.addEventListener('input',run);document.addEventListener('change',run);$('#cp').onclick=e=>copy($('#css').textContent,e.target);remember().then(run);
</script>
