<!doctype html><meta charset="utf-8"><title>Multi Timers</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#ea580c;--w:900px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.tm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;position:relative}.tm.done{border-color:var(--a);animation:pl 1s infinite}@keyframes pl{50%{background:color-mix(in srgb,var(--a) 15%,var(--card))}}.tm .n{font-weight:600}.tm .t{font:300 46px ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;margin:6px 0}.tm .bar{margin:8px 0 12px}.tm button{padding:6px 14px}.tm .x2{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);cursor:pointer;padding:0 4px}</style>
<div class="wrap"><h1>Multi Timers</h1><p class="sub">Run several named countdowns at once, like a kitchen full of pots. Your timer presets are remembered.</p>
<div class="card"><div class="chips" id="pre"></div><div class="row gap"><div class="col" style="flex:2"><label>Name</label><input id="n" placeholder="Pasta"></div><div class="col"><label>Minutes</label><input id="m" type="number" min="0" step="any" value="10"></div><div class="col"><label>Seconds</label><input id="s" type="number" min="0" value="0"></div><button id="add">Start timer</button><button class="s" id="sp" title="Save as preset">★ Save preset</button></div></div>
<div class="g" id="g"></div></div>
<script>
let timers=[],presets=[],ac,id=0;
const beep=()=>{try{ac||=new AudioContext();for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.3;o.frequency.value=880;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.25)}}catch{}};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600);return(h?h+':':'')+pad2(Math.floor(s%3600/60))+':'+pad2(s%60)};
function add(name,sec){timers.push({id:++id,name:name||'Timer',total:sec,end:Date.now()+sec*1000,paused:null,done:false})}
function paint(){const el=$('#g');const now=Date.now();timers.forEach(t=>{const left=t.paused!=null?t.paused:(t.end-now)/1000;if(left<=0&&!t.done){t.done=true;beep()}t.left=left});
  el.innerHTML=timers.map(t=>`<div class="tm ${t.done?'done':''}" data-id="${t.id}"><button class="x2" data-rm>✕</button><div class="n">${esc(t.name)}</div><div class="t">${t.done?'Done!':fmtT(t.left)}</div><div class="bar"><i style="width:${Math.max(0,t.left/t.total*100)}%"></i></div>${t.done?'<button data-rm>Dismiss</button>':t.paused!=null?'<button data-p>Resume</button>':'<button class="s" data-p>Pause</button>'} <button class="s" data-add>+1 min</button></div>`).join('')||'<span class="mut">No timers running.</span>'}
$('#g').onclick=e=>{const c=e.target.closest('.tm');if(!c)return;const t=timers.find(x=>x.id==c.dataset.id);if(e.target.hasAttribute('data-rm'))timers=timers.filter(x=>x!==t);else if(e.target.hasAttribute('data-p')){if(t.paused!=null){t.end=Date.now()+t.paused*1000;t.paused=null}else t.paused=(t.end-Date.now())/1000}else if(e.target.hasAttribute('data-add')){t.end+=60000;t.total+=60;if(t.paused!=null)t.paused+=60;t.done=false}paint()};
$('#add').onclick=()=>{const s=num('m')*60+num('s');if(s>0){add($('#n').value,s);paint()}};
function chips(){$('#pre').innerHTML=presets.map(p=>`<span class="chip" data-id="${p.id}">${esc(p.name)} <span class="mut">${fmtT(p.sec)}</span><i data-del>✕</i></span>`).join('')||'<span class="mut">Save a preset with ★ to start it in one click.</span>'}
$('#sp').onclick=async()=>{const s=num('m')*60+num('s');if(s>0){presets.push(await api.add({kind:'preset',name:$('#n').value||'Timer',sec:s}));chips()}};
$('#pre').onclick=async e=>{const c=e.target.closest('.chip');if(!c)return;const p=presets.find(x=>x.id===c.dataset.id);if(e.target.hasAttribute('data-del')){await api.del(p.id);presets=presets.filter(x=>x!==p);chips()}else{add(p.name,p.sec);paint()}};
api.list().then(d=>{presets=only(d,'preset');chips()});setInterval(paint,250);paint();
</script>
