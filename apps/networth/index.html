<!doctype html><meta charset="utf-8"><title>Net Worth Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#059669;--w:980px}svg{width:100%;height:240px;background:var(--soft);border-radius:10px}.li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.li span{flex:1}.li input{width:130px;text-align:right}</style>
<div class="wrap"><h1>Net Worth Tracker</h1><p class="sub">List what you own and what you owe, then take a snapshot now and then to watch the trend.</p>
<div class="g3" id="kp"></div><div class="g2 gap"><div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Assets</h2></div><div id="as"></div><div class="row gap"><div class="col"><input id="an" placeholder="Savings, house, car…"></div><button class="s" data-add="asset">Add</button></div></div>
<div class="card"><h2>Liabilities</h2><div id="li"></div><div class="row gap"><div class="col"><input id="ln" placeholder="Mortgage, card, loan…"></div><button class="s" data-add="debt">Add</button></div></div></div>
<div class="card gap"><div class="row" style="margin-bottom:8px"><h2 style="margin:0;flex:1">Net worth over time</h2><button id="snap">📸 Take snapshot</button></div><svg id="sv" viewBox="0 0 800 240" preserveAspectRatio="none"></svg><div id="sl" class="mut gap"></div></div></div>
<script>
let it=[],snaps=[];
const sum=k=>it.filter(i=>i.t===k).reduce((n,i)=>n+i.v,0);
function paint(){const A=sum('asset'),D=sum('debt'),N=A-D;$('#kp').innerHTML=[['Assets',money(A)],['Liabilities',money(D)],['Net worth',money(N)]].map(([k,v],i)=>`<div class="kpi"><small>${k}</small><b ${i===2?`class="${N>=0?'ok':'bad'}"`:''}>${v}</b></div>`).join('');
  for(const[k,el]of[['asset','#as'],['debt','#li']])$(el).innerHTML=it.filter(i=>i.t===k).map(i=>`<div class="li" data-id="${i.id}"><span>${esc(i.n)}</span><input type="number" step="any" value="${i.v}"><button class="x" data-rm>✕</button></div>`).join('')||'<span class="mut">None yet.</span>';
  const s=[...snaps].sort((a,b)=>a.at-b.at);if(s.length){const lo=Math.min(0,...s.map(x=>x.n)),hi=Math.max(1,...s.map(x=>x.n)),X=i=>s.length>1?i/(s.length-1)*780+10:400,Y=v=>230-(v-lo)/(hi-lo||1)*220;$('#sv').innerHTML=`<line x1="0" x2="800" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" opacity=".25" stroke-dasharray="5 5"/><polyline fill="none" stroke="var(--a)" stroke-width="3" points="${s.map((x,i)=>`${X(i)},${Y(x.n)}`).join(' ')}"/>`+s.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.n)}" r="5" fill="var(--a)"><title>${new Date(x.at).toLocaleDateString()}: ${money(x.n)}</title></circle>`).join('');
    $('#sl').innerHTML=[...s].reverse().slice(0,6).map(x=>`<span data-id="${x.id}" style="margin-right:14px">${new Date(x.at).toLocaleDateString()}: <b>${money(x.n)}</b> <a data-rs style="cursor:pointer">✕</a></span>`).join('')}else{$('#sv').innerHTML='';$('#sl').textContent='Take a snapshot to start the chart.'}}
document.addEventListener('click',async e=>{const t=e.target.dataset.add;if(t){const el=$(t==='asset'?'#an':'#ln');if(!el.value.trim())return;it.push(await api.add({kind:'nw',t,n:el.value.trim(),v:0}));el.value='';paint()}
  const r=e.target.closest('.li');if(r&&e.target.hasAttribute('data-rm')){await api.del(r.dataset.id);it=it.filter(x=>x.id!==r.dataset.id);paint()}if(e.target.hasAttribute('data-rs')){const id=e.target.closest('[data-id]').dataset.id;await api.del(id);snaps=snaps.filter(x=>x.id!==id);paint()}});
let t;document.addEventListener('input',e=>{const r=e.target.closest('.li');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);i.v=parseFloat(e.target.value)||0;clearTimeout(t);t=setTimeout(()=>api.upd(i.id,{v:i.v}),500);const A=sum('asset'),D=sum('debt');$('#kp').children[0].querySelector('b').textContent=money(A);$('#kp').children[1].querySelector('b').textContent=money(D);$('#kp').children[2].querySelector('b').textContent=money(A-D)});
$('#snap').onclick=async()=>{snaps.push(await api.add({kind:'nwsnap',n:sum('asset')-sum('debt'),at:Date.now()}));paint()};api.list().then(d=>{it=only(d,'nw');snaps=only(d,'nwsnap');paint()});
</script>
