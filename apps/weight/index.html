<!doctype html><meta charset="utf-8"><title>Weight Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#0284c7;--w:900px}svg{width:100%;height:260px;background:var(--soft);border-radius:10px}</style>
<div class="wrap"><h1>Weight Tracker</h1><p class="sub">Log weigh-ins, set a goal, and watch the trend rather than the daily noise.</p>
<div class="card"><div class="row"><div class="col"><label>Weight</label><input id="w" type="number" step="0.1" style="font-size:20px"></div><div class="col"><label>Date</label><input id="d" type="date"></div><div class="col"><label>Goal weight</label><input id="g" type="number" step="0.1" data-keep></div><div class="col"><label>Unit</label><select id="u" data-keep><option>kg</option><option>lb</option></select></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="card gap"><h2>Trend</h2><svg id="sv" viewBox="0 0 800 260" preserveAspectRatio="none"></svg><div class="mut"><span style="color:var(--a)">●</span> weigh-ins &nbsp; <span style="color:#f59e0b">━</span> 7-day average &nbsp; <span style="color:#16a34a">┅</span> goal</div></div>
<div class="card"><h2>Entries</h2><div style="max-height:280px;overflow:auto"><table id="tb"></table></div></div></div>
<script>
let es=[];$('#d').value=dkey(new Date());
function run(){const u=$('#u').value,s=[...es].sort((a,b)=>a.d<b.d?-1:1),g=num('g');
  const avg=s.map((e,i)=>{const w=s.filter(x=>{const dd=(pdate(e.d)-pdate(x.d))/864e5;return dd>=0&&dd<7});return w.reduce((n,x)=>n+x.w,0)/w.length});
  const first=s[0],last=s.at(-1),ch=last&&first?last.w-first.w:0;let wk=null;if(s.length>1){const t=pdate(last.d),w1=s.filter(x=>(t-pdate(x.d))/864e5<=7),w0=s.filter(x=>{const dd=(t-pdate(x.d))/864e5;return dd>7&&dd<=14});if(w1.length&&w0.length)wk=w1.reduce((n,x)=>n+x.w,0)/w1.length-w0.reduce((n,x)=>n+x.w,0)/w0.length}
  $('#kp').innerHTML=[['Current',last?`${fmt(last.w,1)} ${u}`:'–'],['Change since start',last?`${ch>0?'+':''}${fmt(ch,1)} ${u}`:'–'],['vs prior week',wk==null?'–':`${wk>0?'+':''}${fmt(wk,1)} ${u}`],['To goal',g&&last?`${fmt(Math.abs(last.w-g),1)} ${u} ${last.w>g?'to lose':last.w<g?'to gain':'🎯'.replace('🎯','reached')}`:'set a goal']].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join('');
  if(s.length){const lo=Math.min(...s.map(x=>x.w),g||1e9)-1,hi=Math.max(...s.map(x=>x.w),g||0)+1,t0=pdate(s[0].d).getTime(),t1=Math.max(pdate(s.at(-1).d).getTime(),t0+864e5),X=d=>(pdate(d)-t0)/(t1-t0)*780+10,Y=w=>250-(w-lo)/(hi-lo)*240;
    $('#sv').innerHTML=(g?`<line x1="0" x2="800" y1="${Y(g)}" y2="${Y(g)}" stroke="#16a34a" stroke-dasharray="6 5" stroke-width="2"/>`:'')+`<polyline fill="none" stroke="#f59e0b" stroke-width="3" points="${s.map((e,i)=>`${X(e.d)},${Y(avg[i])}`).join(' ')}"/>`+s.map(e=>`<circle cx="${X(e.d)}" cy="${Y(e.w)}" r="4" fill="var(--a)"/>`).join('')}else $('#sv').innerHTML='';
  $('#tb').innerHTML=[...s].reverse().map(e=>`<tr data-id="${e.id}"><td>${pdate(e.d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</td><td class="r"><b>${fmt(e.w,1)} ${u}</b></td><td class="r"><button class="x" data-rm>✕</button></td></tr>`).join('')||'<tr><td class="mut">No entries.</td></tr>'}
$('#add').onclick=async()=>{const w=num('w');if(!(w>0)||!$('#d').value)return;es.push(await api.add({kind:'w',w,d:$('#d').value}));$('#w').value='';run()};$('#w').onkeydown=e=>e.key==='Enter'&&$('#add').click();
$('#tb').onclick=async e=>{if(!e.target.hasAttribute('data-rm'))return;const id=e.target.closest('tr').dataset.id;await api.del(id);es=es.filter(x=>x.id!==id);run()};document.addEventListener('input',e=>{if(e.target.id==='g'||e.target.id==='u')run()});api.list().then(d=>{es=only(d,'w');remember().then(run)});
</script>
