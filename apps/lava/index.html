<!doctype html><meta charset="utf-8"><title>Lava Lamp</title><script src="/shared/lib.js"></script>
<style>body{margin:0;min-height:100vh;background:#120a14;color:#f6d8e8;font-family:system-ui;display:flex;gap:40px;align-items:center;justify-content:center}
.lamp{width:240px;height:560px;border-radius:120px 120px 70px 70px/90px 90px 50px 50px;overflow:hidden;position:relative;box-shadow:0 0 80px var(--glow),inset 0 0 40px #0006;border:6px solid #2a1a2c}canvas{width:100%;height:100%;display:block;image-rendering:auto}
.base{position:absolute;bottom:-1px;left:-6px;right:-6px;height:50px;background:linear-gradient(#444,#111)}h1{margin:0 0 16px;font-weight:200;letter-spacing:.3em}.p{width:230px}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.pal i{height:46px;border-radius:10px;cursor:pointer;border:3px solid transparent}.pal i.on{border-color:#fff}label{display:block;font-size:13px;margin-top:12px}input[type=range]{width:100%}</style>
<div class="lamp" id="lamp"><canvas id="c" width="60" height="140"></canvas></div>
<div class="p"><h1>LAVA</h1><div class="pal" id="pal"></div><label>Blobs <b id="vb"></b></label><input type="range" id="nb" min="3" max="12" value="7"><label>Heat <b id="vh"></b></label><input type="range" id="ht" min="2" max="30" value="10"><p style="color:#a0788f;font-size:12px">Your last settings are remembered.</p></div>
<script>
const THEMES=[['#ff3d00','#ffb300','#3d0b22'],['#00e5ff','#7c4dff','#0a1030'],['#76ff03','#00bfa5','#08240f'],['#ff4081','#ffea00','#2a0a2a']];
let th=0,cfg=null,blobs=[];const cv=$('#c'),g=cv.getContext('2d'),W=60,H=140,img=g.createImageData(W,H);
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const fit=()=>{const n=+$('#nb').value;while(blobs.length<n)blobs.push({x:15+Math.random()*30,y:Math.random()*H,r:9+Math.random()*9,vy:(Math.random()-.5)*.5,ph:Math.random()*9});blobs.length=n;$('#vb').textContent=n;$('#vh').textContent=$('#ht').value};
// Metaballs: every pixel sums r²/d² over all blobs; above a threshold it is "wax", with a glow gradient just below it.
function frame(t){const heat=$('#ht').value/10,[a,b,bg]=THEMES[th].map(rgb);
  blobs.forEach(o=>{o.y+=o.vy*heat+Math.sin(t/1800+o.ph)*.15;if(o.y<10)o.vy=Math.abs(o.vy)+.05;if(o.y>H-10)o.vy=-Math.abs(o.vy)-.05;o.x=30+Math.sin(t/2600+o.ph)*14});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0;for(const o of blobs){const dx=x-o.x,dy=y-o.y;s+=o.r*o.r/(dx*dx+dy*dy+1)}
    const m=Math.min(1,Math.max(0,(s-.7)*2.2)),k=Math.min(1,y/H*1.2+(s>1?.0:0)),i=(y*W+x)*4;
    for(let c=0;c<3;c++)img.data[i+c]=bg[c]*(1-m)+(a[c]*(1-k)+b[c]*k)*m+(s>.35&&s<1?(a[c]*.25):0);img.data[i+3]=255}
  g.putImageData(img,0,0);requestAnimationFrame(frame)}
function theme(){$('#pal').innerHTML=THEMES.map((t,i)=>`<i data-i="${i}" class="${i===th?'on':''}" style="background:linear-gradient(135deg,${t[0]},${t[1]})"></i>`).join('');$('#lamp').style.setProperty('--glow',THEMES[th][0]+'88')}
async function persist(){const d={th,nb:+$('#nb').value,ht:+$('#ht').value};if(cfg)api.upd(cfg.id,d);else cfg=await api.add(d)}
$('#pal').onclick=e=>{if(e.target.dataset.i){th=+e.target.dataset.i;theme();persist()}};$('#nb').oninput=()=>{fit()};$('#ht').oninput=fit;$('#nb').onchange=$('#ht').onchange=persist;
api.list().then(d=>{cfg=d[0]||null;if(cfg){th=cfg.th;$('#nb').value=cfg.nb;$('#ht').value=cfg.ht}fit();theme()});fit();theme();requestAnimationFrame(frame);
</script>
