<!doctype html><meta charset="utf-8"><title>Bracket</title>
<script src="/shared/lib.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0f1f3d; color: #e8eefc; font-family: 'Helvetica Neue', Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 24px; padding: 20px 40px; border-bottom: 1px solid #25375e; } h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; } h1 b { color: #ffc93c; }
  .chips { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; } .chip { padding: 6px 12px; border: 1px solid #35497a; border-radius: 20px; cursor: pointer; font-size: 13px; } .chip.on { background: #ffc93c; color: #0f1f3d; border-color: #ffc93c; } .chip i { font-style: normal; margin-left: 8px; opacity: .6; }
  button { font: inherit; background: #ffc93c; color: #0f1f3d; border: none; padding: 8px 16px; font-weight: 700; border-radius: 6px; cursor: pointer; }
  #stage { overflow: auto; padding: 40px; } .bk { display: flex; align-items: stretch; min-width: max-content; }
  .round { display: flex; flex-direction: column; justify-content: space-around; width: 210px; margin-right: 34px; position: relative; } .round h4 { position: absolute; top: -24px; margin: 0; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #6f86b8; }
  .m { background: #182b50; border: 1px solid #2d4373; border-radius: 6px; margin: 10px 0; position: relative; } .m::after { content: ''; position: absolute; right: -35px; top: 50%; width: 34px; height: 2px; background: #2d4373; }
  .round:last-child .m::after { display: none; } .p { padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; } .p + .p { border-top: 1px solid #2d4373; } .p:hover { background: #22397004; background: #223970; } .p.win { background: #ffc93c; color: #0f1f3d; font-weight: 700; } .p.lose { opacity: .4; text-decoration: line-through; } .p.tbd { color: #556a9a; cursor: default; font-style: italic; }
  #champ { text-align: center; font-size: 34px; margin: 6px 0 0; color: #ffc93c; } dialog { background: #182b50; color: inherit; border: 1px solid #35497a; border-radius: 12px; padding: 24px; width: 380px; } dialog::backdrop { background: #000a; } dialog input, dialog textarea { width: 100%; margin: 6px 0 12px; padding: 9px; background: #0f1f3d; color: inherit; border: 1px solid #35497a; border-radius: 6px; font: inherit; }
</style>
<header><h1>Brack<b>et</b></h1><div class="chips" id="chips"></div><button id="new">New bracket</button></header>
<div id="stage"></div>
<dialog id="dlg"><h3 style="margin:0 0 10px">New bracket</h3><input id="bt" placeholder="Tournament name"><textarea id="bp" rows="8" placeholder="One name per line (2–32)"></textarea><div style="text-align:right"><button id="bc" style="background:none;color:#aab">Cancel</button> <button id="bg">Create</button></div></dialog>
<script>
let brackets = [], cur = null;
// Build the rounds: round 0 pairs players (padded with byes to a power of two); later rounds are fed by recorded winners.
function rounds(b) {
  let size = 2; while (size < b.players.length) size *= 2;
  let slots = [...b.players, ...Array(size - b.players.length).fill(null)], out = [], r = 0;
  while (slots.length > 1) {
    const ms = []; for (let i = 0; i < slots.length; i += 2) ms.push({ a: slots[i], b: slots[i + 1], key: `${r}-${i / 2}` });
    out.push(ms); slots = ms.map(m => m.a === null ? m.b : m.b === null ? m.a : (b.winners[m.key] ?? '')); r++;
  }
  return out;
}
// Drop any recorded winner who is no longer actually in their match (e.g. after an earlier result changed).
function prune(b) { for (let n = 0; n < 6; n++) for (const m of rounds(b).flat()) if (b.winners[m.key] && b.winners[m.key] !== m.a && b.winners[m.key] !== m.b) delete b.winners[m.key]; }
function render() {
  $('#chips').innerHTML = brackets.map(b => `<div class="chip ${b.id === cur ? 'on' : ''}" data-id="${b.id}">${esc(b.name)}<i data-del>×</i></div>`).join('');
  const b = brackets.find(x => x.id === cur); if (!b) return $('#stage').innerHTML = '<p style="color:#6f86b8">Create a bracket to get started.</p>';
  const rs = rounds(b), names = ['Final', 'Semifinals', 'Quarterfinals', 'Round of 16', 'Round of 32'];
  const last = rs[rs.length - 1][0], champ = b.winners[last.key];
  $('#stage').innerHTML = `<div class="bk">${rs.map((ms, ri) => `<div class="round"><h4>${ri === rs.length - 1 ? 'Final' : names[rs.length - 1 - ri] || 'Round ' + (ri + 1)}</h4>${ms.map(m => {
    const w = b.winners[m.key], row = (p, o) => p === null ? `<div class="p tbd">bye</div>` : p === '' ? `<div class="p tbd">TBD</div>` : `<div class="p ${w === p ? 'win' : w && w !== p ? 'lose' : ''}" data-k="${m.key}" data-p="${esc(p)}" data-o="${esc(o ?? '')}">${esc(p)}${w === p ? ' ✓' : ''}</div>`;
    return `<div class="m">${row(m.a, m.b)}${row(m.b, m.a)}</div>`; }).join('')}</div>`).join('')}</div>${champ ? `<div id="champ">🏆 ${esc(champ)}</div>` : ''}`;
}
// Clicking a name makes them the match winner (clicking again undoes it, and clears any downstream result that depended on it).
$('#stage').onclick = async e => {
  const p = e.target.closest('.p[data-k]'); if (!p) return; const b = brackets.find(x => x.id === cur), k = p.dataset.k;
  if (b.winners[k] === p.dataset.p) delete b.winners[k]; else b.winners[k] = p.dataset.p;
  prune(b);
  render(); api.upd(b.id, { winners: b.winners });
};
$('#chips').onclick = async e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (e.target.hasAttribute('data-del')) { await api.del(c.dataset.id); brackets = brackets.filter(b => b.id !== c.dataset.id); if (cur === c.dataset.id) cur = brackets[0]?.id; } else cur = c.dataset.id;
  render();
};
$('#new').onclick = () => $('#dlg').showModal(); $('#bc').onclick = () => $('#dlg').close();
$('#bg').onclick = async () => {
  const players = $('#bp').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 32); if (players.length < 2) return;
  const b = await api.add({ name: $('#bt').value || 'Tournament', players, winners: {} }); brackets.unshift(b); cur = b.id; $('#dlg').close(); $('#bt').value = $('#bp').value = ''; render();
};
api.list().then(d => { brackets = d; cur = d[0]?.id; render(); });
</script>
