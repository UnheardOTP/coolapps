<!doctype html><meta charset="utf-8"><title>Subscription Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#e11d48;--w:960px}.up{border-left:4px solid var(--a);padding-left:10px;margin-bottom:6px}tr.off td{opacity:.45;text-decoration:line-through}</style>
<div class="wrap"><h1>Subscription Tracker</h1><p class="sub">See what your recurring bills really cost per month and per year, and what renews soon.</p>
<div class="card"><div class="row"><div class="col" style="flex:2"><label>Service</label><input id="n" placeholder="Streaming, gym, cloud storage…"></div><div class="col" style="max-width:120px"><label>Cost ($)</label><input id="c" type="number" step="0.01"></div><div class="col"><label>Billed</label><select id="p"><option value="1">monthly</option><option value="0.230769">weekly</option><option value="3">quarterly</option><option value="6">every 6 months</option><option value="12">yearly</option></select></div><div class="col"><label>Next renewal</label><input id="d" type="date"></div><button id="add">Add</button></div></div>
<div class="g4" id="kp"></div><div class="g2 gap"><div class="card"><h2>Renewing in the next 30 days</h2><div id="soon"></div></div><div class="card"><h2>By cost (monthly equivalent)</h2><div id="bars"></div></div></div>
<div class="card"><h2>All subscriptions</h2><table id="tb"></table></div></div>
<script>
let it=[];$('#d').value=dkey(new Date(Date.now()+30*864e5));
const mo=i=>i.c/i.p;   // p = months per billing period, so monthly equivalent = cost / months
function next(i){const d=pdate(i.d),now=new Date();now.setHours(0,0,0,0);const step=i.p===.230769?{days:7}:{months:i.p};while(d<now){if(step.days)d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+step.months)}return d}
function paint(){const act=it.filter(i=>!i.off),M=act.reduce((n,i)=>n+mo(i),0);$('#kp').innerHTML=[['Per month',money(M)],['Per year',money(M*12)],['Per day',money(M*12/365)],['Active',act.length+' of '+it.length]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join('');
  const now=new Date();now.setHours(0,0,0,0);const soon=act.map(i=>({i,d:next(i)})).filter(x=>(x.d-now)/864e5<=30).sort((a,b)=>a.d-b.d);$('#soon').innerHTML=soon.map(({i,d})=>`<div class="up"><b>${esc(i.n)}</b> ${money(i.c)}<div class="mut">${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · in ${Math.round((d-now)/864e5)} d</div></div>`).join('')||'<span class="mut">Nothing in the next 30 days.</span>';
  const mx=Math.max(...act.map(mo),1);$('#bars').innerHTML=[...act].sort((a,b)=>mo(b)-mo(a)).slice(0,8).map(i=>`<div class="gap"><div class="row" style="justify-content:space-between"><span>${esc(i.n)}</span><b>${money(mo(i))}</b></div><div class="bar"><i style="width:${mo(i)/mx*100}%"></i></div></div>`).join('')||'<span class="mut">—</span>';
  const lab={1:'monthly',.230769:'weekly',3:'quarterly',6:'6-monthly',12:'yearly'};$('#tb').innerHTML='<tr><th>Service</th><th>Billing</th><th class="r">Cost</th><th class="r">/ month</th><th>Next</th><th></th></tr>'+[...it].sort((a,b)=>mo(b)-mo(a)).map(i=>`<tr class="${i.off?'off':''}" data-id="${i.id}"><td><b>${esc(i.n)}</b></td><td>${lab[i.p]||i.p}</td><td class="r">${money(i.c)}</td><td class="r">${money(mo(i))}</td><td>${i.off?'—':next(i).toLocaleDateString()}</td><td class="r"><button class="x" data-t>${i.off?'Resume':'Cancelled?'}</button> <button class="x" data-rm>✕</button></td></tr>`).join('')}
$('#add').onclick=async()=>{const n=$('#n').value.trim(),c=num('c');if(!n||!(c>0)||!$('#d').value)return;it.push(await api.add({kind:'sub',n,c,p:+$('#p').value,d:$('#d').value,off:false}));$('#n').value=$('#c').value='';paint()};
$('#tb').onclick=async e=>{const r=e.target.closest('tr[data-id]');if(!r)return;const i=it.find(x=>x.id===r.dataset.id);if(e.target.hasAttribute('data-t')){i.off=!i.off;api.upd(i.id,{off:i.off})}if(e.target.hasAttribute('data-rm')){await api.del(i.id);it=it.filter(x=>x!==i)}paint()};api.list().then(d=>{it=only(d,'sub');paint()});
</script>
