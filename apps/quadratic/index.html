<!doctype html><meta charset="utf-8"><title>Quadratic Solver</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#db2777;--w:900px}.eq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px;justify-content:center}.eq input{width:90px;text-align:center;font-size:18px}svg{width:100%;height:300px;background:var(--soft);border-radius:10px}</style>
<div class="wrap"><h1>Quadratic Solver</h1><p class="sub">Solve ax² + bx + c = 0 with the discriminant, roots (real or complex), vertex, and a graph.</p>
<div class="card"><div class="eq"><input id="a" type="number" step="any" value="1" data-keep> x² + <input id="b" type="number" step="any" value="-3" data-keep> x + <input id="c" type="number" step="any" value="-4" data-keep> = 0</div><div class="err" id="er" style="text-align:center"></div></div>
<div class="g3" id="kp"></div><div class="card gap"><svg id="sv" viewBox="-400 -150 800 300" preserveAspectRatio="none"></svg></div><div class="card"><h2>Steps</h2><div class="out" id="st" style="font-family:inherit;font-size:15px"></div></div></div>
<script>
const f=n=>+n.toFixed(6)+'';
function run(){const a=num('a'),b=num('b'),c=num('c');$('#er').textContent='';if(!a){$('#er').textContent='a must not be 0 — that is a linear equation'+(b?` (x = ${f(-c/b)})`:'');$('#kp').innerHTML='';$('#sv').innerHTML='';$('#st').textContent='';return}
  const D=b*b-4*a*c,vx=-b/(2*a),vy=a*vx*vx+b*vx+c;let roots,desc;
  if(D>0){const s=Math.sqrt(D);roots=[`x₁ = ${f((-b+s)/(2*a))}`,`x₂ = ${f((-b-s)/(2*a))}`];desc='two distinct real roots'}else if(D===0){roots=[`x = ${f(vx)} (double root)`];desc='one repeated real root'}else{const s=Math.sqrt(-D)/(2*Math.abs(a));roots=[`x₁ = ${f(vx)} + ${f(s)}i`,`x₂ = ${f(vx)} − ${f(s)}i`];desc='two complex conjugate roots'}
  $('#kp').innerHTML=[['Discriminant (b²−4ac)',f(D)],['Roots',roots.join('<br>')],['Vertex',`(${f(vx)}, ${f(vy)}) — ${a>0?'minimum':'maximum'}`],['y-intercept / axis',`${f(c)} · x = ${f(vx)}`]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:16px">${v}</b></div>`).join('');
  $('#st').innerHTML=`Δ = b² − 4ac = (${f(b)})² − 4·(${f(a)})·(${f(c)}) = <b>${f(D)}</b> → ${desc}.<br>x = (−b ± √Δ) / 2a = (${f(-b)} ± √${f(D)}) / ${f(2*a)}<br>Factored form: ${D>=0?`${f(a)}(x − ${f((-b+Math.sqrt(D))/(2*a))})(x − ${f((-b-Math.sqrt(D))/(2*a))})`:'not factorable over the reals'}<br>Vertex form: ${f(a)}(x − ${f(vx)})² + ${f(vy)}`;
  const span=Math.max(5,Math.abs(vx)*2.2,D>0?Math.abs(vx)+Math.sqrt(D)/Math.abs(2*a)+1:0),X=x=>x/span*380,ys=[...Array(81)].map((_,i)=>{const x=vx-span+i/80*2*span;return a*x*x+b*x+c}),yr=Math.max(5,Math.abs(vy)*1.5,Math.min(...ys.map(Math.abs).filter(v=>v>0)||[5])),Ym=Math.min(Math.max(...ys.map(Math.abs)),Math.max(10,Math.abs(vy)*2+5));
  const sy=y=>-y/Ym*140,pts=[...Array(161)].map((_,i)=>{const x=vx-span+i/160*2*span,y=a*x*x+b*x+c;return`${X(x-vx*0)},${Math.max(-300,Math.min(300,sy(y)))}`}).join(' ');
  $('#sv').innerHTML=`<line x1="-400" x2="400" y1="0" y2="0" stroke="currentColor" opacity=".4"/><line x1="0" x2="0" y1="-150" y2="150" stroke="currentColor" opacity=".4"/><polyline fill="none" stroke="var(--a)" stroke-width="3" points="${pts}"/><circle cx="${X(vx)}" cy="${sy(vy)}" r="6" fill="var(--a)"/>${D>=0?[(-b+Math.sqrt(D))/(2*a),(-b-Math.sqrt(D))/(2*a)].map(r=>`<circle cx="${X(r)}" cy="0" r="6" fill="#16a34a"/>`).join(''):''}`}
document.addEventListener('input',run);remember().then(run);
</script>
