<!doctype html><meta charset="utf-8"><title>Trivia</title><script src="/shared/lib.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#4a1d96,#1d3a96);color:#fff;font-family:'Trebuchet MS',system-ui;display:flex;flex-direction:column;align-items:center;padding-top:34px}h1{margin:0;letter-spacing:.2em}.pr{width:640px;height:8px;background:#fff3;border-radius:4px;margin:16px 0}.pr i{display:block;height:100%;background:#ffd23f;border-radius:4px;transition:width .4s}
.q{width:640px;background:#fff;color:#1d1d3a;border-radius:20px;padding:30px;box-shadow:0 14px 0 #0003;text-align:center;font-size:26px;min-height:120px;display:flex;align-items:center;justify-content:center}.ans{width:640px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.ans button{font:inherit;font-size:19px;padding:18px;border:none;border-radius:14px;background:#ffffff22;color:#fff;cursor:pointer;border:2px solid #fff4}.ans button:hover{background:#ffffff40}.ans .ok{background:#2ecc71;border-color:#2ecc71}.ans .bad{background:#e74c3c;border-color:#e74c3c}
.end{text-align:center}.end b{font-size:80px;display:block}button.n{font:inherit;font-size:18px;background:#ffd23f;color:#1d1d3a;border:none;padding:12px 40px;border-radius:26px;cursor:pointer;margin-top:16px}.hist{margin-top:24px;color:#cdd;font-size:14px}</style>
<h1>TRIVIA</h1><div class="pr"><i id="pr"></i></div><div id="main"></div><div class="hist" id="hist"></div>
<script>
const Q=[['Which planet has the most moons?','Saturn',['Jupiter','Mars','Neptune']],['What is the capital of Australia?','Canberra',['Sydney','Melbourne','Perth']],['How many bones are in the adult human body?','206',['186','212','240']],['Which element has the symbol Fe?','Iron',['Fluorine','Lead','Tin']],['Who painted the Mona Lisa?','Leonardo da Vinci',['Michelangelo','Raphael','Botticelli']],['What is the largest ocean?','Pacific',['Atlantic','Indian','Arctic']],['In what year did the Berlin Wall fall?','1989',['1979','1991','1985']],['What is the hardest natural substance?','Diamond',['Quartz','Topaz','Steel']],['Which language has the most native speakers?','Mandarin Chinese',['English','Spanish','Hindi']],['What is the smallest prime number?','2',['0','1','3']],['Who wrote "1984"?','George Orwell',['Aldous Huxley','Ray Bradbury','H. G. Wells']],['What gas do plants absorb from the air?','Carbon dioxide',['Oxygen','Nitrogen','Helium']],['Which country has the most time zones?','France',['Russia','USA','China']],['How many strings does a standard violin have?','4',['5','6','3']],['What is the longest river in South America?','Amazon',['Orinoco','Paraná','Magdalena']],['Which blood type is the universal donor?','O negative',['AB positive','A positive','B negative']],['What is H₂O commonly called?','Water',['Peroxide','Hydrogen','Ozone']],['Which planet is known as the Red Planet?','Mars',['Venus','Mercury','Jupiter']],['Who developed the theory of general relativity?','Albert Einstein',['Isaac Newton','Niels Bohr','Max Planck']],['What is the main ingredient in guacamole?','Avocado',['Tomato','Lime','Pepper']]];
let round,i,score,locked,hist=[];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function start(){round=shuf(Q).slice(0,10);i=0;score=0;show()}
function show(){$('#pr').style.width=i/10*100+'%';if(i>=10)return end();const[q,a,w]=round[i],opts=shuf([a,...w]);locked=false;
  $('#main').innerHTML=`<div class="q">${esc(q)}</div><div class="ans">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;stats()}
async function end(){$('#main').innerHTML=`<div class="end"><b>${score}/10</b>${['Better luck next time!','Not bad!','Solid!','Trivia master!'][Math.min(3,Math.floor(score/3))]}<br><button class="n" id="again">Play again</button></div>`;$('#again').onclick=start;hist.unshift(await api.add({score}));stats()}
$('#main').onclick=e=>{const b=e.target.closest('[data-o]');if(!b||locked)return;locked=true;const ok=b.dataset.o===round[i][1];if(ok)score++;b.classList.add(ok?'ok':'bad');if(!ok)[...document.querySelectorAll('.ans button')].find(x=>x.dataset.o===round[i][1]).classList.add('ok');setTimeout(()=>{i++;show()},900)};
const stats=()=>$('#hist').textContent=hist.length?`${hist.length} rounds played · average ${(hist.reduce((n,h)=>n+h.score,0)/hist.length).toFixed(1)}/10 · best ${Math.max(...hist.map(h=>h.score))}/10`:'';
api.list().then(d=>{hist=d;start()});
</script>
