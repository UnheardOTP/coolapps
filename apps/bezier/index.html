<!doctype html><meta charset="utf-8"><title>Easing Curve Editor</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#06b6d4;--w:960px}svg{width:100%;max-width:420px;aspect-ratio:1;background:var(--soft);border-radius:12px;touch-action:none}.h{cursor:grab}.track{height:60px;background:var(--soft);border-radius:12px;position:relative;margin-top:12px}.ball{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:var(--a)}</style>
<div class="wrap"><h1>Easing Curve Editor</h1><p class="sub">Drag the two handles to shape a CSS <code>cubic-bezier()</code> timing function, and watch it animate.</p>
<div class="g2"><div class="card"><svg id="sv" viewBox="-0.15 -0.15 1.3 1.3"></svg></div><div class="card"><div class="chips" id="pr"></div><div class="out gap" id="css" style="font-size:16px"></div><button class="s gap" id="cp">Copy</button><div class="row gap"><div class="col"><label>Duration <b id="dv">1.2</b>s</label><input type="range" id="d" min="0.3" max="3" step="0.1" value="1.2" data-keep></div><button id="pl">▶ Play</button></div><div class="track"><div class="ball" id="ball"></div></div></div></div><div class="card"><h2>Saved curves</h2><div id="sv2"></div></div></div>
<script>
let P=[.25,.1,.25,1];
const PRE={ease:[.25,.1,.25,1],'ease-in':[.42,0,1,1],'ease-out':[0,0,.58,1],'ease-in-out':[.42,0,.58,1],linear:[0,0,1,1],'in-back':[.6,-.28,.735,.045],'out-back':[.175,.885,.32,1.275],'in-out-quart':[.77,0,.175,1],'out-expo':[.19,1,.22,1]};
const Y=y=>1-y;
function draw(){const[a,b,c,d]=P;$('#sv').innerHTML=`<line x1="0" y1="1" x2="1" y2="0" stroke="currentColor" opacity=".15" stroke-width=".01"/><rect x="0" y="0" width="1" height="1" fill="none" stroke="currentColor" opacity=".25" stroke-width=".005"/><line x1="0" y1="1" x2="${a}" y2="${Y(b)}" stroke="var(--a)" stroke-width=".012"/><line x1="1" y1="0" x2="${c}" y2="${Y(d)}" stroke="var(--a)" stroke-width=".012"/><path d="M0 1 C ${a} ${Y(b)}, ${c} ${Y(d)}, 1 0" fill="none" stroke="var(--a)" stroke-width=".03"/><circle class="h" data-i="0" cx="${a}" cy="${Y(b)}" r=".035" fill="#f43f5e"/><circle class="h" data-i="1" cx="${c}" cy="${Y(d)}" r=".035" fill="#8b5cf6"/>`;
  $('#css').textContent=`cubic-bezier(${P.map(v=>+v.toFixed(2)).join(', ')})`;$('#dv').textContent=$('#d').value}
let drag=null;$('#sv').onpointerdown=e=>{const h=e.target.closest('.h');if(h){drag=+h.dataset.i;$('#sv').setPointerCapture(e.pointerId)}};
$('#sv').onpointermove=e=>{if(drag===null)return;const r=$('#sv').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1.3-.15,y=1-((e.clientY-r.top)/r.height*1.3-.15);P[drag*2]=Math.max(0,Math.min(1,x));P[drag*2+1]=Math.max(-.5,Math.min(1.5,y));draw()};$('#sv').onpointerup=()=>{drag=null};
$('#pr').innerHTML=Object.keys(PRE).map(k=>`<span class="chip" data-k="${k}">${k}</span>`).join('');$('#pr').onclick=e=>{const k=e.target.dataset.k;if(k){P=[...PRE[k]];draw()}};
// Replays the animation with the CSS transition engine itself, so what you see is exactly what the timing function does in a browser.
$('#pl').onclick=()=>{const b=$('#ball'),w=b.parentNode.clientWidth-60;b.style.transition='none';b.style.transform='translateX(0)';b.offsetWidth;b.style.transition=`transform ${$('#d').value}s ${$('#css').textContent}`;b.style.transform=`translateX(${w}px)`};$('#cp').onclick=e=>copy($('#css').textContent,e.target);$('#d').oninput=draw;
savedBar($('#sv2'),{get:()=>({P:[...P]}),set:d=>{P=[...d.P];draw()}});remember().then(draw);draw();
</script>
