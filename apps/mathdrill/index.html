<!doctype html><meta charset="utf-8"><title>Math Drills</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#16a34a;--w:760px}#q{font:700 64px ui-monospace,Menlo,monospace;text-align:center;margin:18px 0;font-variant-numeric:tabular-nums}#ans{font-size:34px;text-align:center;max-width:240px;margin:0 auto;display:block}.pg{display:flex;gap:6px;justify-content:center;margin:12px 0}.pg i{width:22px;height:8px;border-radius:4px;background:var(--soft)}.pg i.ok{background:var(--ok)}.pg i.no{background:var(--bad)}.pg i.cur{background:var(--a)}</style>
<div class="wrap"><h1>Math Drills</h1><p class="sub">Ten quick questions, timed. Pick your operations and numbers, then build speed.</p>
<div class="card" id="cfg"><div class="row"><div class="col"><label>Operations</label><div class="row" style="gap:14px"><label style="margin:0"><input type="checkbox" id="op1" checked> +</label><label style="margin:0"><input type="checkbox" id="op2"> −</label><label style="margin:0"><input type="checkbox" id="op3" checked> ×</label><label style="margin:0"><input type="checkbox" id="op4"> ÷</label></div></div><div class="col"><label>Largest number</label><select id="mx" data-keep><option>10</option><option selected>12</option><option>20</option><option>50</option><option>100</option></select></div><button id="go">Start</button></div></div>
<div class="card hide" id="game"><div class="pg" id="pg"></div><div id="q"></div><input id="ans" type="number" inputmode="numeric" autocomplete="off"><div class="mut" style="text-align:center;margin-top:10px">Enter to submit · <span id="tm">0.0</span>s</div></div>
<div class="card hide" id="res"></div><div class="card"><h2>History</h2><div id="hs"></div></div></div>
<script>
let qs,i,score,t0,res,hist=[],iv;const R=n=>Math.floor(Math.random()*n);
// Subtraction never goes negative and division is always exact, so every answer is a whole number.
function make(ops,mx){const o=ops[R(ops.length)];let a=1+R(mx),b=1+R(mx);if(o==='−'){if(b>a)[a,b]=[b,a];return{t:`${a} − ${b}`,a:a-b}}if(o==='+')return{t:`${a} + ${b}`,a:a+b};if(o==='×')return{t:`${a} × ${b}`,a:a*b};return{t:`${a*b} ÷ ${b}`,a}}
function start(){const ops=[['op1','+'],['op2','−'],['op3','×'],['op4','÷']].filter(([id])=>$('#'+id).checked).map(x=>x[1]);if(!ops.length)return;qs=Array.from({length:10},()=>make(ops,+$('#mx').value));i=0;score=0;res=[];t0=performance.now();$('#cfg').classList.add('hide');$('#res').classList.add('hide');$('#game').classList.remove('hide');clearInterval(iv);iv=setInterval(()=>$('#tm').textContent=((performance.now()-t0)/1000).toFixed(1),100);show();$('#ans').focus()}
const show=()=>{$('#q').textContent=qs[i].t+' = ?';$('#ans').value='';$('#pg').innerHTML=qs.map((_,k)=>`<i class="${k<i?res[k]?'ok':'no':k===i?'cur':''}"></i>`).join('')};
async function done(){clearInterval(iv);const secs=(performance.now()-t0)/1000;$('#game').classList.add('hide');$('#cfg').classList.remove('hide');$('#res').classList.remove('hide');
  $('#res').innerHTML=`<div class="big">${score}/10 in ${secs.toFixed(1)}s</div><div class="mut">${score===10?'Perfect! ':''}${fmt(secs/10,1)} s per question${hist.length&&secs<Math.min(...hist.map(h=>h.s))&&score===10?' — a new personal best!':''}</div><table class="gap">${qs.map((q,k)=>`<tr class="${res[k]?'':'bad'}"><td>${q.t}</td><td class="r">${q.a}</td><td class="r">${res[k]?'✓':'✗'}</td></tr>`).join('')}</table>`;hist.unshift(await api.add({kind:'dr',score,s:+secs.toFixed(1),mx:+$('#mx').value}));paint()}
$('#ans').onkeydown=e=>{if(e.key!=='Enter'||$('#ans').value==='')return;const ok=+$('#ans').value===qs[i].a;res.push(ok);if(ok)score++;i++;i<10?show():done()};$('#go').onclick=start;
function paint(){$('#hs').innerHTML=hist.slice(0,10).map(h=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="mut">${new Date(h.createdAt).toLocaleDateString()}</span><b class="col">${h.score}/10</b><span>${fmt(h.s,1)}s</span><span class="mut">up to ${h.mx}</span></div>`).join('')||'<span class="mut">No drills yet.</span>'}
api.list().then(d=>{hist=only(d,'dr').sort((a,b)=>b.createdAt-a.createdAt);paint();remember()});
</script>
