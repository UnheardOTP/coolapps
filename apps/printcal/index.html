<!doctype html><meta charset="utf-8"><title>Printable Calendar</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#2563eb;--w:1000px}.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff;color:#111}.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:92px;padding:5px 7px;font-size:14px}.cal .h{min-height:0;text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#f3f4f6;padding:6px}.cal .o{background:#fafafa;color:#bbb}.cal .we{background:#f9fafb}.cal .nt{min-height:92px}.cal.sm div{min-height:0;padding:2px 4px;font-size:11px;text-align:center}.ttl{background:#fff;color:#111;text-align:center;font:700 34px Georgia,serif;padding:8px 0}.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;background:#fff;color:#111;padding:10px}.yr h3{margin:0 0 4px;text-align:center;font:700 16px Georgia}@media print{body{background:#fff}.noprint,h1,.sub{display:none!important}.wrap{padding:0;max-width:none}}</style>
<div class="wrap"><h1>Printable Calendar</h1><p class="sub">A clean month or full-year calendar to print or save as PDF.</p>
<div class="card noprint"><div class="row"><div class="col"><label>View</label><select id="v" data-keep><option value="m">Month</option><option value="y">Whole year</option></select></div><div class="col"><label>Month</label><select id="mo" data-keep></select></div><div class="col"><label>Year</label><input id="yr" type="number" data-keep></div><div class="col"><label>Week starts on</label><select id="ws" data-keep><option value="1">Monday</option><option value="0">Sunday</option></select></div><label style="margin:0 0 9px"><input type="checkbox" id="wn" data-keep> week numbers</label><button id="pr">🖨 Print</button></div></div>
<div id="out"></div></div>
<script>
const MN=Array.from({length:12},(_,i)=>new Date(2000,i,1).toLocaleDateString(undefined,{month:'long'})),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];$('#mo').innerHTML=MN.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
const t=new Date();$('#yr').value=t.getFullYear();$('#mo').value=t.getMonth();
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dn=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-dn);return Math.ceil(((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5+1)/7)}
function month(y,m,small){const ws=+$('#ws').value,wn=$('#wn').checked&&!small,first=new Date(y,m,1),off=(first.getDay()-ws+7)%7,n=new Date(y,m+1,0).getDate(),cells=Math.ceil((off+n)/7)*7,td=dkey(new Date());
  let h=`<div class="cal ${small?'sm':''}" style="${wn?'grid-template-columns:34px repeat(7,1fr)':''}">`+(wn?'<div class="h">Wk</div>':'')+Array.from({length:7},(_,i)=>`<div class="h">${DN[(i+ws)%7].slice(0,small?1:3)}</div>`).join('');
  for(let i=0;i<cells;i++){const d=new Date(y,m,1-off+i),inM=d.getMonth()===m;if(wn&&i%7===0)h+=`<div class="h" style="display:flex;align-items:center;justify-content:center">${isoWeek(new Date(d.getFullYear(),d.getMonth(),d.getDate()+3))}</div>`;h+=`<div class="${inM?'':'o'} ${d.getDay()%6===0?'we':''}" style="${dkey(d)===td&&inM?'font-weight:800;color:#2563eb':''}">${inM||!small?d.getDate():''}</div>`}return h+'</div>'}
function run(){const y=+$('#yr').value||t.getFullYear(),m=+$('#mo').value;$('#out').innerHTML=$('#v').value==='m'?`<div class="ttl">${MN[m]} ${y}</div>`+month(y,m,false):`<div class="ttl">${y}</div><div class="yr">${MN.map((n,i)=>`<div><h3>${n}</h3>${month(y,i,true)}</div>`).join('')}</div>`;$('#mo').parentNode.classList.toggle('hide',$('#v').value==='y')}
document.addEventListener('input',run);document.addEventListener('change',run);$('#pr').onclick=()=>print();remember().then(run);
</script>
