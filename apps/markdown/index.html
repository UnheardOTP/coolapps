<!doctype html><meta charset="utf-8"><title>Markdown Editor</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#475569;--w:1200px}#pv{min-height:420px;line-height:1.65}#pv h1,#pv h2,#pv h3{margin:18px 0 8px;text-transform:none;letter-spacing:-.01em;font-size:inherit;color:var(--fg)}#pv h1{font-size:28px}#pv h2{font-size:22px}#pv h3{font-size:18px}#pv h1::before{display:none}#pv code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.9em}#pv pre{background:var(--soft);padding:12px;border-radius:8px;overflow:auto}#pv pre code{padding:0;background:none}#pv blockquote{margin:10px 0;padding:2px 14px;border-left:4px solid var(--a);color:var(--mut)}#pv hr{border:none;border-top:1px solid var(--line)}#pv a{color:var(--a)}</style>
<div class="wrap"><h1>Markdown Editor</h1><p class="sub">Write on the left, see the rendered result on the right.</p>
<div class="g2"><div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Markdown</h2><button class="x right" id="cm">Copy Markdown</button><button class="x" id="ch">Copy HTML</button></div><textarea id="md" style="min-height:420px" data-keep></textarea></div><div class="card"><h2>Preview</h2><div id="pv"></div></div></div>
<div class="card"><h2>Saved documents</h2><div id="sv"></div></div></div>
<script>
// A small Markdown subset: headings, emphasis, inline/fenced code, links, quotes, lists, rules. Input is HTML-escaped first, so it is safe to inject.
function inline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function render(src){const lines=esc(src).split('\n');let out='',list=null,code=false,para=[];const flush=()=>{if(para.length){out+=`<p>${inline(para.join(' '))}</p>`;para=[]}},close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const l of lines){if(/^```/.test(l)){flush();close();out+=code?'</code></pre>':'<pre><code>';code=!code;continue}if(code){out+=l+'\n';continue}
    let m;if(!l.trim()){flush();close();continue}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flush();close();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^(-{3,}|\*{3,})$/.test(l.trim())){flush();close();out+='<hr>'}
    else if(m=l.match(/^&gt;\s?(.*)/)){flush();close();out+=`<blockquote>${inline(m[1])}</blockquote>`}
    else if(m=l.match(/^\s*([-*+]|\d+\.)\s+(.*)/)){flush();const t=/\d/.test(m[1])?'ol':'ul';if(list!==t){close();out+=`<${t}>`;list=t}out+=`<li>${inline(m[2])}</li>`}
    else{close();para.push(l.trim())}}flush();close();if(code)out+='</code></pre>';return out}
const run=()=>$('#pv').innerHTML=render($('#md').value);$('#md').oninput=run;$('#cm').onclick=e=>copy($('#md').value,e.target);$('#ch').onclick=e=>copy($('#pv').innerHTML,e.target);
savedBar($('#sv'),{get:()=>({t:$('#md').value}),set:d=>{$('#md').value=d.t;run()}});
remember().then(()=>{if(!$('#md').value)$('#md').value='# Hello\n\nWrite **Markdown** here — *italic*, `code`, [links](https://example.com).\n\n- one\n- two\n\n> a quote\n';run()});
</script>
