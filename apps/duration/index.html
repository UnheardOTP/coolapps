<!doctype html><meta charset="utf-8"><title>Time Duration Calculator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/shared/util.css"><script src="/shared/lib.js"></script><script src="/shared/util.js"></script><style>:root{--a:#8b5cf6;--w:760px}.r2{display:flex;gap:8px;align-items:center;margin-bottom:8px}.r2 select{width:70px}.r2 input{font-family:ui-monospace,monospace}</style>
<div class="wrap"><h1>Time Duration Calculator</h1><p class="sub">Add or subtract times like 1:45:30 or 2h 15m — handy for timesheets, video runtimes and workouts.</p>
<div class="card"><div id="rows"></div><div class="row"><button class="s" id="add">+ Add row</button><button class="x" id="clr">Clear</button></div></div>
<div class="card"><div class="mut">Total</div><div class="big" id="tot"></div><div class="g4 gap" id="kp"></div></div>
<div class="card"><h2>Seconds ⇄ hh:mm:ss</h2><div class="row"><div class="col"><label>Seconds</label><input id="sec" type="number" value="5430" data-keep></div><div class="kpi col"><small>As clock</small><b id="clk"></b></div></div></div></div>
<script>
let rows=[{op:'+',v:'1:45:30'},{op:'+',v:'2h 15m'},{op:'−',v:'0:30:00'}];
// Accepts h:mm:ss, mm:ss, "1h 20m 5s", or a bare number of minutes.
function parse(s){s=s.trim().toLowerCase();if(!s)return 0;if(/^[\d.]+$/.test(s))return parseFloat(s)*60;if(s.includes(':')){const p=s.split(':').map(Number);if(p.some(isNaN))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}const m=[...s.matchAll(/([\d.]+)\s*(h|hr|hrs|hours?|m|min|mins|minutes?|s|sec|secs|seconds?)/g)];if(!m.length||m.map(x=>x[0]).join('').length<s.replace(/\s/g,'').length)return NaN;return m.reduce((n,[,v,u])=>n+parseFloat(v)*(u[0]==='h'?3600:u[0]==='m'?60:1),0)}
const clock=t=>{const neg=t<0;t=Math.round(Math.abs(t));return(neg?'−':'')+`${Math.floor(t/3600)}:${pad2(Math.floor(t%3600/60))}:${pad2(t%60)}`};
function paint(){$('#rows').innerHTML=rows.map((r,i)=>`<div class="r2"><select data-i="${i}" data-k="op"><option ${r.op==='+'?'selected':''}>+</option><option ${r.op==='−'?'selected':''}>−</option></select><input data-i="${i}" data-k="v" value="${esc(r.v)}" placeholder="1:30:00 or 1h 30m" class="${isNaN(parse(r.v))?'bad':''}"><span class="mut" style="width:90px;text-align:right">${isNaN(parse(r.v))?'?':clock(parse(r.v))}</span><button class="x" data-rm="${i}">✕</button></div>`).join('');calc()}
function calc(){const ok=rows.every(r=>!isNaN(parse(r.v)));const t=rows.reduce((n,r)=>n+(r.op==='+'?1:-1)*(parse(r.v)||0),0);$('#tot').textContent=ok?clock(t):'Check the highlighted rows';$('#kp').innerHTML=ok?[['Hours',fmt(t/3600,3)],['Minutes',fmt(t/60,2)],['Seconds',Math.round(t).toLocaleString()],['Days',fmt(t/86400,4)]].map(([k,v])=>`<div class="kpi"><small>${k}</small><b style="font-size:17px">${v}</b></div>`).join(''):'';$('#clk').textContent=clock(num('sec'));if(!calc.skip)KV.save({rows,sec:$('#sec').value})}
$('#rows').oninput=$('#rows').onchange=e=>{const i=e.target.dataset.i;if(i===undefined)return;rows[i][e.target.dataset.k]=e.target.value;if(e.target.dataset.k==='v'){e.target.classList.toggle('bad',isNaN(parse(e.target.value)));e.target.nextElementSibling.textContent=isNaN(parse(e.target.value))?'?':clock(parse(e.target.value))}calc()};
$('#rows').onclick=e=>{const r=e.target.dataset.rm;if(r!==undefined){rows.splice(+r,1);paint()}};$('#add').onclick=()=>{rows.push({op:'+',v:''});paint()};$('#clr').onclick=()=>{rows=[{op:'+',v:''}];paint()};$('#sec').oninput=calc;
KV.load().then(s=>{if(s.rows)rows=s.rows;if(s.sec)$('#sec').value=s.sec;paint()});paint();
</script>
